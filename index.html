{num:40,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) — Не лучше ли было остаться в каюте, юноша? Погода не для прогулок, — строго заметил капитан.`,`2) «Так задумано природой, — грустно сказала мама и добавила: — Все дети когда-нибудь становятся взрослыми».`,`3) «Пишешь ты об искусстве, — говорил Войницкий: — но ничего не понимаешь в нём».`,`4) Цицерон утверждал, что: «нет такой книги, которая хотя бы частично не оказалась полезной».`,`5) «Включите свет, а то нам темно заниматься», — попросил Саша. «Потом включу, а сейчас идите ужинать», — сказал Иван.`],answer:`125`},
{num:41,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Куда ты держишь путь, скажи на милость» — спросил я у речушки луговой.`,`2) «Чтобы быть в хорошем настроении, я перестала смотреть телевизор, — сказала с усмешкой актриса и добавила: — К тому же он у меня сломан».`,`3) «Встречай, хозяйка! — бойко крикнул Цыганов: — Встречай гостей!»`,`4) Стендаль верно подметил, что: «опираться можно только на то, что оказывает сопротивление».`,`5) «Хорошо парни работают», — сказал мастер. «А как Серёжка? Не позорит ли он отца?» — поинтересовался Данилов.`],answer:`25`},
{num:42,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Придётся здесь остановиться, — сказал проводник, зажигая фонарь, и добавил: — В такую пургу через перевал не пройдём».`,`2) Горький писал о Чехове: «Его врагом была пошлость, и он всю жизнь боролся с ней».`,`3) «Что вы читали на этой неделе, пока мы не виделись?» — поинтересовался Старцев у Екатерины Ивановны. «Я читала Писемского», — ответила она.`,`4) Французский философ Вольтер утверждал, что: «чтение возвышает душу».`,`5) — Все ли здесь? — спросил Дубровский: — Не осталось ли кого в доме?`],answer:`123`},
{num:43,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) Матвей, вздохнув, произнёс: «Костерок бы сейчас разжечь».`,`2) «Город слишком много средств затрачивает на ненужные постройки и лишние должности, — сказал Андрей Ефимыч и, подумав, продолжил: — На эти деньги можно было бы содержать две образцовые больницы».`,`3) О знаках препинания К. Г. Паустовский писал, что: «они твёрдо держат текст и не дают ему рассыпаться».`,`4) «Что прикажете вам сыграть, мадам Иванова?» — осведомился Сашка, который всегда был с ней изысканно любезен. «Что-нибудь своё», — ответила она.`,`5) — Все ли здесь? — спросил Дубровский: — Не осталось ли кого в доме?`],answer:`124`},
{num:44,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) — Работал Никитин поразительно, — вспоминал старик: — он только выйдет на манеж, сделает лёгкий поклон — и ему сразу хлопают.`,`2) «Возьмите ещё огурчиков, кусок пирога и банку варенья. Не стесняйтесь!» — настаивали родственники, провожая нас.`,`3) Писатель О. Уайльд заявлял, что: «лучший способ сделать детей хорошими — это сделать их счастливыми».`,`4) «Здравствуй, сынок», — протянул мне руку отец. «Здравствуй, папа», — прошептал я.`,`5) «Иван Павлович, поздравляем вас с юбилеем! — сказал я, протягивая учителю букет цветов, и добавил от себя: — Я очень благодарен вам за всё».`],answer:`245`},
{num:45,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) Писатель Ф. А. Искандер иронично замечал, что: «хорошо поддаются воспитанию как раз те, кто не нуждается в воспитании».`,`2) Пройдя множество коридоров, переходов, арок, он не выдержал и спросил: «Как вы умудряетесь здесь не заблудиться?»`,`3) «Назовите вашу должность», — попросила девушка из окошка. «Помощник оператора», — ответил за меня Гурин.`,`4) «Мне хотелось бы поговорить с тобой, — сказала Катя и попросила: — Приходи сегодня в половине восьмого на Триумфальную площадь».`,`5) — А вы меня спрашивали об этом раньше? — вскипел Михаил Николаевич от такой бестактности: — Марш сейчас же отсюда!`],answer:`234`},
{num:46,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Я засмотрелась на воду, поэтому у меня закружилась голова», — отвечала Анна`,`2) «Откуда шум? — насторожился Кузнецов и, помолчав, спросил: — Кто бы это мог шуметь?»`,`3) «Будет ли продолжение у этого сериала?» — поинтересовались телезрители у кинорежиссёра. «Думаю, что через полгода вы снова встретитесь с полюбившимися вам героями», — ответил он`,`4) Учёный и общественный деятель Д. С. Лихачёв считал, что: «учиться хорошей, спокойной, интеллигентной речи надо долго и внимательно»`,`5) — Прощайте, ребята, — сказал он смущённой дворне: — мне здесь делать нечего`],answer:`123`},
{num:47,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) — Что это значит? — спросил грозно Кирилл Петрович: — До сих пор ты молчала и была согласна, а теперь, когда всё решено, ты вздумала капризничать и отрекаться`,`2) Поэт В. С. Шефнер писал, что: «словом можно убить, словом можно спасти, словом можно полки за собой повести»`,`3) «Папенька, я не люблю князя и не хочу быть его женой!» — закричала она и выбежала из комнаты`,`4) «Какая ты всё-таки молодец!» — взглянув в лицо Елены, улыбнулся Иван. «Если бы не ты, у меня бы ничего не получилось», — отозвалась она`,`5) «Может быть, вы чего-то недоговариваете?» — поинтересовалась Анна`],answer:`345`},
{num:48,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Пушкин меня заразил любовью», — признавалась Марина Цветаева в очерке «Мой Пушкин».`,`2) — Василиса Егоровна — прехрабрая дама, — заметил важно Швабрин: — Иван Кузьмич может это засвидетельствовать.`,`3) «Петруша в Петербург не поедет, — сказал батюшка и добавил: — Чему научится он, служа в Петербурге?»`,`4) — Куда приехали? — спросил я, протирая глаза. — На постоялый двор, — ответил Савельич.`,`5) По словам Фазиля Искандера: «чтение Пушкина способствует долголетию, как альпийский воздух».`],answer:`134`},
{num:49,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) По словам Льва Толстого: «плохие книги не только бесполезны, но и вредны».`,`2) «Гостиные, сплетни, балы, тщеславие, ничтожество — вот заколдованный круг, из которого я не могу вырваться», — сказал князь Андрей Пьеру.`,`3) — Вся моя жизнь сложилась так, а не иначе, не от среды, а совсем от другого, — заговорил вдруг Иван Васильевич: — Чтобы понять это, надо много рассказывать.`,`4) «Влюблялся я много раз, но это была самая сильная моя любовь, — быстро произнёс он и с грустью добавил: — У неё уже дочери замужем».`,`5) — Ведь после ужина кадриль моя? — спросил я у Вареньки. — Разумеется, если меня не увезут, — ответила она.`],answer:`245`}
];
const a17_questions = [
{num:1,text:`Октябрь был удивительно холодный, ненастный. Тесовые крыши почернели. Спутанная трава в саду полегла.\n\nНад лугами тащились из-за реки, цеплялись за голые ветки старых деревьев рыхлые тучи. Из них назойливо сыпался мелкий дождик. По просёлочным дорогам уже нельзя было ни пройти, ни проехать.\n\nКатерине Петровне стало ещё труднее вставать по утрам и видеть всё то же: комнаты, где застоялся горький запах нетопленых печей, пыльный «Вестник Европы», пожелтевшие чашки на столе, давно не чищенный самовар и картины на стенах. Может быть, в комнатах было слишком сумрачно, или, может быть, картины потускнели от времени, но на них ничего нельзя было разобрать. Катерина Петровна только по памяти знала, что вот эта картина — портрет её отца, а вот эта — маленькая, в золотой раме — подарок Крамского, эскиз к его «Неизвестной».\n\nКатерина Петровна доживала свой век в старом доме, который построил её отец — известный художник. В старости художник вернулся из Петербурга в своё село, жил на покое и занимался садом. Но писать он уже не мог, поскольку дрожала рука. Да и зрение ослабло, часто болели глаза.\n\nДом был, как говорила Катерина Петровна, «мемориальный». И поэтому он находился под охраной областного музея.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Октябрь был тёплым и солнечным.`,`2) Картины на стенах поражали своими яркими красками.`,`3) В старом доме висел один из эскизов Крамского.`,`4) Хозяин старого дома — известный художник Крамской.`,`5) Дом художника, отца Катерины Петровны, находился под охраной областного музея.`],answer:`35`},
{num:2,text:`Это произошло на палубе дачного парохода, подгоняемого ветерком к зелёным берегам Петергофа.\n\nСергей Есенин, недавно вернувшийся из-за границы, загорелый, с расстёгнутым воротом белой рубашки, весёлый, непривычно оживлённый, прислонясь к борту, безостановочно читал свои стихи. В этот вечер Сергей Есенин был особенно в ударе: стихи звучали так, словно поэт бросал кому-то вызов молодости и силы. И все, кто находился на палубе, не могли оторвать от него глаз.\n\nНо особенно поразило меня то, как Алексей Толстой реагировал на стихи молодого поэта. Ранее рассеянный и несколько апатичный, грузно сидевший на палубной скамье, сейчас он весь был полон внимания и даже подался вперёд всем своим телом. Пальцы всё сильнее и веселее отбивали такт на правом колене.\n\nВдруг Толстой резко сдвинул на затылок шляпу и стёр со лба выступивший пот. Потом встал, грузно шагнул к Сергею Есенину и широким жестом тряхнул его за плечи. Широкая улыбка озарила мясистое, гладко выбритое лицо Алексея Толстого.\n\n— Вот это стихи! — взволнованно произнёс Алексей Николаевич. Он крепко обнял несколько смущённого и растерянного молодого поэта и трижды поцеловал.\n\nПрочитайте текст и определите, какие из перечисленных ниже подтем нашли отражение в тексте:`,options:[`1) Предчувствие грозы.`,`2) Чтение стихов Сергеем Есениным.`,`3) Реакция Алексея Толстого на стихи Сергея Есенина.`,`4) Спор о поэзии.`,`5) Отзыв Алексея Толстого о стихах Сергея Есенина.`],answer:`235`},
{num:3,text:`С конца сентября наши сады пустели, погода, по обыкновению, круто менялась. Ветер по целым дням рвал и трепал деревья, дожди поливали их с утра до ночи. Иногда к вечеру между хмурыми низкими тучами пробивался на западе трепещущий золотистый свет низкого солнца. Воздух делался чист и ясен, солнечный свет ослепительно сверкал между листвою, между ветвями, которые живою сеткою двигались и волновались от ветра. Холодно и ярко сияло на севере над тяжёлыми свинцовыми тучами голубое небо, а из-за этих туч медленно выплывали хребты снеговых гор-облаков. Стоишь у окна и думаешь: «Авось, бог даст, распогодится».\n\nНо ветер всё никак не унимался: он волновал сад и нагонял зловещие космы пепельных облаков. И облака бежали низко и быстро и затуманивали солнце. Угасал его блеск, закрывалось окошечко в голубое небо, а в саду становилось пустынно и скучно, и снова начинал сеять дождь. Сперва тихо, осторожно, потом всё гуще и, наконец, превращался в ливень с бурей и темнотою. Наступала долгая, тревожная ночь.\n\nПрочитайте текст и определите, какие из перечисленных ниже подтем нашли отражение в тексте:`,options:[`1) Солнечное сентябрьское утро.`,`2) Золотистый свет низкого вечернего солнца.`,`3) Незатихающий ветер.`,`4) Последствия сильной грозы.`,`5) Спокойная осенняя ночь.`],answer:`23`},
{num:4,text:`Вокруг произведения Рафаэля «Сикстинская мадонна» всегда было много тайн. Разные поколения, разные люди находили в «Сикстинской мадонне» что-то своё. Однако все единодушно видели в картине не только совершенное произведение искусства, но и высшую меру человеческого благородства. И вот это самое знаменитое произведение Рафаэля, созданное им около 1516 года, могло быть навсегда утеряно в годы Второй мировой войны.\n\nПеред своим крахом гитлеровцы спрятали картины знаменитой Дрезденской галереи в сырых известняковых шахтах и готовы были вообще взорвать и уничтожить бесценные сокровища. Но по приказу советского командования солдаты Первого Украинского фронта два месяца вели поиск величайших шедевров галереи. «Сикстинская мадонна» великого Рафаэля оказалась в ящике, который был сделан из тонких, но прочных и хорошо обработанных планок. На дне ящика был укреплён толстый картон, а внутри ящика — рамка, обитая войлоком, на которой и покоилась картина. Но в дни войны ящик не мог служить надёжной защитой. В одно мгновение он мог вспыхнуть, и...\n\nКогда ящик нашли и открыли, перед людьми предстало изображение женщины дивной, неземной красоты с божественным младенцем на руках. И советские солдаты и офицеры, несколько лет шагавшие тяжёлыми дорогами войны, сняли перед ней пилотки и фуражки.\n\nПрочитайте текст и определите, какие из приведённых ниже подтем нашли отражение в тексте:`,options:[`1) История создания картины Рафаэля «Сикстинская мадонна».`,`2) Возможная опасность утраты картины во время войны.`,`3) Поиск знаменитой картины.`,`4) Ящик для картины «Сикстинская мадонна».`,`5) Новая жизнь картины после войны.`],answer:`234`},
{num:5,text:`Сводки погоды три дня обещали грозу. Однако все эти три дня сияло солнце, и никто уже не верил, что гроза придёт. Поэтому, собираясь в кино, мы не взяли зонтики.\n\nГроза захватила нас неожиданно, обрушив на город потоки воды. Пока мы добежали до ближайшего подъезда, промокли почти насквозь.\n\nМы встали у двери, но в подъезд один за другим стремительно влетали с улицы промокшие люди, встряхивались, и брызги от них летели во все стороны. Сначала мы немного отодвинулись от порога, а потом поднялись на лестничную площадку первого этажа.\n\nНа улице вовсю плясал и буйствовал дождь. Грязные, мутные потоки лились по мостовой, сбегали со скамеек, с крыши беседки. Какой-то мальчишка, босой, в закатанных выше колен штанах, восторженно и громко визжа, промчался по стремительному ручью вдоль тротуара. Но вот наконец посветлело, дождь стал стихать.\n\nТы сказала: «Всё равно в кино мы опоздали. Побежали домой. Я так давно не бегала босиком». Я не стал спорить. Дождь ещё сеял, тёплый, лёгкий, весёлый, и на душе было радостно. Ты была рядом, и мы топали босиком по центру громадного города.\n\nПрочитайте текст и укажите, на какие вопросы в тексте нет ответов:`,options:[`1) Какой фильм хотели посмотреть ребята?`,`2) Почему ребята, собираясь в кино, не взяли зонтики?`,`3) Куда спрятались ребята от дождя?`,`4) Сколько времени длилась гроза?`,`5) Удалось ли ребятам попасть в кино?`],answer:`14`},
{num:6,text:`В любое произведение искусства, без сомнения, вложена душа и сердце его создателя. В фильме или спектакле всё может быть ненастоящим, бутафорским: стены комнаты, обстановка, вещи, однако же чувства художника, его желанья, его раздумья всегда настоящие, подлинные. Они-то как раз и составляют особую силу искусства, способную растрогать и расшевелить самого сдержанного человека. Сколько раз вы могли видеть, как после окончания кинокартины встают со своих мест зрители с ещё не просохшими слезами на глазах! Сколько раз, вероятно, вы и сами заливались неудержимым смехом, нисколько не смущаясь тем, что вокруг вас сидят чужие люди.\n\nМы потому-то и любим искусство, что оно захватывает нас, обостряет наши чувства, побуждает нас становиться лучше, заставляет стремиться к светлым и благородным целям. Постигая «вечное» и «непревзойдённое», мы, кроме того, начинаем верить в то, что и в каждом из нас заложено то прекрасное, к чему зовёт нас искусство.\n\nПо моему глубокому убеждению, искусство учит и воспитывает не только зрителей, но и самого художника, творческий путь которого труден и тернист и нередко приносит огорчения и глубокие разочарования. Как и во многих других профессиях, работа творческого человека, безусловно, требует от него самоотверженности, полного напряжения всех сил. Она забирает всё его время, все силы, но зато даёт ему ощущение необычайной полноты и разнообразия жизни.\n\nПрочитайте текст и определите, какие из перечисленных утверждений соответствуют содержанию текста:`,options:[`1) Подлинность чувств, желаний, раздумий художника позволяет произведениям искусства воздействовать на человека.`,`2) Искусство обладает заряжающей силой.`,`3) Искусство воздействует на зрителя, но не воздействует на самого художника.`,`4) Путь художника чаще всего бывает лёгким.`,`5) Работа творческого человека делает его жизнь полной и разнообразной.`],answer:`125`},
{num:7,text:`Рогульник плавающий (водяной орех) — редкий, реликтовый европейский вид семейства рогульниковых, находящийся в Европе под угрозой исчезновения. Он включён в Красную книгу Республики Беларусь.\n\nРогульник — однолетнее водное травянистое растение, иногда свободно плавающее, но обычно прикреплённое ко дну. Для водяного ореха, как и для других водяных растений, характерна разнолистность. Прежде всего на его стебле появляются нитевидные, рано опадающие листья. Затем на водной поверхности рогульник развивает одну или несколько розеток ромбических, зазубренных листьев, несколько напоминающих по форме листья берёзы. Эти листья расположены мозаично благодаря разной длине черешков.\n\nВ верхней части черешков имеются «плавательные пузыри» — вздутия, заполненные воздухоносной тканью. В пазухах листьев появляются одиночные цветки с белыми или розоватыми прозрачными лепестками. Верхние доли чашечки цветка постепенно отвердевают и превращаются в легко отламывающиеся шипы. Костянковидные плоды — «орехи» — имеют роговидные выступы. У водяного ореха плоды съедобны. Они также являются ценным лекарственным сырьём.\n\nРогульник предпочитает пойменные озёра, куда в половодье поступает свежая вода, а также заводи рек глубиной 50—200 см, с илистым грунтом и обогащённой железом водой. В Беларуси этот вид встречается в озёрах бассейнов рек Припяти, Березины, Днепра, Сожа, в Городокском районе Витебской области, Житковичском районе Минской области.\n\nПрочитайте текст и определите, какие из перечисленных ниже подтем нашли отражение в тексте:`,options:[`1) Реликтовый вид семейства рогульниковых.`,`2) Факторы угрозы исчезновения рогульника.`,`3) Листья водяного ореха.`,`4) Механизм опыления цветов рогульника.`,`5) Предпочтительные места произрастания рогульника.`],answer:`135`},
{num:8,text:`Однажды в нашей таёжной деревушке сильная гроза повалила огородные заборы и подгнившие телефонные столбы, посрывала кое-где крыши, повыворачивала давно состарившиеся берёзы и тополя.\n\nПробегая утром мимо школы, я услышал тревожный писк и увидел на краю карниза ласточек, суетящихся у разорённого вчерашней грозой гнезда. Ветром оторвало от него больше половины, из оставшейся треснувшей части гнезда выглядывали три ещё желторотых птенца; их родители цеплялись за стенки сарая рядом и, щебеча, будто плача над неутешным горем, просили помощи. Казалось, что остатки гнезда вот-вот отвалятся. А другие ласточки поочерёдно подлетали к пострадавшему гнезду, зависали на трепещущих крыльях, словно обдумывая, что предпринять, и отлетали.\n\nВозвращаясь около полудня, я заметил, что ласточки ремонтируют гнездо «всем миром». Трещина уже была аккуратно заделана — её можно было заметить лишь по тёмной полосе сырой ещё глины, но ласточки с комочками строительного материала в клювах всё подлетали одна за другой.\n\nВскоре гнездо было полностью восстановлено, и ласточки улетели к реке. Они носились над водной гладью, то касаясь её брюшком или крылом, то взмывая под небеса.\n\nА я стоял и думал: как дружны эти милые птицы!\n\nПрочитайте текст и определите, какие из перечисленных ниже подтем нашли отражение в тексте:`,options:[`1) Предупреждение о грозе.`,`2) Последствия сильной грозы.`,`3) Разорённое грозой гнездо.`,`4) Ремонт гнезда.`,`5) Птенцы учатся летать.`],answer:`234`},
{num:9,text:`Лейтенант резко взял с места, направляясь к кустарнику, однако в рыхлом снегу лыжи скользили плохо, проваливаясь в глубокие колеи, из которых торчали лишь их изогнутые концы. А ветки кустарника цеплялись за маскировочный халат, срывали с головы капюшон. Наверное, четверть часа лейтенант продирался через кустарник, пока наконец не вырвался в поле. Взгляд его был устремлён вперёд, лейтенант не оглядывался, он слышал шорох лыж сзади и мерное привычное дыхание бойцов. Его гнев понемногу стал спадать, самая большая беда миновала, он стал свыкаться с тем, что их осталось восемь. Правда, полностью примириться с этим было нельзя. Но трудный участок они проскочили, и теперь важно было не нарваться в ночи на какие-нибудь тыловые части.\n\nВскоре на снегу наметился небольшой спуск, лыжи пошли вперёд легче, рукам стало свободнее. В ветреном ночном сумраке слышался сплошной шорох снега под лыжами. Лейтенант ещё увеличил темп. Дорога была дальняя, даже слишком дальняя для одной ночи, и надо было спешить. Тут он ещё помнил маршрут, изученный накануне по карте, и знал, что скоро опять пойдёт пойма всё той же речушки.\n\nГруппа быстро двигалась в серых ночных сумерках. Беззвёздное небо сплошным пологом накрыло зимний простор, в котором тускло темнели размытые пятна кустарников, деревьев, бурьяна и ещё чего-то неясного и загадочного. Ракеты на передовой светили далеко сзади. Постепенно лейтенант стал успокаиваться: они прорвались.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Рыхлый снег и ветки кустарника мешали бойцам быстро передвигаться.`,`2) Для бойцов было важно не встретить ночью в пути тыловые части.`,`3) В ночном сумраке не было слышно ни звука.`,`4) Лейтенант совсем не помнил маршрут.`,`5) Лейтенант вёл группу в сторону ракет, которые изредка вспыхивали и гасли далеко впереди.`],answer:`12`},
{num:10,text:`Родина письма — Древний Восток. Наидревнейшей считается письменность шумеров, которая возникла более пяти тысяч лет назад. Существует гипотеза, что из шумерского письма происходят все остальные письменности, кроме письма майя. Шумерское письмо хорошо изучено, известна его многовековая эволюция от пиктограмм к словесным и затем к словесно-слоговым знакам.\n\nСамые ранние образцы шумерской письменности — это бирки с печатью и пометкой о количестве предметов или животных. Затем появились более сложные учётные таблицы. Выдающимся достижением шумеров было то, что количество они обозначали отдельным знаком. Например, пяти коровам соответствовали пять кружочков и рисунок коровы, а не пять рисунков коровы, как в других письменностях. Постепенно система усложнялась: появились стандартные знаки — иероглифы. С течением времени значки всё менее походили на рисунки. У шумеров появились стандартные условные знаки, состоявшие из клинообразных чёрточек. По форме клинообразных чёрточек шумерское письмо называют клинописью.\n\nТруднее всего было изображать абстрактные понятия, имена собственные. В этом помогал ребусный принцип. Шумеры постоянно применяли его и закрепили за некоторыми знаками не конкретное значение, а звуковое чтение.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Шумерское письмо плохо изучено, известен только его путь развития от пиктограмм к словесным знакам.`,`2) Учёные давно доказали, что шумерское письмо стало основой для формирования всех известных человечеству письменностей.`,`3) Наиболее ранние образцы шумерской письменности — это бирки с печатью и пометкой о количестве предметов или животных.`,`4) Шумерское письмо называют клинописью.`,`5) При изображении абстрактных понятий и имён собственных шумеры использовали ребусный принцип.`],answer:`345`},
{num:11,text:`Географическая оболочка является крупнейшим природным комплексом Земли. И три внешние оболочки Земли — литосфера, гидросфера, атмосфера — тесно взаимосвязаны. Так, газы атмосферы проникают в воду и в горные породы. Вода просачивается в земную кору, размывает и растворяет горные породы. И далее частицы горных пород попадают в атмосферу, а растворимые вещества — в воду. Всё это происходит при участии солнечного света и тепла. В результате такого взаимодействия верхние слои литосферы, вся гидросфера и нижние слои атмосферы образуют единую систему — географическую оболочку.\n\nУсловия в географической оболочке благоприятны для развития жизни. Миллиарды лет назад в географической оболочке появились организмы, которые затем начали в ней развиваться и распространяться. Впоследствии они сами стали важнейшим элементом географической оболочки. Именно эти организмы создали «живую» оболочку Земли — биосферу. Согласно учению В. И. Вернадского, биосфера состоит из живых веществ и неживых веществ, созданных и переработанных этими организмами. Необходимо отметить, что биосфера находится в постоянном движении.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Литосфера, гидросфера и атмосфера тесно взаимосвязаны.`,`2) Географическая оболочка Земли является единой системой.`,`3) В географической оболочке Земли нет благоприятных условий для развития жизни.`,`4) Живые организмы не являются компонентом географической оболочки Земли.`,`5) Согласно учению В. И. Вернадского, биосфера состоит из живых и неживых веществ.`],answer:`125`},
{num:12,text:`По заключению Японской медицинской ассоциации, пожилым людям для счастья нужны три условия. Во-первых, быть здоровым. Во-вторых, экономически независимым. В-третьих, сохранять любые увлечения, разделять их с друзьями.\n\nЧто касается здоровья, то Япония занимает первое место в мире по продолжительности жизни. И это говорит само за себя. А высокий уровень медицинского обслуживания и преимущества традиционной национальной диеты сделали для японцев уход на пенсию в 65 лет началом «второй жизни».\n\nВторая задача — обеспечить пожилых людей материально — в Японии тоже решена.\n\nНо ведь, кроме здоровья и экономической независимости, человеку преклонного возраста нужны любимые увлечения. Японский образ жизни благоприятствует и этому. В Стране восходящего солнца у женщин по-прежнему популярны икебана и чайная церемония, у мужчин — каллиграфия и боевые искусства. Не выходят из моды кружки бальных танцев, куда ходят те, кому за 70. Наконец, пожилых людей призывают изучать иностранные языки, так как это способствует улучшению памяти.\n\nБыть общительным, не допускать, чтобы с годами сужался круг интересов, — вот залог оптимистического взгляда на жизнь. А он, в свою очередь, обеспечивает психическое здоровье, что позволяет японцу чувствовать себя счастливым, несмотря на возраст.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Пожилым японцам для счастья нужно только здоровье.`,`2) В Японии высокий уровень медицинского обслуживания.`,`3) Японские женщины, выйдя на пенсию, увлекаются боевыми искусствами и каллиграфией.`,`4) Для улучшения памяти пожилым японцам рекомендуют изучать иностранные языки.`,`5) Чувствовать себя счастливым японцу помогает пессимистический взгляд на мир.`],answer:`24`},
{num:13,text:`Лётчик вышел, тяжело качаясь, из кабины, упал на нагретую солнцем землю и так пролежал без движения несколько часов. Но к концу дня, когда солнце начало клониться к закату, он пошевелился, открыл глаза и прислушался. Ему показалось, что солнечный свет шумит усыпительно и равномерно. Загадочный этот звук заставил его сесть и осмотреться.\n\nГде-то далеко, почти на самом краю земли, прокричал петух, а в кустах затрещала какая-то крошечная птица с красным хохолком. «Земля», — сказал лётчик, и тяжёлый комок подкатил к горлу. Никогда до этих пор он не знал и не думал, что Земля так трогательна и так нежна.\n\nГолова у лётчика кружилась. И он не видел, как девочка лет двенадцати бежала к нему. Она задыхалась. Она сразу поняла, что произошло, что это лежит разбившийся лётчик. Она плакала и не вытирала слёз. Лётчик, очнувшись, увидел в её глазах и нежность, и страх за его жизнь.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений противоречат содержанию текста:`,options:[`1) Лётчик пролежал без движения несколько часов.`,`2) Какой-то странный звук заставил лётчика спрятаться.`,`3) Лётчик всегда знал, что Земля удивительно трогательна и нежна.`,`4) Девочка сразу поняла, что произошло с лётчиком.`,`5) Лётчик, очнувшись, увидел глаза девочки, склонившейся над ним.`],answer:`23`},
{num:14,text:`Павла Михайловича Третьякова едва ли можно назвать коллекционером в привычном смысле этого слова. Посвятив всю жизнь собиранию картин, отдав этому делу все силы и средства, Третьяков поступал не как одиночка-искатель, а как создатель общенародного собрания изобразительных богатств. Всю жизнь он приобретал картины, всё лучшее в русской национальной живописи, а потом подарил Москве.\n\nПервоначально Павел Михайлович покупал картины современников, отдавая предпочтение художникам демократического направления. Подолгу простаивали посетители перед полотнами Верещагина, Пукирева, Флавицкого.\n\nЗатем у Третьякова возникла интересная мысль — показать искусство в движении, в чередовании стилей и направлений. Появился зал с портретами, написанными старыми мастерами и более близкими по времени художниками.\n\nСобытием художественной и общественной жизни Москвы стало появление в галерее таких крупных полотен, как «Иван Грозный и сын его Иван», «Утро стрелецкой казни», «Боярыня Морозова», «Явление Христа народу».\n\nТретьяков всегда поражал безошибочностью вкуса. Это позволило ему собрать великолепную коллекцию картин и создать музей национальной живописи.\n\nПрочитайте текст и определите, какие из приведённых ниже подтем нашли отражение в тексте:`,options:[`1) П. М. Третьяков — необычный коллекционер.`,`2) Биография П. М. Третьякова.`,`3) Этапы строительства здания художественного музея.`,`4) П. М. Третьяков — тонкий знаток искусства.`,`5) Последователи П. М. Третьякова.`],answer:`14`},
{num:15,text:`Все знают, как важно беречь в облике нашей земли, нашей страны всё то, что может тронуть человеческое сердце и оставить о себе благодарную память. Однако, если присмотреться, мы всё-таки плохо бережём то, что непременно надо беречь. Например, частенько можно увидеть кучу бетонного мусора, или забытую ржавую сеялку, или кучу полиэтиленовых мешков из-под удобрений. Опушки лесов и полосы лесопосадок в степи опалены химикатами. Деревья в лесу испачканы пятнами масляной краски.\n\nИли ещё такой пример: зелёный травяной склон горы нередко изрезан громадными буквами какого-нибудь призыва. Достигает ли цели этот призыв, когда его вырубают лопатой в зелёном дёрне? После всего этого как-то даже неловко говорить о тонкостях восприятия красоты пейзажа.\n\nТаким образом, забота об облике нашей земли является очень важной задачей. Истоки сыновнего чувства к отчизне лежат там, где мы рождаемся и живём. Наша Родина должна оставаться прекрасной во всех уголках. Это дело нашей совести, нашей культуры, это наш долг.\n\nПрочитайте текст и определите, какие из приведённых ниже утверждений соответствуют содержанию текста:`,options:[`1) Все знают, что нужно беречь только то, что сделано человеком.`,`2) Мы не всегда бережём то, что необходимо беречь.`,`3) Призывы на травяном склоне помогают беречь лес.`,`4) Наша Родина должна быть прекрасной во всех уголках.`,`5) Забота об облике нашей земли — священный долг каждого человека.`],answer:`245`},
{num:16,text:`Бобр — животное из отряда грызунов с ценным мехом. Мех высокий, густой, мягкий, от светло- до тёмно-коричневого.\n\nБобр имеет внешнее сходство с водяной крысой. Тело у него обтекаемой формы. Оканчивается туловище сильным веслообразным хвостом, плоским и покрытым ороговевшими чешуйками. Хвост служит рулём при плавании и нырянии.\n\nПоверх губ торчат большие сильные резцы. С помощью этих резцов он легко подтачивает молодую осину. Благодаря замыкающимся ноздрям бобр может находиться под водой четверть часа.\n\nПередние и задние конечности бобра различны. Передние ноги маленькие, но сильные. Задние ноги длиннее и снабжены плавательными перепонками. Когти большие.\n\nБобр активен ночью и в сумерках, днём его активность снижается. Живёт бобр возле чистой воды, на лесистом берегу.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Мех бобров очень ценен.`,`2) Хвост бобра покрыт густым красивым мехом.`,`3) Хвост служит бобру рулём при плавании и нырянии.`,`4) Передние и задние конечности у бобра одинаковой длины.`,`5) Бобры ведут преимущественно ночной образ жизни.`],answer:`135`},
{num:17,text:`Сколько раз я зачарованно стоял перед главным украшением знаменитого Троицкого собора — иконой прославленного живописца Андрея Рублёва! В иконе воплощены лучшие свойства его таланта: одухотворённость, нравственное благородство и простота. А ещё необыкновенная игра красок. Художник всегда стремился создавать иконы, которые, казалось, излучали свет.\n\nНа значительной по размерам доске Андрей Рублёв изобразил ветхозаветную Троицу — явление Аврааму Бога в виде трёх ангелов. За каждым из трёх ангелов изображена его эмблема. За одним — древо, означающее «древо жизни». За вторым — лёгкие, стройные палаты. За третьим ангелом находится гора — древний символ всего возвышенного.\n\nУже при первом взгляде на икону зритель оказывается в плену грациозных линий и нежнейшей красоты цветов. И. Грабарь писал, что «Троица» сверкает «высшим, неземным светом». Свет этот сияет в белых и голубоватых пробелах.\n\nЕщё долго учёные будут изучать историю создания знаменитой иконы.\n\nПрочитайте текст и определите, какие из приведённых ниже подтем нашли отражение в тексте:`,options:[`1) Троицкий собор — известный памятник русского зодчества.`,`2) В главной иконе Троицкого собора воплощены лучшие свойства таланта Андрея Рублёва.`,`3) Эмблемы трёх ангелов.`,`4) «Высший, неземной свет» иконы.`,`5) История создания знаменитой иконы.`],answer:`234`},
{num:18,text:`Мы пришли в этот мир, чтобы расширить его просторы, наполнить его свежим духом надежды и новых свершений. Забывать эту великую миссию — значит обкрадывать самих себя.\n\nНельзя растрачивать жизнь, выбрав позицию пассивного наблюдателя. Нужно, чтобы каждое утро нам было ради чего подниматься с постели. Как бы ни было тяжело, нужно научиться мечтать и летать.\n\n«Раз в жизни фортуна стучится в дверь каждого человека, однако очень часто он не слышит её стука», — горько шутил Марк Твен.\n\nПросто так удача и счастье никому не падают с неба. Настоящий успех — это когда предварительная подготовка встречается с благоприятной возможностью. Таких возможностей не так уж и мало. Беда в том, что редко кто трудится над тем, чтобы встретить Фортуну во всеоружии.\n\nЖелания даются человеку вместе со средствами, необходимыми для достижения желаемого. Не бойтесь трудностей, мечтайте о высоком и великом. Только если мы знаем свою цель и понимаем своё предназначение, мы не будем растрачивать силы и время попусту.\n\nПрочитайте текст и определите, какие из приведённых ниже утверждений соответствуют содержанию текста:`,options:[`1) Мы пришли в этот мир, чтобы наслаждаться жизнью.`,`2) Жить, выбрав позицию стороннего наблюдателя, — значит растрачивать свои силы и время впустую.`,`3) Удача приходит не к каждому человеку, а только к избранным.`,`4) Настоящий успех приходит только к целеустремлённому человеку, который сумел воспользоваться благоприятными возможностями.`,`5) Если человек знает, чего хочет, он не растрачивает силы впустую, а идёт прямо к цели.`],answer:`245`},
{num:19,text:`Два дня и три ночи бесилась непогода, на третий день улеглась. Ветер стих, неожиданно уступив тишине и морозу. Малиновый солнечный шар коснулся края небесной лазури. Он всплывал из-за леса. И вдруг этот слепящий слиток быстро отделился от горизонта.\n\nВся лесная стихия приняла невиданно сказочный образ. Безбрежная голубая лазурь была тем гуще, чем дальше от солнца. На другом небесном краю ещё умирал сумрак ночи. Месяц бледнел над лесами, когда снега заискрились вокруг. Ели, отягощённые белыми снежными клубами, изменили свои очертания, но безмолвствовали. Кроны старых сосен гордо остались сами собою.\n\nПар влажных низин поднялся на уровень древесных вершин и замёрз. Мельчайшие бисеринки засверкали на солнце. С последним колыханием исчезающего осеннего тепла всё замёрзло. Мороз начал серебрить всё, что имело хоть малую долю влаги.\n\nЛесная речка начала сдавливаться серебряными зубцами. Прозрачный лёд смело наползал на середину струи.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений противоречат содержанию текста:`,options:[`1) Тишина и мороз воцарились после непогоды.`,`2) Красив и сказочен лес при восходе солнца.`,`3) После восхода солнца снег начал постепенно таять.`,`4) Ели и сосны шумели, колыхались от ветра.`,`5) Лесная речка начала замерзать.`],answer:`34`},
{num:20,text:`Все знают, что город растёт в ширину. А вот о вертикальных городах сегодня говорят как о явлении пусть не совсем далёкого, но будущего. Высота домов в таком городе может даже превышать две тысячи метров. И проект подобного суперсооружения недавно создан японскими учёными.\n\nГигантский небоскрёб поделён на четырнадцать секций. Каждая из таких секций — универсальный микрорайон, центр которого представляет собой открытое воздуху и свету пространство, засаженное деревьями, цветами, декоративными кустарниками. Искусственно созданный ландшафт предполагает наличие ручейков, каскадов и разнообразных водоёмов.\n\nКоническая форма здания поможет защититься от грозных сил природы. А в случае сильной жары, холода или понижения уровня кислорода этажи чудо-здания самозакрываются. Планировка квартир будет свободной, с переносными самоотодвигающимися перегородками. Она создаётся самими жильцами с помощью компьютерных технологий. Помимо жилых блоков, на этажах гипернебоскрёбов будут размещаться производственные и административно-культурные сооружения.\n\nСовременные зодчие мечтают о новой Вавилонской башне. И воплощение этой мечты — дело не такого уж далёкого будущего.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений противоречат содержанию текста:`,options:[`1) В вертикальных городах будущего высота домов может превышать две тысячи метров.`,`2) В гипернебоскрёбах невозможно будет воссоздать естественные ландшафты.`,`3) От разрушительных сил природы город защитит устойчивая конусообразная форма сооружений.`,`4) С помощью компьютерных технологий жильцы сами смогут осуществлять планировку своей квартиры.`,`5) Попытка создать вертикальные города обречена на провал.`],answer:`25`},
{num:21,text:`Музыка — вид искусства, в котором художественные образы формируются с помощью звуков и который характеризуется особо активным и непосредственным воздействием на внутренний мир человека.\n\nЗвук как основа музыкальной образности и выразительности лишён смысловой конкретности слова. К средствам выразительности в музыке относятся мелодия, фактура, полифония, гармония, ритм, композиция и другие.\n\nМузыка обладает ярко выраженными национальными чертами. Особенно характерно это для народного музыкального творчества.\n\nВ зависимости от средств, с помощью которых воспроизводится музыка, различают вокальную, инструментальную, вокально-инструментальную музыку. Различают также виды музыки и жанры.\n\nСпецифические особенности музыки, её способность выражать тончайшие оттенки чувств делают понятной ту роль, которая отводилась ей как средству воспитания. Значительное воздействие на человека оказывает классическая музыка, обладающая свойством совершенствовать и возвышать душу.\n\nПрочитайте текст и определите, на какие вопросы в тексте нет ответов:`,options:[`1) Что является средствами выразительности в музыке?`,`2) Как характеризуется музыка в зависимости от средств воспроизведения?`,`3) Какие музыкальные инструменты используются в народном музыкальном творчестве?`,`4) Какое влияние оказывает классическая музыка на человека?`,`5) Как организовать воспитательный процесс с помощью музыки?`],answer:`35`},
{num:22,text:`Как бы часто ты ни бывал в лесу, всякий раз он удивляет новизной впечатлений. Есть особенная радость для души в светлой свежести берёзовых рощ и в сдержанной силе вековых дубрав, в таинственности густых ельников и в шуме соснового бора. Всё это наполняет лес подлинной поэзией.\n\nА бывали ли вы когда-нибудь в Беловежской пуще? Её неброская красота обладает особой притягательной силой. Незабываемое впечатление производят древние ельники и могучие дубравы. Дикий мир пущи необыкновенно разнообразен. Особенно живописны здесь дубравы, удивительно нарядные осенью.\n\nЗдесь никогда не бывает скучно. Каждая тропа таит радость новых открытий. И, постигая их, как будто попадаешь в зелёный храм. Так давайте же беречь Беловежскую пущу — наше национальное достояние.\n\nПрочитайте текст и определите, какие из приведённых ниже утверждений соответствуют содержанию текста:`,options:[`1) Лес всегда удивляет нас новизной впечатлений.`,`2) Незабываемое впечатление производит Беловежская пуща.`,`3) Мир Беловежской пущи удивительно однообразен.`,`4) Дубравы Беловежской пущи осенью нарядны и живописны.`,`5) В Беловежской пуще никогда не бывает скучно.`],answer:`1245`},
{num:23,text:`Никита проснулся с предчувствием счастья, потому что должен был наконец прийти обоз с обещанным дедом Никифором подарком. Мальчик поскорее оделся и вышел во двор.\n\nУтро было ясное и морозное. Над всей деревней стояли столбы синего дыма. За ночь на деревьях ещё гуще лёг иней.\n\nВскоре Никита увидел, что на дороге появились возы. Один за другим они выползли из овражка и поплелись по дороге. Всего в обозе было шестнадцать саней.\n\nПервым въехал на двор во главе обоза Никифор, коренастый старик. Он обернулся и крикнул тем, кто был позади: «Эй, заворачивай к амбарам, а последний воз к дому».\n\nКогда этот воз приблизился, Никита не сразу понял, что на нём лежит. Это было что-то большое, странной формы, зелёное, с длинной красной полосой. У мальчика забилось сердце. На санях лежала двухвёсельная крутоносая лодка. Сбоку лодки торчали два зелёных весла и мачта.\n\nТак вот какой был подарок, обещанный дедом Никифором.\n\nПрочитайте текст и определите, на какие вопросы в тексте нет ответов:`,options:[`1) Что делал Никита накануне вечером?`,`2) Почему мальчик проснулся с предчувствием счастья?`,`3) Кто ехал во главе обоза?`,`4) Что увидел мальчик на санях?`,`5) Как дед Никифор выбирал лодку?`],answer:`15`},
{num:24,text:`Смог бы мир существовать без птиц? Если бы и смог, то это был бы мир с безмолвными погибающими лесами и ничтожными урожаями. Расплодились бы в огромном количестве клещи, грызуны. Без птиц ничего не осталось бы от наших урожаев. Ведь птицы съедают невероятное количество жуков, пауков, гусениц, мышей. Большая синица уничтожает за день до шести тысяч насекомых.\n\nКак же благодарен должен быть человек своим пернатым друзьям! Как же бережно должен он относиться к ним!\n\nУ нас ещё есть возможность сохранить удивительный мир природы, однако одним орнитологам не под силу такое. Эта помощь заключается не только в нетерпимом отношении к тем, кто губит пернатых, но и в заботе о лесе, о зелёном убранстве городов и сёл, в подкормке птиц, устройстве гнездовий.\n\nКаждый человек должен осознавать свою гражданскую ответственность за судьбу Земли. Пока этого не будет, экологические проблемы не могут быть успешно решены.\n\nПрочитайте текст и определите, какие из приведённых ниже утверждений соответствуют содержанию текста:`,options:[`1) Из-за того, что птицы съедают огромное количество насекомых, от наших урожаев ничего не остаётся.`,`2) Люди должны бережно относиться к своим пернатым друзьям.`,`3) Чтобы сохранить мир птиц, нужны усилия не только орнитологов.`,`4) Один из способов спасения птиц — создание специальных заповедников.`,`5) Экологические проблемы Земли уже практически решены.`],answer:`23`},
{num:25,text:`Приближалась буря. Мы спустили парус в одно мгновение. Несколько ударов весла — и лодка укрылась за гигантской базальтовой стеной, попав в относительно спокойный водоём. В самой середине нашего укрытия поднимался из воды большой плоский камень. Поверхность этого камня была покрыта бурыми водорослями и раковинами. Вокруг нас высились гигантские утёсы.\n\nВолны с грохотом таранили стену, но она стойко выдерживала натиск моря. Ветром перебрасывало через неё брызги. Волны пенились, дробились и, ослабленные, уходили за базальтовую стенку.\n\nВыкачав из лодки воду, мы перебрали всё наше имущество и уложили его получше. Затем мы оделись потеплее и сели на свои места, надеясь, что ветер стихнет и море хоть немного успокоится.\n\nНо, вопреки нашим ожиданиям, сильная волна подхватила лодку, как пёрышко, и на гребне вынесла в открытое море. Ветер хлестнул по лицу холодной изморосью. Лодка сильно накренилась: прошла вторая большая волна, потом третья. Словно раненая птица, помчалась наша лодка вдоль берега. Ничего не было видно.\n\nПрочитайте текст и определите, на какие вопросы в тексте нет ответов:`,options:[`1) Где укрылась лодка?`,`2) Какие повреждения обнаружили путешественники в лодке?`,`3) На что надеялись путешественники?`,`4) Что произошло после прихода сильной волны?`,`5) Как были спасены путешественники?`],answer:`14`},
{num:26,text:`Всё хорошо было в этой деревне. Всюду было свежо и чисто.\n\nДома в деревне стояли в один ряд, окнами на восход, а между домами росли большие ивы. Кора этих ив была настолько стара и морщиниста, что муравьям, живущим в корнях, казалось бы, будто они ползут по горным ущельям. По другую сторону улицы пестрели поленницы берёзовых дров, сараи да курятники.\n\nДомов стояло всего шестнадцать. Четыре были заколочены и черны, но один ослепительно сверкал соломенной свежестью брёвен. Плотно и добротно сбитый, стоял он на кирпичном фундаменте. Всё говорило о том, что в дом этот скоро приедут новосёлы.\n\nА внизу, под деревней, под песчаной кручей, широко разлилась коричневая от весеннего паводка река.\n\nВсё было по-весеннему прекрасным в этой тихой северной деревеньке.\n\nПрочитайте текст и определите, какие из перечисленных подтем нашли отражение в тексте:`,options:[`1) Старые ивы.`,`2) Создание муравейника.`,`3) Деревенская улица.`,`4) Новый дом.`,`5) На берегу реки.`],answer:`134`},
{num:28,text:`Шиншиллы — это грызуны семейства шиншилловых. Длина тела варьируется от 22 до 38 сантиметров. Масса взрослой особи составляет от 0,5 до 1 килограмма. Для них характерны крупные уши и узкие удлинённые стопы. Передние и задние конечности четырёхпалые, однако пальцы задних конечностей значительно укорочены. Скелет тонкокостный.\n\nВолосяной покров густой, мягкий. Окрас спинной стороны тела голубовато-серый, брюшная поверхность желтовато-белая. Хвост покрыт жёсткими волосами. Усы многочисленные, длинные.\n\nУ грызунов данного вида в ДНК-наборе шестьдесят четыре хромосомы, которые обеспечивают определённую жизнестойкость популяции.\n\nПредставители шиншилловых ведут активный ночной образ жизни и, как правило, моногамны.\n\nИз-за ценного меха шиншиллы в двадцатом веке были практически уничтожены. Однако в настоящее время они охраняются государством.\n\nПрочитайте текст и определите, какие из приведённых ниже утверждений соответствуют содержанию текста:`,options:[`1) Шиншиллы — большие и тяжеловесные существа.`,`2) ДНК-набор обеспечивает определённую жизнестойкость шиншилл.`,`3) Окраска меха шиншилл преимущественно желтовато-коричневая.`,`4) Шиншиллы ведут активный ночной образ жизни.`,`5) Ценный мех долгое время был причиной массового истребления шиншилл.`],answer:`245`},
{num:29,text:`Папоротники — это древнейшие растения, появившиеся около 400 миллионов лет назад. Гигантские папоротниковые растения во многом определяли облик планеты в конце палеозойской — начале мезозойской эры.\n\nСовременные папоротники сильно различаются по размерам, жизненным циклам, особенностям строения. Широкое распространение папоротников по земному шару обусловлено устойчивостью к переувлажнению и громадным количеством спор. Папоротники встречаются в лесах, в расселинах скал, на болотах, в реках и озёрах, на стенах домов. Но самое их большое разнообразие — в местах, где тепло и сыро.\n\nУ папоротников ещё нет настоящих листьев. То, что напоминает лист, — это целая система ветвей.\n\nЗначение папоротников в жизни человека не так велико по сравнению с семенными растениями.\n\nНекоторые папоротники употребляются в пищу. Однако многие их виды ядовиты. Экстракты из щитовника используются в медицине.\n\nС девятнадцатого века папоротники используют как комнатные растения. Орхидеи часто выращивают в почве, содержащей корни папоротника. Стволы древовидных папоротников служат в тропиках строительным материалом.\n\nПрочитайте текст и определите, какие из приведённых ниже утверждений соответствуют содержанию текста:`,options:[`1) Папоротниковые растения появились на Земле в глубокой древности.`,`2) Все современные папоротники очень похожи друг на друга.`,`3) Основной ареал распространения папоротников — страны с холодным и засушливым климатом.`,`4) Папоротники не так широко используются человеком, как другие растения.`,`5) Некоторые папоротники могут служить продуктом питания.`],answer:`145`},
{num:30,text:`Сегодня мы поговорим о русском народном искусстве, точнее, только об одном его художественном явлении — искусстве «золотой Хохломы».\n\nХохлома — это удивительная яркость цвета и праздничность. Огненно-красный цвет изделий, золотое сияние узоров вызывает ощущение жаркого пламени. И недаром. Созидательный огонь превратил деревянные поверхности посуды в золотые. Они блестят золотистым металлическим блеском. Русские люди создавали простые предметы обихода и украшали их яркой нарядной росписью. В ней ожили любимые природные мотивы.\n\nХохломские художники любят рисовать на поверхности своих изделий «ягодки»: земляничку, черничку, малинку, ежевичку, рябинку и смородинку.\n\nСамый любимый орнамент художников — «травка». Как правило, это удлинённые, слегка изогнутые тонкие былинки. А если «травки» превратились в крупные кудри-завитки, то эти узоры называют «кудринами».\n\nПожеланием добра, благополучия и счастья считались изображения цветущих кустов и плодов. Прекрасную традицию хохломские художники сохраняют и сегодня. И с этими вещами в наш дом приходят красота и радость.\n\nПрочитайте текст и определите, какие из перечисленных ниже подтем нашли отражение в тексте:`,options:[`1) История зарождения искусства «золотой Хохломы».`,`2) Яркость и праздничность изделий хохломских мастеров.`,`3) Излюбленные мотивы хохломской росписи.`,`4) Процесс обучения хохломских мастеров.`,`5) Изделия хохломских художников несут людям красоту и радость.`],answer:`235`},
{num:31,text:`Я считаю, что каждый человек обязан заботиться о своём интеллектуальном развитии. Это его обязанность перед обществом, в котором он живёт, и перед самим собой.\n\nСуществуют различные способы интеллектуального развития. Основной, но не единственный, — это чтение.\n\nЯ точно знаю, каким не должно быть чтение. Чтение не должно быть случайным. Почему? Потому что это огромный расход времени, а время — величайшая ценность. Чтение должно быть избирательным, продуманным, глубоким. В чём должен проявляться его избирательный характер? В целенаправленном отборе книг.\n\nВ идеале хорошо было бы составить программу чтения. Разумеется, не обязательно следовать ей жёстко. Отступления от неё возможны там, где появляются дополнительные интересы. Отклонились от первоначального плана — составьте новую программу.\n\nЧтение не должно быть простой самоцелью. Для того чтобы быть эффективным, оно должно в первую очередь интересовать читающего. Так что развивайте в себе интерес к чтению. Такой интерес может быть результатом самовоспитания.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Любой человек должен заботиться о своём интеллектуальном развитии.`,`2) Единственный способ интеллектуального развития — чтение.`,`3) Чтение должно быть избирательным и целенаправленным.`,`4) Нельзя отступать от составленной и продуманной вами программы чтения.`,`5) Наличие увлечённости чтением — залог его эффективности.`],answer:`135`},
{num:32,text:`Есть на карте России, недалеко от Нижнего Новгорода, село Хохлома, известное теперь всему миру своими неповторимыми изделиями.\n\nХохломской промысел насчитывает более трёх столетий. По одной из легенд, принёс на Нижегородскую землю искусство золотой росписи старообрядец-иконописец. Селились вокруг избы мастера люди, перенимали его искусство. Быстро разлетелась слава об умельце. Послал царь стрельцов за мастером, да воля тому была дороже жизни. Передал он свои секреты людям, поджёг избу и исчез. Сгорел ли иконописец вместе с домом или ушёл дальше за волей, неизвестно. Но остались его краски — цвет жаркого костра и чернь пепелища. А огненная жар-птица стала символом хохломской росписи.\n\nКонечно, это легенда, но действительно уходили в леса старообрядцы, знавшие секреты золочения икон без золота. Деревянные иконы покрывали тонким слоем растёртого в порошок серебра, пропитывали олифой и ставили в русскую печь. После закалки огнём икона обретала новый золотистый цвет. А позже эти приёмы стали использовать для изготовления расписной деревянной посуды.\n\nСегодня для народного хохломского промысла нет границ. Хохломская роспись вышла из традиционных рамок.\n\nПрочитайте текст и определите, на какие вопросы в тексте нет ответов:`,options:[`1) Где находится село Хохлома?`,`2) Сколько есть разных версий возникновения хохломского промысла?`,`3) Каковы излюбленные сюжеты хохломской росписи?`,`4) Почему легендарный мастер-иконописец исчез?`,`5) Какие приёмы использовались для золочения икон без золота?`],answer:`23`},
{num:33,text:`Был хороший майский день. Своё свободное время я проводил, бродя по булыжным мостовым, по которым так редко проезжали автомобили, что между камней росла травка.\n\nСтарый русский городок, кирпично-бурый, малоэтажный, с горбатыми улочками, смотрел на меня гераниевыми своими окошками. За крашеными заборами ютились тесные дворики, заросшие травой с одуванчиками и кустами цветущей сирени. Кирпичные украшения дряхлых домов резко контрастировали с белёными фасадами новых домов на окраинах города.\n\nСтарики сидели на скамеечках перед этими домами. Мне, столичному жителю, было очень хорошо, и я, как со старыми знакомыми, здоровался с ними. Слыша в ответ удивлённое «здрасте», я смущался.\n\nБродя по улочкам, которые вели то вверх, то вниз, я вышел к краеведческому музею. Площадка перед музеем была похожа на старый церковный дворик.\n\nПрочитайте текст и определите, какие из перечисленных подтем нашли отражение в тексте:`,options:[`1) Прогулки по городу.`,`2) Улочки старого городка.`,`3) Церквушка на окраине.`,`4) Старики на скамеечках.`,`5) Посещение музея.`],answer:`124`},
{num:34,text:`Нравственный климат в государстве определяется степенью культуры общества. А культура — это прежде всего результат знаний, упорядоченных и сочетающихся с осознанием их недостаточности.\n\nЧем больше человек знает, тем яснее он понимает недостаток своих знаний. Отсюда осторожность и тактичность подлинно знающих людей и чрезвычайная самоуверенность полузнаек.\n\nПолузнайка думает, что знает всё. И он всегда находит быстрый выход из временных затруднений. Полузнайке кажется, что учёный или просто культурный человек — плохой проводник его идей и живой укор его невежеству. Некультурность видна во всём облике полузнайки. Он агрессивен в своём мировоззрении, в отношении к природе, к истории, к искусству. Одним словом, полузнайка ведёт себя так, будто находится в полузнакомом лесу в сумерках.\n\nТаким образом, полузнайство воспитывает очень опасные черты характера. Полузнайство — это опаснейшая социальная болезнь.\n\nУкажите, какие утверждения противоречат точке зрения автора:`,options:[`1) Культура предполагает овладение определённой суммой знаний.`,`2) Полузнайкам свойственны самоуверенность и агрессивность.`,`3) Полузнаек отличает уважение к науке и учёным.`,`4) Полузнайство — безобидная мелочь в поведении людей.`,`5) Подлинно образованные люди понимают ограниченность своих знаний.`],answer:`34`},
{num:35,text:`Зима вошла в степи. К этому времени волчата у Акбары заметно подросли и превратились в угловатых переростков — каждый со своим норовом. Волчица не могла дать им имена, зато по запаху и другим приметам легко различала своих детёнышей.\n\nПервый снег, выпавший незаметно за ночь, ранним утром был праздником для всех. Вначале волчата оробели от вида и запаха незнакомого вещества, а потом стали барахтаться в снегу и фыркать от удовольствия.\n\nВ степи было уже светло и прозрачно. Острый голод по-зимнему дал о себе знать. Наступила пора добывать прокорм. Волчата сидели в нетерпеливом напряжении. Акбара встала с места и двинулась трусцой. И все последовали за ней.\n\nВсё складывалось так, как грезилось волчице. Акбара и Ташчайнар, отец семейства, вели своих перворождённых на первую для них великую охоту на сайгаков. Волки шли то шагом, то трусцой. И смогут ли они выжить в этом мире, теперь зависело от них самих и от удачи.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Акбара различала своих детёнышей по именам.`,`2) Волчата оробели от вида и запаха первого снега.`,`3) Острый голод заставил волчье семейство отправиться на охоту.`,`4) Ташчайнар и Акбара уже не в первый раз вели своих волчат на охоту.`,`5) Охота оказалась очень удачной для волчат.`],answer:`23`},
{num:36,text:`В годы Великой Отечественной войны наравне с людьми сражались и животные. Верблюдов стали брать в армию не от хорошей жизни. Когда в Астраханской области перебили всех лошадей, некому стало тащить артиллерийские снаряды и полевую кухню. Многие двугорбые, высокие и слишком медлительные, погибли в первые же дни службы. Однако были такие, кто мужественно вытерпел все тяготы солдатской службы, уцелел и дожил до победы.\n\nВерблюды Маша и Миша прошагали со своим артиллерийским расчётом до Берлина. Они невозмутимо подвозили оружие, тем самым помогая воинам. Машу и Мишу не пугали ни разрывы снарядов, ни свист пуль, ни тяжёлый гул орудий.\n\nПосле войны штабное начальство велело отправить животных на бойню, но армейцы потребовали найти другое решение. И героических животных оставили в Берлинском зоопарке.\n\nА в 2008 году Маше и Мише в Ахтубинске установили бронзовый памятник. Так увековечили мужество, героизм и дружбу человека и животного.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) В суровых боевых условиях верблюды заменили лошадей.`,`2) Верблюды легко избегали опасности благодаря быстроте реакции.`,`3) Выносливость и невозмутимость верблюдов Миши и Маши сделали их верными помощниками артиллеристов.`,`4) Бойцы заступились за верблюдов перед штабным начальством и спасли их от гибели.`,`5) Памятник героическим животным установлен в Берлинском зоопарке.`],answer:`134`},
{num:37,text:`Это лето было на редкость знойным. Вечера стояли душные, тихие, даже ночь не приносила облегчения. Вот и сегодня казалось, что в густом воздухе застыли и город, и река. И вдруг зажглась первая звезда, за ней другая, и вскоре всё небо покрылось звёздным узором, россыпью огоньков отразившимся в реке.\n\nВ доме на берегу не спал маленький мальчик. Он смотрел на звёзды и видел неведомый, фантастический мир. Вот Козерог, а вот созвездие Водолея. Водолей — это сказочный король, который вытянул руку, чтобы с его ладони падала вниз, на Землю, серебряная струя. А вон Скорпион, Телец, Дева, Рыбы.\n\nМальчику вспомнился бабушкин рассказ о далёких временах, когда люди верили, что по звёздам можно определить, сколько живых душ обитает на земле. Родился человек — зажглась звезда, отдал Богу душу — и звезда погасла. Большие и яркие звёзды принадлежат князьям и царям, маленькие и тусклые — неудачникам и беднякам, а самые крохотные — всем остальным существам.\n\nМаленький художник не спал до рассвета, мысленно рисуя одну картину за другой.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Звёзды россыпью огоньков отразились в реке.`,`2) Водолей — это сказочный король, с ладони которого бьёт высоко в небо серебряная струя.`,`3) В старину люди верили, что по звёздам можно определить, сколько живых душ обитает на земле.`,`4) Большие и яркие звёзды принадлежат творческим людям, маленькие и тусклые — животным, а самые крохотные — беднякам.`,`5) Мальчик не спал до рассвета, мысленно рисуя одну картину за другой.`],answer:`135`},
{num:38,text:`Я просыпаюсь от холода. Вылезаю из-под одеяла, иду во двор за поленьями. С десяток поленьев несу в дом. Нащипал лучины и затопил печь. Запах огня был чист и резок. Дым, белый как снег, пошёл в трубу, и я долго смотрел на него.\n\nЧерез несколько часов на небе показалось яркое солнышко.\n\nЕго лучи стали проникать через неплотно притворённые ставни, золотили изразцовую печь и стены. Какие только переливающиеся на солнце краски здесь не играли.\n\nПечь уже трещала. Я взял две бадьи и пошёл за водой. Высоко натоптанная тропинка звенела под валенками. Снег на солнце был до того ярок и светел, что глаза непроизвольно щурились, а в тени ощущалась глубинная снежная синева.\n\nНабрав воды, я пошёл домой. Дышалось легко, глубоко. Я не слышал своего сердца. Дома налил воды в самовар, набрал румяных углей и опустил их в нутро самовара. Самовар зашумел почти тотчас же.\n\nЯ раскрыл банку сгущёнки, заварил чай и нарезал хлеб. Хорошо-то как.\n\nПрочитайте текст и укажите высказывания, которые точно отражают содержание текста:`,options:[`1) Жарко натопленная печь не давала спать.`,`2) От яркого снега приходилось щурить глаза.`,`3) Лучи солнца играли разноцветными красками на стенах.`,`4) На морозе хорошо ощущалось биение сердца.`,`5) Сгущёнка, чай и хлеб — вот и весь завтрак.`],answer:`235`},
{num:39,text:`«Это подлинник», — с уважением говорят про картину или скульптуру. Казалось бы, можно, листая журнал или книгу с репродукциями, познакомиться с творчеством художников и скульпторов. Но почему люди всё-таки стремятся в музеи и картинные галереи? Почему, чтобы посмотреть подлинник, они едут в другой город или страну?\n\nЭти вопросы очень важны для формирования правильного отношения к искусству. Художник не просто положил краски на холст. В картину он всегда вкладывает своё отношение к тому, что изображает, свои переживания и мысли — словом, своё неповторимое видение мира. Встреча с произведением искусства — это также встреча с его создателем.\n\nСтоя перед картиной или скульптурой, мы стараемся понять её творца, разгадать то, что он хотел нам сказать. И чем больше мы смотрим на картину-подлинник, тем больше она говорит нам. Рассказать обо всём этом, передать очарование подлинника не в силах даже самая совершенная копия.\n\nПрочитайте текст и укажите высказывания, которые точно отражают содержание текста:`,options:[`1) По-настоящему с творчеством художников и скульпторов можно познакомиться, только обратившись к книгам и журналам.`,`2) В картинах отражается неповторимый мир художника.`,`3) Встречаясь с произведением искусства, вы встречаетесь и с его создателем.`,`4) Только подлинник позволяет понять творца, разгадать его замысел.`,`5) Самая совершенная копия в состоянии передать очарование подлинника.`],answer:`234`},
{num:40,text:`Лексика — это словарный запас языка. Центральную, ядерную, часть лексики составляют слова, актуальные для современных носителей русского языка, и прежде всего общеупотребительные слова.\n\nЭто слова, понятные всем говорящим на русском языке и необходимые для их повседневного общения.\n\nОни образуют активную лексику. Это, например: человек, голова, учить, есть, светлый, умный.\n\nНа фоне активной лексики выделяется пассивная лексика.\n\nВ неё входят слова, редко употребляющиеся в повседневном общении. Это слова, уже неактуальные в процессе общения, или, наоборот, новые слова, недавно появившиеся и ещё не ставшие привычными.\n\nГраницы между активной и пассивной лексикой характеризуются подвижностью, изменчивостью. Это значит, что возможен переход из одной группы в другую. К пассивной лексике относят слова, которые ранее принадлежали к активной лексике, и наоборот.\n\nПрочитайте текст и укажите высказывания, которые точно отражают содержание текста:`,options:[`1) Словарный состав языка включает как активную, так и пассивную лексику.`,`2) Общеупотребительные слова составляют периферийную часть лексики.`,`3) Границы между активной и пассивной лексикой подвижны.`,`4) В состав активной лексики входят устаревшие слова и неологизмы.`,`5) Лексика — это словарный состав языка.`],answer:`135`},
{num:41,text:`Самый старый дуб в Беларуси любовно называют «царём-дубом». Растёт этот дуб в трёх километрах восточнее деревни Старое Роматово Брестской области.\n\nПо оценкам специалистов, дереву более восьмисот лет. Царь-дуб не только самый старый в Беларуси, но и самый высокий. Его высота составляет сорок шесть метров, диаметр ствола больше двух метров.\n\nДерево имеет прямой колоннообразный ствол. В 1963 году царь-дуб был объявлен памятником природы республиканского значения.\n\nПрочитайте текст и определите, какое из приведённых после текста предложений должно быть в нём первым:`,options:[`1) В Лепельском районе Витебской области растёт знаменитый царь-дуб, являющийся символом рода Реутов.`,`2) На территории лесничества есть ещё один памятник природы — дуб-патриарх, которому около семисот лет.`,`3) В центральном городском парке растут уникальные сосны.`,`4) В 2009 году в Северной Америке учёные обнаружили самое старое дерево — дуб Палмера.`,`5) Самый старый дуб в Беларуси любовно называют «царём-дубом».`],answer:`5`},
{num:42,text:`Барбос был невелик ростом, но приземист и широкогруд. Благодаря длинной, чуть-чуть вьющейся шерсти в нём замечалось отдалённое сходство с белым пуделем, но только с пуделем, к которому никогда не прикасались ни мыло, ни гребень, ни ножницы. Летом он постоянно бывал унизан колючками, а осенью клоки шерсти на его ногах и животе превращались в коричневые болтающиеся сталактиты. Уши Барбоса вечно носили следы «боевых схваток».\n\nПёс имел весьма смутные понятия о праве собственности и не отличался аккуратностью. Этому разбойнику ничего не стоило стрескать половину жареного индюка или улечься, только что выскочив из грязной лужи, на белое покрывало.\n\nБарбос обычно лежал на подоконнике раскрытого окна. Едва на улице показывалась собачья фигура, он стремительно скатывался с окошка и настигал соперника. В течение нескольких минут в густом столбе пыли барахтались два собачьих тела. Наконец Барбос одерживал победу. С гордым видом он возвращался на свой пост на подоконник. Иногда при этом он сильно прихрамывал, но тем слаще казались ему победные лавры.\n\nПрочитайте текст и определите, какие из перечисленных ниже подтем нашли отражение в тексте:`,options:[`1) Отдалённое сходство Барбоса с белым пуделем.`,`2) «Боевые схватки» с котами.`,`3) Воспитанный и аккуратный пёс.`,`4) Дружба пса с индюками.`,`5) Победные лавры.`],answer:`15`},
{num:43,text:`Сказку об Иванушке мне в детстве рассказывала бабушка. Помню розового коня, возникавшего передо мной в ночной тьме всякий раз, когда я слышал её неторопливое повествование. Почему ребёнок просит взрослого слово в слово повторять одну и ту же сказку?\n\nПочему с замиранием сердца следит за развитием событий? Об этом своём ощущении хорошо помнят многие люди, давно ставшие взрослыми. Детям необходимо видеть, как добро всякий раз неуклонно одерживает победу над злом. Так важна учёным повторяемость результатов опыта, подтверждающего открытый ими закон.\n\nПрочитайте текст и определите, какое из приведённых после текста предложений должно быть в нём первым:`,options:[`1) Я настаиваю, что Иванушка-дурачок и Иван-царевич — это один герой.`,`2) Множество чудесных подвигов совершил Иван-царевич.`,`3) Сказку об Иванушке мне в детстве рассказывала бабушка.`,`4) Кто же полезет в подземное царство, кроме Иванушки?`,`5) В сказке лягушка обязательно становится прекрасной царевной.`],answer:`3`},
{num:44,text:`Чартков сделался модным живописцем во всех отношениях. Чаще стал бывать на обедах, сопровождать дам в галереи и на гулянья, щегольски одеваться. Дома у себя он завёл опрятность и чистоту, великолепных лакеев, щегольских учеников, занялся улучшением манер. Скоро в нём нельзя было узнать того скромного и талантливого художника, который работал когда-то незаметно в своей лачужке на Васильевском острове.\n\nКогда в журналах появлялась печатная хвала ему, он радовался, как ребёнок, хотя эта хвала была куплена им за свои же деньги. Слава его росла, работы и заказы увеличивались. Но уже стали ему надоедать одни и те же портреты и лица. Уже без большой охоты он писал. Ум уставал придумывать и обдумывать. Кисть его хладела и тупела.\n\nПрикосновение прекрасного уже не превращало девственных сил в огонь и пламя. Но все отгоревшие чувства становились доступнее к звуку золота, вслушивались внимательнее в его заманчивую музыку. Золото сделалось его страстью, идеалом, страхом, наслаждением, целью.\n\nПрочитайте текст и определите, какие из перечисленных ниже подтем нашли отражение в тексте:`,options:[`1) Модный живописец.`,`2) Дворец на Васильевском острове.`,`3) Хвалебные статьи в журналах.`,`4) Жизнь богатых заказчиков.`,`5) Заманчивая музыка золота.`],answer:`135`},
{num:45,text:`Невесомость — естественное состояние космического полёта. По словам космонавтов, побывавших в космосе, она похожа по ощущениям на спуск в скоростном лифте или полёт в самолёте. Невесомость может существенно влиять на физическое состояние человека.\n\nПродолжительное воздействие невесомости на человеческое тело приводит к неблагоприятным изменениям. Ослабляется циркуляция крови, снижается содержание воды в тканях и кальция в костях, ухудшается мышечный тонус. Предварительная тренировка и профилактические меры позволяют космонавту долгое время находиться и успешно работать в условиях невесомости.\n\nПрочитайте текст и определите, какое из приведённых после текста предложений должно быть в нём первым:`,options:[`1) На борту космического аппарата многие физические процессы протекают иначе, чем на Земле.`,`2) При таком состоянии не проявляется действие веса.`,`3) На международной космической станции уже проведено множество экспериментов, которые призваны определить, как отсутствие всемирного тяготения влияет на организм человека.`,`4) Невесомость — естественное состояние космического полёта.`,`5) Физические тренировки в условиях космического полёта жизненно необходимы.`],answer:`4`},
{num:46,text:`В ожидании концерта мы расположились в камышовых зарослях на берегу небольшой, но быстрой речонки. Воздух был чист, прозрачен, душист.\n\nВечер начался пением кукушки. Она лениво закуковала где-то в дальней роще и скоро замолкла. Затем запела иволга, певица известная, серьёзно занимающаяся певческим искусством. Мы прослушали бы её с удовольствием, если бы не грачи, летевшие на ночёвку и с карканьем опустившиеся на рощу.\n\nКогда закричали грачи, загалдели и лягушки, где-то запел дрозд. Ему аккомпанировали речная курочка и камышовка.\n\nЗатем последовал антракт, наступила тишина, изредка нарушаемая пением сверчка. Когда на землю опустилась ночь и луна остановилась среди неба над самой рощей, наступила и очередь соловья. Он показался в молодом ольшанике, порхнул в терновник и стал неподвижен. Минуты три сидел он молча. Но вот зашумели верхушки деревьев, задул ветерок, затрещал громче сверчок, и соловей исполнил свою первую трель.\n\nОн запел, засвистал, осыпая рощу щёлканьем и дробью. И властная сила, и томительная нега, и искренняя страсть слышались в его чудесном голосе. Он пел, а кругом царила внимающая тишина.\n\nКогда засерело небо и потухли звёзды, голос соловья стал слабее и нежнее и мало-помалу умолк.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) Вечер начался пением камышовки.`,`2) Пению кукушки помешали грачи, летевшие на ночёвку.`,`3) Дрозд пел в сопровождении кукушки.`,`4) Соловей исполнил свою первую трель, когда зашумели верхушки деревьев, задул ветерок и затрещал громче сверчок.`,`5) В чудесном голосе соловья слышались и сила, и нега, и страсть.`],answer:`45`},
{num:47,text:`Много удивительного и прекрасного можно было увидеть в Древнем Вавилоне. Но всё затмевали знаменитые висячие сады Семирамиды. Вошедшему на их территорию казалось, что он находится в небольшой долине, с трёх сторон окружённой горными лесистыми склонами.\n\nКонструкция, которая поддерживала сады, была почти не видна. Она хорошо была замаскирована и скрыта за вьющимися растениями и каменными глыбами, изображающими отвесные скалы.\n\nСады словно парили в воздухе, над городом, над его домами и храмами, высоко над зубцами крепостной стены дворца.\n\nПрочитайте текст и определите, какое из приведённых после текста предложений должно быть в нём первым:`,options:[`1) Самое раннее упоминание о висячих садах Семирамиды датируется примерно 290 г. до н. э.`,`2) Кто построил знаменитые сады Семирамиды?`,`3) Много удивительного и прекрасного можно было увидеть в Древнем Вавилоне.`,`4) Мастера Вавилона были известны и в других городах и странах.`,`5) Висячие сады Семирамиды раскинулись на искусственных террасах, расположенных в четыре яруса.`],answer:`3`},
{num:48,text:`Передо мной были молчаливые горы и тихие леса в осенней задумчивости. Горечь надвигающегося увядания угадывалась во всём. Речки кружились, затягивая в жёлтые петли горы с дремучими лесами. Всё вокруг было величаво и спокойно.\n\nПредчувствие долгого сна таилось в лесах, и шорох облетающих листьев уже начинал усыплять их, нашёптывая об осенних дождях, о глубоких снегах и о весне, которую надо долго и терпеливо ждать. Очарованные печальной музыкой осени, обнажились леса, роняя листья в светлые ручьи.\n\nЗемля надевала шубу из листьев, готовилась к зиме, и только шорох был всюду от листа и шум от речек, наполненных водой благодаря дождям.\n\nНо гора, на которой мы стояли, жила вроде бы отдельно от всего леса. Она была обрублена лет десять назад. Вокруг пней рос рябинник, берёзки. Они без грусти сорили вокруг листьями, а тонкие рябинки были с первыми ягодами.\n\nПрочитайте текст и определите, какие из перечисленных ниже утверждений соответствуют содержанию текста:`,options:[`1) В природе уже угадывалась горечь осеннего увядания.`,`2) Шорох облетающих листьев нашёптывал лесам о долгожданном лете.`,`3) Очарованные печальной музыкой осени, обнажились леса.`,`4) В преддверии зимы реки обмелели.`,`5) Рябины и берёзы величаво и спокойно ожидали прихода весны.`],answer:`13`},
{num:49,text:`Дом у Песоцкого был громадный, с колоннами, со львами, на которых облупилась штукатурка, и с лакеем у подъезда.\n\nСтаринный парк, угрюмый и строгий, разбитый на английский манер, тянулся чуть ли не целую версту от дома до реки и здесь оканчивался обрывистым, крутым глинистым берегом, на котором росли сосны с обнажившимися корнями. Внизу нелюдимо блестела вода, носились кулики. И всегда тут менялось настроение. Зато около самого дома, во дворе и фруктовом саду всегда было весело и жизнерадостно.\n\nТаких удивительных роз, лилий, камелий, таких тюльпанов всевозможных цветов, как в усадьбе Песоцкого, не случалось видеть в другом месте. Весна была ещё только в начале, и роскошь цветников пряталась ещё в теплицах. Но и того, что цвело вдоль аллей и на клумбах, было достаточно, чтобы почувствовать себя в царстве нежных красок. Особенно в ранние часы, когда на каждом лепестке сверкала вода.\n\nПрочитайте текст и определите, какие из перечисленных ниже подтем нашли отражение в тексте:`,options:[`1) Дом Песоцкого.`,`2) Старинный парк.`,`3) Пологий песчаный берег реки.`,`4) Цветы в усадьбе Песоцкого.`,`5) Ранние часы в осеннем саду.`],answer:`124`},
{num:50,text:`За скрипучим столом в кабинете, низко нагнувшись над книгой или препаратом, сидит мой ассистент Пётр Игнатьевич, трудолюбивый, скромный, но бесталанный человек. Работает он с утра до ночи, читает много, отлично помнит всё прочитанное — и в этом отношении он не человек, а золото. В остальном же это ломовой конь, учёный-тупица. Характерные черты ломового коня, отличающие его от таланта, таковы: кругозор его тесен и ограничен специальностью; вне своей специальности он наивен, как ребёнок.\n\nДругая черта — фантастическая вера в непогрешимость науки и всего того, что пишут немцы. Он уверен в самом себе, в своих препаратах, знает цель жизни и незнаком с сомнениями. Рабское поклонение авторитетам и отсутствие потребности самостоятельно мыслить. Разубедить его в чём-то трудно.\n\nБудущность его представляется мне ясно. Возможно, за всю свою жизнь Пётр Игнатьевич приготовит несколько сотен препаратов необыкновенной чистоты, напишет много сухих рефератов, сделает около десяти добросовестных переводов. Но пороха он не выдумает. Для пороха нужны фантазия, изобретательность, умение угадывать. Короче говоря, это не хозяин в науке, а работник.\n\nПрочитайте текст и определите, какие из перечисленных ниже подтем нашли отражение в тексте:`,options:[`1) Талантливый учёный.`,`2) Удивительная трудоспособность Петра Игнатьевича.`,`3) Отсутствие веры в непогрешимость науки.`,`4) Рабское поклонение авторитетам.`,`5) Научные открытия.`],answer:`24`},
{num:51,text:`Карликовая игрунка относится к семейству игрунковых и является наименьшим представителем отряда приматов на Земле.\n\nДлина тела достигает 15 сантиметров, хвоста — 20 сантиметров. Максимальная масса тела — 150 граммов. Шерсть густая и длинная и окрашена на верхней стороне в золотисто-бурый цвет. Длинные пучки волос на голове и груди напоминают гриву. Глаза маленькие, миндалевидные.\n\nКарликовые игрунки активны в утреннее и полуденное время. Они передвигаются на четырёх лапах и умеют прыгать на расстояние до одного метра. Карликовые игрунки живут в родовых группах. Взаимный уход за шерстью играет важную роль в их социальных отношениях.\n\nКарликовые игрунки живут в бассейне реки Амазонки, в южной Колумбии, Эквадоре, северных регионах Перу и Боливии, а также на западе Бразилии. Часто селятся на опушках лесов, по берегам рек и в заливаемых сезонными паводками джунглях. На деревьях эти животные проводят большую часть жизни. Но иногда они спускаются на землю.\n\nПища карликовых игрунок в основном состоит из древесных соков. Учёные отмечают, что самая большая продолжительность жизни у этих зверей составляет одиннадцать лет.\n\nПрочитайте текст и определите, на какие вопросы в тексте есть ответы:`,options:[`1) Какие животные, кроме карликовой игрунки, являются представителями отряда приматов?`,`2) Какова длина шерсти у карликовой игрунки?`,`3) В какое время суток карликовая игрунка проявляет активность?`,`4) Где обитает карликовая игрунка?`,`5) Какова самая большая продолжительность жизни карликовой игрунки?`],answer:`345`},
