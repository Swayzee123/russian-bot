<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#6C63FF;--primary-light:#8B83FF;--primary-dark:#5A52E0;--accent:#FF6584;--bg-start:#f0e6ff;--bg-end:#e6e0ff;--card-bg:rgba(255,255,255,0.92);--text:#2d2d3a;--text-light:#6b6b80;--radius:20px;--shadow:0 8px 32px rgba(108,99,255,0.12)}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:90px;background:linear-gradient(135deg,var(--bg-start),var(--bg-end));color:var(--text)}
        .header{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(108,99,255,0.1);position:sticky;top:0;z-index:10}
        .date-icon{font-size:14px;font-weight:600;background:linear-gradient(135deg,var(--primary),var(--primary-light));padding:8px 16px;border-radius:24px;color:white;box-shadow:0 2px 12px rgba(108,99,255,0.3)}
        .close-btn{font-size:22px;cursor:pointer;color:var(--primary);background:rgba(108,99,255,0.08);border:none;width:40px;height:40px;border-radius:50%;transition:all .25s}
        .close-btn:hover{background:rgba(108,99,255,0.18);transform:scale(1.08)}
        .tabs{display:flex;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);padding:8px 16px;gap:20px;border-bottom:1px solid rgba(108,99,255,0.1);overflow-x:auto;position:sticky;top:68px;z-index:10;-webkit-overflow-scrolling:touch}
        .tab{font-size:14px;font-weight:600;color:var(--text-light);padding:10px 0;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .25s}
        .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
        .content{padding:18px;animation:fadeUp .4s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .subject-card{background:var(--card-bg);backdrop-filter:blur(12px);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;border:1px solid rgba(108,99,255,0.06)}
        .subject-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(108,99,255,0.18)}
        .subject-title{font-size:22px;font-weight:800;margin-bottom:18px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px}
        .task-btn{background:linear-gradient(145deg,rgba(108,99,255,0.08),rgba(108,99,255,0.03));border:2px solid rgba(108,99,255,0.15);border-radius:18px;padding:13px 6px;text-align:center;cursor:pointer;font-weight:700;font-size:14px;color:var(--primary);transition:all .25s;position:relative;overflow:hidden}
        .task-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--primary),var(--accent));opacity:0;transition:opacity .25s;border-radius:18px}
        .task-btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(108,99,255,0.3);border-color:transparent}
        .task-btn:hover::before{opacity:1}
        .task-btn:hover{color:white}
        .task-btn span{position:relative;z-index:1}
        .task-btn.viewed{border-color:var(--accent);background:linear-gradient(145deg,rgba(255,101,132,0.12),rgba(255,101,132,0.04))}
        .task-btn.viewed::after{content:'✓';position:absolute;top:4px;right:6px;font-size:10px;color:var(--accent)}
        .quiz-card{background:var(--card-bg);border-radius:28px;padding:24px;box-shadow:0 16px 48px rgba(108,99,255,0.1);animation:fadeUp .4s ease;border:1px solid rgba(108,99,255,0.06)}
        .rule-title{font-size:22px;font-weight:800;margin-bottom:20px;color:var(--primary);border-left:4px solid var(--accent);padding-left:14px}
        .rule-text{font-size:15px;line-height:1.65;color:var(--text)}
        .rule-text table{width:100%;border-collapse:separate;border-spacing:0;margin:18px 0;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(108,99,255,0.06)}
        .rule-text th,.rule-text td{border:1px solid rgba(108,99,255,0.12);padding:11px 13px;text-align:left;vertical-align:top}
        .rule-text th{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;font-weight:700;font-size:14px}
        .rule-text tr:nth-child(even) td{background:rgba(108,99,255,0.03)}
        .rule-text td{background:white}
        .rule-text .info-block{background:linear-gradient(135deg,rgba(108,99,255,0.06),rgba(108,99,255,0.02));border-left:4px solid var(--primary);padding:14px 18px;margin:16px 0;border-radius:14px}
        .rule-text .info-block i{color:var(--primary);margin-right:8px;font-size:16px}
        .rule-text .example{background:linear-gradient(135deg,rgba(255,101,132,0.08),rgba(255,101,132,0.02));border-left:4px solid var(--accent);padding:13px 16px;margin:14px 0;border-radius:14px}
        .rule-text .ex-word{font-weight:700;color:var(--primary);background:rgba(108,99,255,0.1);padding:2px 6px;border-radius:6px}
        .btn-main{width:100%;background:linear-gradient(135deg,var(--primary),var(--accent));color:white;border:none;padding:15px;border-radius:24px;font-size:15px;font-weight:700;cursor:pointer;margin-top:20px;transition:all .25s;box-shadow:0 4px 16px rgba(108,99,255,0.3)}
        .btn-main:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,99,255,0.4)}
        .footer{position:fixed;bottom:0;left:0;width:100%;padding:10px 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(108,99,255,0.1);display:flex;justify-content:center;gap:36px;z-index:10}
        .social-item{text-align:center;text-decoration:none;color:var(--primary);transition:all .25s}
        .social-item:hover{transform:translateY(-3px);color:var(--accent)}
        .social-icon{font-size:24px;margin-bottom:4px;display:block}
        .social-label{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
        .stat-card{background:var(--card-bg);border-radius:var(--radius);padding:20px;margin-bottom:16px;text-align:center;box-shadow:var(--shadow);border:1px solid rgba(108,99,255,0.06)}
        .stat-progress{width:100%;height:10px;background:rgba(108,99,255,0.1);border-radius:10px;overflow:hidden;margin-top:14px}
        .stat-progress-fill{height:100%;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:10px;transition:width .6s ease}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
</head>
<body>
<div id="mainScreen" class="screen">
    <div class="header"><div class="date-icon" id="currentDate"></div><button class="close-btn" onclick="window.Telegram?.WebApp?.close()">✕</button></div>
    <div class="tabs"><div class="tab active" data-tab="tasks">📚 Задания</div><div class="tab" data-tab="stats">📊 Статистика</div><div class="tab" data-tab="profile">👤 Профиль</div></div>
    <div class="content"><div id="tasksList"></div><div id="statsContent" style="display:none;"></div><div id="profileContent" style="display:none;"></div></div>
    <div class="footer">
        <a href="https://t.me/histforyou" target="_blank" class="social-item"><i class="fab fa-telegram-plane social-icon"></i><div class="social-label">TELEGRAM КАНАЛ</div></a>
        <a href="https://t.me/swayzeee" target="_blank" class="social-item"><i class="fab fa-telegram-plane social-icon"></i><div class="social-label">МОЙ TELEGRAM</div></a>
        <a href="https://www.instagram.com/yakimisha_oleg" target="_blank" class="social-item"><i class="fab fa-instagram social-icon"></i><div class="social-label">МОЙ INSTAGRAM</div></a>
    </div>
</div>
<div id="ruleScreen" class="screen" style="display:none;">
    <div class="header"><button class="close-btn" onclick="backToTasks()">←</button><div id="ruleTitle"></div><div style="width:42px"></div></div>
    <div class="content"><div class="quiz-card"><div class="rule-title" id="ruleHeader"></div><div class="rule-text" id="ruleText"></div><button class="btn-main" onclick="backToTasks()">📖 Назад к заданиям</button></div></div>
</div>
<script>
const tg = window.Telegram?.WebApp; if(tg){tg.expand();tg.ready();}

const sections = [
// А1
{id:"А1",title:"А1. Чередование гласных в корне",rule:`
<div class="info-block"><i class="fas fa-exchange-alt"></i> <b>Корни с чередованием А/О</b></div>
<table class="table"><tr><th>Корень</th><th>Условие</th><th>Примеры</th></tr>
<tr><td>гар/гор</td><td>Без ударения — О</td><td>заг<u>а</u>рать — заг<u>о</u>релый, уг<u>а</u>р</td></tr>
<tr><td>клан/клон</td><td>Без ударения — О</td><td>накл<u>а</u>нить — накл<u>о</u>ниться, покл<u>о</u>н</td></tr>
<tr><td>твар/твор</td><td>Без ударения — О</td><td><u>тв</u>арь — <u>тв</u>орить, у<u>тв</u>арь</td></tr>
<tr><td>зар/зор</td><td>Без ударения — А</td><td>оз<u>а</u>рять — з<u>о</u>ри, з<u>а</u>ря</td></tr>
<tr><td>плав/плов</td><td>Всегда А, кроме «пловец, пловчиха»</td><td>пл<u>а</u>вать, попл<u>а</u>вок — пл<u>о</u>вец</td></tr>
<tr><td>кас/кос</td><td>Есть суффикс А — пишем А</td><td>к<u>а</u>саться — к<u>о</u>снуться</td></tr>
<tr><td>лаг/лож</td><td>Перед Г — А, перед Ж — О</td><td>пол<u>а</u>гать — пол<u>о</u>жить, прил<u>а</u>гательное</td></tr>
<tr><td>раст/ращ/рос</td><td>Перед СТ, Щ — А, иначе — О</td><td>выр<u>а</u>стить, р<u>а</u>стение — выр<u>о</u>с</td></tr>
<tr><td>скак/скоч</td><td>Перед К — А, перед Ч — О</td><td>ск<u>а</u>кать — вск<u>о</u>чить</td></tr>
<tr><td>мак/мок</td><td>мак = погружать, мок = мокрый</td><td>м<u>а</u>кать хлеб — пром<u>о</u>кашка</td></tr>
<tr><td>равн/ровн</td><td>равн = одинаковый, ровн = гладкий</td><td>ср<u>а</u>внить — подр<u>о</u>внять</td></tr>
</table>
<div class="example"><i class="fas fa-star"></i> <b>Исключения:</b> <span class="ex-word">отрасль, Ростов, Ростислав, росток, ростовщик</span> (раст/рос); <span class="ex-word">пловец, пловчиха</span> (плав); <span class="ex-word">пригарь, выгарки</span> (гар/гор)</div>
<div class="info-block"><i class="fas fa-lightbulb"></i> <b>Лайфхак!</b> Подбирай однокоренное слово, где гласная под ударением: <span class="ex-word">побледневший → бледный</span>. НЕЛЬЗЯ проверять словами с суффиксами -ыва-/-ива-: <span class="ex-word">опоздать</span> (поздний), НО <span class="ex-word">опаздывать</span></div>
`},

// А2
{id:"А2",title:"А2. Приставки ПРЕ-/ПРИ-",rule:`
<div class="info-block"><i class="fas fa-code-branch"></i> <b>ПРЕ- и ПРИ-: значения</b></div>
<table class="table"><tr><th>ПРЕ- = «очень»</th><th>ПРЕ- = «пере-»</th><th>ПРИ- значения</th></tr>
<tr><td>премилый (= очень милый), превосходный, прескверный</td><td>преградить (= перегородить), прервать (= перервать), преломить</td><td>приближение: приехать, прибежать, прибыть</td></tr>
<tr><td colspan="2"></td><td>присоединение: приклеить, прибить, привинтить</td></tr>
<tr><td colspan="2"></td><td>близость: прибрежный, приморский, привокзальный</td></tr>
<tr><td colspan="2"></td><td>неполнота действия: прилечь, приоткрыть, приглушить</td></tr>
</table>
<div class="info-block"><i class="fas fa-exclamation-triangle"></i> <b>Слова для запомнения (ПРИ-):</b><br>
<span class="ex-word">привередливый</span> (=капризный), <span class="ex-word">причудливый</span>, <span class="ex-word">примитивный</span> (три буквы И), <span class="ex-word">привлекательный</span>, <span class="ex-word">прилежный</span>, <span class="ex-word">пригодный</span>, <span class="ex-word">пригожий</span>, <span class="ex-word">привилегия</span>, <span class="ex-word">приоритет</span>, <span class="ex-word">примадонна</span>, <span class="ex-word">приватный</span>, <span class="ex-word">прибор</span>, <span class="ex-word">присутствовать</span>, <span class="ex-word">присягать</span>, <span class="ex-word">приказать</span></div>
<div class="example"><i class="fas fa-star"></i> <b>Лайфхак:</b> ПРЕ = ОЧЕНЬ или ПЕРЕ. Если можно заменить — пиши ПРЕ. Если нет — проверяй ПРИ по значению.</div>
`},

// А3
{id:"А3",title:"А3. Суффиксы -ЧИК/-ЩИК, приставки",rule:`<div class="info-block"><i class="fas fa-paint-brush"></i> <b>Суффиксы -ЧИК и -ЩИК</b></div>
<table class="table"><tr><th>Суффикс</th><th>После каких согласных</th><th>Примеры</th></tr>
<tr><td>-ЧИК-</td><td>после Д, Т, З, С, Ж</td><td>разведчик, переводчик, смазчик, перебежчик</td></tr>
<tr><td>-ЩИК-</td><td>после всех остальных</td><td>барабанщик, каменщик, фонарщик</td></tr>
</table>
<div class="info-block"><i class="fas fa-code-branch"></i> <b>Приставки на З/С</b><br>
<b>З-</b> — перед гласной и звонкой согласной: <span class="ex-word">разбежаться, беззвучный, изгнать, низвергнуть</span><br>
<b>С-</b> — перед глухой согласной: <span class="ex-word">расстелить, бесполезный, воскликнуть</span><br>
<b>Запомни:</b> приставки З- не существует! Всегда: <span class="ex-word">сделать, сбить, сгореть, сдать</span></div>
<div class="example"><i class="fas fa-star"></i> <b>Важно!</b> Приставки «од-» не существует — есть «от-» или «ото-». В непроизносимых согласных меняй форму слова: <span class="ex-word">местный — место, прекрасный — прекрасен</span>. Исключение: <span class="ex-word">лестница</span></div>
`},

// А4
{id:"А4",title:"А4. Глаголы и причастия",rule:`
                <tr><td>доведение до конца</td><td>пр<u>и</u>думать, пр<u>и</u>говорить, пр<u>и</u>своить, пр<u>и</u>прятать, пр<u>и</u>готовить, пр<u>и</u>учить</td></tr></table><div class="info-block"><i class="fas fa-memory"></i> <b>Слова-исключения для запоминания:</b><br><b>ПРЕ-</b>: <span class="ex-word">пр<u>е</u>зидент, пр<u>е</u>мьера, пр<u>е</u>парат, пр<u>е</u>тензия, пр<u>е</u>цедент, пр<u>е</u>имущество, пр<u>е</u>стиж, пр<u>е</u>амбула, пр<u>е</u>рогатива, пр<u>е</u>клонный (возраст), пр<u>е</u>вратный (непостоянный), пр<u>е</u>терпеть (вынести), пр<u>е</u>ходящий (временный), пр<u>е</u>ставиться (умереть), пр<u>е</u>емник (продолжатель)</span><br><b>ПРИ-</b>: <span class="ex-word">пр<u>и</u>ватный, пр<u>и</u>вилегия, пр<u>и</u>оритет, пр<u>и</u>мадонна, пр<u>и</u>лежный, пр<u>и</u>митивный, пр<u>и</u>сутствие, пр<u>и</u>чуда, пр<u>и</u>тязание, пр<u>и</u>верженец, пр<u>и</u>стой, пр<u>и</u>звание, пр<u>и</u>вычка, пр<u>и</u>ветствие, пр<u>и</u>личие, пр<u>и</u>чина, пр<u>и</u>рода, пр<u>и</u>ключение</span></div><div class="info-block"><i class="fas fa-exchange-alt"></i> <b>Приставки на -З/-С</b><br><b>-З-</b> пишется перед звонкими согласными: <span class="ex-word">разбежаться, беззвучный, возглавить, изгнать, низвергнуть, чрезмерный</span><br><b>-С-</b> пишется перед глухими согласными: <span class="ex-word">расстелить, бесполезный, воскликнуть, исправить, нисходить, чересчур</span><br><b>Запомнить:</b> <span class="ex-word">здесь, здание, здоровье, ни зги</span> (з- входит в корень)<br>Приставки <b>З-</b> не существует! Всегда пишем <span class="ex-word">сделать, сбить, сгореть, сдать, сжать, сжечь</span></div><div class="example"><i class="fas fa-star"></i> <b>Исключения:</b> <span class="ex-word">расчёт, рассчитывать, расчётный</span> (НО: <span class="ex-word">рассчитать, рассчитанный</span>)</div><div class="info-block"><i class="fas fa-table"></i> <b>Различай по контексту (пары слов с ПРЕ- и ПРИ-)</b></div><table class="table"><tr><th>Слово с ПРЕ-</th><th>Значение</th><th>Слово с ПРИ-</th><th>Значение</th></tr><tr><td>пребывать</td><td>находиться где-то</td><td>прибывать</td><td>приезжать</td></tr><tr><td>предавать</td><td>изменять</td><td>придавать</td><td>добавлять, придавать вид</td></tr><tr><td>претворить</td><td>осуществить</td><td>притворить</td><td>прикрыть</td></tr><tr><td>преступить</td><td>нарушить</td><td>приступить</td><td>начать</td></td></tr>
                <tr><td>презирать</td><td>не уважать</td><td>призирать</td><td>заботиться, давать приют</td></tr>
                <tr><td>преклоняться</td><td>относиться с уважением</td><td>приклоняться</td><td>наклоняться</td></tr><tr><td>преходящий</td><td>временный</td><td>приходящий</td><td>тот, кто приходит</td></tr><tr><td>преемник</td><td>продолжатель</td><td>приемник</td><td>радиоприёмник</td></tr></table>`},

// А3
{id:"А3",title:"А3. Правописание суффиксов",rule:`<div class="info-block"><i class="fas fa-paint-brush"></i> <b>Суффиксы имён существительных</b></div><table class="table"><tr><th>Суффикс</th><th>Условие</th><th>Примеры</th></tr><tr><td>-чик-</td><td>после д, т, з, с, ж</td><td>переводчик, разведчик, перебежчик, грузчик, смазчик</td></tr><tr><td>-щик-</td><td>после остальных согласных</td><td>каменщик, стекольщик, барабанщик, фонарщик</td></tr><tr><td>-ек-</td><td>при склонении гласный выпадает</td><td>замочек — замочка, орешек — орешка, горошек — горошка</td></td></tr>
                <tr><td>-ик- (-чик-)</td><td>при склонении гласный сохраняется</td><td>ключик — ключика, мячик — мячика, стульчик — стульчика</td></tr>
                <tr><td>-ец-</td><td>м.р., а также ср.р. с ударением на окончании</td><td>братец, молодец, пальтецо, письмецо</td></tr>
                <tr><td>-иц-</td><td>ж.р., а также ср.р. с ударением на основе</td><td>умница, красавица, платьице, здоровьице</td></td></tr><tr><td>-инк-</td><td>от слов на -ина</td><td>жемчужинка, соломинка, горошинка, царапинка</td></tr>
                <tr><td>-енк-</td><td>от слов на -ня, -на</td><td>вишенка, сосенка, башенка, песенка, пашенка</td></tr></table><div class="info-block"><i class="fas fa-paint-brush"></i> <b>Суффиксы имён прилагательных</b></div><table class="table"><tr><th>Суффикс</th><th>Условие</th><th>Примеры</th></tr><tr><td>-ив-</td><td>под ударением</td><td>красивый, правдивый, игривый, ленивый</td></tr><tr><td>-ев-</td><td>без ударения</td><td>сиреневый, тюлевый, полевой, гостевой</td></tr><tr><td>-лив-, -чив-</td><td>всегда И</td><td>заботливый, доверчивый, улыбчивый, счастливый</td></td></tr><tr><td>-оват-, -еват-</td><td>оттенок качества</td><td>беловатый, красноватый, синеватый, рыжеватый</td></tr></table><div class="info-block"><i class="fas fa-star"></i> <b>Запомните!</b> <span class="ex-word">милостивый, юродивый, чванливый, сварливый</span></div><div class="example"><i class="fas fa-star"></i> <b>Суффиксы прилагательных -к- и -ск-:</b><br>-к- пишется после основы на к, ц, ч (чередование): <span class="ex-word">ткацкий (ткач), немецкий (немец), рыбацкий (рыбак)</span><br>-ск- в остальных случаях: <span class="ex-word">русский, французский, матросский, гигантский</span><br><b>Исключения:</b> <span class="ex-word">узбекский, таджикский</span></div>`},

// А4
{id:"А4",title:"А4. Личные окончания глаголов и суффиксы причастий",rule:`<div class="info-block"><i class="fas fa-running"></i> <b>Спряжение глаголов с безударными личными окончаниями</b></div><table class="table"><tr><th>I спряжение</th><th>II спряжение</th></tr><tr><td>1) брить, стелить, зиждиться<br>2) все глаголы на -ать, -еть, -ять, -оть, -уть, -ти, -чь (кроме глаголов-исключений)<br>Примеры: <span class="ex-word">таять, сеять, веять, лаять, каяться, надеяться, бороться, колоть, полоть, молоть</span></td><td>1) все глаголы на -ить (кроме брить, стелить)<br>2) 4 глагола на -ать: <b>гнать, держать, дышать, слышать</b><br>3) 7 глаголов на -еть: <b>видеть, смотреть, ненавидеть, обидеть, вертеть, терпеть, зависеть</b><br>4) глаголы на -ять с ударением на личных окончаниях: <span class="ex-word">стоять, бояться</span> (определяются по форме 3 л. мн.ч.: -ат/-ят)</td></tr></table><div class="info-block"><i class="fas fa-table"></i> <b>Окончания глаголов</b><br>I спр.: <span class="ex-word">-у/-ю, -ешь, -ет, -ем, -ете, -ут/-ют</span><br>II спр.: <span class="ex-word">-у/-ю, -ишь, -ит, -им, -ите, -ат/-ят</span></div><div class="info-block"><i class="fas fa-crown"></i> <b>Суффиксы причастий настоящего времени</b><br><b>Действительные:</b> I спр. <span class="ex-word">-ущ-/-ющ-</span> (пишущий, читающий, колющий), II спр. <span class="ex-word">-ащ-/-ящ-</span> (дышащий, строящий, клеящий)<br><b>Страдательные:</b> I спр. <span class="ex-word">-ем-/-ом-</span> (читаемый, ведомый), II спр. <span class="ex-word">-им-</span> (видимый, слышимый)</div><div class="example"><i class="fas fa-star"></i> <b>Глаголы на -ять (безударное) — I спряжения:</b> <span class="ex-word">сеять, веять, реять, лелеять, каяться, блеять, лаять, таять, чуять, затеять, кашлять, надеяться, чаять</span><br><b>Исключение:</b> <span class="ex-word">клеить</span> (II спряжение)</div><div class="info-block"><i class="fas fa-table"></i> <b>Разноспрягаемые глаголы</b><br><b>хотеть</b>: ед.ч. — по I спр. (хочу, хочешь, хочет), мн.ч. — по II спр. (хотим, хотите, хотят)<br><b>бежать</b>: 3 л. мн.ч. — бегут (I спр.), остальные формы — по II спр. (бежишь, бежит, бежим, бежите)<br><b>есть, дать</b> и производные — особая система окончаний</div>`},

// А5
{id:"А5",title:"А5. Правописание НЕ с разными частями речи",rule:`<div class="info-block"><i class="fas fa-ban"></i> <b>НЕ с существительными, прилагательными, наречиями на -о/-е</b></div><table class="table"><tr><th>Слитно</th><th>Раздельно</th></tr>
                <tr><td>• без НЕ не употребляется: <span class="ex-word">невежда, нелепый, ненастный, негодовать</span><br>• можно заменить синонимом без НЕ: <span class="ex-word">неправда (ложь), неглубокий (мелкий), недорого (дёшево)</span><br>• с наречиями меры и степени: <span class="ex-word">очень некрасивый, совершенно неподготовленный</span></td><td>• противопоставление с союзом <b>а</b>: <span class="ex-word">не правда, а ложь; не глубокий, а мелкий</span><br>• слова <span class="ex-word">отнюдь не, далеко не, вовсе не</span>: <span class="ex-word">далеко не глупый, вовсе не интересный</span><br>• с относительными и притяжательными прилагательными: <span class="ex-word">не железный, не лисий, не деревянный</span><br>• с цветовыми прилагательными: <span class="ex-word">не красный, не синий</span><br>• с краткими прилагательными, не имеющими полной формы: <span class="ex-word">не рад, не должен, не готов, не намерен</span></td></tr></table><div class="info-block"><i class="fas fa-pen-fancy"></i> <b>НЕ с причастиями</b></div><table class="table"><tr><th>Слитно</th><th>Раздельно</th></tr>
                <tr><td>• без НЕ не употребляется: <span class="ex-word">негодующий, ненавидящий</span><br>• нет зависимого слова (одиночное причастие): <span class="ex-word">незамеченные ошибки, невыученный урок</span><br>• с наречиями меры и степени: <span class="ex-word">абсолютно невоспитанный ребёнок, совершенно неисследованная область</span></td><td>• есть зависимое слово: <span class="ex-word">не замеченные учителем ошибки, не выученный вчера урок</span><br>• краткие причастия: <span class="ex-word">работа не выполнена, письмо не отправлено</span><br>• противопоставление с <b>а</b>: <span class="ex-word">не законченный, а только начатый рассказ</span><br>• с частицами <b>отнюдь не, далеко не, вовсе не</b>: <span class="ex-word">вовсе не наказанный мальчик</span></td></tr></table><div class="info-block"><i class="fas fa-running"></i> <b>НЕ с глаголами и деепричастиями</b><br>Раздельно всегда, кроме:<br>• без НЕ не употребляются: <span class="ex-word">негодовать, недоумевать, ненавидеть, нездоровится, невзлюбить, несдобровать</span><br>• приставка НЕДО- (значение неполноты, недостаточности действия): <span class="ex-word">недоедать (мало есть), недосыпать (мало спать), недосмотреть (плохо смотреть), недосолить, недовесить</span></div><div class="example"><i class="fas fa-star"></i> <b>Сравните:</b> <span class="ex-word">недосмотреть за ребёнком</span> (плохо смотреть) — <span class="ex-word">не досмотреть спектакль</span> (не закончить смотреть); <span class="ex-word">недоедать во время болезни</span> — <span class="ex-word">не доедать суп</span> (оставить в тарелке)</div><div class="info-block"><i class="fas fa-table"></i> <b>Слова на -мый, всегда пишущиеся с НЕ слитно:</b><br><span class="ex-word">независимый, невыносимый, неиссякаемый, неистощимый, неоспоримый, неотъемлемый, неотвратимый, непобедимый, неповторимый, непогрешимый, непреодолимый, непримиримый, нерушимый, несгораемый, нестерпимый, неувядаемый, неугасимый, неуловимый, неумолимый, неустрашимый, неутомимый</span></div>`},

// А6
{id:"А6",title:"А6. Правописание НЕ и НИ в местоимениях и наречиях",rule:`<div class="info-block"><i class="fas fa-question-circle"></i> <b>Правописание НЕ и НИ в отрицательных местоимениях и наречиях</b></div><table class="table"><tr><th>НЕ</th><th>НИ</th></tr><tr><td>под ударением: <span class="ex-word">н<u>е</u>кто, н<u>е</u>что, н<u>е</u>кого, н<u>е</u>чему, н<u>е</u>где, н<u>е</u>куда, н<u>е</u>когда</span></td><td>без ударения: <span class="ex-word">н<u>и</u>кто, н<u>и</u>что, н<u>и</u>кого, н<u>и</u>чему, н<u>и</u>где, н<u>и</u>куда, н<u>и</u>когда</span></td></tr></table><div class="info-block"><i class="fas fa-code-branch"></i> <b>Раздельное написание</b><br>Если между НЕ/НИ и местоимением есть предлог, пишется в три слова:<br><span class="ex-word">не у кого, не с кем, не о чем, не для кого, ни у кого, ни с кем, ни о чем, ни для кого</span></div><div class="info-block"><i class="fas fa-link"></i> <b>Различение НЕ и НИ</b><br>• <b>НЕ</b> — отрицание: <span class="ex-word">он не пришёл, не было никого</span><br>• <b>НИ</b> — усиление отрицания: <span class="ex-word">ни души, ни шагу назад, не сказал ни слова</span><br>• <b>НЕ</b> в восклицательных предложениях с обобщающим значением: <span class="ex-word">Кто не мечтал о путешествиях! Где он только не бывал!</span><br>• <b>НИ</b> в уступительных придаточных (усиление утвердительного смысла): <span class="ex-word">Сколько ни звони — никто не отвечает. Что бы ни случилось — оставайся человеком. Кто бы ни пришёл — скажи, что меня нет.</span><br>• <b>НИ</b> в устойчивых оборотах: <span class="ex-word">как бы то ни было, что бы то ни стало, откуда ни возьмись, как ни в чём не бывало</span></div><div class="example"><i class="fas fa-star"></i> <b>Фразеологизмы с НИ:</b> <span class="ex-word">ни свет ни заря, ни жив ни мёртв, ни рыба ни мясо, ни пуха ни пера, ни два ни полтора, ни то ни сё, ни дать ни взять, ни много ни мало, ни брат ни сват, ни взад ни вперёд, ни слуху ни духу, ни с того ни с сего</span></div><div class="info-block"><i class="fas fa-table"></i> <b>Различай!</b><br><span class="ex-word">н<u>е</u> один</span> (много) — <span class="ex-word">н<u>и</u> один</span> (никто)<br><span class="ex-word">н<u>е</u> раз</span> (часто) — <span class="ex-word">н<u>и</u> разу</span> (никогда)<br><span class="ex-word">н<u>е</u> кто иной, как</span> (именно он) — <span class="ex-word">н<u>и</u>кто иной</span> (никто другой)<br><span class="ex-word">н<u>е</u> что иное, как</span> (именно это) — <span class="ex-word">н<u>и</u>что иное</span> (ничто другое)</div>`},

// А7
{id:"А7",title:"А7. Слитное, дефисное, раздельное написание",rule:`<div class="info-block"><i class="fas fa-link"></i> <b>Слитное написание</b></div><table class="table"><tr><th>Категория</th><th>Примеры</th></tr><tr><td>сложные слова с соединительными гласными О/Е</td><td>пароход, землемер, пешеход, водопровод, пулемёт, самолётостроение</td></tr>
                <tr><td>слова с ПОЛУ-</td><td>полуботинки, полумесяц, полуфинал, полуостров, полупроводник</td></tr>
                <tr><td>слова с иноязычными приставками (анти-, архи-, гипер-, интер-, контр-, пост-, суб-, супер-, ультра-, экстра-, пан-)</td><td>антинародный, контратака, супермен, ультрафиолет, экстраординарный, панславизм</td></tr>
                <tr><td>сложносокращённые слова</td><td>колхоз, совхоз, зарплата, стенгазета, роддом, главврач, сбербанк</td></tr></table><div class="info-block"><i class="fas fa-hyphen"></i> <b>Дефисное написание</b></div><table class="table"><tr><th>Категория</th><th>Примеры</th></tr><tr><td>слова с ПОЛ- перед Л, гласной, прописной буквой</td><td>пол-лимона, пол-апельсина, пол-Москвы, пол-арбуза, пол-Европы</td></tr>
                <tr><td>повтор слов (усиление, оттенок действия)</td><td>чуть-чуть, еле-еле, давным-давно, крест-накрест, туго-натуго, мало-помалу, худо-бедно, нежданно-негаданно</td></tr>
                <tr><td>наречия с приставкой ПО- и суффиксами -ОМУ, -ЕМУ, -И, -СКИ</td><td>по-новому, по-русски, по-дружески, по-лисьи, по-волчьи, по-прежнему, по-пустому</td></td><td>наречия с приставкой В- (ВО-) и суффиксами -ЫХ, -ИХ</td><td>во-первых, во-вторых, в-третьих, в-четвёртых, в-последних</td></tr>
                <tr><td>слова с -ТО, -ЛИБО, -НИБУДЬ, КОЕ-</td><td>кто-то, когда-либо, что-нибудь, кое-где, кое-как, куда-то</td></td><td>термины с буквами и цифрами</td><td>альфа-частица, икс-лучи, гамма-излучение, бета-распад</td></tr>
                <tr><td>промежуточные стороны света</td><td>юго-запад, северо-восток, юго-восток, северо-запад</td></tr><td rowspan="2">сложные прилагательные, образованные от равноправных слов (можно вставить <b>и</b>)</td><td rowspan="2">русско-английский (русский и английский), кисло-сладкий (кислый и сладкий), сердечно-сосудистый, отчётно-выборный</td></tr></table><div class="info-block"><i class="fas fa-space-shuttle"></i> <b>Раздельное написание</b><br>• наречные выражения: <span class="ex-word">без устали, на ходу, до упаду, в конце концов, за границей, под мышкой, на цыпочках, в одиночку, без оглядки, без умолку</span><br>• производные предлоги: <span class="ex-word">в течение дня, в продолжение часа, в заключение речи, в связи с обстоятельствами, в отличие от других</span><br>• сочетания существительных с предлогами: <span class="ex-word">в корне, в меру, в срок, в старину, в тупик, на глаз, на память, на совесть</span><br>• НЕ с глаголами: <span class="ex-word">не был, не знал, не хочет</span></div><div class="example"><i class="fas fa-star"></i> <b>Важно!</b> <span class="ex-word">пол столовой ложки, пол яблоневого сада</span> (пол + существительное в родительном падеже — раздельно)</div>`},

// А8
{id:"А8",title:"А8. Правописание предлогов, союзов, частиц",rule:`<div class="info-block"><i class="fas fa-link"></i> <b>Производные предлоги (слитно)</b><br><span class="ex-word">ввиду (из-за), вследствие (из-за), вроде (наподобие), насчёт (о), навстречу (к), наподобие (вроде), несмотря на (вопреки), невзирая на</span></div><div class="info-block"><i class="fas fa-link"></i> <b>Производные предлоги (раздельно)</b><br><span class="ex-word">в течение, в продолжение, в заключение, в связи с, в отличие от, по мере, в силу, по причине, в виде, за исключением, по случаю, в меру, в области, со стороны</span></div><div class="info-block"><i class="fas fa-code-branch"></i> <b>Отличие союзов от омонимичных слов</b></div><table class="table"><tr><th>Союз (слитно)</th><th>Омоним (раздельно)</th></tr><tr><td><b>тоже, также</b> (=и): <span class="ex-word">Я тоже пойду. Он также пришёл.</span></td><td><b>то же, так же</b>: <span class="ex-word">То же самое. Так же, как и всегда. Он сделал то же, что и я.</span></td></tr><tr><td><b>чтобы</b> (цель, =для того чтобы): <span class="ex-word">Пришёл, чтобы помочь. Я учусь, чтобы знать.</span></td><td><b>что бы</b> (местоимение с частицей): <span class="ex-word">Что бы мне надеть? Что бы ты делал без меня?</span></td></tr><tr><td><b>зато</b> (=но): <span class="ex-word">Мало спал, зато много работал. Дорого, зато качественно.</span></td><td><b>за то</b>: <span class="ex-word">Спрятался за то дерево. Спасибо за то, что помог.</span></td></td><td><b>итак</b> (=следовательно, вводное): <span class="ex-word">Итак, начнём урок. Итак, мы решили ехать.</span></td><td><b>и так</b>: <span class="ex-word">И так понятно. И так каждый день. Он и так устал.</span></td></tr></table><div class="info-block"><i class="fas fa-grip-lines"></i> <b>Частицы</b><br>• Через дефис: <span class="ex-word">-то, -либо, -нибудь, кое-</span><br>• Раздельно: <span class="ex-word">бы (б), же (ж), ли (ль)</span><br>• <span class="ex-word">всё-таки, таки</span> (с глаголами: <span class="ex-word">пришёл-таки</span>)</div><div class="example"><i class="fas fa-star"></i> <b>Запомните написание предлогов:</b> <span class="ex-word">в отличие от, в связи с, в продолжение, в течение, в заключение, в силу, по мере, по причине</span></div>`},

// А9
{id:"А9",title:"А9. Тире между подлежащим и сказуемым",rule:`<div class="info-block"><i class="fas fa-minus"></i> <b>Тире ставится</b></div><table class="table"><tr><th>Схема</th><th>Пример</th></tr><tr><td>сущ. — сущ.</td><td>Книга — источник знаний. Москва — столица России. Дружба — великая сила.</td></tr>
                <tr><td>числ. — числ.</td><td>Дважды два — четыре. Пятью пять — двадцать пять. Сорок — не возраст.</td></tr>
                <tr><td>инф. — инф.</td><td>Жить — родине служить. Курить — здоровью вредить. Любить — значит прощать.</td></tr>
                <tr><td>инф. — сущ.</td><td>Учиться — наша задача. Строить — большое счастье. Понимать — искусство.</td></tr>
                <tr><td>сущ. — инф.</td><td>Наша задача — учиться. Его мечта — стать лётчиком. Долг — защищать Родину.</td></tr>
                <tr><td>перед <b>это, вот, значит, это значит</b></td><td>Любить — <b>это</b> значит понимать. Честность — <b>вот</b> главное качество. Счастье — <b>это</b> когда тебя понимают.</td></tr><tr><td rowspan="2">числ. — сущ.<br>сущ. — числ.</td><td rowspan="2">Два — чётное число. Четыреста — хорошая оценка.<br>Площадь комнаты — двадцать метров. Рост спортсмена — два метра.</td></tr></table><div class="info-block"><i class="fas fa-minus-circle"></i> <b>Тире не ставится</b></div><table class="table"><tr><th>Случай</th><th>Пример</th></tr>
                <tr><td>есть связка <b>есть, это есть</b></td><td>Жизнь <b>есть</b> особая форма движения материи. Бедность <b>есть</b> не порок.</td></tr>
                <tr><td>подлежащее — личное местоимение</td><td>Я ученик. Ты мой лучший друг. Он врач. Она студентка. Мы люди.</td></td><td>сказуемое — прилагательное</td><td>День тёплый. Ночь светлая. Погода прекрасная. Река глубокая.</td></td><td>сказуемое — наречие</td><td>Книга здесь. Сосед рядом. Дом напротив. Экзамен завтра.</td></tr>
                <tr><td>отрицание <b>не</b></td><td>Бедность не порок. Сердце не камень. Аналогия не доказательство.</td></tr><tr><td>сравнительный союз <b>как, словно, будто, точно, всё равно что</b></td><td>Глаза как звёзды. Лёд словно зеркало. Слова будто мёд. Чужой как враг.</td></tr>
                <tr><td>сказуемое — фразеологизм</td><td>Он семи пядей во лбу. Этот чиновник — шишка. Ты мне как кость в горле.</td></tr><div class="example"><i class="fas fa-quote-left"></i> <b>Примеры:</b> <span class="ex-word">Чтение — лучшее учение. Дружба не гриб — в лесу не найдёшь. Бедность не порок, а несчастье. Две сестры — две руки человека. Слово — серебро, молчание — золото.</span></div>`},

// А10
{id:"А10",title:"А10. Обособленные определения и приложения",rule:`<div class="info-block"><i class="fas fa-check-circle"></i> <b>Обособляются определения (выделяются запятыми)</b></div><table class="table"><tr><th>Условие</th><th>Пример</th></tr><tr><td>причастный оборот после определяемого слова</td><td>Лес, <u>поражённый дождями</u>, стоял мрачный. Тополя, <u>покрытые росой</u>, наполняли воздух ароматом.</td></tr>
                <tr><td>определение относится к личному местоимению</td><td><u>Усталый</u>, я прилёг отдохнуть. <u>Обрадованный</u>, он засмеялся. <u>Смущённый</u>, я покраснел.</td></tr>
                <tr><td>два и более одиночных определения после определяемого слова</td><td>Мать, <u>грустная и тревожная</u>, сидела молча. Ночь, <u>тихая и звёздная</u>, стояла над землёй.</td></td><td>определение оторвано от определяемого слова другими словами</td><td>И снова, <u>отсечённая от танков огнём</u>, залегла пехота. Вдруг, <u>поднятая ветром</u>, закружилась листва.</td></td><td>определение имеет добавочное обстоятельственное значение (причины, уступки)</td><td><u>Веселый и жизнерадостный</u>, мальчик был всеобщим любимцем. <u>Оглушённый тяжким гулом</u>, Тёркин никнет головой.</td></td><td>несогласованное определение (чаще после имени собственного)</td><td>Студент, <u>в очках и с книгой</u>, стоял у окна. Москва, <u>вся в огнях</u>, простиралась внизу.</td></tr></table><div class="info-block"><i class="fas fa-user-tag"></i> <b>Обособляются приложения</b></div><table class="table"><tr><th>Условие</th><th>Пример</th></tr><tr><td>распространённое приложение после нарицательного существительного</td><td>Старичок, <u>больничный сторож</u>, впустил его. Сосед, <u>мужчина лет пятидесяти</u>, вышел на крыльцо.</td></td><td>приложение с <b>как</b> (имеет значение причины)</td><td><u>Как старый артиллерист</u>, я презираю это оружие. <u>Как человек умный</u>, он понял это сразу.</td></td><td>приложение после имени собственного</td><td>Антон, <u>мой старший брат и верный товарищ</u>, всегда готов помочь. Байкал, <u>величайшее озеро мира</u>, поражает своей красотой.</td></td><td>приложение относится к личному местоимению</td><td>Ему ли, <u>карлику</u>, тягаться с гигантом? Мне, <u>человеку неопытному</u>, трудно было разобраться.</td></td><td>приложение перед именем собственным (имеет добавочное обстоятельственное значение)</td><td><u>Упрямец во всём</u>, мальчик оставался упрямцем и в учении. <u>Замечательный врач</u>, Иванов принимал больных до поздней ночи.</td></td><td>обособляется в конце предложения (пояснение, можно вставить <b>а именно</b>)</td><td>В дальнем углу светилось жёлтое пятно — <u>огонь в окне квартиры Серафимы</u>. Появился новый сотрудник — <u>молодой специалист из Москвы</u>.</td></tr><div class="example"><i class="fas fa-ban"></i> <b>Не обособляются:</b> определение перед определяемым словом (если нет добавочного значения): <span class="ex-word">Вышедший рано утром отряд уже прошёл четыре версты</span>; приложение с <b>как</b> в значении «в качестве»: <span class="ex-word">Он известен как хирург. Все знали его как хорошего специалиста.</span></div>`},

// А11
{id:"А11",title:"А11. Обособленные обстоятельства",rule:`<div class="info-block"><i class="fas fa-check-circle"></i> <b>Обособляются запятыми</b></div><table class="table"><tr><th>Что</th><th>Пример</th></tr><tr><td>деепричастные обороты (в любой позиции)</td><td><u>Спустившись к реке</u>, мы увидели лодку. Мы, <u>спустившись к реке</u>, увидели лодку. Мы увидели лодку, <u>спустившись к реке</u>.</td></tr>
                <tr><td>одиночные деепричастия (если обозначают добавочное действие)</td><td>Он шёл, <u>не оглядываясь</u>. Старик остановился, <u>передохнув</u>. <u>Вздрогнув</u>, он обернулся.</td></tr>
                <tr><td>обороты с <b>несмотря на, невзирая на</b></td><td><u>Несмотря на дождь</u>, мы пошли гулять. <u>Невзирая на усталость</u>, продолжали путь.</td></td><td>обстоятельства с предлогами <b>благодаря, вопреки, согласно, ввиду, за неимением, при наличии, при условии</b> (иногда, для смыслового выделения)</td><td>Улицы, <u>благодаря отличной погоде</u>, снова оживились. Самолёт, <u>вопреки прогнозам</u>, вылетел вовремя.</td></tr><tr><td rowspan="2">обстоятельства, выраженные существительными с предлогами <b>в случае, по причине, за неимением</b> (если они распространены и стоят перед сказуемым)</td><td rowspan="2"><u>В случае плохой погоды</u>, поездка отменяется. <u>По причине болезни</u>, он не пришёл.</td></tr></table><div class="info-block"><i class="fas fa-ban"></i> <b>Не обособляются</b></div><table class="table"><tr><th>Случай</th><th>Пример</th></tr><tr><td>фразеологизмы (устойчивые сочетания)</td><td>Он работал <u>спустя рукава</u>. Сидел <u>сложа руки</u>. Бежал <u>сломя голову</u>. Говорил <u>затаив дыхание</u>. Слушал <u>раскрыв рот</u>.</td></tr>
                <tr><td>деепричастия, перешедшие в наречия (обозначают образ действия)</td><td>Он сидел <u>молча</u>. Иди <u>не спеша</u>. Стоял <u>не шелохнувшись</u>. Читал <u>лёжа</u>. Говорил <u>заикаясь</u>.</td></tr><tr><td>деепричастия в конце предложения, тесно связанные по смыслу со сказуемым</td><td>Он сидел <u>откинувшись на спинку стула</u>. Мы вернулись <u>с трудом передвигая ноги</u>.</td></tr>
                <tr><td>деепричастный оборот — однородный член с необособленным обстоятельством</td><td>В роще <u>оглушительно и перебивая друг друга</u> пели соловьи. Он шёл <u>быстро и не оглядываясь</u>.</td></tr></table><div class="example"><i class="fas fa-star"></i> <b>Сравните:</b> <span class="ex-word">Он шёл не оглядываясь</span> (обособляется, добавочное действие) — <span class="ex-word">Он шёл не спеша</span> (не обособляется, наречие образа действия). <span class="ex-word">Сидя на берегу, он смотрел на море</span> (обособляется) — <span class="ex-word">Он сидел на берегу, смотрел на море и думал</span> (нет обособления).</div>`},

// А12
{id:"А12",title:"А12. Знаки препинания в ССП и при однородных членах",rule:`<div class="info-block"><i class="fas fa-check-circle"></i> <b>Запятая между однородными членами ставится</b></div><table class="table"><tr><th>Случай</th><th>Пример</th></tr><tr><td>между однородными членами без союзов</td><td>В лесу росли <u>сосны, ели, берёзы, осины</u>. Он был <u>умён, красив, добр</u>.</td></tr>
                <tr><td>перед противительными союзами <b>а, но, да (=но), однако, зато</b></td><td>Он <u>мал, да удал</u>. <u>Торопился, но опоздал</u>. Не <u>перо, а ум</u> красит человека.</td></td><td>перед повторяющимися союзами <b>и…и, ни…ни, то…то, или…или, не то…не то</b></td><td>И <u>снег, и ветер, и мороз</u>. <u>Ни рыба ни мясо</u>. <u>То дождь, то град</u>. <u>Не то смех, не то слёзы</u>.</td></td><td>перед второй частью двойного союза <b>не только…но и, как…так и, если не…то, хотя и…но</b></td><td>Он <u>не только умён, но и красив</u>. <u>Как старые, так и молодые</u> любят природу. <u>Хотя и больно, но терпимо</u>.</td></td></tr></table><div class="info-block"><i class="fas fa-ban"></i> <b>Запятая не ставится</b></div><table class="table"><tr><th>Случай</th><th>Пример</th><tr>
        
                <td>между однородными членами с одиночным союзом <b>и, да (=и), или, либо</b></td>
                <td>Птицы <u>пели и щебетали</u>. Возьму <u>книгу или журнал</u>.</td>
            <tr>
                <td>в фразеологизмах с повторяющимися союзами</td>
                <td><u>ни свет ни заря, и смех и грех, и так и сяк, ни рыба ни мясо, ни жив ни мёртв</u></td>
            </tr>
                <tr><td>между двумя глаголами, обозначающими движение (единое действие)</td>
                <td><u>Пойду посмотрю</u>. <u>Сяду отдохну</u>. <u>Жду не дождусь</u>.</td>
            </tr>
                <tr><td>внутри цельных выражений с повторяющимися союзами</td>
                <td><u>и день и ночь, и стар и млад, и смех и горе</u></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-link"></i> <b>В ССП запятая ставится</b>, если части не имеют общего второстепенного члена или общего придаточного.<br>
            <b>Не ставится</b>, если есть общий второстепенный член: <span class="ex-word">В саду пели птицы и шумели деревья</span>.<br>
            <b>Не ставится</b>, если есть общее придаточное: <span class="ex-word">Когда Аню провожали, уже светало и кухарки шли на рынок</span>.<br>
            <b>Не ставится</b>, если части — вопросительные, восклицательные или побудительные предложения: <span class="ex-word">Кто он и что ему нужно? Как хорошо и как приятно! Пусть придёт и всё расскажет</span>.</div>
            <div class="example"><i class="fas fa-star"></i> <b>Примеры ССП:</b> <span class="ex-word">Солнце село, и наступила тишина. Солнце село, но было светло. То ли шелест колоса, то ли гладит волосы тёплая рука.</span></div>`},

// А13
{id:"А13",title:"А13. Знаки препинания в СПП",rule:`
            <div class="info-block"><i class="fas fa-check-circle"></i> <b>Придаточная часть отделяется запятой</b><br>
            <span class="ex-word">Я знаю, что ты придёшь. Когда наступит утро, мы отправимся в путь. Дом, в котором я живу, стоит на окраине. Он не пришёл, потому что заболел.</span></div>
            <div class="info-block"><i class="fas fa-ban"></i> <b>Запятая не ставится</b></div>
            <table class="table"><tr><th>Случай</th><th>Пример</th><tr>
                <td>придаточная состоит из одного союзного слова (местоимения или наречия)</td>
                <td>Он сказал, что пойдёт, но не сказал <u>когда</u>. Ему велели уйти, но он не сказал <u>куда</u>.</td>
            </tr>
                <tr><td>есть отрицание или частицы <b>не, лишь, только</b> перед союзным словом</td>
                <td>Он не знал, <u>что ответить</u>. Мы пришли только <u>когда стемнело</u>. Я спросил лишь <u>когда начнётся</u>.</td>
            </tr>
                <tr><td>придаточная — фразеологизм</td>
                <td>Он пришёл <u>как ни в чём не бывало</u>. Делай <u>что хочешь</u>. Гуляй <u>где хочешь</u>.</td>
            </tr>
                <tr><td>однородные придаточные с одиночным союзом <b>и, или, либо</b></td>
                <td>Я знаю, <u>что он пришёл и что он остался</u>. Он сказал, <u>что устал и что хочет отдохнуть</u>.</td>
            </tr>
                <tr><td>в сложноподчинённых предложениях с двумя союзами подряд (стык союзов) — если есть <b>то</b></td>
                <td>Я понял, что если не приду вовремя, <u>то</u> меня не простят.</td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-layer-group"></i> <b>Стык союзов (что если, что когда, потому что когда и т.д.)</b><br>
            <b>Запятая ставится</b>, если после придаточной части нет второй части двойного союза <b>то, но, однако, так</b>:<br>
            <span class="ex-word">Я понял, что, если не приду вовремя, меня не простят. Он думал, что, когда стемнеет, все уйдут.</span><br>
            <b>Запятая не ставится</b>, если есть <b>то</b>: <span class="ex-word">Я понял, что если не приду вовремя, <u>то</u> меня не простят.</span></div>
            <div class="example"><i class="fas fa-star"></i> <b>Типы придаточных:</b> определительные (<span class="ex-word">книга, которую я читал</span>), изъяснительные (<span class="ex-word">знаю, что ты придёшь</span>), обстоятельственные (<span class="ex-word">когда, где, куда, откуда, почему, зачем, как, сколько</span>).</div>`},

// А14
{id:"А14",title:"А14. Знаки препинания в БСП",rule:`
            <div class="info-block"><i class="fas fa-comma"></i> <b>Запятая</b> — перечисление (части тесно связаны по смыслу): <span class="ex-word">Солнце село, наступила тишина. Бледные щеки впали, глаза сделались большие, губы горели.</span></div>
            <div class="info-block"><i class="fas fa-semicolon"></i> <b>Точка с запятой</b> — части отдалены по смыслу, распространены или имеют свои знаки препинания: <span class="ex-word">Солнце уже высоко; птицы заливаются на все голоса. Изумрудные лягушата прыгают под ногами; между корней, подняв голову, лежит уж и стережёт их.</span></div>
            <div class="info-block"><i class="fas fa-colon"></i> <b>Двоеточие</b></div>
            <table class="table"><tr><th>Значение</th><th>Пример</th></tr>
                <tr><td>пояснение (можно вставить <b>а именно</b>)</td>
                <td>Я понял одно: нужно уходить. Тут его осенила мысль: партизаны должны быть где-то поблизости.</td>
            </tr>
                <tr><td>причина (можно вставить <b>потому что</b>)</td>
                <td>Я не пошёл: было холодно. Он покраснел: ему было стыдно.</td>
            </tr>
                <tr><td>изъяснение (можно вставить <b>и увидел, что; и понял, что</b>)</td>
                <td>Я выглянул: на улице шёл снег. Я тебе определённо скажу: у тебя есть талант.</td>
            </tr>
                <tr><td>прямой вопрос</td>
                <td>Одного только я не понимаю: как она могла тебя укусить?</td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-minus"></i> <b>Тире</b></div>
            <table class="table"><tr><th>Значение</th><th>Пример</th></tr>
                <tr><td>противопоставление (можно вставить <b>а, но</b>)</td>
                <td>Смелые побеждают — трусливые погибают. Ученье — свет, неученье — тьма.</td>
            </tr>
                <tr><td>время, условие (можно вставить <b>когда, если</b>)</td>
                <td>Ехал сюда — рожь начинала желтеть. Ругаться будут — не бойся. Лес рубят — щепки летят.</td>
            </tr>
                <tr><td>следствие, вывод (можно вставить <b>поэтому, так что</b>)</td>
                <td>Я умираю — мне не к чему лгать. Солнце взошло — день начинается.</td>
            </tr>
                <tr><td>быстрая смена событий (неожиданное действие)</td>
                <td>Упадет луч солнца на траву — вспыхнет трава изумрудом и жемчугом. Чин следовал ему — он службу вдруг оставил.</td>
            </tr>
                <tr><td>сравнение (можно вставить <b>как, словно</b>)</td>
                <td>Молвит слово — соловей поёт. Посмотрит — рублём подарит.</td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Разграничение:</b> <span class="ex-word">Выйти невозможно: на улице дождь</span> (причина) — <span class="ex-word">На улице дождь — выйти невозможно</span> (следствие). <span class="ex-word">Наступило утро: взошло солнце</span> (пояснение) — <span class="ex-word">Наступило утро — взошло солнце</span> (последовательность).</div>`},

{id:"А15",title:"А15. Вводные слова и обращения",rule:`
            <div class="info-block"><i class="fas fa-check-circle"></i> <b>Вводные слова выделяются запятыми</b></div>

            </tr>
                <tr><td>чувства, эмоции</td>
                <td><span class="ex-word">к счастью, к сожалению, к удивлению, к радости, на беду, к досаде, странное дело</span></td>
            </tr>
                <tr><td>источник сообщения</td>
                <td><span class="ex-word">по-моему, по-твоему, говорят, по словам, по мнению, как известно, как сообщают</span></td>
            </tr>
                <tr><td>порядок мыслей, связь предложений</td>
                <td><span class="ex-word">во-первых, во-вторых, наконец, итак, следовательно, значит, таким образом, например, напротив</span></td>
            </tr>
                <tr><td>способ оформления мыслей</td>
                <td><span class="ex-word">одним словом, иначе говоря, так сказать, мягко выражаясь, грубо говоря, точнее сказать</span></td>
            </tr>
                <tr><td>степень обычности</td>
                <td><span class="ex-word">как всегда, как обычно, по обыкновению, по традиции, случается, бывает</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-ban"></i> <b>Не являются вводными (не выделяются запятыми)</b><br>
            <span class="ex-word">авось, будто, вдруг, ведь, даже, именно, как будто, как раз, к тому же, между тем, приблизительно, примерно, притом, почти, просто, словно, якобы, решительно, исключительно, в конце концов</span></div>
            <div class="info-block"><i class="fas fa-user"></i> <b>Обращения</b> выделяются запятыми<br>
            <span class="ex-word">Иван, принеси книгу. Друзья, рад вас видеть! Как ты, дорогая, поживаешь? О, Волга, колыбель моя! Здравствуй, солнце да утро весёлое!</span></div>
            <div class="example"><i class="fas fa-star"></i> <b>Различение однако:</b><br>
            • вводное слово (в середине/конце предложения): <span class="ex-word">Надо, однако, подышать воздухом. Он, однако, не пришёл.</span><br>
            • союз (=но) в начале предложения или между однородными членами: <span class="ex-word">Однако (НО) мы встретились. Метель не утихала, однако (но) погода не ухудшилась.</span><br>
            <b>Различение наконец:</b><br>
            • вводное слово (порядок мыслей, нетерпение): <span class="ex-word">Во-первых, он умён, во-вторых, красив и, наконец, талантлив. Да уходите же, наконец!</span><br>
            • обстоятельство времени (=под конец, после всего): <span class="ex-word">Мы поднимались всё выше и наконец достигли вершины.</span></div>`},

// А16
{id:"А16",title:"А16. Прямая речь и диалог",rule:`
            <div class="info-block"><i class="fas fa-quote-left"></i> <b>Схемы прямой речи</b></div>
            <table class="table"><tr><th>Схема</th><th>Пример</th></tr>
                <tr><td><b>А: «П».</b></td>
                <td>Мама сказала: «Иди домой». Учитель спросил: «Кто дежурный?»</td>
            </tr>
                <tr><td><b>«П», — а.</b></td>
                <td>«Иди домой», — сказала мама. «Кто дежурный?» — спросил учитель.</td>
            </tr>
                <tr><td><b>«П?» — а.</b></td>
                <td>«Ты идёшь?» — спросила мама. «Который час?» — поинтересовался он.</td>
            </tr>
                <tr><td><b>«П!» — а.</b></td>
                <td>«Иди скорей!» — крикнула мама. «Как красиво!» — воскликнула она.</td>
            </tr>
                <tr><td><b>«П, — а, — п».</b></td>
                <td>«Иди домой, — сказала мама, — уже поздно». «Завтра, — объявил учитель, — будет контрольная».</td>
            </tr>
                <tr><td><b>«П? — а. — П».</b></td>
                <td>«Ты идёшь? — спросила мама. — Уже поздно».</td>
            </tr>
                <tr><td><b>«П! — а. — П».</b></td>
                <td>«Как красиво! — воскликнула она. — Я в восторге».</td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-comments"></i> <b>Диалог</b><br>
            — Ты идёшь?<br>
            — Да, иду.<br>
            — Когда вернёшься?<br>
            — Не знаю.<br>
            В строку: <span class="ex-word">«Ты идёшь?» — «Да, иду». «Когда вернёшься?» — «Не знаю».</span></div>
            <div class="info-block"><i class="fas fa-quote-right"></i> <b>Цитаты</b><br>
            • как прямая речь: <span class="ex-word">Пушкин писал: «Я помню чудное мгновенье…»</span><br>
            • как часть предложения (в косвенной речи): <span class="ex-word">Пушкин писал, что «гений и злодейство — вещи несовместные».</span><br>
            • с вводными словами: <span class="ex-word">По словам Пушкина, «гений и злодейство — вещи несовместные».</span><br>
            • с пропуском цитаты: <span class="ex-word">«…Я помню чудное мгновенье…» — писал Пушкин.</span></div>
            <div class="example"><i class="fas fa-star"></i> <b>Важно!</b> При диалоге каждая реплика пишется с новой строки, перед ней ставится тире. Кавычки не ставятся. Если реплики пишутся в строку, они заключаются в кавычки и разделяются тире.</div>`},

// А17
{id:"А17",title:"А17. Предложения с разными видами связи",rule:`
            <div class="info-block"><i class="fas fa-code-branch"></i> <b>Алгоритм анализа сложной синтаксической конструкции (ССК)</b><br>
            1. Найти грамматические основы<br>
            2. Определить вид связи между частями (сочинительная, подчинительная, бессоюзная)<br>
            3. Определить границы частей<br>
            4. Расставить знаки препинания</div>
            <div class="info-block"><i class="fas fa-link"></i> <b>Стык союзов (два союза подряд)</b><br>
            <b>Запятая ставится</b>, если после придаточной части нет второй части двойного союза <b>то, но, однако, так</b>:<br>
            <span class="ex-word">Я понял, что, если не приду вовремя, меня не простят. Он думал, что, когда стемнеет, все уйдут.</span><br>
            <b>Запятая не ставится</b>, если есть вторая часть двойного союза <b>то</b>:<br>
            <span class="ex-word">Я понял, что если не приду вовремя, <u>то</u> меня не простят. Он решил, что если погода не улучшится, <u>то</u> поездку отменят.</span></div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Типы связи в ССК</b></div>
            <table class="table"><tr><th>Тип конструкции</th><th>Пример</th></tr>
                <tr><td>сочинение + подчинение</td>
                <td><span class="ex-word">Татьяна Афанасьевна подала брату знак, что больная хочет уснуть, и все вышли потихоньку из светлицы, кроме служанки, которая снова села за самопрялку.</span></td>
            </tr>
                <tr><td>подчинение + бессоюзие</td>
                <td><span class="ex-word">Я понимал, что выручить нас может только случайность: или вода перестанет прибывать, или мы наткнёмся на этом берегу на брошенную лодку.</span></td>
            </tr>
                <tr><td>сочинение + бессоюзие</td>
                <td><span class="ex-word">Солнце село, и наступила тишина: все разошлись по домам.</span></td>
            </tr>
                <tr><td>все три вида связи</td>
                <td><span class="ex-word">Когда стемнело и раздался колокольчик сторожа, я испугался, что сад закроется, и пошёл очень быстро.</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Пример сложного анализа:</b> <span class="ex-word">И он стал рассказывать, почему не вышло: кругом всё уже было заминировано, и, для того чтобы прорваться в Сальково, оставалась только узкая полоска в несколько десятков метров с двух сторон железной дороги.</span><br>
            (СПП с придаточным изъяснительным + БСП + ССП + СПП с придаточным цели)</div>`},

// А18
{id:"А18",title:"А18. Стили и типы речи",rule:`
            <div class="info-block"><i class="fas fa-palette"></i> <b>Стили речи</b></div>
            <table class="table"><tr><th>Стиль</th><th>Особенности</th><th>Сфера применения</th></tr>
                <tr><td>Разговорный</td>
                <td>непринуждённость, эмоциональность, диалог, неполные предложения, разговорная лексика</td>
                <td>бытовое общение, семейные разговоры, дружеские беседы</td>
            </tr>
                <tr><td>Художественный</td>
                <td>образность, выразительность, изобразительные средства (эпитеты, метафоры), авторская позиция</td>
                <td>литература (проза, поэзия, драматургия)</td>
            </tr>
                <tr><td>Публицистический</td>
                <td>эмоциональность, призывность, сочетание логики и чувства, общественно-политическая лексика</td>
                <td>СМИ, газеты, журналы, телевидение, выступления, агитация</td>
            </tr>
                <tr><td>Научный</td>
                <td>термины, точность, логичность, безличность, абстрактная лексика, сложные предложения</td>
                <td>наука, учебники, научные статьи, диссертации, лекции</td>
            </tr>
                <tr><td>Официально-деловой</td>
                <td>точность, стандартность, шаблонность, канцеляризмы, отсутствие эмоций</td>
                <td>документы, законы, приказы, заявления, договоры, справки</td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-pen-fancy"></i> <b>Типы речи</b></div>
            <table class="table"><tr><th>Тип</th><th>Вопрос</th><th>Содержание</th><th>Пример</th></tr>
                <tr><td>Описание</td>
                <td>какой? какая? какие?</td>
                <td>признаки предмета, явления, места, портрет человека, пейзаж</td>
                <td><span class="ex-word">Лес стоял золотой. Небо было синее-синее. На поляне росла стройная берёза.</span></td>
            </tr>
                <tr><td>Повествование</td>
                <td>что произошло? что случилось?</td>
                <td>действия, события в хронологическом порядке, динамика, сюжет</td>
                <td><span class="ex-word">Мальчик встал, умылся, оделся и пошёл в школу. Вдруг налетел ветер и начался дождь.</span></td>
            </tr>
                <tr><td>Рассуждение</td>
                <td>почему? зачем? в чём смысл?</td>
                <td>тезис → аргументы → вывод, логические связи, причинно-следственные отношения</td>
                <td><span class="ex-word">Человек должен учиться, потому что знания дают свободу. Если бы не было книг, мир был бы другим.</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Комбинированные типы речи:</b> в одном тексте могут сочетаться описание, повествование и рассуждение. Например: <span class="ex-word">Была тихая летняя ночь (описание). Вдруг раздался крик (повествование). Должно быть, кто-то заблудился в лесу (рассуждение).</span></div>
            <div class="info-block"><i class="fas fa-link"></i> <b>Средства связи предложений в тексте:</b> местоимения (личные, указательные), лексический повтор, синонимы, союзы, наречия (там, тогда, потому, поэтому), синтаксический параллелизм.</div>`},

// В1
{id:"В1",title:"В1. Лексическое значение слова",rule:`
            <div class="info-block"><i class="fas fa-lightbulb"></i> <b>Лексическое значение</b> — то, что обозначает слово. Например: <span class="ex-word">дом</span> — здание для проживания людей, <span class="ex-word">бежать</span> — быстро передвигаться.</div>
            <div class="info-block"><i class="fas fa-star"></i> <b>Однозначные и многозначные слова</b><br>
            <b>Однозначные</b> — имеют одно значение: <span class="ex-word">берёза, компьютер, термометр, одуванчик</span><br>
            <b>Многозначные</b> — имеют два и более значений: <span class="ex-word">ключ</span> (гаечный, скрипичный, родник), <span class="ex-word">ручка</span> (дверная, авторучка, ребёнка, чемодана), <span class="ex-word">игла</span> (швейная, сосновая, ежа, медицинская)</div>
            <div class="info-block"><i class="fas fa-star"></i> <b>Прямое и переносное значение</b><br>
            <b>Прямое</b> — основное, прямое называние предмета: <span class="ex-word">золотое кольцо, железный гвоздь, каменный дом</span><br>
            <b>Переносное</b> — основано на сходстве: <span class="ex-word">золотые руки, железная воля, каменное сердце, тёплый приём, холодный взгляд</span><br>
            <b>Типы переноса:</b> метафора (скрытое сравнение), метонимия (смежность), синекдоха (часть вместо целого)</div>
            <div class="example"><i class="fas fa-star"></i> <b>Лексические явления:</b><br>
            <b>Омонимы</b> (звучат/пишутся одинаково, разное значение): <span class="ex-word">коса</span> (волосы/орудие/полуостров), <span class="ex-word">брак</span> (супружество/дефект)<br>
            <b>Синонимы</b> (близкие по значению): <span class="ex-word">храбрый, смелый, отважный, мужественный, бесстрашный</span><br>
            <b>Антонимы</b> (противоположные): <span class="ex-word">добро — зло, высокий — низкий, радость — горе, любить — ненавидеть</span><br>
            <b>Паронимы</b> (похожие по звучанию, разные по значению): <span class="ex-word">одеть — надеть, абонент — абонемент, дипломат — дипломант</span></div>
            <div class="info-block"><i class="fas fa-globe"></i> <b>Контекстуальное значение</b> — значение, которое слово приобретает только в данном контексте (часто используется в художественной литературе).<br>
            <span class="ex-word">Каждый человек — <u>кузнец</u> своего счастья.</span> (кузнец = создатель)<br>
            <span class="ex-word">Ах ты, <u>шуба</u> овечья!</span> (шуба = глупый человек)<br>
            <span class="ex-word">Эй, <u>шляпа</u>, проходи!</span> (шляпа = рассеянный человек)</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Происхождение лексики</b><br>
            <b>Исконно русские:</b> <span class="ex-word">мать, стол, земля, один, добрый</span><br>
            <b>Заимствованные:</b> <span class="ex-word">алфавит (греч.), солдат (нем.), бульон (франц.), футбол (англ.)</span></div>`},

// В2
{id:"В2",title:"В2. Синонимы, антонимы, паронимы",rule:`
            <div class="info-block"><i class="fas fa-exchange-alt"></i> <b>Синонимы</b> — слова одной части речи, близкие или полностью совпадающие по значению.<br>
            <span class="ex-word">радостный — весёлый, говорить — беседовать, быстро — стремительно, большой — огромный — гигантский, учитель — педагог — преподаватель</span><br>
            <b>Синонимический ряд</b> — группа синонимов: <span class="ex-word">храбрый, смелый, отважный, мужественный, бесстрашный, доблестный, геройский</span><br>
            <b>Контекстуальные синонимы</b> — становятся синонимами только в данном контексте: <span class="ex-word">девочка — малышка, красотка, хохотунья, прелесть, кокетка</span></div>
            <div class="info-block"><i class="fas fa-arrows-alt-h"></i> <b>Антонимы</b> — слова одной части речи с противоположным значением.<br>
            <b>Однокорневые:</b> <span class="ex-word">друг — недруг, правда — неправда, счастье — несчастье, прийти — уйти</span><br>
            <b>Разнокорневые:</b> <span class="ex-word">день — ночь, добрый — злой, приходить — уходить, правда — ложь, любить — ненавидеть, высокий — низкий, широкий — узкий</span><br>
            <b>Контекстуальные антонимы:</b> <span class="ex-word">волк и овца, лиса и заяц</span> (в баснях)</div>
            <div class="info-block"><i class="fas fa-waveform"></i> <b>Паронимы</b> — однокоренные слова, похожие по звучанию, но разные по значению (часто различаются суффиксами или приставками).</div>
            <table class="table"><tr><th>Паронимы</th><th>Значение</th></tr>
                <tr><td>одеть — надеть</td><td>одеть <b>кого-то</b>, надеть <b>что-то</b> (одеть ребёнка, надеть пальто)</td>
            </tr>
                <tr><td>абонент — абонемент</td><td>абонент — <b>пользователь</b> (абонент сети), абонемент — <b>документ</b> (абонемент в театр)</td>
            </tr>
                <tr><td>дипломат — дипломант</td><td>дипломат — <b>специалист</b> по международным отношениям, дипломант — <b>победитель конкурса</b></td>
            </tr>
                <tr><td>эффектный — эффективный</td><td>эффектный — <b>производящий впечатление</b>, эффективный — <b>действенный, дающий результат</b></td>
            </tr>
                <tr><td>главный — заглавный</td><td>главный — <b>основной</b> (главная улица), заглавный — <b>о букве, о роли</b> (заглавная буква, заглавная роль)</td>
            </tr>
                <tr><td>желанный — желательный</td><td>желанный — <b>тот, кого желают</b> (желанный гость), желательный — <b>возможный, необязательный</b> (желательное условие)</td>
            <tr>
                <td>представить — предоставить</td><td>представить — <b>вообразить, показать</b> (представить картину), предоставить — <b>отдать в распоряжение</b> (предоставить отпуск)</td>
            </tr>
                <tr><td>командированный — командировочный</td><td>командированный — <b>человек</b> (он командированный), командировочный — <b>документ</b> (командировочное удостоверение)</td>
            </tr>
                <tr><td>поступок — проступок</td><td>поступок — <b>действие</b> (героический поступок), проступок — <b>нарушение</b> (мелкий проступок)</td>
            </tr>
                <tr><td>невежа — невежда</td><td>невежа — <b>грубый человек</b>, невежда — <b>необразованный человек</b></td>
            </tr>
                <tr><td>осудить — обсудить</td><td>осудить — <b>выразить неодобрение, приговорить</b>, обсудить — <b>рассмотреть, поговорить</b></td>
            </tr>
                <tr><td>длинный — длительный</td><td>длинный — <b>о длине</b> (длинный поезд), длительный — <b>о времени</b> (длительный перелёт)</td>
            </tr>
                <tr><td>скрытный — скрытый</td><td>скрытный — <b>неоткровенный</b> (скрытный человек), скрытый — <b>невидимый, тайный</b> (скрытая угроза)</td>
            </tr>
                <tr><td>удачный — удачливый</td><td>удачный — <b>хороший, успешный</b> (удачный день), удачливый — <b>везучий</b> (удачливый охотник)</td>
            </tr>
                <tr><td>двойной — двойственный</td><td>двойной — <b>состоящий из двух частей</b> (двойной подбородок), двойственный — <b>противоречивый</b> (двойственное чувство)</td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Запомните!</b> <span class="ex-word">одеть — надеть, оплатить — уплатить, враждебный — вражеский, целый — цельный, бережный — бережливый, эффективный — эффектный</span></div>`},
