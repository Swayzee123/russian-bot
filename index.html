<script>
const sections = [
{"id":"А1","title":"А1. Гласная в корне","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Алгоритм:</b><br>1️⃣ Корни с чередующимися гласными<br>2️⃣ Подбери проверочное слово<br>3️⃣ Не получается → словарное</div><div class="info-block green"><i class="fas fa-exchange-alt"></i> <b>Гар/гор, клан/клон, твар/твор</b> (без уд.→О); <b>зар/зор</b> (без уд.→А); <b>плав/плов</b> (А, кроме пловец/пловчиха); <b>кас/кос</b> (суфф.А→А); <b>лаг/лож</b> (Г→А, Ж→О); <b>раст/ращ/рос</b> (СТ,Щ→А); <b>скак/скоч</b> (К→А, Ч→О); <b>мак/мок</b> (мак=погруж., мок=мокр.); <b>равн/ровн</b> (равн=одинак., ровн=гладк.).</div><div class="info-block pink"><i class="fas fa-star"></i> <b>Искл.:</b> <span class="ex-word">пригарь, выгарки, утварь; скачу, скачок; росток, Ростов, Ростислав, ростовщик, отрасль; поровну, уровень, ровесник, равнина</span></div><div class="info-block yellow"><i class="fas fa-exclamation-triangle"></i> <b>НЕЛЬЗЯ с -ыва-, -ива-:</b> <span class="ex-word">опоздать</span> (поздний) ✅, <span class="ex-word">опаздывать</span> ❌</div>`},
{"id":"А2","title":"А2. Гласная в корне","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Алгоритм:</b> 1️⃣ Корни е/и? 2️⃣ Проверочное? 3️⃣ Словарное? 4️⃣ пре-/при-?</div><div class="info-block green"><i class="fas fa-exchange-alt"></i> <b>Е/И:</b> бер/бир, дер/дир, мер/мир, пер/пир, тер/тир, блест/блист, жег/жиг, стел/стил, чет/чит. Суфф.А → И. Искл.: сочетать, сочетание, чета.</div><div class="info-block blue"><i class="fas fa-code-branch"></i> <b>ПРЕ-:</b> =очень (премилый), =пере (преградить). <b>ПРИ-:</b> приближение, присоединение, близость, неполнота.</div><div class="info-block purple"><i class="fas fa-star"></i> <b>ПРИ-:</b> <span class="ex-word">привередливый, примитивный, привлекательный, прилежный, привилегия, приоритет, примадонна, приватный, присутствие, прибор</span>. <b>ПРЕ-:</b> <span class="ex-word">беспрекословный, знаки препинания, камень преткновения, непреклонный, преамбула, президент, преимущество, препятствие, престиж, преследовать, прецедент</span></div>`},
{"id":"А3","title":"А3. Согласные в корне","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Алгоритм:</b> 1️⃣ Озвонч./оглуш.? 2️⃣ Проверь однокоренным. 3️⃣ Словарное?</div><div class="info-block green"><i class="fas fa-volume-up"></i> <b>Проверяемые:</b> <span class="ex-word">просьба—просить, резьба—резать</span>. Искл.: <span class="ex-word">свадьба</span></div><div class="info-block blue"><i class="fas fa-book"></i> <b>Непроверяемые:</b> <span class="ex-word">космонавт, вокзал, бутсы, анекдот, здесь, здоровье, здание, футбол</span></div><div class="info-block green"><i class="fas fa-volume-up"></i> <b>Непроизносимые:</b> <span class="ex-word">солнце—солнышко</span>. Непровер.: <span class="ex-word">лестница, чувство, сверстник, праздник, ландшафт, ветчина</span>. Без: <span class="ex-word">грейпфрут, блеснуть, шествовать</span></div><div class="info-block orange"><i class="fas fa-exchange-alt"></i> <b>З-/С-:</b> З- перед гласн. и звонк., С- перед глух. диз-/дис-: дис- перед согл., диз- перед гласн.</div>`},
{"id":"А4","title":"А4. Суффиксы и окончания","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>1️⃣ Перед ВШ,В,ВШИ,НН,Л → как в инф. (искл.: -ИТЬ→перед НН пишем Е). 2️⃣ Перед М,Щ → причастия. 3️⃣ Окончания → спряжение.</b></div><div class="info-block green"><i class="fas fa-crown"></i> <b>Причастия наст. вр.:</b> Действ.: 1 спр. -ущ/-ющ (читающий), 2 спр. -ащ/-ящ (клеящий). Страдат.: 1 спр. -ем/-ом (читаемый), 2 спр. -им (видимый).</div><div class="info-block blue"><i class="fas fa-running"></i> <b>Спряжение:</b> 1 спр: -ать, -еть, -ять, -оть, -уть, -ти, -чь (+брить, стелить). 2 спр: -ить (+гнать, дышать, держать, слышать, смотреть, видеть, ненавидеть, терпеть, зависеть, вертеть, обидеть).</div>`},
{"id":"А5","title":"А5. НЕ и НИ","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>НЕ:</b> отрицание; двойное НЕ=утверждение (<span class="ex-word">нельзя не уважать</span>); не раз/не один=много; <span class="ex-word">свет не мил</span>; вовсе/далеко/отнюдь не.</div><div class="info-block blue"><i class="fas fa-ban"></i> <b>НИ:</b> усиление (<span class="ex-word">ни гроша</span>); ни...ни; ни разу=никогда; <span class="ex-word">ни свет ни заря, ни жив ни мёртв, ни пуха ни пера, ни слуху ни духу</span></div><div class="info-block orange"><i class="fas fa-exchange-alt"></i> НЕ под уд.=Е (<span class="ex-word">негде</span>), НИ без уд.=И (<span class="ex-word">никогда</span>)</div>`},
{"id":"А6","title":"А6. Слитное/раздельное НЕ","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>Слитно:</b> синоним без НЕ, без НЕ не употр., есть «НО».</div><div class="info-block blue"><i class="fas fa-times-circle"></i> <b>Раздельно:</b> есть «А»; вовсе/далеко/отнюдь не; никто не.</div><div class="info-block purple"><i class="fas fa-pen-fancy"></i> <b>НЕ с причастиями:</b> Слитно — нет зависимого. Раздельно — есть зависимое.</div><div class="info-block yellow"><i class="fas fa-exclamation-triangle"></i> Краткие причастия ВСЕГДА раздельно! Глаголы/деепричастия ВСЕГДА раздельно.</div>`},
{"id":"А7","title":"А7. Сложные слова","rule":`<div class="info-block green"><i class="fas fa-link"></i> <b>Слитно:</b> <span class="ex-word">авиа-, авто-, био-, гео-, кино-, метео-, радио-, теле-, фото-, электро-, анти-, архи-, контр-, супер-, ультра-, экстра-</span></div><div class="info-block blue"><i class="fas fa-hyphen"></i> <b>Дефис:</b> <span class="ex-word">альфа-, блок-, веб-, вице-, лейб-, макси-, мини-, онлайн-, обер-, поп-, пресс-, рок-, штаб-, экс-</span></div><div class="info-block green"><i class="fas fa-star"></i> <b>Сущ. СЛИТНО:</b> -метр; сложносокр.; полу-; числительное. <b>ДЕФИС:</b> стороны света; оценка; научные; географические.</div><div class="info-block yellow"><i class="fas fa-star"></i> <b>ПОЛ-:</b> Слитно. Дефис — перед Л, гласн., прописн. Раздельно — есть слово между.</div>`},
{"id":"А8","title":"А8. Союзы, предлоги, наречия","rule":`<div class="info-block green"><i class="fas fa-link"></i> <b>Союзы СЛИТНО:</b> зато=но, тоже/также=и, чтобы=каб, итак=следовательно, оттого=потому что. <b>РАЗДЕЛЬНО:</b> за то, то же, что бы, и так, при том, от того.</div><div class="info-block purple"><i class="fas fa-map-marker-alt"></i> <b>Предлоги СЛИТНО:</b> <span class="ex-word">благодаря, ввиду, вопреки, несмотря на, вследствие, наподобие, навстречу</span>. <b>РАЗДЕЛЬНО:</b> <span class="ex-word">в течение, в продолжение, в заключение, в связи с, в отличие от, по мере, по поводу</span></div><div class="info-block yellow"><i class="fas fa-star"></i> <b>в заключение</b> вечера vs <b>в заключении</b> (находится). <b>в течение</b> года vs <b>в течении</b> реки.</div>`},
{"id":"А9","title":"А9. Тире","rule":`<div class="info-block green"><i class="fas fa-minus"></i> <b>Ставится:</b> сущ.—сущ., инф.—инф., числ.—числ., это/вот/значит.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>НЕ ставится:</b> перед как/словно/будто; перед есть; подлежащее — личное мест.; сказуемое — прилагательное; перед НЕ (кроме инф.); фразеологизм; перед также/тоже.</div>`},
{"id":"А10","title":"А10. Обособленные","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>Дееприч. оборот</b> — ВСЕГДА обособл., кроме: фразеологизм, одиночное сразу за сказуемым.</div><div class="info-block blue"><i class="fas fa-check-circle"></i> <b>«Несмотря на»</b> — всегда обособляется!</div><div class="info-block green"><i class="fas fa-check-circle"></i> <b>Причастный оборот:</b> ПОСЛЕ опр. — обособл. ПЕРЕД опр. — НЕ обособл.</div>`},
{"id":"А11","title":"А11. Вводные слова","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Вводные ВСЕГДА обособляются!</b></div><div class="info-block green"><i class="fas fa-comment-dots"></i> <b>Обозначают:</b> уверенность, чувства, источник, порядок мыслей.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>НЕ вводные:</b> <span class="ex-word">авось, вот, едва ли, лишь, притом, будто, именно, между тем, причём, действительно, буквально, вряд ли, к тому же, просто, вдруг, словно, примерно, ведь, даже, как раз, якобы</span></div>`},
{"id":"А12","title":"А12. Однородные члены","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>Ставится:</b> Перечисление. Противительные (а, но, да=но, однако, зато, же). Повторяющиеся (и...и, ни...ни). Двойные (не только...но и, как...так и).</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>НЕ ставится:</b> Одиночные и/да=и/или/либо. Фразеологизмы: <span class="ex-word">ни свет ни заря, и так и этак, за все про все</span>.</div>`},
{"id":"А13","title":"А13. ССП и СПП","rule":`<div class="info-block green"><i class="fas fa-code-branch"></i> <b>ССП</b> — запятая между частями. <b>НЕ ставится:</b> Общий второст. член; общее вводное; оба вопросит./восклицат.; оба безличные; оба назывные.</div><div class="info-block blue"><i class="fas fa-sitemap"></i> <b>СПП — НЕ ставится:</b> Есть НЕ/повторяющийся союз/ни...ни; придаточная из одного слова; фразеологизм; однородные придаточные с И.</div><div class="info-block yellow"><i class="fas fa-exclamation-triangle"></i> <b>Стык союзов:</b> Ставится — если НЕТ (то, но). НЕ ставится — если ЕСТЬ (то, но).</div>`},
{"id":"А14","title":"А14. БСП","rule":`<div class="info-block green"><i class="fas fa-comma"></i> <b>Запятая</b> — перечисление.</div><div class="info-block blue"><i class="fas fa-colon"></i> <b>Двоеточие:</b> пояснение (а именно), изъяснение (что), причина (потому что), прямой вопрос.</div><div class="info-block pink"><i class="fas fa-minus"></i> <b>Тире:</b> противопоставление, условие (если), время (когда), следствие, быстрая смена.</div>`},
{"id":"А15","title":"А15. Прямая речь","rule":`<div class="info-block green"><i class="fas fa-quote-left"></i> <b>Схемы:</b> «П», — а. | «П, — а. — П». | «П, — а: — П» (2 сказуемых).</div><div class="info-block blue"><i class="fas fa-quote-right"></i> <b>Цитаты:</b> 1) Как прямая речь. 2) [ ], что «цитата». 3) Вводное, «цитата».</div><div class="info-block purple"><i class="fas fa-comments"></i> <b>Диалог:</b> Каждая реплика с абзаца, перед каждой — тире.</div>`},
{"id":"А16","title":"А16. Запятая перед КАК","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>Ставится:</b> Причина (=будучи); сравнение (=будто); указат. слова; СПП; вводные (как правило); не кто иной, как; как и.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>НЕ ставится:</b> Составное сказуемое (<span class="ex-word">Город как сад</span>); = «в качестве»; как...так и; в начале предложения; фразеологизм.</div>`},
{"id":"А17","title":"А17. Разные виды связи","rule":`<div class="info-block green"><i class="fas fa-code-branch"></i> <b>Стык союзов:</b> Ставится — если НЕТ (то, но). НЕ ставится — если ЕСТЬ (то, но).</div><div class="info-block blue"><i class="fas fa-table"></i> <b>Типы:</b> сочинение+подчинение, подчинение+бессоюзие, сочинение+бессоюзие, все три вида.</div>`},
{"id":"А18","title":"А18. Текст","rule":`<div class="info-block green"><i class="fas fa-palette"></i> <b>Типы:</b> Описание. Повествование. Рассуждение.</div><div class="info-block blue"><i class="fas fa-book"></i> <b>Стили:</b> Научный, публицистический, художественный.</div>`},
{"id":"В1","title":"В1. Связь предложений","rule":`<div class="info-block green"><i class="fas fa-link"></i> 1️⃣ <b>Союз</b> (в начале 2-го): И, А, НО, ОДНАКО, ТОЖЕ, ТАКЖЕ. 2️⃣ <b>Лексический повтор</b>. 3️⃣ <b>Синонимическая замена</b>. 4️⃣ <b>Местоимение</b>.</div>`},
{"id":"В2","title":"В2. Лексика","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> <b>Синонимы</b> — близкие. <b>Антонимы</b> — противоположные. <b>Однозначные</b>: жёлтый, сорока, мечтать. <b>Многозначные</b>: ножка, шляпка, идти.</div>`},
{"id":"В3","title":"В3. Орфоэпия","rule":`<div class="info-block green"><i class="fas fa-volume-up"></i> <b>Ударение:</b> катал<b>о</b>г, кварт<b>а</b>л, догов<b>о</b>р, дос<b>у</b>г, звон<b>и</b>т, т<b>о</b>рты, б<b>а</b>нты, крас<b>и</b>вее, бал<b>о</b>ванный, кровоточ<b>и</b>ть, облегч<b>и</b>ть, щав<b>е</b>ль.</div>`},
{"id":"В4","title":"В4. Фразеология","rule":`<div class="info-block green"><i class="fas fa-book-open"></i> <b>Фразеологизмы:</b> бить баклуши (бездельничать), спустя рукава (небрежно), сломя голову (быстро), кот наплакал (мало), водить за нос (обманывать), как снег на голову (внезапно), ахиллесова пята (слабое место).</div>`},
{"id":"В5","title":"В5. Фонетика","rule":`<div class="info-block green"><i class="fas fa-volume-up"></i> <b>Звонкие:</b> б, в, г, д, ж, з, л, м, н, р, й. <b>Всегда мягкие:</b> щ, ч, й. <b>Всегда твёрдые:</b> ж, ш, ц.</div><div class="info-block blue"><i class="fas fa-exchange-alt"></i> <b>Оглушение:</b> в конце слова и перед глухим. <b>Озвончение:</b> перед звонким. <b>Смягчение:</b> мягкий смягчает предыдущий.</div>`},
{"id":"В6","title":"В6. Местоимение","rule":`<div class="info-block green"><i class="fas fa-users"></i> <b>Разряды:</b> Личные (я, ты, он), возвратное (себя), притяжательные (мой, твой), указательные (этот, тот), определительные (весь, каждый), вопросительные (кто, что, какой), относительные, неопределённые, отрицательные (никто, ничто).</div>`},
{"id":"В7","title":"В7. Синтаксические функции","rule":`<div class="info-block green"><i class="fas fa-project-diagram"></i> <b>Алгоритм:</b> сначала найдите грамматическую основу, затем задайте вопрос к выделенному слову и определите его роль: подлежащее, сказуемое, дополнение, определение или обстоятельство.</div><div class="info-block blue"><i class="fas fa-language"></i> <b>Инфинитив в предложении</b> может быть подлежащим, частью сказуемого, дополнением или обстоятельством — ориентируйтесь только на вопрос в контексте.</div><div class="info-block yellow"><i class="fas fa-table"></i> В заданиях на соответствие ответы записывайте строго в формате <b>А1Б2В3Г4</b>.</div>`},
{"id":"В8","title":"В8. Глагол","rule":`<div class="info-block green"><i class="fas fa-clock"></i> <b>Вид:</b> Совершенный (что сделать?), Несовершенный (что делать?).</div><div class="info-block blue"><i class="fas fa-arrows-alt-h"></i> <b>Переходность:</b> Переходный (В.п. без предлога). Непереходный.</div><div class="info-block purple"><i class="fas fa-sync-alt"></i> <b>Возвратность:</b> Возвратный (-ся, -сь). Невозвратный.</div><div class="info-block pink"><i class="fas fa-running"></i> <b>Спряжение:</b> 1 спр: -ать, -еть, -ять, -оть, -уть, -ти, -чь (+брить, стелить). 2 спр: -ить (+гнать, дышать, держать, слышать, смотреть, видеть, ненавидеть, терпеть, зависеть, вертеть, обидеть). Разноспрягаемые: хотеть, бежать.</div>`},
{"id":"В9","title":"В9. Словосочетание","rule":`<div class="info-block green"><i class="fas fa-link"></i> <b>Согласование:</b> завис. — прилагательное (какой?): <span class="ex-word">красивый дом</span>.</div><div class="info-block blue"><i class="fas fa-link"></i> <b>Управление:</b> завис. — предмет (падежные вопросы): <span class="ex-word">читать книгу</span>.</div><div class="info-block purple"><i class="fas fa-link"></i> <b>Примыкание:</b> завис. — неизменяемая (наречие, дееприч., инфинитив): <span class="ex-word">бежать быстро</span>.</div>`},
{"id":"В10","title":"В10. Ь/Ъ, Ы/И, О/Ё","rule":`<div class="info-block green"><i class="fas fa-spell-check"></i> <b>Что проверяем в этом разделе:</b> разделительные <b>Ь/Ъ</b>, написание <b>Ы/И</b> после приставок и Ц, а также <b>О/Ё</b> после шипящих.</div><div class="info-block blue"><i class="fas fa-list"></i> <b>Быстрый порядок:</b> 1) приставка или корень, 2) есть ли йотированная гласная, 3) часть речи и форма слова, 4) только потом выбор буквы.</div><div class="info-block yellow"><i class="fas fa-pen"></i> В ответе записывайте слово в той форме, в какой оно требуется в задании.</div>`},
{"id":"В11","title":"В11. Суффиксы и окончания глагольных форм","rule":`<div class="info-block green"><i class="fas fa-running"></i> <b>Личные окончания глаголов:</b> определяются по спряжению. I спр. — <span class="ex-word">-у/-ю, -ешь, -ет, -ем, -ете, -ут/-ют</span>; II спр. — <span class="ex-word">-у/-ю, -ишь, -ит, -им, -ите, -ат/-ят</span>.</div><div class="info-block blue"><i class="fas fa-feather"></i> <b>Причастия:</b> в действительных причастиях настоящего времени пишем <span class="ex-word">-ущ/-ющ</span> (I спр.) и <span class="ex-word">-ащ/-ящ</span> (II спр.); в страдательных — <span class="ex-word">-ем/-ом</span> (I спр.) и <span class="ex-word">-им</span> (II спр.).</div><div class="info-block yellow"><i class="fas fa-book"></i> <b>Прошедшее время, причастия на -вш-/-ш- и -нн-:</b> обычно сохраняют гласную инфинитива перед <span class="ex-word">-ть</span> (например: <span class="ex-word">посеять → посеявший</span>, <span class="ex-word">потерять → потерянный</span>).</div>`},
{"id":"В12","title":"В12. Алгоритм орфографии","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> Читать по буквам, проверять всю орфографию!</div>`},
{"id":"В13","title":"В13. Алгоритм пунктуации","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> 1️⃣ Стык союзов. 2️⃣ Двоеточие. 3️⃣ Однородные. 4️⃣ Причастный оборот.</div>`},
{"id":"В14","title":"В14. Лексика","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> <b>Синонимы</b> (близкие), <b>Антонимы</b> (противоположные), <b>Многозначные</b> (несколько значений), <b>Омонимы</b> (одинаково пишутся, разное значение).</div>`},
{"id":"В15","title":"В15. Простое предложение","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> Нераспространённое (только главные), распространённое (главные + второстепенные).</div>`},
{"id":"В16","title":"В16. Лексические нормы","rule":`<div class="info-block green"><i class="fas fa-comment-dots"></i> <b>Что проверяем:</b> лексическая сочетаемость, плеоназмы, тавтология, смешение паронимов, неверное употребление фразеологизмов.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>Частые ошибки:</b> <span class="ex-word">большая половина, перспектива на будущее, оказать вред, сделать услугу, гончий мотоцикл</span></div>`},

{"id":"В19","title":"В19. Состав слова","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Алгоритм:</b> 1️⃣ Часть речи (по вопросу!!!). 2️⃣ СМС. 3️⃣ Изменяем слово.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>Нет окончания:</b> наречие (<span class="ex-word">легко</span>), деепричастие (<span class="ex-word">читая</span>), инфинитив (<span class="ex-word">писать</span>), сравн. степень (<span class="ex-word">красивее</span>).</div>`},

{"id":"В21","title":"В21. Определение синтаксической роли слов в предложении","rule":`<div class="info-block green"><i class="fas fa-sitemap"></i> <b>Что проверяем:</b> подлежащее, сказуемое, дополнение, определение, обстоятельство, тип сказуемого, роль инфинитива и местоимения.</div><div class="info-block blue"><i class="fas fa-list-check"></i> <b>Алгоритм:</b> 1) Найди грамматическую основу. 2) Задай вопрос к выделенному слову. 3) Определи связь слова с главным членом.</div>`},

{num:3,text:`С конца сентября наши сады пустели, погода, по обыкновению, круто менялась. Ветер по целым дням рвал и трепал деревья, дожди поливали их с утра до ночи. Иногда к вечеру между хмурыми низкими тучами пробивался на западе трепещущий золотистый свет низкого солнца. Воздух делался чист и ясен, солнечный свет ослепительно сверкал между листвою, между ветвями, которые живою сеткою двигались и волновались от ветра. Холодно и ярко сияло на севере над тяжёлыми свинцовыми тучами голубое небо, а из-за этих туч медленно выплывали хребты снеговых гор-облаков. Стоишь у окна и думаешь: «Авось, бог даст, распогодится».

{num:4,text:`Вокруг произведения Рафаэля «Сикстинская мадонна» всегда было много тайн. Разные поколения, разные люди находили в «Сикстинской мадонне» что-то своё. Однако все единодушно видели в картине не только совершенное произведение искусства, но и высшую меру человеческого благородства. И вот это самое знаменитое произведение Рафаэля, созданное им около 1516 года, могло быть навсегда утеряно в годы Второй мировой войны.

Когда ящик нашли и открыли, перед людьми предстало изображение женщины дивной, неземной красоты с божественным младенцем на руках. И советские солдаты и офицеры, несколько лет шагавшие тяжёлыми дорогами войны, сняли перед ней пилотки и фуражки.

{num:5,text:`Сводки погоды три дня обещали грозу. Однако все эти три дня сияло солнце, и никто уже не верил, что гроза придёт. Поэтому, собираясь в кино, мы не взяли зонтики.

Мы встали у двери, но в подъезд один за другим стремительно влетали с улицы промокшие люди, встряхивались, и брызги от них летели во все стороны. Сначала мы немного отодвинулись от порога, а потом поднялись на лестничную площадку первого этажа.

Ты сказала: «Всё равно в кино мы опоздали. Побежали домой. Я так давно не бегала босиком». Я не стал спорить. Дождь ещё сеял, тёплый, лёгкий, весёлый, и на душе было радостно. Ты была рядом, и мы топали босиком по центру громадного города.

{num:6,text:`В любое произведение искусства, без сомнения, вложена душа и сердце его создателя. В фильме или спектакле всё может быть ненастоящим, бутафорским: стены комнаты, обстановка, вещи, однако же чувства художника, его желанья, его раздумья всегда настоящие, подлинные. Они-то как раз и составляют особую силу искусства, способную растрогать и расшевелить самого сдержанного человека. Сколько раз вы могли видеть, как после окончания кинокартины встают со своих мест зрители с ещё не просохшими слезами на глазах! Сколько раз, вероятно, вы и сами заливались неудержимым смехом, нисколько не смущаясь тем, что вокруг вас сидят чужие люди.

Мы потому-то и любим искусство, что оно захватывает нас, обостряет наши чувства, побуждает нас становиться лучше, заставляет стремиться к светлым и благородным целям. Постигая «вечное» и «непревзойдённое», мы, кроме того, начинаем верить в то, что и в каждом из нас заложено то прекрасное, к чему зовёт нас искусство.

По моему глубокому убеждению, искусство учит и воспитывает не только зрителей, но и самого художника, творческий путь которого труден и тернист и нередко приносит огорчения и глубокие разочарования. Как и во многих других профессиях, работа творческого человека, безусловно, требует от него самоотверженности, полного напряжения всех сил. Она забирает всё его время, все силы, но зато даёт ему ощущение необычайной полноты и разнообразия жизни.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) разговорный стиль речи`,`3) тип речи — повествование`,`4) тип речи — рассуждение`,`5) задача речи — убедить читателя в том, что произведения искусства не всегда воздействуют на мысли и сознание человека`],answer:`14`},
{num:7,text:`Рогульник плавающий (водяной орех) — редкий, реликтовый европейский вид семейства рогульниковых, находящийся в Европе под угрозой исчезновения. Он включён в Красную книгу Республики Беларусь.

Рогульник — однолетнее водное травянистое растение, иногда свободно плавающее, но обычно прикреплённое ко дну. Для водяного ореха, как и для других водяных растений, характерна разнолистность. Прежде всего на его стебле появляются нитевидные, рано опадающие листья. Затем на водной поверхности рогульник развивает одну или несколько розеток ромбических, зазубренных листьев, несколько напоминающих по форме листья берёзы. Эти листья расположены мозаично благодаря разной длине черешков.

В верхней части черешков имеются так называемые «плавательные пузыри» — вздутия, заполненные воздухоносной тканью. В пазухах листьев появляются одиночные цветки с белыми или розоватыми прозрачными лепестками. Верхние доли чашечки цветка постепенно отвердевают и превращаются в легко отламывающиеся шипы. Костянковидные плоды — «орехи» — имеют роговидные выступы. У водяного ореха плоды съедобны. Они также являются ценным лекарственным сырьём.

Рогульник предпочитает пойменные озёра, куда в половодье поступает свежая вода, а также заводи рек глубиной 50-200 см, с илистым грунтом и обогащённой железом водой. В Беларуси этот вид встречается в озёрах бассейнов рек Припяти, Березины, Днепра, Сожа, в Городокском районе Витебской области, Житковичском районе Минской области.

{num:8,text:`Однажды в нашей таёжной деревушке сильная гроза повалила огородные заборы и подгнившие телефонные столбы, посрывала кое-где крыши, повыворачивала давно состарившиеся берёзы и тополя.

Пробегая утром мимо школы, я услышал тревожный писк и увидел на краю карниза ласточек, суетящихся у разорённого вчерашней грозой гнезда. Ветром оторвало от него больше половины, из оставшейся треснувшей части гнезда выглядывали три ещё желторотых птенца; их родители цеплялись за стенки сарая рядом и, щебеча, будто плача над неутешным горем, просили помощи. Казалось, что остатки гнезда вот-вот отвалятся. А другие ласточки поочерёдно подлетали к пострадавшему гнезду, зависали на трепещущих крыльях, словно обдумывая, что предпринять, и отлетали.

Возвращаясь около полудня, я заметил, что ласточки ремонтируют гнездо «всем миром». Трещина уже была аккуратно заделана — её можно было заметить лишь по тёмной полосе сырой ещё глины, но ласточки с комочками строительного материала в клювах всё подлетали одна за другой.

Вскоре гнездо было полностью восстановлено, и ласточки улетели к реке. Они носились над водной гладью, то касаясь её брюшком или крылом, то взмывая под небеса.

А я стоял и думал: как дружны эти милые птицы!

{num:9,text:`Лейтенант резко взял с места, направляясь к кустарнику, однако в рыхлом снегу лыжи скользили плохо, проваливаясь в глубокие колеи, из которых торчали лишь их изогнутые концы. А ветки кустарника цеплялись за маскировочный халат, срывали с головы капюшон. Наверное, четверть часа лейтенант продирался через кустарник, пока наконец не вырвался в поле. Взгляд его был устремлён вперёд, лейтенант не оглядывался, он слышал шорох лыж сзади и мерное привычное дыхание бойцов. Его гнев понемногу стал спадать, самая большая беда миновала, он стал свыкаться с тем, что их осталось восемь. Правда, полностью примириться с этим было нельзя. Но трудный участок они проскочили, и теперь важно было не нарваться в ночи на какие-нибудь тыловые части.

Вскоре на снегу наметился небольшой спуск, лыжи пошли вперёд легче, рукам стало свободнее. В ветреном ночном сумраке слышался сплошной шорох снега под лыжами. Лейтенант ещё увеличил темп. Дорога была дальняя, даже слишком дальняя для одной ночи, и надо было спешить. Тут он ещё помнил маршрут, изученный накануне по карте, и знал, что скоро опять пойдёт пойма всё той же речушки.

Группа быстро двигалась в серых ночных сумерках. Беззвёздное небо сплошным пологом накрыло зимний простор, в котором тускло темнели размытые пятна кустарников, деревьев, бурьяна и ещё чего-то неясного и загадочного. Ракеты на передовой светили далеко сзади. Постепенно лейтенант стал успокаиваться: они прорвались.

{num:10,text:`Родина письма — Древний Восток. Наидревнейшей считается письменность шумеров, которая возникла более пяти тысяч лет назад. Существует гипотеза, что из шумерского письма происходят все остальные письменности, кроме письма майя. Шумерское письмо хорошо изучено, известна его многовековая эволюция от пиктограмм к словесным и затем к словесно-слоговым знакам.

Самые ранние образцы шумерской письменности — это бирки с печатью и пометкой о количестве предметов или животных. Затем появились более сложные учётные таблицы. Выдающимся достижением шумеров было то, что количество они обозначали отдельным знаком. Например, пяти коровам соответствовали пять кружочков и рисунок коровы, а не пять рисунков коровы, как в других письменностях. Постепенно система усложнялась: появились стандартные знаки — иероглифы, с помощью которых легче всего было изображать конкретные предметы. С течением времени значки всё менее походили на рисунки. У шумеров появились стандартные условные знаки, состоявшие из клинообразных чёрточек. По форме клинообразных чёрточек шумерское письмо в настоящее время называют клинописью.

Труднее всего было изображать абстрактные понятия, имена собственные. В этом помогал ребусный принцип, при котором, например, знак стрелы использовали не только для слова «стрела», но и для слова «жизнь». Шумеры постоянно применяли ребусный принцип и закрепили за некоторыми знаками не конкретное значение, а звуковое чтение.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) научный стиль речи`,`2) художественный стиль речи`,`3) тип речи — рассуждение`,`4) задача речи — дать представление о Древнем Востоке как родине письма майя`,`5) задача речи — рассказать о том, как возникла и как развивалась письменность шумеров`],answer:`15`}
,{num:11,text:`Географическая оболочка является крупнейшим природным комплексом Земли. И три внешние оболочки Земли — литосфера, гидросфера, атмосфера — тесно взаимосвязаны. Так, газы атмосферы проникают в воду и в горные породы. Вода просачивается в земную кору, размывает и растворяет горные породы. И далее частицы горных пород попадают в атмосферу, а растворимые вещества — в воду. Всё это происходит при участии солнечного света и тепла. В результате такого взаимодействия верхние слои литосферы, вся гидросфера и нижние слои атмосферы образуют единую систему — географическую оболочку.

Условия в географической оболочке благоприятны для развития жизни. Миллиарды лет назад в географической оболочке появились организмы, которые затем начали в ней развиваться и распространяться. Впоследствии они сами стали важнейшим элементом географической оболочки, изменив и объединив остальные её части.

Именно эти организмы создали «живую» оболочку Земли — биосферу. Согласно учению о биосфере Владимира Ивановича Вернадского, биосфера состоит из живых веществ, то есть из всех живущих на Земле организмов, и неживых веществ, созданных и переработанных этими организмами. Необходимо отметить, что биосфера находится в постоянном движении: её развитие продолжается и в настоящий период существования планеты.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) научный стиль речи`,`2) художественный стиль речи`,`3) тип речи — рассуждение`,`4) задача речи — убедить читателя в том, что в географической оболочке нет условий для зарождения и развития живых организмов`,`5) задача речи — дать представление о географической оболочке Земли и рассказать, как появилась в ней биосфера`],answer:`15`},
{num:12,text:`По заключению Японской медицинской ассоциации, пожилым людям для счастья нужны три условия. Во-первых, быть здоровым. Во-вторых, экономически независимым. В-третьих, сохранять любые увлечения, разделять их с друзьями.

Что касается здоровья, то Япония занимает первое место в мире по продолжительности жизни. И это говорит само за себя. А высокий уровень медицинского обслуживания и преимущества традиционной национальной диеты сделали для японцев уход на пенсию в 65 лет началом «второй жизни».

Вторая задача — обеспечить пожилых людей материально — в Японии тоже решена.

Но ведь, кроме здоровья и экономической независимости, человеку преклонного возраста нужны любимые увлечения. Японский образ жизни благоприятствует и этому. В Стране восходящего солнца у женщин по-прежнему популярны икебана и чайная церемония, у мужчин — каллиграфия и боевые искусства. Не выходят из моды кружки бальных танцев, куда ходят те, кому за 70. Наконец, пожилых людей призывают изучать иностранные языки, так как это способствует улучшению памяти.

Быть общительным, не допускать, чтобы с годами сужался круг интересов, — вот залог оптимистического взгляда на жизнь. А он, в свою очередь, обеспечивает психическое здоровье, что позволяет японцу чувствовать себя счастливым, несмотря на возраст.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — рассуждение`,`4) тип речи — повествование`,`5) задача речи — рассказать, как в Японии решается проблема материального обеспечения пожилых людей`],answer:`13`},
{num:13,text:`Лётчик вышел, тяжело качаясь, из кабины, упал на нагретую солнцем землю и так пролежал без движения несколько часов. Но к концу дня, когда солнце начало клониться к закату, он пошевелился, открыл глаза и прислушался. Ему показалось, что солнечный свет шумит усыпительно и равномерно. Загадочный этот звук заставил его сесть и осмотреться.

Где-то далеко, почти на самом краю земли, прокричал петух, а в кустах затрещала, вертясь, какая-то крошечная птица с красным хохолком. «Земля», — сказал лётчик, и тяжёлый комок подкатил к горлу. Никогда до этих пор он не знал и не думал, что Земля так трогательна и так нежна.

Голова у лётчика кружилась. И он не видел, как девочка лет двенадцати, обыкновенная мечтательная девочка, любившая бродить по склонам горы и представлять себя Золушкой, изгнанной из дому, бежала к нему. Она задыхалась. Она сразу поняла, что произошло, что это лежит разбившийся лётчик. Она плакала и не вытирала слёз, они слетали с её побледневших щёк и брызгали на её руки и светлое платье, но после каждой тяжёлой слезы глаза девочки сияли всё больше и больше. Лётчик, очнувшись, увидел в этих глазах и лазурь, и блеск, и нежность, и страх за его жизнь, и любовь.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — рассуждение`,`4) тип речи — повествование с элементами описания`,`5) задача речи — объяснить причины крушения самолёта`],answer:`24`},
{num:14,text:`Павла Михайловича Третьякова едва ли можно назвать коллекционером в привычном смысле этого слова. Посвятив всю жизнь собиранию картин, отдав этому делу все силы и средства — от начальной покупки картин до возведения здания галереи, — Третьяков поступал не как одиночка-искатель, а как создатель общенародного собрания изобразительных богатств. Всю жизнь он приобретал картины, всё лучшее в русской национальной живописи, а потом подарил Москве.

Первоначально Павел Михайлович покупал картины современников, отдавая предпочтение художникам демократического направления. Подолгу простаивали посетители перед ярко-красочными батальными полотнами художника Верещагина, перед обличительным «Неравным браком» Пукирева или историко-романтической «Княжной Таракановой» Флавицкого.

Затем у Третьякова возникла интересная мысль — показать искусство в движении, в чередовании стилей и направлений. Появился зал с одухотворёнными и возвышенными портретами, которые были написаны старыми мастерами: Левицким, Боровиковским, Рокотовым, а также более близкими по времени к Третьякову художниками — Тропининым, Венециановым, Брюлловым.

Событием художественной и общественной жизни Москвы, да и всей России, стало появление в галерее таких крупных полотен, как «Иван Грозный и сын его Иван» Ильи Репина, «Утро стрелецкой казни», «Боярыня Морозова» Василия Сурикова, «Явление Христа народу» Александра Иванова.

Третьяков всегда поражал безошибочностью вкуса. Это позволило ему собрать великолепную коллекцию картин и создать музей национальной живописи.

{num:15,text:`Все знают, как важно беречь в облике нашей земли, нашей страны всё то, что может тронуть человеческое сердце и оставить о себе благодарную память. Однако, если присмотреться, мы всё-таки плохо бережём то, что непременно надо беречь. Например, частенько на «клочке земли, припавшем к трём берёзам», можно увидеть кучу бетонного мусора, или забытую ржавую сеялку, или «нетленную» кучу полиэтиленовых мешков из-под удобрений. Опушки лесов и полосы лесопосадок в степи опалены химикатами, неаккуратно распылёнными с самолёта. Деревья в лесу испачканы пятнами масляной краски — помечали туристический маршрут.

Или ещё такой пример: зелёный травяной склон горы нередко изрезан громадными буквами какого-нибудь призыва, например: «Берегите лес!». Достигает ли цели этот призыв, когда его вырубают лопатой в зелёном дёрне? После всего этого как-то даже неловко говорить о тонкостях восприятия человеком красоты пейзажа.

Таким образом, согласитесь, забота об облике нашей земли, безусловно, является очень важной задачей. Истоки сыновнего чувства к отчизне лежат там, где мы рождаемся и живём. Наша Родина должна оставаться прекрасной во всех уголках. Это дело нашей совести, нашей культуры, это наш долг.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — рассуждение с элементами описания`,`4) тип речи — повествование`,`5) задача речи — убедить читателей, что забота об облике нашей земли — это дело нашей совести и культуры`],answer:`135`},
{num:16,text:`Бобр — животное из отряда грызунов с ценным мехом. Мех высокий, густой, мягкий, от светло- до тёмно-коричневого, сильно развита подпушка.

Бобр имеет внешнее сходство с водяной крысой. Тело у него обтекаемой формы, небольшая голова с плотно прижатыми маленькими ушами, короткая шея и массивное, постепенно расширяющееся к середине туловище. Оканчивается туловище сильным веслообразным хвостом, плоским и покрытым ороговевшими чешуйками. Хвост служит рулём при плавании и нырянии, а в момент опасности бобр подаёт сигналы членам своей семьи, громко шлёпая хвостом по воде.

Поверх губ торчат большие сильные резцы — одновременно пила и мотыга водного грызуна. С помощью этих резцов он легко подтачивает за две-три минуты молодую осину толщиной в человеческую руку. А благодаря замыкающимся мясистым ноздрям бобр, плотно сжав их, может находиться под водой четверть часа.

Передние и задние конечности бобра различны. Передние ноги маленькие, но сильные. Они напоминают руки, так как бобр обычно ими пользуется при еде. Задние ноги длиннее и снабжены плавательными перепонками. Когти большие, на втором пальце задней конечности коготь раздвоен.

Бобр активен ночью и в сумерках, днём его активность снижается. Живёт бобр возле чистой воды, на лесистом берегу.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) научный стиль речи`,`2) художественный стиль речи`,`3) тип речи — описание`,`4) тип речи — повествование`,`5) задача речи — рассказать о жизни бобров в заповедниках`],answer:`13`},
{num:17,text:`Сколько раз я зачарованно стоял перед главным украшением знаменитого Троицкого собора — иконой прославленного живописца Андрея Рублёва! В иконе воплощены лучшие свойства его таланта: одухотворённость, нравственное благородство и простота. А ещё необыкновенная игра красок... Художник всегда стремился создавать иконы, которые, казалось, излучали свет.

На значительной по размерам доске Андрей Рублёв изобразил ветхозаветную Троицу — явление Аврааму Бога в виде трёх ангелов. За каждым из трёх ангелов изображена его эмблема. За одним — древо, которое по библейскому повествованию означает «древо жизни». За вторым — возвышаются лёгкие, стройные палаты, являющиеся художественным образом радостного и вдохновенного познания. За третьим ангелом находится гора — древний символ всего возвышенного.

Уже при первом взгляде на икону зритель оказывается в плену грациозных, певучих линий её рисунка и нежнейшей красоты сочетающихся цветов. Художник и искусствовед И. Грабарь писал, что «Троица» сверкает «высшим, неземным светом». Свет этот сияет в белых и голубоватых пробелах.

Ещё долго учёные будут изучать историю создания знаменитой иконы. А три задумчивых и грустных ангела в мерцающем свете лампад из века в век будут вести свою безмолвную и таинственную беседу.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — описание`,`4) тип речи — повествование`,`5) задача речи — рассказать о жизни и творчестве гениального живописца Андрея Рублёва`],answer:`13`},
{num:18,text:`Мы пришли в этот мир, чтобы расширить его просторы, наполнить его свежим духом надежды и новых свершений. Забывать эту великую миссию — значит обкрадывать самих себя.

Нельзя растрачивать жизнь, выбрав позицию пассивного наблюдателя. Нужно, чтобы каждое утро нам было ради чего подниматься с постели. Как бы ни было тяжело, нужно научиться мечтать и летать!

«Раз в жизни фортуна стучится в дверь каждого человека, однако очень часто он не слышит её стука», — горько шутил Марк Твен.

Просто так удача и счастье никому не падают с неба. Настоящий успех — это когда предварительная подготовка встречается с благоприятной возможностью.

Таких благоприятных возможностей, вопреки Марку Твену, не так уж и мало.

Беда в том, что редко кто трудится над тем, чтобы встретить госпожу Фортуну во всеоружии.

Желания даются человеку вместе со средствами, необходимыми для достижения желаемого. Не бойтесь трудностей, мечтайте о высоком и великом. Только если мы знаем свою цель и понимаем, каково наше предназначение на этой земле, мы не будем растрачивать силы и время попусту.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — рассуждение`,`4) тип речи — повествование`,`5) задача речи — на примере жизни великих людей показать, как сделать карьеру`],answer:`13`},
{num:19,text:`Два дня и три ночи бесилась непогода, на третий день улеглась. Ветер стих, неожиданно уступив тишине и морозу. Малиновый солнечный шар коснулся края небесной лазури. Он всплывал из-за леса, уменьшаясь и плавясь в слиток золота. И вдруг этот слепящий слиток быстро отделился от горизонта.

Вся лесная стихия приняла невиданно сказочный образ. Безбрежная, непорочно чистая голубая лазурь была тем гуще, чем дальше от солнца. На другом небесном краю ещё умирал сизый сумрак ночи. Месяц, ясно и чётко оттеняемый этим светлым сумраком, бледнел над лесами, когда снега заискрились вокруг. Ели, отягощённые белыми снежными клубами, изменили свои очертания, но безмолвствовали. Кроны старых сосен гордо остались сами собою.

Пар ещё не остывших влажных низин поднялся на уровень древесных вершин и замёрз, рассыпался на свободных от снега ветках берёз. Несчётные россыпи мельчайших бисеринок засверкали на солнце. С последним колыханием исчезающего осеннего тепла всё замёрзло. Мороз начал неспешно гранить, ковать, серебрить всё, что имело хоть самую малую долю влаги.

Лесная речка, ещё вчера бежавшая навстречу метели, начала сдавливаться серебряными зубцами. Прозрачный лёд смело наползал на середину струи, сужая водяной ток прочным панцирем.

И всё вокруг бесшумно сияло, сверкало, искрилось от морозного света.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — описание с элементами повествования`,`4) тип речи — рассуждение`,`5) задача речи — показать красоту морозного утра`],answer:`235`},
{num:20,text:`Все знают, что город растет в ширину. А вот о вертикальных городах сегодня говорят как о явлении пусть не совсем далёкого, но будущего. Высота домов в таком городе может даже превышать две тысячи метров. И проект подобного суперсооружения недавно создан японскими учёными.

Гигантский небоскрёб поделён на четырнадцать секций. Каждая из таких секций — универсальный микрорайон, центр которого представляет собой открытое воздуху и свету пространство, засаженное деревьями, цветами, декоративными кустарниками. Искусственно созданный ландшафт предполагает наличие ручейков, каскадов и разнообразных водоёмов.

Коническая форма здания поможет защититься от грозных сил природы: землетрясений, цунами, смерчей, тайфунов, проливных дождей. А в случае сильной жары, холода, понижения уровня кислорода в атмосфере этажи этого чудо-здания мгновенно самозакрываются.

Планировка квартир в блок-секциях будет свободной, с переносными самоотодвигающимися перегородками. Она, кроме санитарной зоны, создаётся самими жильцами с помощью компьютерных технологий. Помимо жилых блоков, на этажах гипернебоскрёбов будут размещаться производственные и административно-культурные сооружения.

Современные зодчие мечтают о новой Вавилонской башне! И воплощение этой мечты — дело не такого уж далёкого будущего!

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — описание`,`4) тип речи — повествование`,`5) задача речи — рассказать о жителях вертикальных городов`],answer:`13`}
,{num:21,text:`Музыка — вид искусства, в котором художественные образы формируются с помощью звуков и который характеризуется особо активным и непосредственным воздействием на внутренний мир человека.

Звук как основа музыкальной образности и выразительности лишён смысловой конкретности слова, не воспроизводит фиксированных, видимых картин мира; звучащим искусством музыку делает интонация. К средствам выразительности в музыке относятся также следующие компоненты музыкальной формы: мелодия, фактура, полифония, гармония, ритм, композиция и другие.

Музыка обладает ярко выраженными национальными чертами, проявляющимися в её интонационном, мелодическом, ритмическом строе. Особенно характерно это для народного музыкального творчества.

В зависимости от средств, с помощью которых воспроизводится музыка, различают вокальную, инструментальную, вокально-инструментальную музыку. Различают также виды музыки и жанры.

Специфические особенности музыки, её способность выражать тончайшие оттенки чувств и психических состояний, а также воздействовать на глубинный мир человека делают понятной ту роль, которая отводилась ей как средству воспитания. Значительное воздействие на человека оказывает классическая музыка.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) художественный стиль речи`,`2) научный стиль речи`,`3) тип речи — повествование`,`4) тип речи — описание`,`5) задача речи — охарактеризовать музыку как вид искусства`],answer:`245`},
{num:22,text:`Как бы часто ты ни бывал в лесу, всякий раз он удивляет новизной впечатлений. Есть особенная радость для души в светлой свежести берёзовых рощ и в сдержанной силе вековых дубрав, в таинственности густых ельников и в шуме соснового бора. Ветка цветущей ивы, огненно-багряный кленовый лист, коричневая шляпка боровика, пение птиц и даже жужжание шмеля — всё это наполняет лес подлинной поэзией.

А бывали ли вы когда-нибудь в Беловежской пуще? Её неброская, на первый взгляд, красота обладает особой притягательной силой, способной глубоко тронуть душу.

Незабываемое впечатление производят древние вековые ельники и могучие дубравы — память о тех первозданных лесах, которые покрывали в прошлом большую часть Европы. Дикий мир пущи необыкновенно разнообразен: он дремуч и светел, угрюм и радостен, стар и молод. Особенно живописны здесь дубравы, удивительно нарядные осенью.

Здесь никогда не бывает скучно! Ведь каждая тропа, уводящая вглубь, таит радость новых открытий. И, постигая их шаг за шагом, как будто попадаешь в зелёный, полный удивительной жизни храм. Так давайте же беречь Беловежскую пущу — наше национальное достояние!

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — описание с элементами рассуждения`,`4) задача речи — описать разновидности лесов, встречающихся на территории нашей республики`,`5) задача речи — описать красоту белорусских лесов, в частности Беловежской пущи, и призвать беречь это национальное достояние`],answer:`135`},
{num:23,text:`Никита проснулся с предчувствием счастья, потому что должен был наконец прийти обоз с обещанным дедом Никифором подарком. Мальчик поскорее оделся и вышел во двор.

Утро было ясное и морозное. Над всей деревней стояли столбы синего дыма. За ночь на деревьях ещё гуще лёг иней, а огромные тополя над прудом совсем опустили заснеженные ветви.

Вскоре Никита увидел, что на дороге, правее деревни, появились возы. Один за другим они выползли из овражка и поплелись по дороге вдоль пруда к плотине. Всего в обозе было шестнадцать саней. Лошади шли бодро, хлопали кнуты, пар стоял над обозом.

Первым въехал на двор во главе обоза Никифор, коренастый старик в валенках, обмотанных верёвками. Он обернулся и крикнул тем, кто был позади: «Эй, заворачивай к амбарам, а последний воз к дому».

Когда этот воз приблизился, Никита не сразу понял, что на нём лежит. Это было что-то большое, странной формы, зелёное, с длинной красной полосой. У мальчика забилось сердце. На санях лежала, скрипя и покачиваясь, двухвёсельная крутоносая лодка. Сбоку лодки из саней торчали два зелёных весла и мачта с медной маковкой на конце.

Так вот какой был подарок, обещанный дедом Никифором!

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — повествование с элементами описания`,`4) задача речи — рассказать о том, как начался счастливый для Никиты день; передать чувства мальчика, который долго ждал обещанного подарка и наконец получил его`,`5) задача речи — рассказать о жизни Никиты в деревне`],answer:`234`},
{num:24,text:`Смог бы мир существовать без птиц? Если бы и смог, то это был бы мир с безмолвными погибающими лесами и ничтожными урожаями. Расплодились бы в огромном количестве клещи, грызуны, убытки от которых исчислялись бы миллионами рублей. Без птиц ничего не осталось бы от наших урожаев. Ведь птицы прожорливы и съедают невероятное количество жуков, пауков, гусениц, мышей. Большая синица, например, уничтожает за день до шести тысяч насекомых, а пара канюков истребляет за лето до тысячи грызунов. Как же благодарен должен быть человек своим пернатым друзьям! Как же бережно должен он относиться к ним!

У нас ещё есть возможность сохранить удивительный мир природы, однако одним орнитологам не под силу такое, не обойтись им без помощи множества любителей натуралистов. Эта помощь заключается не только в нетерпимом отношении к тем, кто губит пернатых, но и в заботе о лесе, о зелёном убранстве городов и сёл, в подкормке птиц, устройстве гнездовий.

Каждый человек должен осознавать свою гражданскую ответственность за судьбу Земли. Пока этого не будет, экологические проблемы не могут быть успешно решены.

{num:25,text:`Приближалась буря. Мы спустили парус в одно мгновение. Несколько ударов весла — и лодка укрылась за гигантской базальтовой стеной, попав в относительно спокойный водоём. В самой середине нашего укрытия поднимался из воды большой плоский камень. Поверхность этого камня была покрыта бурыми водорослями и раковинами. Вокруг нас высились гигантские утёсы, круто, а местами отвесно обрывающиеся в море.

Волны с грохотом таранили стену, но она стойко выдерживала натиск моря. Ветром перебрасывало через неё брызги. Волны пенились, дробились и, ослабленные, с урчанием уходили за базальтовую стенку.

Выкачав из лодки воду, мы перебрали всё наше имущество и уложили его получше, прикрыв сверху брезентом и обвязав покрепче верёвками. Затем мы оделись потеплее и сели на свои места в лодке, надеясь, что ветер стихнет и море хоть немного успокоится.

Но, вопреки нашим ожиданиям, сильная волна подхватила лодку, как пёрышко, и на гребне вынесла в открытое море. Ветер хлестнул по лицу холодной изморосью. Лодка сильно накренилась: прошла вторая большая волна, потом третья. Словно раненая птица, увлекаемая сильным ветром, помчалась наша лодка вдоль берега. Ничего не было видно: ни где кончается вода, ни где начинается небо.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) художественный стиль речи`,`2) научный стиль речи`,`3) тип речи — повествование с элементами описания`,`4) задача речи — рассказать о случае, произошедшем в море во время бури`,`5) задача речи — рассказать о том, как следует готовиться к морскому путешествию`],answer:`134`},
{num:26,text:`Всё хорошо было в этой деревне. Всюду было свежо и чисто, словно каждое утро ходил кто-то с новой метлой и подметал тропинки вдоль домов, прошлогоднюю траву, которая плотным войлоком затянула всю улицу.

Дома в деревне стояли в один ряд, окнами на восход, а между домами росли большие ивы. Кора этих ив была настолько стара и так глубоки были морщины, избороздившие её, что, наверное, рыжим муравьям, живущим в корнях под ивами, казалось, что они ползут по горным ущельям. По другую сторону улицы весело пестрели, как ситцевые рубашки, поленницы берёзовых дров, сараи да курятники.

Домов стояло всего шестнадцать. Четыре были заколочены и черны, но один ослепительно сверкал соломенной свежестью брёвен. Плотно и добротно сбитый, стоял он на не просохшем ещё кирпичном фундаменте. И золотая чешуя деревянной крыши, и лакированная чернота не занавешенных пока окон — всё говорило о том, что в дом этот скоро приедут новосёлы. В этом прохладном и светлом доме хотелось и жить по-новому. А внизу, под деревней, широко разлилась коричневая от весеннего паводка река.

Всё было по-весеннему прекрасным в этой тихой северной деревеньке. Каждый день светило солнце, но просыхающая земля хранила ещё в глубинах холод.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) научный стиль речи`,`2) художественный стиль речи`,`3) тип речи — описание`,`4) задача речи — привлечь внимание общественности к проблеме возрождения русской деревни`,`5) задача речи — создать художественный образ северной деревеньки`],answer:`235`},
{num:27,text:`Шиншиллы — это грызуны семейства шиншилловых. Длина тела варьируется от 22 до 38 сантиметров. Масса взрослой особи составляет от 0,5 до 1 килограмма. Для грызунов семейства шиншилловых характерны крупные уши и узкие удлинённые стопы. Передние и задние конечности четырёхпалые, однако пальцы задних конечностей значительно укорочены. Скелет тонкокостный, малая берцовая кость небольшая и не сращена с большой берцовой.

Волосяной покров густой, мягкий. Окрас спинной стороны тела голубовато-серый, брюшная же поверхность желтовато-белая. Хвост покрыт жёсткими волосами. Усы, или вибриссы, многочисленные, длинные, белого либо чёрного цвета.

Череп с ярко выраженным межглазничным сужением. Резцовые отверстия длинные, нижняя челюсть имеет узкие угловые отростки, резко направленные вверх.

У грызунов данного вида в ДНК-наборе шестьдесят четыре хромосомы, которые обеспечивают определённую жизнестойкость популяции.

Представители шиншилловых ведут активный ночной образ жизни и, как правило, моногамны.

Из-за ценного меха шиншиллы в двадцатом веке были практически уничтожены. Однако в настоящее время они охраняются государством и их численность постепенно возрастает.
