{id:"В5",title:"В5. Фонетика. Озвончение/оглушение, непроизносимые согласные",rule:`
            <div class="info-block"><i class="fas fa-volume-up"></i> <b>Фонетика</b> — раздел языкознания, изучающий звуки речи.</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Фонетические процессы</b></div>
            <table class="table"><tr><th>Процесс</th><th>Условие</th><th>Примеры</th></tr>
                <tr><td><b>Оглушение</b> (звонкий → глухой)</td>
                <td>в конце слова, перед глухим согласным</td>
                <td>ду[п] (дуб), ска[с]ка (сказка), ло[ш]ка (ложка), про[п]ка (пробка), ле[ф] (лев), горо[т] (город), моро[с] (мороз)</td>
            </tr>
                <tr><td><b>Озвончение</b> (глухой → звонкий)</td>
                <td>перед звонким согласным</td>
                <td>про[з']ба (просьба), [з]делать (сделать), во[г]зал (вокзал), моло[д']ба (молотьба), а[д]жио (аджио), фу[д]бол (футбол)</td>
            </tr>
                <tr><td><b>Смягчение</b> (твёрдый → мягкий)</td>
                <td>перед мягкими согласными (часто)</td>
                <td>сте[п']ня (степня), гво[з']ди (гвозди), е[с']ли (если), ку[з']нец (кузнец), в[з']ять (взять)</td>
            </tr>
                <tr><td><b>Упрощение групп согласных</b></td>
                <td>непроизносимые согласные</td>
                <td>со[н]це (солнце), чес[н]ый (честный), поз[н]о (поздно), чу[ств]о (чувство), здра[ств]уй (здравствуй)</td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Непроизносимые согласные (полная таблица из учебника)</b></div>
            <table class="table"><tr><th>Сочетание</th><th>Не произносится</th><th>Примеры</th><th>Проверочные слова</th></tr>
                <tr><td>стн</td><td>[сн]</td><td>чес[н]ый, мес[н]ость, радос[н]ый, влас[н]ый, завис[н]ый, корыс[н]ый, ярос[н]ый, горес[н]ый, ревнос[н]ый</td><td>честь, место, радость, власть, зависть, корысть, ярость, горесть, ревность</td>
            </tr>
                <tr><td>здн</td><td>[зн]</td><td>поз[н]о, звёз[н]ый, празд[н]ый, безд[н]а, безобраз[н]ый, гроз[н]ый</td><td>опоздать, звезда, праздник, бездна, образ, гроза</td>
            </tr>
                <tr><td>лнц</td><td>[нц]</td><td>со[н]це</td><td>солнечный</td>
            </tr>
                <tr><td>вств</td><td>[ств]</td><td>чу[ств]о, здра[ств]уй, безмол[ств]овать, уча[ств]овать, че[ств]овать, ше[ств]овать, я[ств]а</td><td>— (запомнить)</td>
            </tr>
                <tr><td>нтск, ндск</td><td>[нск]</td><td>гига[нск]ий, голла[нск]ий, шотла[нск]ий</td><td>гигант, Голландия, Шотландия</td>
            </tr>
                <tr><td>рдц</td><td>[рц]</td><td>се[рц]е</td><td>сердечный</td>
            </tr>
                <tr><td>стл</td><td>[сл]</td><td>счас[л]ивый, завис[л]ивый, жало[с]ливый, совес[л]ивый</td><td>счастье, зависть, жалость, совесть</td>
            </tr>
                <tr><td>стск</td><td>[сск]</td><td>раси[сск]ий, тури[сск]ий, журнали[сск]ий</td><td>расист, турист, журналист</td>
            </tr>
            <tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Запомните написание!</b> <span class="ex-word">блеснуть, плеснуть, ровесник, сверстник, чувство, участвовать, шествовать, лестница (НО: лесница — от лес), склянка (стекло), интриганство, голландский</span></div>
            <div class="info-block"><i class="fas fa-chart-simple"></i> <b>Количество букв и звуков</b><br>
            • Е, Ё, Ю, Я дают 2 звука: в начале слова (<span class="ex-word">ёлка [й'олка]</span>), после гласной (<span class="ex-word">моя [май'а]</span>), после Ъ, Ь (<span class="ex-word">подъезд [падй'эст], вьюга [в'й'уга]</span>)<br>
            • Ь и Ъ звука не обозначают<br>
            • Двойные согласные: <span class="ex-word">класс — 5 б., 4 зв. (один звук долгий), ванна — 5 б., 4 зв.</span><br>
            • Непроизносимые согласные: <span class="ex-word">солнце — 6 б., 5 зв.</span></div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Гласные звуки и буквы</b><br>
            Гласных звуков 6: <span class="ex-word">[а], [о], [у], [ы], [и], [э]</span><br>
            Гласных букв 10: <span class="ex-word">а, о, у, ы, и, э, е, ё, ю, я</span><br>
            Буквы е, ё, ю, я — йотированные, могут обозначать один звук (после согласного: <span class="ex-word">лес [л'эс]</span>) или два (в указанных выше позициях).</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Согласные звуки</b><br>
            <b>Звонкие:</b> <span class="ex-word">б, в, г, д, ж, з, й, л, м, н, р</span><br>
            <b>Глухие:</b> <span class="ex-word">к, п, с, т, ф, х, ц, ч, ш, щ</span><br>
            <b>Всегда твёрдые:</b> <span class="ex-word">ж, ш, ц</span><br>
            <b>Всегда мягкие:</b> <span class="ex-word">й, ч, щ</span></div>`},

// В6
{id:"В6",title:"В6. Морфемика и словообразование",rule:`
            <div class="info-block"><i class="fas fa-puzzle-piece"></i> <b>Морфема</b> — наименьшая значимая часть слова.</div>
            <table class="table"><tr><th>Морфема</th><th>Значение</th><th>Примеры</th></tr>
                <tr><td><b>Приставка</b> (префикс)</td>
                <td>служит для образования новых слов, стоит перед корнем</td>
                <td><span class="ex-word">при-школьный, пере-писать, вы-бежать, за-ходить</span></td>
            </tr>
                <tr><td><b>Корень</b></td>
                <td>общее значение родственных слов, главная морфема</td>
                <td><span class="ex-word">вод-а, вод-ный, под-вод-ник, вод-яной, наводнение</span></td>
            </tr>
                <tr><td><b>Суффикс</b></td>
                <td>образует новые слова и формы, стоит после корня</td>
                <td><span class="ex-word">уч-и-тель, красн-оват-ый, бел-изн-а, ход-б-а</span></td>
            </tr>
                <tr><td><b>Окончание</b> (флексия)</td>
                <td>связь слов в предложении, образует формы слова, изменяемая часть</td>
                <td><span class="ex-word">стол-□, стол-а, стол-у, стол-ом, о стол-е</span></td>
            </tr>
                <tr><td><b>Постфикс</b></td>
                <td>стоит после окончания, образует новые слова или формы</td>
                <td><span class="ex-word">учить-ся, какой-то, возьми-те, пойдём-те</span></td>
            </tr>
                <tr><td><b>Соединительная морфема (интерфикс)</b></td>
                <td>связывает корни в сложных словах</td>
                <td><span class="ex-word">пар-о-ход, земл-е-мер, тепл-о-ход, сам-о-лёт</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-code-branch"></i> <b>Способы словообразования (полная таблица из учебника)</b></div>
            <table class="table"><tr><th>Способ</th><th>Описание</th><th>Пример</th></tr>
                <tr><td><b>Приставочный</b></td>
                <td>присоединение приставки к производящему слову</td>
                <td><span class="ex-word">написать → переписать, ехать → приехать, делать → сделать</span></td>
            </tr>
                <tr><td><b>Суффиксальный</b></td>
                <td>присоединение суффикса к производящему слову</td>
                <td><span class="ex-word">учитель → учительница, красный → красноватый, бежать → бегун</span></td>
            </tr>
                <tr><td><b>Приставочно-суффиксальный</b></td>
                <td>одновременное присоединение приставки и суффикса</td>
                <td><span class="ex-word">стол → настольный, берег → прибрежный, окно → подоконник</span></td>
            </tr>
                <tr><td><b>Бессуффиксный (нулевая суффиксация)</b></td>
                <td>образование слова без суффикса (чаще от глаголов)</td>
                <td><span class="ex-word">выходить → выход, заходить → заход, синий → синь, тихий → тишь</span></td>
            </tr>
                <tr><td><b>Постфиксальный</b></td>
                <td>присоединение постфикса -ся, -то, -либо, -нибудь</td>
                <td><span class="ex-word">учить → учиться, мыть → мыться, какой → какой-то, где → где-нибудь</span></td>
            </tr>
                <tr><td><b>Сложение</b></td>
                <td>сложение двух или более корней/основ</td>
                <td><span class="ex-word">лес + степь → лесостепь, пар + ход → пароход, сам + летать → самолёт</span></td>
            </tr>
                <tr><td><b>Сложение сокращённых основ (аббревиация)</b></td>
                <td>образование сложносокращённых слов</td>
                <td><span class="ex-word">СНГ, вуз, МГУ, зарплата, стенгазета, колхоз, совхоз</span></td>
            </tr>
                <tr><td><b>Переход из одной части речи в другую</b></td>
                <td>изменение грамматических признаков слова</td>
                <td><span class="ex-word">столовая (сущ. из прил.), дежурный (сущ. из прил.), мороженое (сущ. из прич.)</span></td>
            </tr>
                <tr><td><b>Слияние</b></td>
                <td>сращение сочетания слов в одно слово</td>
                <td><span class="ex-word">вечнозелёный (вечно зелёный), вышеуказанный, малоизвестный, труднодоступный</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Нулевое окончание</b> — в словах: <span class="ex-word">дом□, стол□, лес□, друг□, день□, ночь□</span><br>
            <b>Нулевой суффикс</b>: <span class="ex-word">выход (от выходить), синь (от синий), бег (от бегать)</span><br>
            <b>Морфемный разбор (пример):</b> <span class="ex-word">без-успеш-н-ый</span> (приставка без-, корень успеш-, суффикс -н-, окончание -ый)<br>
            <b>Словообразовательная цепочка:</b> <span class="ex-word">лужочек → лужок → луг</span>; <span class="ex-word">подснежник → снег</span> (приставочно-суффиксальный)</div>`},

// В7
{id:"В7",title:"В7. Морфология. Части речи",rule:`
            <div class="info-block"><i class="fas fa-tag"></i> <b>Самостоятельные части речи (отвечают на вопросы, являются членами предложения)</b></div>
            <table class="table"><tr><th>Часть речи</th><th>Вопрос</th><th>Значение</th><th>Примеры</th></tr>
                <tr><td><b>Имя существительное</b></td>
                <td>кто? что?</td>
                <td>предмет</td>
                <td><span class="ex-word">дом, радость, учитель, детвора, красота, счастье</span></td>
            </tr>
                <tr><td><b>Имя прилагательное</b></td>
                <td>какой? чей? который?</td>
                <td>признак предмета</td>
                <td><span class="ex-word">красный, добрый, папин, стеклянный, интересный, прекрасный</span></td>
            </tr>
                <tr><td><b>Имя числительное</b></td>
                <td>сколько? который?</td>
                <td>количество, порядок при счёте</td>
                <td><span class="ex-word">пять, пятый, двое, две пятых, сто, миллион</span></td>
            </tr>
                <tr><td><b>Местоимение</b></td>
                <td>кто? что? какой? чей? сколько?</td>
                <td>указывает на предмет, признак, количество</td>
                <td><span class="ex-word">я, ты, он, свой, этот, кто-то, ничей, такой</span></td>
            </tr>
                <tr><td><b>Глагол</b></td>
                <td>что делать? что сделать?</td>
                <td>действие, состояние</td>
                <td><span class="ex-word">читать, написать, учиться, любить, спать, думать</span></td>
            </tr>
                <tr><td><b>Наречие</b></td>
                <td>как? где? когда? куда? откуда? почему? зачем?</td>
                <td>признак действия, признака, предмета</td>
                <td><span class="ex-word">быстро, вчера, там, по-русски, очень, слишком</span></td>
            </tr>
                <tr><td><b>Причастие</b> (особая форма глагола)</td>
                <td>какой? (действие)</td>
                <td>признак предмета по действию</td>
                <td><span class="ex-word">читающий, прочитанный, строящийся, решённый</span></td>
            </tr>
                <tr><td><b>Деепричастие</b> (особая форма глагола)</td>
                <td>что делая? что сделав?</td>
                <td>добавочное действие</td>
                <td><span class="ex-word">читая, прочитав, играя, увидев, смеясь</span></td>
            </tr>
                <tr><td><b>Категория состояния</b> (предикативные наречия)</td>
                <td>каково? (безличное предложение)</td>
                <td>состояние природы, человека, оценку</td>
                <td><span class="ex-word">холодно, грустно, можно, нельзя, жаль, пора, душно</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-link"></i> <b>Служебные части речи (не отвечают на вопросы, не являются членами предложения)</b><br>
            • <b>Предлог</b>: <span class="ex-word">в, на, из, через, до, за, перед, под, над, при, без, для, о, об, около, вокруг, в течение, вследствие, несмотря на</span><br>
            • <b>Союз</b>: <span class="ex-word">и, а, но, да, или, либо, чтобы, потому что, так как, если, когда, хотя, однако, зато</span><br>
            • <b>Частица</b>: <span class="ex-word">бы, же, ли, не, ни, неужели, разве, только, лишь, даже, ведь, вот, вон</span></div>
            <div class="example"><i class="fas fa-smile"></i> <b>Междометия</b> — выражают чувства, побуждения, но не называют их: <span class="ex-word">ах! ох! ура! ба! ой! эй! браво! караул! марш! прочь!</span><br>
            <b>Звукоподражательные слова:</b> <span class="ex-word">мяу, гав-гав, ку-ка-ре-ку, тик-так, кап-кап, чик-чирик, хруст, шлёп, бух</span></div>`},

// В8
{id:"В8",title:"В8. Морфология. Глагол и его формы",rule:`
            <div class="info-block"><i class="fas fa-running"></i> <b>Морфологические признаки глагола</b></div>
            <table class="table"><tr><th>Признак</th><th>Значение</th><th>Примеры</th></tr>
                <tr><td><b>Вид</b></td>
                <td>совершенный (что сделать?) / несовершенный (что делать?)</td>
                <td><span class="ex-word">решить — решать, прочитать — читать, прийти — приходить</span></td>
            </tr>
                <tr><td><b>Переходность</b></td>
                <td>переходный (есть прямое дополнение) / непереходный</td>
                <td><span class="ex-word">читать (книгу), любить (маму) — спать, идти, стоять</span></td>
            </tr>
                <tr><td><b>Возвратность</b></td>
                <td>возвратный (с -ся, -сь) / невозвратный</td>
                <td><span class="ex-word">мыться — мыть, одеваться — одевать, радоваться — радовать</span></td>
            </tr>
                <tr><td><b>Наклонение</b></td>
                <td>изъявительное, условное (сослагательное), повелительное</td>
                <td><span class="ex-word">пишу, писал бы, напиши; читаю, читал бы, читай</span></td>
            </tr>
                <tr><td><b>Время</b></td>
                <td>настоящее, прошедшее, будущее (простое и сложное)</td>
                <td><span class="ex-word">читаю, читал, прочитаю (буд. прост.), буду читать (буд. слож.)</span></td>
            </tr>
                <tr><td><b>Лицо</b></td>
                <td>1-е (я, мы), 2-е (ты, вы), 3-е (он, она, оно, они) — в наст. и буд. вр.</td>
                <td><span class="ex-word">читаю, читаешь, читает; читаем, читаете, читают</span></td>
            </tr>
                <tr><td><b>Число</b></td>
                <td>единственное, множественное</td>
                <td><span class="ex-word">читает — читают, писал — писали</span></td>
            </tr>
                <tr><td><b>Род</b></td>
                <td>мужской, женский, средний — только в прош. вр. ед. ч.</td>
                <td><span class="ex-word">читал, читала, читало; писал, писала, писало</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-crown"></i> <b>Формы глагола</b><br>
            • <b>Инфинитив</b> (неопределённая форма): <span class="ex-word">читать, решить, беречь, идти, нести</span> (отвечает на вопросы что делать? что сделать?, имеет вид, переходность, возвратность)<br>
            • <b>Причастие</b>: <span class="ex-word">читающий (действ. наст.), прочитанный (страд. прош.), строящийся (возвр.)</span><br>
            • <b>Деепричастие</b>: <span class="ex-word">читая (несов.), прочитав (сов.), улыбаясь (возвр.)</span></div>
            <div class="example"><i class="fas fa-star"></i> <b>Синтаксическая функция инфинитива (может быть любым членом предложения)</b><br>
            • <b>Подлежащее:</b> <span class="ex-word">Учить — мой долг. Жить — родине служить.</span><br>
            • <b>Сказуемое:</b> <span class="ex-word">Я хочу учиться. Наша цель — победить.</span><br>
            • <b>Дополнение:</b> <span class="ex-word">Мама велела учиться. Я прошу тебя помочь.</span><br>
            • <b>Определение:</b> <span class="ex-word">Желание учиться захватило меня. Способность чувствовать — дар природы.</span><br>
            • <b>Обстоятельство:</b> <span class="ex-word">Я пришёл учиться. Мы вышли погулять.</span></div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Спряжение глаголов (повторение)</b><br>
            <b>I спряжение:</b> <span class="ex-word">-у/-ю, -ешь, -ет, -ем, -ете, -ут/-ют</span><br>
            <b>II спряжение:</b> <span class="ex-word">-у/-ю, -ишь, -ит, -им, -ите, -ат/-ят</span><br>
            <b>Глаголы-исключения II спряжения:</b> <span class="ex-word">гнать, держать, дышать, слышать; видеть, смотреть, ненавидеть, обидеть, вертеть, терпеть, зависеть</span><br>
            <b>Разноспрягаемые:</b> <span class="ex-word">хотеть, бежать</span><br>
            <b>Архаическое спряжение:</b> <span class="ex-word">есть, дать</span></div>`},

// В9
{id:"В9",title:"В9. Словосочетание. Виды подчинительной связи",rule:`
            <div class="info-block"><i class="fas fa-handshake"></i> <b>Словосочетание</b> — два и более слова, связанных по смыслу и грамматически. Имеет главное и зависимое слово.</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Виды подчинительной связи в словосочетании</b></div>
            <table class="table"><tr><th>Вид связи</th><th>Описание</th><th>Зависимое слово</th><th>Примеры</th><tr>
                <td><b>Согласование</b></td>
                <td>зависимое слово уподобляется главному в роде, числе, падеже</td>
                <td>прилагательное, местоимение, причастие, порядковое числительное</td>
                <td><span class="ex-word">новая книга, мой друг, первый снег, читающий ученик, этот дом</span></td>
            </tr>
                <tr><td><b>Управление</b></td>
                <td>зависимое слово ставится в определённом падеже (с предлогом или без)</td>
                <td>существительное, местоимение</td>
                <td><span class="ex-word">читать книгу (В.п.), гордиться другом (Т.п.), думать о маме (П.п.), пойти в школу (В.п.)</span></td>
            </tr>
                <tr><td><b>Примыкание</b></td>
                <td>зависимое слово — неизменяемая часть речи, связь только по смыслу</td>
                <td>наречие, инфинитив, деепричастие, сравнительная степень прилагательного</td>
                <td><span class="ex-word">быстро бежать, желание учиться, говорил улыбаясь, сделать красивее</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Важно! Не являются словосочетаниями:</b><br>
            • грамматическая основа предложения: <span class="ex-word">солнце светит, дети играют</span><br>
            • однородные члены: <span class="ex-word">солнце и луна, красивый и умный</span><br>
            • сочетание предлога с существительным (нет главного слова): <span class="ex-word">около дома, у реки, без друга</span><br>
            • формы слова (аналитическая форма): <span class="ex-word">буду читать, самый умный, пусть придёт</span><br>
            • фразеологизмы (устойчивые сочетания): <span class="ex-word">бить баклуши, спустя рукава</span></div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Типы словосочетаний по главному слову</b><br>
            • <b>Именные</b> (главное слово — сущ., прил., числ., местоим.): <span class="ex-word">новый дом, очень красивый, два стола, кто-то из нас</span><br>
            • <b>Глагольные</b> (главное слово — глагол, причастие, деепричастие): <span class="ex-word">читать книгу, прочитанный мной, улыбаясь прохожим</span><br>
            • <b>Наречные</b> (главное слово — наречие): <span class="ex-word">очень быстро, слишком громко, далеко от дома</span></div>`},

// В10
{id:"В10",title:"В10. Грамматическая основа предложения",rule:`
            <div class="info-block"><i class="fas fa-chess-queen"></i> <b>Грамматическая основа (предикативная основа)</b> — главные члены предложения: подлежащее и сказуемое (в двусоставных) или один главный член (в односоставных).</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Подлежащее</b> — отвечает на вопросы <b>кто? что?</b>, обозначает предмет речи.</div>
            <table class="table"><tr><th>Способ выражения подлежащего</th><th>Примеры</th></tr>
                <tr><td>существительное (И.п.)</td><td><span class="ex-word">Солнце светит. Мальчик играет. Дождь прошёл.</span></td>
            </tr>
                <tr><td>местоимение (И.п.)</td><td><span class="ex-word">Я пришёл. Он ушёл. Мы победили. Кто стучится?</span></td>
            </tr>
                <tr><td>числительное (И.п.)</td><td><span class="ex-word">Двадцать делится на пять. Семеро одного не ждут.</span></td>
            </tr>
                <tr><td>инфинитив</td><td><span class="ex-word">Учить — полезно. Жить — значит бороться.</span></td>
            </tr>
                <tr><td>прилагательное (И.п.)</td><td><span class="ex-word">Больной быстро поправился. Богатые тоже плачут.</span></td>
            </tr>
                <tr><td>причастие (И.п.)</td><td><span class="ex-word">Встречающие вышли на перрон. Отдыхающие загорали.</span></td>
            </tr>
                <tr><td>цельное словосочетание</td><td><span class="ex-word">Несколько человек вышли. Мы с тобой пойдём. Два друга встретились. Многие из нас согласились.</span></td>
            </tr>
                <tr><td>синтаксически неделимое сочетание</td><td><span class="ex-word">Мальчик с девочкой играли. Бабушка с внуком гуляли.</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-gavel"></i> <b>Сказуемое</b> — обозначает действие или признак подлежащего.</div>
            <table class="table"><tr><th>Тип сказуемого</th><th>Описание</th><th>Примеры</th></tr>
                <tr><td><b>Простое глагольное (ПГС)</b></td>
                <td>глагол в форме любого наклонения, времени, лица</td>

            </tr>
                <tr><td><b>Составное глагольное (СГС)</b></td>
                <td>вспомогательный глагол (можно, начать, продолжить, хотеть, мочь) + инфинитив</td>
                <td><span class="ex-word">Он начал читать. Я хочу учиться. Мы можем помочь. Он продолжил работать.</span></td>
            </tr>
                <tr><td><b>Составное именное (СИС)</b></td>
                <td>глагол-связка (быть, стать, являться, казаться, называться) + именная часть</td>
                <td><span class="ex-word">Он был учителем. День был тёплый. Она стала врачом. Это казалось странным.</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Примеры СИС:</b> <span class="ex-word">Он инженер. День жаркий. Ночь тихая. Зима холодная. Она умна. Погода отличная.</span> (связка <b>есть</b> в настоящем времени опущена, ставится тире или нет — см. А9)</div>`},

// В11
{id:"В11",title:"В11. Односоставные и двусоставные предложения",rule:`
            <div class="info-block"><i class="fas fa-balance-scale"></i> <b>Двусоставные предложения</b> — имеют и подлежащее, и сказуемое: <span class="ex-word">Солнце светит. Дети играют. Наступила зима. Я люблю читать.</span></div>
            <div class="info-block"><i class="fas fa-crown"></i> <b>Односоставные предложения</b> — имеют один главный член (подлежащее или сказуемое).</div>
            <table class="table"><tr><th>Тип односоставного</th><th>Главный член</th><th>Форма главного члена</th><th>Примеры</th></tr>
                <tr><td><b>Определённо-личные</b></td>
                <td>сказуемое</td>
                <td>глагол 1-го или 2-го лица наст./буд. вр., повелит. накл.</td>
                <td><span class="ex-word">Люблю грозу в начале мая. Идёшь со мной? Принесите воды. Пойдём в кино.</span></td>
            </tr>
                <tr><td><b>Неопределённо-личные</b></td>
                <td>сказуемое</td>
                <td>глагол 3-го лица мн.ч. наст./буд. вр., прош.вр. мн.ч.</td>
                <td><span class="ex-word">В дверь стучат. Построили школу. Ему сказали правду. В газетах пишут.</span></td>
            </tr>
                <tr><td><b>Безличные</b></td>
                <td>сказуемое</td>
                <td>безличный глагол, слово категории состояния, инфинитив</td>
                <td><span class="ex-word">Мне холодно. Светает. Вечереет. Смеркается. Не спится. Мне грустно. Надо работать.</span></td>
            </tr>
                <tr><td><b>Назывные (номинативные)</b></td>
                <td>подлежащее</td>
                <td>существительное в И.п., количественно-именное сочетание</td>
                <td><span class="ex-word">Зима. Мороз и солнце. Тишина. День чудесный. Два часа ночи. Вот и лес.</span></td>
            </tr>
                <tr><td><b>Обобщённо-личные</b></td>
                <td>сказуемое</td>
                <td>глагол 2-го лица ед.ч. (чаще) или 3-го лица мн.ч.</td>
                <td><span class="ex-word">Цыплят по осени считают. Что посеешь, то и пожнёшь. Слезами горю не поможешь.</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Безличные глаголы (полный список для ЦТ):</b> <span class="ex-word">знобит, тошнит, лихорадит, морозит, холодает, теплеет, светает, смеркается, вечереет, везёт, не везёт, нездоровится, не спится, не работается, не пишется, не сидится, не лежится</span><br>
            <b>Отличие безличных предложений от двусоставных:</b> в безличных нет и не может быть подлежащего. <span class="ex-word">Мне холодно</span> (нет того, кому холодно, — состояние) — <span class="ex-word">Я замёрз</span> (двусоставное, есть подлежащее).</div>`},

// В12
{id:"В12",title:"В12. Однородные члены предложения",rule:`
            <div class="info-block"><i class="fas fa-check-circle"></i> <b>Однородные члены</b> — отвечают на один вопрос, относятся к одному слову, являются одним членом предложения, произносятся с интонацией перечисления.</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Запятая между однородными членами ставится</b></div>
            <table class="table"><tr><th>Случай</th><th>Примеры</th></tr>
                <tr><td>между однородными членами без союзов</td>
                <td><span class="ex-word">В лесу росли сосны, ели, берёзы, осины. Он был умён, красив, добр, талантлив.</span></td>
            </tr>
                <tr><td>перед противительными союзами <b>а, но, да (=но), однако, зато</b></td>
                <td><span class="ex-word">Он мал, да удал. Торопился, но опоздал. Не перо, а ум красит человека. Мал золотник, да дорог.</span></td>
            </tr>
                <tr><td>перед повторяющимися союзами <b>и…и, ни…ни, то…то, или…или, либо…либо, не то…не то</b></td>
                <td><span class="ex-word">И снег, и ветер, и мороз. Ни рыба ни мясо. То дождь, то град. Не то смех, не то слёзы.</span></td>
            </tr>
                <tr><td>перед второй частью двойного союза <b>не только…но и, как…так и, если не…то, хотя и…но</b></td>
                <td><span class="ex-word">Он не только умён, но и красив. Как старые, так и молодые любят природу. Хотя и больно, но терпимо.</span></td>
            </tr>
            </tr>
            <div class="info-block"><i class="fas fa-ban"></i> <b>Запятая между однородными членами не ставится</b></div>
            <table class="table"><tr><th>Случай</th><th>Примеры</th></tr>
                <tr><td>между однородными членами с одиночным союзом <b>и, да (=и), или, либо</b></td>
                <td><span class="ex-word">Птицы пели и щебетали. Возьму книгу или журнал. Пойду да посмотрю.</span></td>
            </tr>
                <tr><td>внутри фразеологизмов с повторяющимися союзами</td>
                <td><span class="ex-word">ни свет ни заря, и смех и грех, и так и сяк, ни рыба ни мясо, ни жив ни мёртв, ни взад ни вперёд</span></td>
            </tr>
                <tr><td>между двумя глаголами, обозначающими единое действие (движение)</td>
                <td><span class="ex-word">Пойду посмотрю. Сяду отдохну. Жду не дождусь. Пойду принесу.</span></td>
            <tr>
                <td>в цельных выражениях с повторяющимися союзами</td>
                <td><span class="ex-word">и день и ночь, и стар и млад, и смех и горе, и там и тут</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-link"></i> <b>Однородные и неоднородные определения</b><br>
            <b>Однородные</b> (запятая ставится): характеризуют предмет с одной стороны, перечисляют признаки, можно вставить <b>и</b>: <span class="ex-word">жёлтые, красные, синие огни; сильный, буйный, оглушительный ливень</span><br>
            <b>Неоднородные</b> (запятая не ставится): характеризуют предмет с разных сторон (качество+материал, размер+цвет и т.п.): <span class="ex-word">белые круглые облака, старая кожаная сумка, большой красный шар, зимний холодный день</span></div>`},

// В13
{id:"В13",title:"В13. Обособленные члены предложения",rule:`
            <div class="info-block"><i class="fas fa-check-circle"></i> <b>Обособление</b> — смысловое и интонационное выделение второстепенных членов предложения. Обособленные члены выделяются запятыми (реже — тире).</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Обособленные определения</b></div>
            <table class="table"><tr><th>Условие обособления</th><th>Примеры</th><tr>
                <td>причастный оборот после определяемого слова</td>
                <td><span class="ex-word">Лес, <u>покрытый инеем</u>, стоял. Тополя, <u>покрытые росой</u>, наполняли воздух ароматом.</span></td>
            </tr>
                <tr><td>определение относится к личному местоимению (всегда)</td>
                <td><span class="ex-word"><u>Усталый</u>, я прилёг отдохнуть. <u>Обрадованный</u>, он засмеялся. <u>Смущённый</u>, я покраснел.</span></td>
            </tr>
                <tr><td>два и более одиночных определения после определяемого слова</td>
                <td><span class="ex-word">Мать, <u>грустная и тревожная</u>, сидела молча. Ночь, <u>тихая и звёздная</u>, стояла над землёй.</span></td>
            </tr>
                <tr><td>определение оторвано от определяемого слова другими словами</td>
                <td><span class="ex-word">И снова, <u>отсечённая от танков огнём</u>, залегла пехота. Вдруг, <u>поднятая ветром</u>, закружилась листва.</span></td>
            </tr>
                <tr><td>определение имеет добавочное обстоятельственное значение (причины, уступки)</td>
                <td><span class="ex-word"><u>Веселый и жизнерадостный</u>, мальчик был всеобщим любимцем. <u>Оглушённый тяжким гулом</u>, Тёркин никнет головой.</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Обособленные приложения</b></div>
            <table class="table"><tr><th>Условие обособления</th><th>Примеры</th></tr>
                <tr><td>распространённое приложение после нарицательного существительного</td>
                <td><span class="ex-word">Старичок, <u>больничный сторож</u>, впустил его. Сосед, <u>мужчина лет пятидесяти</u>, вышел на крыльцо.</span></td>
            </tr>
                <tr><td>приложение с <b>как</b> (имеет значение причины)</td>
                <td><span class="ex-word"><u>Как старый артиллерист</u>, я презираю это оружие. <u>Как человек умный</u>, он понял это сразу.</span></td>
            </tr>
                <tr><td>приложение после имени собственного</td>
                <td><span class="ex-word">Антон, <u>мой старший брат</u>, всегда готов помочь. Байкал, <u>величайшее озеро мира</u>, поражает своей красотой.</span></td>
            </tr>
                <tr><td>приложение относится к личному местоимению</td>
                <td><span class="ex-word">Ему ли, <u>карлику</u>, тягаться с гигантом? Мне, <u>человеку неопытному</u>, трудно было разобраться.</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Обособленные обстоятельства</b></div>
            <table class="table"><tr><th>Условие обособления</th><th>Примеры</th></tr>
                <tr><td>деепричастные обороты и одиночные деепричастия (кроме перешедших в наречия)</td>
                <td><span class="ex-word"><u>Спустившись к реке</u>, мы увидели лодку. Он шёл, <u>не оглядываясь</u>. <u>Вздрогнув</u>, он обернулся.</span></td>
            </tr>
                <tr><td>обороты с <b>несмотря на, невзирая на</b></td>
                <td><span class="ex-word"><u>Несмотря на дождь</u>, мы пошли гулять. <u>Невзирая на усталость</u>, продолжали путь.</span></td>
            </tr>
                <tr><td>обстоятельства с предлогами <b>благодаря, вопреки, согласно, ввиду, за неимением</b> (при смысловом выделении)</td>
                <td><span class="ex-word">Улицы, <u>благодаря отличной погоде</u>, снова оживились. Самолёт, <u>вопреки прогнозам</u>, вылетел вовремя.</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Не обособляются (не выделяются запятыми):</b><br>
            • фразеологизмы: <span class="ex-word">работал спустя рукава, сидел сложа руки, бежал сломя голову, говорил затаив дыхание, слушал раскрыв рот</span><br>
            • деепричастия, перешедшие в наречия: <span class="ex-word">сидел молча, шёл не спеша, стоял не шелохнувшись, читал лёжа, говорил заикаясь</span><br>
            • определение перед определяемым словом (без добавочного значения): <span class="ex-word">Вышедший рано утром отряд уже прошёл четыре версты</span><br>
            • приложение с <b>как</b> в значении «в качестве»: <span class="ex-word">Он известен как хирург. Все знали его как хорошего специалиста.</span></div>`},

// В14
{id:"В14",title:"В14. Уточняющие члены предложения",rule:`
            <div class="info-block"><i class="fas fa-crosshairs"></i> <b>Уточняющие члены</b> — конкретизируют, сужают значение другого члена предложения (уточняемого). Выделяются запятыми (реже — тире).</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Уточняющие члены места</b></div>
            <table class="table"><tr><th>Примеры</th></tr>
                <tr><td><span class="ex-word">Там, <u>внизу</u>, шумела река. Вдали, <u>у леса</u>, виднелась избушка. Везде, <u>слева и справа</u>, стояли дома.</span></td>
            </tr>
                <tr><td><span class="ex-word">На улице, <u>за углом</u>, находился магазин. В горах, <u>на высоте двух тысяч метров</u>, мы нашли стоянку.</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Уточняющие члены времени</b></div>
            <table class="table"><tr><th>Примеры</th></tr>
                <tr><td><span class="ex-word">Вечером, <u>после заката</u>, стало прохладно. Поздно ночью, <u>часов в одиннадцать</u>, я вышел на улицу.</span></td>
            </tr>
                <tr><td><span class="ex-word">Летом, <u>в июле</u>, мы поедем на море. В детстве, <u>лет в пять</u>, я переболел корью.</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Уточняющие члены образа действия, меры, степени</b></div>
            <table class="table"><tr><th>Примеры</th></tr>
                <tr><td><span class="ex-word">Он говорил тихо, <u>почти шёпотом</u>. Она пела красиво, <u>как соловей</u>. Мальчик покраснел, <u>до корней волос</u>.</span></td>
            </tr>
                <tr><td><span class="ex-word">Она любила его сильно, <u>до самозабвения</u>. Старик был стар, <u>глубоким стариком</u>.</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Уточняющие члены с союзами <b>то есть, или (=то есть)</b></b></div>
            <table class="table"><tr><th>Примеры</th></tr>
                <tr><td><span class="ex-word">Время стояло самое благоприятное, <u>то есть было морозно и тихо</u>. Нас пригласили в субботу, <u>то есть пятого апреля</u>.</span></td>
            </tr>
                <tr><td><span class="ex-word">Вдали показался силуэт человека, <u>или нечто похожее на него</u>. Поедем на юг, <u>то есть в Крым</u>.</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Присоединительные члены (с союзами даже, особенно, в том числе, например, и притом, причём, и то)</b></div>
            <table class="table"><tr><th>Примеры</th></tr>
                <tr><td><span class="ex-word">Все встали, <u>даже Петя</u>. Я люблю животных, <u>особенно собак</u>. В лесу много ягод, <u>например малины и черники</u>.</span></td>
            </tr>
                <tr><td><span class="ex-word">Он хорошо учился, <u>причём по всем предметам</u>. Мы поедем на дачу, <u>и то только если будет хорошая погода</u>.</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Важно!</b> Уточняющие члены всегда сужают понятие, конкретизируют его. Если член предложения не сужает, а расширяет — это присоединительный член. <span class="ex-word">Там, внизу, шумела река</span> (уточнение: где именно? — внизу). <span class="ex-word">Он говорил тихо, почти шёпотом</span> (уточнение: как именно? — почти шёпотом).</div>`},

// В15
{id:"В15",title:"В15. Знаки препинания со сравнительными оборотами",rule:`
            <div class="info-block"><i class="fas fa-check-circle"></i> <b>Сравнительный оборот</b> — оборот с союзами <b>как, словно, будто, точно, как будто, подобно тому как</b>. Выделяется запятыми.</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Выделяются запятыми</b></div>
            <table class="table"><td><th>Примеры</td></tr>
                <tr><td><span class="ex-word">Она пела, как соловей. Глаза её сияли, словно звёзды. Лёд блестит, будто зеркало. Дождь лил, как из ведра.</span></td>
            </tr>
                <tr><td><span class="ex-word">Воздух чист и свеж, как поцелуй ребёнка. Руки его дрожали, как ртуть. Похвала многих знающих людей важнее, чем насмешки многочисленных невежд.</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-ban"></i> <b>Не выделяются запятыми</b></div>
            <table class="table"><tr><th>Случай</th><th>Примеры</th></tr>
                <tr><td>оборот входит в состав сказуемого (теряет сравнение, обозначает отождествление)</td>
                <td><span class="ex-word">Глаза как звёзды. Слова были как лёд. День как праздник. Она была как мать для него.</span></td>
            </tr>
                <tr><td>фразеологизм (устойчивое выражение)</td>
                <td><span class="ex-word">Он работает как вол. Всё идёт как по маслу. Живут как кошка с собакой. Боится как огня.</span></td>
            </tr>
                <tr><td>перед <b>как</b> есть отрицание <b>не</b> или слова <b>почти, совсем, совершенно, вроде, точь-в-точь</b></td>
                <td><span class="ex-word">Он говорил не как учитель. Всё было не как у людей. Выглядит точь-в-точь как мать.</span></td>
            <tr>
                <td>оборот имеет значение «в качестве» (стоит в конце предложения)</td>
                <td><span class="ex-word">Все знали его как хорошего специалиста. Богат, хорош собою, Ленский везде был принят как жених.</span></td>
            </tr>
                <tr><td>сравнительный оборот — приложение (его можно заменить существительным в Т.п.)</td>
                <td><span class="ex-word">Он вылетел как ураган (=ураганом). Снег посыпался как град (=градом).</span></td>
            </tr>
                <tr><td>сравнительный оборот с <b>как</b> входит в состав сказуемого при глаголах <b>выглядеть, казаться, чувствовать</b></td>
                <td><span class="ex-word">Она выглядит как кинозвезда. Он чувствовал себя как дома. Ты кажешься как привидение.</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Вводные сочетания с <b>как</b> (всегда выделяются запятыми):</b> <span class="ex-word">как правило, как всегда, как сейчас, как нарочно, как исключение, как например, как следствие</span><br>
            <b>Пример:</b> <span class="ex-word">Он, как всегда, опоздал. Как правило, мы встаём рано. Как нарочно, пошёл дождь.</span></div>`},

// В16
{id:"В16",title:"В16. Вводные слова и обращения",rule:`
            <div class="info-block"><i class="fas fa-check-circle"></i> <b>Вводные слова</b> — не являются членами предложения, выражают отношение говорящего к высказыванию, выделяются запятыми.</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Группы вводных слов по значению</b></div>
            <table class="table"><tr><th>Значение</th><th>Примеры вводных слов</th></tr>
                <tr><td>уверенность, достоверность</td>
                <td><span class="ex-word">конечно, безусловно, несомненно, разумеется, действительно, правда, естественно, бесспорно</span></td>
            </tr>
                <tr><td>неуверенность, предположение</td>
                <td><span class="ex-word">кажется, вероятно, возможно, должно быть, может быть, очевидно, по-видимому, видимо, наверное, пожалуй</span></td>
            </tr>
                <tr><td>чувства, эмоции, оценка</td>
                <td><span class="ex-word">к счастью, к сожалению, к удивлению, к радости, на беду, на радость, к досаде, странное дело, грешным делом</span></td>
            </tr>
                <tr><td>источник сообщения</td>
                <td><span class="ex-word">по-моему, по-твоему, по-нашему, по словам (кого-то), говорят, по мнению (кого-то), как известно, по сообщению, как говорят</span></td>
            </tr>
                <tr><td>порядок мыслей, связь предложений</td>
                <td><span class="ex-word">во-первых, во-вторых, наконец, итак, следовательно, значит, таким образом, например, напротив, наоборот, кроме того, во-первых</span></td>
            </tr>
                <tr><td>способ оформления мыслей</td>
                <td><span class="ex-word">одним словом, иначе говоря, так сказать, мягко выражаясь, грубо говоря, точнее сказать, вернее сказать</span></td>
            </tr>
                <tr><td>степень обычности</td>
                <td><span class="ex-word">как всегда, как обычно, по обыкновению, по традиции, случается, бывает, как правило</span></td>
            </tr>
                <tr><td>обращение к собеседнику</td>
                <td><span class="ex-word">видите ли, понимаете, знаете, поверьте, представьте, согласитесь, скажем, положим</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-ban"></i> <b>Не являются вводными (не выделяются запятыми)</b><br>
            <span class="ex-word">авось, будто, вдруг, ведь, даже, именно, как будто, как раз, к тому же, между тем, приблизительно, примерно, притом, почти, просто, словно, якобы, решительно, исключительно, в конце концов, вряд ли, едва ли, всё-таки</span></div>
            <div class="info-block"><i class="fas fa-user"></i> <b>Обращения</b> — называют того, к кому обращаются с речью. Выделяются запятыми. Не являются членами предложения.<br>
            <span class="ex-word">Иван, принеси книгу. Друзья, рад вас видеть! Как ты, дорогая, поживаешь? О, Волга, колыбель моя! Здравствуй, солнце да утро весёлое!</span></div>
            <div class="example"><i class="fas fa-star"></i> <b>Различение однако:</b><br>
            • вводное слово (в середине/конце предложения, можно заменить на <b>кстати</b>): <span class="ex-word">Надо, однако, подышать воздухом. Он, однако, не пришёл.</span><br>
            • союз (=но) в начале предложения или между однородными членами: <span class="ex-word">Однако (НО) мы встретились. Метель не утихала, однако (но) погода не ухудшилась.</span><br>
            <b>Различение наконец:</b><br>
            • вводное слово (порядок мыслей, нетерпение): <span class="ex-word">Во-первых, он умён, во-вторых, красив и, наконец, талантлив. Да уходите же, наконец!</span><br>
            • обстоятельство времени (=под конец, после всего): <span class="ex-word">Мы поднимались всё выше и наконец достигли вершины.</span></div>`},

// В17
{id:"В17",title:"В17. Морфологические нормы (образование форм слова)",rule:`
            <div class="info-block"><i class="fas fa-star"></i> <b>Морфологические нормы</b> — правила образования грамматических форм слов разных частей речи.</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Имена существительные</b></div>
            <table class="table"><tr><th>Трудные случаи</th><th>Норма</th><th>Примеры</th></tr>
                <tr><td>И.п. мн.ч. (окончания -ы/-и или -а/-я)</td>
                <td><b>-ы/-и:</b> договоры, инженеры, конструкторы, лекторы, ректоры, редакторы, бухгалтеры, шофёры, торты, банты<br><b>-а/-я:</b> директора, профессора, доктора, учителя, паспорта, купола, берега, края, голоса</td>
                <td><span class="ex-word">нет: договор<u>а</u>, инженер<u>а</u> — правильно: договор<u>ы</u>, инженер<u>ы</u></span></td>
            </tr>
                <tr><td>Р.п. мн.ч. (нулевое окончание или окончание -ов/-ев)</td>
                <td><b>Нулевое:</b> чулок, ботинок, валенок, солдат, партизан, яблок, армян, грузин, басен, песен, вишен, боен<br><b>-ов:</b> носков, гектаров, граммов, килограммов, апельсинов, помидоров, ананасов, монголов, узбеков</td>
                <td><span class="ex-word">нет: чулк<u>ов</u> — правильно: чулок; нет: носк<u>ов</u>? — правильно: носков</span></td>
            </tr>
                <tr><td>Род существительных</td>
                <td><b>М.р.:</b> шампунь, тюль, рояль, рельс, мозоль? (ж.р.!), банкнот? (ж.р.!), зал, табель<br><b>Ж.р.:</b> мозоль, туфля, банкнота, вуаль, простыня, плацкарта, картофелина, фасоль, лангуст<br><b>Ср.р.:</b> повидло, щупальце, бюллетень? (м.р.!), интервью, какао, желе, резюме</td>
                <td><span class="ex-word">шампунь (м.р.) — шампуня; мозоль (ж.р.) — мозоли; кофе (м.р.) — кофе</span></td>
            </tr>
                <tr><td>Склонение фамилий</td>
                <td><b>Склоняются:</b> мужские на -ов, -ин, -ый, -ой; женские на -ова, -ина<br><b>Не склоняются:</b> женские на -ов, -ин; украинские на -ко, -енко; зарубежные на -а, -я безударные; на -о, -е, -и, -у, -ю</td>
                <td><span class="ex-word">Иванов (м.) — Иванова; Иванова (ж.) — не скл.; Шевченко, Петренко — не скл.</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Имена прилагательные. Степени сравнения</b></div>
            <table class="table"><tr><th>Степень</th><th>Форма</th><th>Образование</th><th>Примеры</th></tr>
                <tr><td><b>Сравнительная</b> (простая)</td>
                <td><span class="ex-word">красивее, лучше, меньше</span></td>
                <td>-ее/-ей, -е, -ше, от другой основы</td>
                <td><span class="ex-word">красивый → красивее, хороший → лучше, маленький → меньше</span></td>
            </tr>
                <tr><td><b>Сравнительная</b> (составная)</td>
                <td><span class="ex-word">более красивый, менее интересный</span></td>
                <td>более/менее + исходная форма</td>
                <td><span class="ex-word">более красивый, менее удобный, более сильный</span></td>
            </tr>
                <tr><td><b>Превосходная</b> (простая)</td>
                <td><span class="ex-word">красивейший, лучший</span></td>
                <td>-ейш-, -айш-, от другой основы</td>
                <td><span class="ex-word">красивый → красивейший, хороший → лучший, великий → величайший</span></td>
            </tr>
                <tr><td><b>Превосходная</b> (составная)</td>
                <td><span class="ex-word">самый красивый, наиболее интересный</span></td>
                <td>самый/наиболее/наименее + исходная форма</td>
                <td><span class="ex-word">самый красивый, наиболее удобный, наименее сильный</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Имена числительные</b></div>
            <table class="table"><tr><th>Трудные случаи</th><th>Норма</th><th>Примеры</th></tr>
                <tr><td>Склонение числительных 50-80, 200-900</td>
                <td><b>50-80:</b> пятьдесят → пятидесяти, пятьюдесятью<br><b>200-400:</b> двести → двухсот, двумстам, двумястами<br><b>500-900:</b> пятьсот → пятисот, пятьюстами</td>
                <td><span class="ex-word">нет пятидесяти, к пятидесяти; нет двухсот, к двумстам; нет пятисот, к пятистам</span></td>
            </tr>
                <tr><td>Собирательные числительные (двое-десятеро)</td>
                <td>с существительными м.р., с детьми, с парными предметами, с личными местоимениями</td>
                <td><span class="ex-word">двое друзей, трое детей, семеро козлят, двое саней, нас двое</span></td>
            </tr>
                <tr><td><b>оба / обе</b></td>
                <td><b>оба</b> — с м.р. и ср.р. (оба друга, оба окна)<br><b>обе</b> — с ж.р. (обе подруги, обе стороны)</td>
                <td><span class="ex-word">обоими руками (м.р.? нет, руки — ж.р.! правильно: обеими руками)</span></td>
            </tr>
                <tr><td><b>полтора / полторы / полтораста</b></td>
                <td><b>полтора</b> — м.р., ср.р.; <b>полторы</b> — ж.р.; <b>полтораста</b> — 150</td>
                <td><span class="ex-word">полтора метра, полторы минуты, полтораста рублей</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Глаголы (образование форм повелительного наклонения):</b> <span class="ex-word">класть — клади, положить — положи, ехать — поезжай, лечь — ляг, бежать — беги, выйти — выйди, сесть — сядь</span><br>
            <b>Нельзя:</b> <span class="ex-word">ложи, едь, ехай, бежи, сядьте (можно сядьте? — да, но сядь — норма)</span></div>`},

// В18
{id:"В18",title:"В18. Синтаксические нормы (управление, согласование)",rule:`
            <div class="info-block"><i class="fas fa-handshake"></i> <b>Синтаксические нормы</b> — правила построения словосочетаний и предложений.</div>
            <div class="info-block"><i class="fas fa-table"></i> <b>Нормы согласования</b></div>
            <table class="table"><tr><th>Случай</th><th>Норма</th><th>Примеры</th></tr>
                <tr><td>Сказуемое с подлежащим (количественные числительные)</td>
                <td>ед.ч. (при совместности действия, при количестве до 5, при подлежащем с <b>много, мало, немного</b>); мн.ч. (при раздельности действия, при количестве больше 5, при одушевлённых)</td>
                <td><span class="ex-word">Пришло три ученика. Пришли три ученика (оба варианта допустимы). Много людей пришло. Десять человек пришли.</span></td>
            </tr>
                <tr><td>Сказуемое с подлежащим (собирательные существительные: большинство, ряд, часть)</td>
                <td>ед.ч. (основная норма); мн.ч. (если есть зависимые слова во мн.ч., если перечисляются деятели)</td>
                <td><span class="ex-word">Большинство согласилось. Большинство студентов согласились. Ряд вопросов был рассмотрен.</span></td>
            </tr>
                <tr><td>Определение с числительными два, три, четыре</td>
                <td>м.р., ср.р. — Р.п. (два больших дома, три больших окна); ж.р. — И.п. (две большие комнаты, три большие улицы)</td>
                <td><span class="ex-word">два новых стола, три красивых окна, четыре высокие девушки</span></td>
            </tr>
                <tr><td>Приложения (географические названия)</td>
                <td>склоняется, если название — русское/славянское м.р. или ср.р.; не склоняется, если название — ж.р., на -о, -е, -и, составное</td>
                <td><span class="ex-word">в городе Москве (скл.), у реки Волги (скл.), в городе Иваново (не скл.), у озера Байкал (не скл.)</span></td>
            </tr>
                <tr><td>Приложения (кавычки)</td>
                <td>не склоняются, если в кавычках и есть родовое слово; склоняются, если кавычки без родового слова</td>
                <td><span class="ex-word">в газете «Правда» (не скл.), в «Правде» (скл.), на корабле «Победа» (не скл.), на «Победе» (скл.)</span></td>
            </tr>
            </table>
            <div class="info-block"><i class="fas fa-table"></i> <b>Нормы управления (падежи после предлогов и глаголов)</b></div>
            <table class="table"><tr><th>Предлог/Глагол</th><th>Требуемый падеж</th><th>Примеры</th></tr>
                <tr><td><b>согласно, благодаря, вопреки, наперекор, подобно, навстречу, вслед</b></td>
                <td><b>Д.п.</b> (кому? чему?)</td>
                <td><span class="ex-word">согласно плану, благодаря помощи, вопреки прогнозам, навстречу ветру</span></td>
            </tr>
                <tr><td><b>по</b> (в значении «после»)</td>
                <td><b>П.п.</b> (о ком? о чём?)</td>
                <td><span class="ex-word">по окончании школы, по прибытии на место, по приезде в город, по истечении срока</span></td>
            </tr>
                <tr><td><b>благодаря</b> (причина)</td>
                <td><b>Д.п.</b> (не Р.п.)</td>
                <td><span class="ex-word">благодаря (кому?) другу, НО: из-за (кого?) друга</span></td>
            </tr>
                <tr><td><b>заведующий, управляющий, командующий</b></td>
                <td><b>Т.п.</b> (кем? чем?)</td>
                <td><span class="ex-word">заведующий (чем?) отделом, управляющий (чем?) делами, командующий (чем?) армией</span></td>
            </tr>
                <tr><td><b>оплатить, заплатить, уплатить</b></td>
                <td><b>В.п.</b> (что?) — без предлога</td>
                <td><span class="ex-word">оплатить (что?) проезд, НО: заплатить (за что?) за проезд</span></td>
            </tr>
                <tr><td><b>отзыв о чём, рецензия на что</b></td>
                <td><b>П.п.</b> / <b>В.п.</b></td>
                <td><span class="ex-word">отзыв (о чём?) о книге, рецензия (на что?) на книгу</span></td>
            </tr>
                <tr><td><b>уверенность в чём, вера во что</b></td>
                <td><b>П.п.</b> / <b>В.п.</b></td>
                <td><span class="ex-word">уверенность (в чём?) в победе, вера (во что?) в победу</span></td>
            </tr>
            </table>
            <div class="example"><i class="fas fa-star"></i> <b>Частые ошибки в управлении (запомнить!):</b><br>
            <span class="ex-word">разочарован (в чём?) в жизни</span> (не жизнью)<br>
            <span class="ex-word">превосходство (над кем?) над соперником</span> (не перед соперником)<br>
            <span class="ex-word">свойственно (кому?) ему</span> (не для него)<br>
            <span class="ex-word">достоин (чего?) награды</span> (не награду)<br>
            <span class="ex-word">обращать внимание (на что?) на детали</span> (не о деталях)<br>
            <span class="ex-word">уделять внимание (чему?) деталям</span> (не на детали)</div>`},

// В19
{id:"В19",title:"В19. Речевые нормы (плеоназм, тавтология)",rule:`
            <div class="info-block"><i class="fas fa-ban"></i> <b>Плеоназм</b> — употребление в речи лишних слов, избыточных выражений.</div>
            <table class="table"><tr><th>Неправильно (плеоназм)</th><th>Правильно</th></tr>
                <tr><td><span class="ex-word">свободная вакансия</span></td>
                <td><span class="ex-word">вакансия</span> (вакансия = свободное место)</td>
            </tr>
                <tr><td><span class="ex-word">хронометраж времени</span></td>
                <td><span class="ex-word">хронометраж</span> (хронометраж = измерение времени)</td>
            </tr>
                <tr><td><span class="ex-word">коллега по работе</span></td>
                <td><span class="ex-word">коллега</span> (коллега = товарищ по работе)</td>
            </tr>
                <tr><td><span class="ex-word">народный фольклор</span></td>
                <td><span class="ex-word">фольклор</span> (фольклор = народное творчество)</td>
            </tr>
                <tr><td><span class="ex-word">первая премьера</span></td>
                <td><span class="ex-word">премьера</span> (премьера = первый показ)</td>
            </tr>
                <tr><td><span class="ex-word">памятный сувенир</span></td>
                <td><span class="ex-word">сувенир</span> (сувенир = памятный подарок)</td>
            </tr>
                <tr><td><span class="ex-word">очень прекрасное впечатление</span></td>
                <td><span class="ex-word">прекрасное впечатление</span> (очень + прекрасное = избыточно)</td>
            </tr>
                <tr><td><span class="ex-word">оригинальные сувениры</span></td>
                <td><span class="ex-word">сувениры</span> (сувенир уже уникален)</td>
            </tr>
                <tr><td><span class="ex-word">равный эквивалент</span></td>
                <td><span class="ex-word">эквивалент</span> (эквивалент = равный)</td>
            </tr>
                <tr><td><span class="ex-word">приснилось во сне</span></td>
                <td><span class="ex-word">приснилось</span> (приснилось = увидел во сне)</td>
            </tr>
                <tr><td><span class="ex-word">агрессивный противник</span></td>
                <td><span class="ex-word">противник</span> (противник уже агрессивен)</td>
            </tr>
                <tr><td><span class="ex-word">редкая шевелюра</span></td>
                <td><span class="ex-word">шевелюра</span> (шевелюра = волосы на голове)</td>
            </tr>
                <tr><td><span class="ex-word">главная суть</span></td>
                <td><span class="ex-word">суть</span> (суть = главное)</td>

// Безопасные функции для работы с localStorage
function safeGet(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch(e) { return fallback; }
}
function safeSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

// XSS защита - экранирование HTML
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function renderTasks(){
    const now = new Date();
    document.getElementById('currentDate').innerText = `${now.getDate()} ${now.toLocaleString('ru',{month:'long'})} ${now.getFullYear()}`;
    const container = document.getElementById('tasksList');
    container.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'subject-card';
    card.innerHTML = '<div class="subject-title">📋 Задания ЦЭ/ЦТ 2026</div><div class="task-grid" id="taskGrid"></div>';
    container.appendChild(card);
    const grid = document.getElementById('taskGrid');
    const viewed = safeGet("russian_rules_viewed", []);
    viewed.forEach(id => viewedRulesCache.add(id));
    sections.forEach(s => {
        const btn = document.createElement('div');
        btn.className = 'task-btn' + (viewedRulesCache.has(s.id) ? ' viewed' : '');
        btn.innerText = s.id;
        btn.onclick = () => { saveProgress(s.id); showRule(s); };
        grid.appendChild(btn);
    });
}

function saveProgress(id) {
    if (!viewedRulesCache.has(id)) {
        viewedRulesCache.add(id);
        safeSet("russian_rules_viewed", Array.from(viewedRulesCache));
    }
}

function showRule(section) {
    document.getElementById('ruleHeader').textContent = section.title;
    document.getElementById('ruleText').innerHTML = section.rule;
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('ruleScreen').style.display = 'block';
    window.scrollTo(0, 0);
}

function backToTasks() {
    document.getElementById('mainScreen').style.display = 'block';
    document.getElementById('ruleScreen').style.display = 'none';
}

function renderStats() {
    const total = viewedRulesCache.size;
    const percent = sections.length ? Math.round((total / sections.length) * 100) : 0;
    document.getElementById('statsContent').innerHTML =
        '<div class="stat-card">' +
            '<div style="font-size:48px;">📊</div>' +
            '<div style="font-size:48px;font-weight:800;color:#9bbf7a;">' + percent + '%</div>' +
            '<div>правил изучено</div>' +
            '<div class="stat-progress"><div class="stat-progress-fill" style="width:' + percent + '%"></div></div>' +
        '</div>' +
        '<div class="stat-card" style="margin-top:16px;">' +
            '<div>📚 Просмотрено: ' + total + ' / ' + sections.length + '</div>' +
        '</div>';

// Кэш для рендера — избегаем повторных перерисовок
let tasksRendered = false;
let statsRendered = false;
let profileRendered = false;

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.tab[data-tab="' + tab + '"]').classList.add('active');
    document.getElementById('tasksList').style.display = 'none';
    document.getElementById('statsContent').style.display = 'none';
    document.getElementById('profileContent').style.display = 'none';
    if (tab === 'tasks') {
        document.getElementById('tasksList').style.display = 'block';
        if (!tasksRendered) { renderTasks(); tasksRendered = true; }
    }
    if (tab === 'stats') {
        document.getElementById('statsContent').style.display = 'block';
        renderStats();
    }
    if (tab === 'profile') {
        document.getElementById('profileContent').style.display = 'block';
        if (!profileRendered) { renderProfile(); profileRendered = true; }
    }
}

document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

renderTasks();
tasksRendered = true;
renderStats();
renderProfile();
switchTab('tasks');
</script>
