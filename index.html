<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:100px;background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}.header{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(155,191,122,0.3)}.date-icon{font-size:16px;font-weight:500;background:rgba(155,191,122,0.2);padding:8px 16px;border-radius:30px;color:#5d8c3a}.close-btn{font-size:24px;cursor:pointer;color:#5d8c3a;background:rgba(255,255,255,0.5);border:none;width:40px;height:40px;border-radius:40px}.tabs{display:flex;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);padding:8px 16px;gap:16px;border-bottom:1px solid rgba(155,191,122,0.3);overflow-x:auto}.tab{font-size:14px;color:#6a5a6a;padding:8px 0;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:#9bbf7a;border-bottom-color:#9bbf7a}.content{padding:16px}.screen{display:block}.screen.hidden{display:none}.subject-card{background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border-radius:28px;padding:20px;margin-bottom:20px}.subject-title{font-size:22px;font-weight:700;margin-bottom:16px;background:linear-gradient(135deg,#9bbf7a,#7dab5a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px}.task-btn{background:rgba(155,191,122,0.15);border:1px solid rgba(155,191,122,0.3);border-radius:20px;padding:12px;text-align:center;cursor:pointer;font-weight:600;color:#5d8c3a;transition:all 0.2s}.task-btn:hover{background:rgba(155,191,122,0.3);transform:translateY(-2px)}.quiz-card{background:rgba(255,255,255,0.95);border-radius:28px;padding:24px}.rule-title{font-size:20px;font-weight:700;margin-bottom:16px;color:#5d8c3a}.rule-text{font-size:16px;line-height:1.5;color:#4a5a4a}.rule-text table{width:100%;border-collapse:collapse;margin:12px 0}.rule-text th,.rule-text td{border:1px solid #c8e6c9;padding:8px;text-align:left;vertical-align:top}.rule-text th{background:#e8f5e9;color:#5d8c3a}.btn-main{width:100%;background:linear-gradient(135deg,#9bbf7a,#7dab5a);color:white;border:none;padding:14px;border-radius:24px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:20px}.footer{position:fixed;bottom:0;left:0;width:100%;padding:12px 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(155,191,122,0.3);display:flex;justify-content:center;gap:40px;z-index:10}.social-item{text-align:center;text-decoration:none;color:#9bbf7a;transition:transform 0.2s}.social-item:hover{transform:translateY(-3px)}.social-icon{font-size:28px;margin-bottom:4px;display:block}.social-label{font-size:10px;font-weight:500;letter-spacing:0.5px}.stat-card{background:rgba(255,255,255,0.9);border-radius:28px;padding:20px;margin-bottom:16px;text-align:center}
    </style>
</head>
<body>
<div id="mainScreen" class="screen">
    <div class="header"><div class="date-icon" id="currentDate"></div><button class="close-btn" onclick="window.Telegram?.WebApp?.close()">✕</button></div>
    <div class="tabs"><div class="tab active" data-tab="tasks">📚 Задания</div><div class="tab" data-tab="stats">📊 Статистика</div><div class="tab" data-tab="profile">👤 Профиль</div></div>
    <div class="content"><div id="tasksList"></div><div id="statsContent" style="display:none;"></div><div id="profileContent" style="display:none;"></div></div>
    <div class="footer">
        <a href="https://t.me/histforyou" target="_blank" class="social-item"><i class="fab fa-telegram-plane social-icon"></i><div class="social-label">TELEGRAM КАНАЛ</div></a>
        <a href="https://t.me/swayzeee" target="_blank" class="social-item"><i class="fab fa-telegram-plane social-icon"></i><div class="social-label">МОЙ TELEGRAM</div></a>
        <a href="https://www.instagram.com/yakimisha_oleg" target="_blank" class="social-item"><i class="fab fa-instagram social-icon"></i><div class="social-label">МОЙ INSTAGRAM</div></a>
    </div>
</div>
<div id="ruleScreen" class="screen" style="display:none;">
    <div class="header"><button class="close-btn" onclick="backToTasks()">←</button><div id="ruleTitle"></div><div style="width:40px"></div></div>
    <div class="content"><div class="quiz-card"><div class="rule-title" id="ruleHeader"></div><div class="rule-text" id="ruleText"></div><button class="btn-main" onclick="backToTasks()">Назад</button></div></div>
</div>
<script>
const tg = window.Telegram?.WebApp; if (tg) { tg.expand(); tg.ready(); }

const sections = [
    {id: "A1", title: "А1. Безударные гласные в корне", rule: `<b>🔹 Проверяемые гласные</b> — проверяются ударением: <i>посв<u>я</u>тить (св<u>я</u>то)</i><br><br><b>🔹 Непроверяемые</b> — словарные: <i>абажур, аромат</i><br><br><b>🔹 Чередующиеся корни</b><br><table><tr><th>Корни</th><th>Условие</th><th>Примеры</th></tr><tr><td>-лаг-/-лож-</td><td>перед Г — А, перед Ж — О</td><td>пол<u>а</u>гать — пол<u>о</u>жить</td></tr><tr><td>-раст-/-ращ-/-рос-</td><td>перед СТ, Щ — А, иначе — О</td><td>выр<u>а</u>стить — выр<u>о</u>с</td></tr><tr><td>-кас-/-кос-</td><td>есть суффикс А — А, иначе — О</td><td>к<u>а</u>саться — к<u>о</u>снуться</td></tr><tr><td>-бер-/-бир-</td><td>есть суффикс А — И, иначе — Е</td><td>соб<u>и</u>рать — соб<u>е</u>ру</td></tr><tr><td>-гор-/-гар-</td><td>под ударением — А, без — О</td><td>з<u>а</u>гар — заг<u>о</u>релый</td></tr><tr><td>-зор-/-зар-</td><td>под ударением — О, без — А</td><td>з<u>о</u>ри — з<u>а</u>ря</td></tr></table>`},
    {id: "A2", title: "А2. Правописание приставок", rule: `<b>🔹 Приставки ПРЕ- и ПРИ-</b><br><table><tr><th>ПРЕ-</th><th>ПРИ-</th></tr><tr><td>= очень (<i>пр<u>е</u>милый</i>)</td><td>приближение (<i>пр<u>и</u>ехать</i>)</td></tr><tr><td>= пере- (<i>пр<u>е</u>градить</i>)</td><td>присоединение (<i>пр<u>и</u>клеить</i>)</td></tr><tr><td></td><td>неполнота действия (<i>пр<u>и</u>сесть</i>)</td></tr></table><br><b>🔹 Приставки на -З/-С</b><br><table><tr><th>Перед звонкими</th><th>Перед глухими</th></tr><tr><td>раз-, без-, воз-, из-, низ-, чрез-</td><td>рас-, бес-, вос-, ис-, нис-, чрес-</td></tr><tr><td><i>разбежаться</i></td><td><i>расстелить</i></td></tr></table><br><b>Запомнить:</b> <i>здесь, здание, здоровье, ни зги</i>`},
    {id: "A3", title: "А3. Правописание суффиксов", rule: `<b>🔹 Суффиксы прилагательных</b><br><table><tr><th>Суффикс</th><th>Условие</th><th>Примеры</th></tr><tr><td>-ив-</td><td>под ударением</td><td>крас<u>и</u>вый, правд<u>и</u>вый</td></tr><tr><td>-ев-</td><td>без ударения</td><td>сирен<u>е</u>вый, тюл<u>е</u>вый</td></tr><tr><td>-лив-/-чив-</td><td>всегда И</td><td>заботл<u>и</u>вый, доверч<u>и</u>вый</td></tr></table><br><b>🔹 Суффиксы существительных -чик-/-щик-</b><br><table><tr><th>После д, т, з, с, ж</th><th>После остальных</th></tr><tr><td>-чик- (<i>переводчик</i>)</td><td>-щик- (<i>каменщик</i>)</td></tr></table>`},
    {id: "A4", title: "А4. Правописание личных окончаний глаголов и суффиксов причастий", rule: `<b>🔹 Спряжение глаголов</b><br><table><tr><th>I спряжение</th><th>II спряжение</th></tr><tr><td>все глаголы на -ать, -еть, -ять, -оть, -уть, -ти, -чь<br>+ <i>брить, стелить</i></td><td>все глаголы на -ить<br>+ <i>гнать, держать, дышать, слышать, видеть, смотреть, ненавидеть, обидеть, вертеть, терпеть, зависеть</i></td></tr></table><br><b>🔹 Окончания глаголов</b><br><table><tr><th>Лицо</th><th>I спр.</th><th>II спр.</th></tr><tr><td>1 л. ед.</td><td>-у/-ю</td><td>-у/-ю</td></tr><tr><td>2 л. ед.</td><td>-ешь</td><td>-ишь</td></tr><tr><td>3 л. ед.</td><td>-ет</td><td>-ит</td></tr><tr><td>1 л. мн.</td><td>-ем</td><td>-им</td></tr><tr><td>2 л. мн.</td><td>-ете</td><td>-ите</td></tr><tr><td>3 л. мн.</td><td>-ут/-ют</td><td>-ат/-ят</td></tr></table><br><b>🔹 Суффиксы причастий</b><br><table><tr><th>Действительные причастия наст.вр.</th><th>Страдательные причастия наст.вр.</th></tr><tr><td>I спр.: -ущ-/-ющ- (<i>пиш<u>ущ</u>ий</i>)</td><td>I спр.: -ем-/-ом- (<i>чита<u>ем</u>ый</i>)</td></tr><tr><td>II спр.: -ащ-/-ящ- (<i>дыш<u>ащ</u>ий</i>)</td><td>II спр.: -им- (<i>вид<u>им</u>ый</i>)</td></tr></table>`},
    {id: "A5", title: "А5. Правописание НЕ с разными частями речи", rule: `<b>🔹 НЕ с существительными, прилагательными, наречиями на -о/-е</b><br><table><tr><th>Слитно</th><th>Раздельно</th></tr><tr><td>без НЕ не употребляется (<i>ненастье</i>)</td><td>противопоставление с <b>а</b> (<i>не правда, а ложь</i>)</td></tr><tr><td>можно заменить синонимом (<i>неправда = ложь</i>)</td><td>слова <i>отнюдь не, далеко не, вовсе не</i></td></tr></table><br><b>🔹 НЕ с причастиями</b><br><table><tr><th>Слитно</th><th>Раздельно</th></tr><tr><td>нет зависимого слова (<i>незаконченная работа</i>)</td><td>есть зависимое слово (<i>не законченная вовремя работа</i>)</td></tr><tr><td>с наречиями меры и степени (<i>совсем нерешённая задача</i>)</td><td>краткие причастия (<i>задача не решена</i>)</td></tr></table><br><b>🔹 НЕ с глаголами и деепричастиями</b><br>Слитно: без НЕ не употребляется (<i>негодовать, недоумевая</i>).<br>Раздельно: во всех остальных случаях (<i>не читал, не зная</i>).`},
    {id: "A6", title: "А6. Правописание НЕ и НИ в местоимениях и наречиях", rule: `<b>🔹 НЕ или НИ?</b><br><table><tr><th>НЕ</th><th>НИ</th></tr><tr><td>под ударением</td><td>без ударения</td></tr><tr><td><i>н<u>е</u>где, н<u>е</u>куда, н<u>е</u>кто</i></td><td><i>н<u>и</u>где, н<u>и</u>куда, н<u>и</u>кто</i></td></tr></table><br><b>🔹 Раздельное написание</b><br>Если между НЕ/НИ и местоимением есть предлог, пишется раздельно:<br><i>не у кого, ни с кем, не о чем</i>.`},
    {id: "A7", title: "А7. Слитное, дефисное, раздельное написание слов", rule: `<b>🔹 Слитно</b><br>• сложные слова с соединительными гласными (<i>пароход</i>)<br>• слова с <b>полу-</b> (<i>полуботинки</i>)<br>• иноязычные приставки <b>анти-, гипер-, контр-</b><br><br><b>🔹 Дефис</b><br>• <b>пол-</b> перед гласной, Л, прописной (<i>пол-арбуза, пол-лимона, пол-Москвы</i>)<br>• повтор слов (<i>чуть-чуть, крест-накрест</i>)<br>• наречия с <b>по-</b> и суффиксами <b>-ому/-ему/-и</b> (<i>по-новому, по-русски</i>)<br><br><b>🔹 Раздельно</b><br>• сочетания предлогов с существительными (<i>на ходу, на лету</i>)<br>• наречные выражения (<i>без устали, до упаду</i>)`},
    {id: "A8", title: "А8. Правописание предлогов, союзов, частиц", rule: `<b>🔹 Предлоги</b><br><table><tr><th>Слитно</th><th>Раздельно</th></tr><tr><td><i>ввиду, вследствие, вроде, насчёт</i></td><td><i>в течение, в продолжение, в заключение, в связи с</i></td></tr></table><br><b>🔹 Союзы (слитно) / омонимичные формы (раздельно)</b><br><table><tr><th>Союз</th><th>Раздельно</th></tr><tr><td><i>тоже, также (=и)</i></td><td><i>то же, так же</i></td></tr><tr><td><i>чтобы (=для того чтобы)</i></td><td><i>что бы</i></td></tr><tr><td><i>зато (=но)</i></td><td><i>за то</i></td></tr></table><br><b>🔹 Частицы</b><br>Раздельно: <i>бы, ли, же</i><br>Через дефис: <i>-то, -либо, -нибудь, кое-</i>`},
    {id: "A9", title: "А9. Тире между подлежащим и сказуемым", rule: `<b>🔹 Тире ставится</b><br>• сущ. – сущ.: <i>Книга – источник знаний</i><br>• числ. – числ.: <i>Дважды два – четыре</i><br>• инф. – инф.: <i>Жить – родине служить</i><br>• перед <i>это, вот, значит</i>: <i>Честность – это главное</i><br><br><b>🔹 Тире не ставится</b><br>• есть связка <i>есть</i>: <i>Бедность не порок</i><br>• подлежащее – личное местоимение: <i>Я ученик</i><br>• сказуемое – прилагательное: <i>День теплый</i>`},
    {id: "A10", title: "А10. Обособленные определения и приложения", rule: `<b>🔹 Обособляются запятыми</b><br>• причастный оборот после определяемого слова: <i>Лес, <u>поражённый дождями</u>, стоял мрачный</i><br>• определение, относящееся к личному местоимению: <i><u>Усталый</u>, я прилёг отдохнуть</i><br>• распространённое приложение: <i>Сосед, <u>мужчина лет пятидесяти</u>, вышел</i><br>• приложение с <b>как</b> (оттенок причины): <i><u>Как человек умный</u>, он понял это сразу</i><br><br><b>🔹 Не обособляются</b><br>• определение перед определяемым словом<br>• приложение с <b>как</b> в значении «в качестве»: <i>Он известен <u>как хирург</u></i>`},
    {id: "A11", title: "А11. Обособленные обстоятельства", rule: `<b>🔹 Обособляются запятыми</b><br>• деепричастные обороты: <i><u>Спустившись к реке</u>, мы увидели лодку</i><br>• одиночные деепричастия: <i>Он шёл, <u>не оглядываясь</u></i><br>• обороты с <b>несмотря на</b>: <i><u>Несмотря на дождь</u>, мы пошли гулять</i><br><br><b>🔹 Не обособляются</b><br>• фразеологизмы: <i>работал <u>спустя рукава</u></i><br>• деепричастия, перешедшие в наречия: <i>сидел <u>молча</u></i>`},
    {id: "A12", title: "А12. Знаки препинания в ССП и при однородных членах", rule: `<b>🔹 Запятая между однородными членами</b><br>• перед повторяющимися союзами: <i>и ... и, ни ... ни, то ... то</i><br>• перед противительными: <i>а, но, да (=но), однако, зато</i><br><br><b>🔹 Запятая не ставится</b><br>• между однородными членами с одиночным союзом <b>и</b><br>• в фразеологизмах: <i>ни свет ни заря, и так и сяк</i><br><br><b>🔹 В ССП запятая ставится</b><br>• если части не имеют общего второстепенного члена<br><br><b>🔹 Запятая не ставится в ССП</b><br>• если есть общий второстепенный член: <i>В саду пели птицы и шумели деревья</i>`},
    {id: "A13", title: "А13. Знаки препинания в СПП", rule: `<b>🔹 Придаточная часть отделяется запятой</b><br>• <i>Я знаю, <u>что ты придёшь</u></i><br>• <i><u>Когда наступит утро</u>, мы отправимся в путь</i><br><br><b>🔹 Запятая не ставится</b><br>• если придаточная состоит из одного союзного слова: <i>Он сказал, что пойдёт, но не сказал <u>когда</u></i><br>• если есть отрицание: <i>Он не знал, <u>что ответить</u></i><br>• если придаточная – фразеологизм: <i>Он пришёл <u>как ни в чём не бывало</u></i><br><br><b>🔹 Однородные придаточные</b><br>Если придаточные соединены одиночным союзом <b>и</b>, запятая не ставится.`},
    {id: "A14", title: "А14. Знаки препинания в БСП", rule: `<b>🔹 Запятая</b> – при перечислении: <i>Солнце село, наступила тишина</i><br><br><b>🔹 Точка с запятой</b> – если части распространены: <i>Солнце уже высоко; птицы заливаются</i><br><br><b>🔹 Двоеточие</b><br>• пояснение (а именно): <i>Я понял одно: нужно уходить</i><br>• причина (потому что): <i>Я не пошёл: было холодно</i><br>• изъяснение (и увидел, что): <i>Я выглянул: на улице шёл снег</i><br><br><b>🔹 Тире</b><br>• противопоставление: <i>Смелые побеждают – трусливые погибают</i><br>• время: <i>Солнце взошло – день начинается</i><br>• условие: <i>Ругаться будут – не бойся</i><br>• следствие: <i>Я умираю – мне не к чему лгать</i>`},
    {id: "A15", title: "А15. Вводные слова и обращения", rule: `<b>🔹 Вводные слова выделяются запятыми</b><br>• уверенность: <i>конечно, безусловно</i><br>• неуверенность: <i>кажется, вероятно</i><br>• чувства: <i>к счастью, к сожалению</i><br>• источник: <i>по-моему, говорят</i><br>• порядок мыслей: <i>во-первых, итак</i><br><br><b>Не являются вводными</b>: <i>авось, будто, вдруг, ведь, даже, как будто, словно, якобы</i><br><br><b>🔹 Обращения</b> выделяются запятыми: <i>Иван, принеси книгу</i>`},
    {id: "A16", title: "А16. Прямая речь и диалог", rule: `<b>🔹 Схемы прямой речи</b><br><table><tr><th>Схема</th><th>Пример</th></tr><tr><td>А: «П».</td><td><i>Мама сказала: «Иди домой».</i></td></tr><tr><td>«П», – а.</td><td><i>«Иди домой», – сказала мама.</i></td></tr><tr><td>«П?» – а.</td><td><i>«Ты идёшь?» – спросила мама.</i></td></tr></table><br><b>🔹 Диалог</b><br><i>- Ты идёшь?<br>- Да, иду.</i><br><br>В строку: <i>«Ты идёшь?» – «Да, иду».</i>`},
    {id: "A17", title: "А17. Знаки препинания в предложениях с разными видами связи", rule: `<b>🔹 Стык союзов</b><br>Запятая ставится, если нет второй части двойного союза (<i>то, но, однако</i>):<br><i>Я понял, что, если не приду вовремя, меня не простят.</i><br><br>Запятая не ставится, если есть вторая часть двойного союза:<br><i>Я понял, что если не приду вовремя, <u>то</u> меня не простят.</i><br><br><b>🔹 Анализ конструкции</b><br>1. Найти грамматические основы<br>2. Определить вид связи<br>3. Расставить знаки по правилам`},
    {id: "A18", title: "А18. Стили и типы речи", rule: `<b>🔹 Стили речи</b><br><table><tr><th>Стиль</th><th>Особенности</th><th>Сфера</th></tr><tr><td>Разговорный</td><td>непринуждённость</td><td>бытовое общение</td></tr><tr><td>Художественный</td><td>образность, выразительность</td><td>литература</td></tr><tr><td>Публицистический</td><td>эмоциональность, призывность</td><td>СМИ, выступления</td></tr><tr><td>Научный</td><td>термины, логичность</td><td>наука, учёба</td></tr><tr><td>Официально-деловой</td><td>точность, стандартность</td><td>документы, законы</td></tr></table><br><b>🔹 Типы речи</b><br><table><tr><th>Тип</th><th>Вопрос</th><th>Особенности</th></tr><tr><td>Описание</td><td>какой?</td><td>много прилагательных</td></tr><tr><td>Повествование</td><td>что произошло?</td><td>последовательность событий</td></tr><tr><td>Рассуждение</td><td>почему?</td><td>тезис → аргументы → вывод</td></tr></table>`},
    {id: "B1", title: "В1. Лексическое значение слова", rule: `<b>🔹 Лексическое значение</b> – то, что обозначает слово.<br><br><b>Однозначные и многозначные слова</b><br>• однозначные: <i>берёза, компьютер</i><br>• многозначные: <i>ключ (гаечный, скрипичный, родник)</i><br><br><b>Прямое и переносное значение</b><br>• прямое: <i>золотое кольцо</i><br>• переносное: <i>золотые руки, золотой характер</i><br><br><b>Контекстуальное значение</b> – значение, которое слово приобретает только в данном контексте.`},
    {id: "B2", title: "В2. Лексические нормы (синонимы, антонимы, паронимы)", rule: `<b>🔹 Синонимы</b> – слова, близкие по значению: <i>радостный – весёлый</i><br><br><b>🔹 Антонимы</b> – слова с противоположным значением: <i>день – ночь</i><br><br><b>🔹 Паронимы</b> – слова одного корня, похожие по звучанию, но разные по значению:<br><table><tr><th>Паронимы</th><th>Значение</th></tr><tr><td>одеть – надеть</td><td>одеть кого-то, надеть что-то</td></tr><tr><td>абонент – абонемент</td><td>абонент – пользователь, абонемент – документ</td></tr><tr><td>дипломат – дипломант</td><td>дипломат – специалист, дипломант – победитель конкурса</td></tr><tr><td>эффектный – эффективный</td><td>эффектный – производящий впечатление, эффективный – действенный</td></tr></table>`},
    {id: "B3", title: "В3. Орфоэпические нормы (ударение)", rule: `<b>🔹 Запомните ударение:</b><br><table><tr><th>Слова</th><th>Ударение</th></tr><tr><td>каталог, квартал, договор</td><td>катал<u>о</u>г, кварт<u>а</u>л, догов<u>о</u>р</td></tr><tr><td>звонит, баловать, облегчить</td><td>звон<u>и</u>т, балов<u>а</u>ть, облегч<u>и</u>ть</td></tr><tr><td>премировать, красивее, щавель<i></i> </td><td>премиров<u>а</u>ть, крас<u>и</u>вее, щав<u>е</u>ль</td> </tr>
    <tr><td>торты, банты, жалюзи</td><td>т<u>о</u>рты, б<u>а</u>нты, жалюз<u>и</u></td></tr>
    <tr><td>досуг, средства, статуя</td><td>дос<u>у</u>г, ср<u>е</u>дства, ст<u>а</u>туя</td></tr>
    <tr><td>верн<u>а</u>, крас<u>и</u>вее, опт<u>о</u>вый</td><td></td></tr>
    <tr><td>брал<u>а</u>, начал<u>а</u>, понял<u>а</u></td><td></td></tr>
</table>`},
    {id: "B4", title: "В4. Фразеология", rule: `<b>🔹 Фразеологизмы</b> – устойчивые сочетания слов.<br><br><b>Примеры:</b><br><table><tr><th>Фразеологизм</th><th>Значение</th></tr>
    <tr><td>бить баклуши</td><td>бездельничать</td></tr>
    <tr><td>спустя рукава</td><td>небрежно</td></tr>
    <tr><td>во весь дух</td><td>быстро</td></tr>
    <tr><td>кот наплакал</td><td>мало</td></tr>
    <tr><td>водить за нос</td><td>обманывать</td></tr>
    <tr><td>как снег на голову</td><td>внезапно</td></tr>
</table>`},
    {id: "B5", title: "В5. Фонетика. Озвончение/оглушение, непроизносимые согласные", rule: `<b>🔹 Оглушение</b> – звонкий → глухой:<br>• в конце слова: <i>ду[п], гара[ш]</i><br>• перед глухим: <i>ска[с]ка, ло[т]ка</i><br><br><b>🔹 Озвончение</b> – глухой → звонкий:<br>• перед звонким: <i>про[з']ба, моло[д']ба</i><br><br><b>🔹 Непроизносимые согласные</b><br><table><tr><th>Пишется</th><th>Не произносится</th><th>Примеры</th></tr>
    <tr><td>стн</td><td>[сн]</td><td>чес[н]ый, мес[н]ость</td></tr>
    <tr><td>здн</td><td>[зн]</td><td>поз[н]о, звёз[н]ый</td></tr>
    <tr><td>лнц</td><td>[нц]</td><td>со[н]це</td></tr>
    <tr><td>вств</td><td>[ств]</td><td>чу[ств]о, здра[ств]уй</td></tr>
</table><br><b>Запомнить:</b> <i>блеснуть, плеснуть, ровесник, сверстник, чувство, участвовать, шествовать</i>`},
    {id: "B6", title: "В6. Морфемика и словообразование", rule: `<b>🔹 Способы образования слов</b><br><table><tr><th>Способ</th><th>Пример</th></tr>
    <tr><td>приставочный</td><td>написать → переписать</td></tr>
    <tr><td>суффиксальный</td><td>учитель → учительница</td></tr>
    <tr><td>приставочно-суффиксальный</td><td>стол → настольный</td></tr>
    <tr><td>бессуффиксный</td><td>выходить → выход</td></tr>
    <tr><td>сложение</td><td>лес + степь → лесостепь</td></tr>
    <tr><td>переход из одной части речи в другую</td><td>столовая (сущ.)</td></tr>
</table>`},
    {id: "B7", title: "В7. Морфология. Части речи", rule: `<b>🔹 Самостоятельные части речи</b><br>• имя существительное (кто? что?) – <i>дом, радость</i><br>• имя прилагательное (какой? чей?) – <i>красный, лисий</i><br>• имя числительное (сколько? какой по счёту?) – <i>пять, пятый</i><br>• местоимение – <i>я, мой, кто, этот</i><br>• глагол (что делать?) – <i>читать, бежать</i><br>• наречие (как? где? когда?) – <i>быстро, вчера</i><br><br><b>🔹 Служебные части речи</b><br>• предлоги (<i>в, на, без, благодаря</i>)<br>• союзы (<i>и, а, но, чтобы, потому что</i>)<br>• частицы (<i>бы, же, ли, не, ни, вот</i>)`},
    {id: "B8", title: "В8. Морфология. Глагол и его формы", rule: `<b>🔹 Глагол имеет категории:</b> вид, переходность, возвратность, наклонение, время, лицо, число, род.<br><br><b>🔹 Причастие</b> – особая форма глагола (признак по действию): <i>читающий, прочитанный</i><br><br><b>🔹 Деепричастие</b> – особая форма глагола (добавочное действие): <i>читая, прочитав</i><br><br><b>🔹 Инфинитив</b> – начальная форма. В предложении может быть подлежащим, сказуемым, дополнением, определением, обстоятельством.<br><i>Учить – мой долг. Я хочу учиться. Мама велела учиться. Желание учиться. Я пришёл учиться.</i>`},
    {id: "B9", title: "В9. Словосочетание. Виды подчинительной связи", rule: `<b>🔹 Согласование</b> – зависимое слово уподобляется главному: <i>нова<u>я</u> книг<u>а</u></i><br><br><b>🔹 Управление</b> – главное слово требует определённого падежа: <i>читать книг<u>у</u></i><br><br><b>🔹 Примыкание</b> – связь только по смыслу: <i>быстро бежать, говорить смеясь</i>`},
    {id: "B10", title: "В10. Грамматическая основа предложения", rule: `<b>🔹 Подлежащее</b> – о ком/о чём говорится.<br><br><b>🔹 Сказуемое</b> – что говорится о подлежащем.<br><br><b>Виды сказуемого:</b><br><table><tr><th>Тип</th><th>Пример</th></tr>
    <tr><td>простое глагольное</td><td>Он <u>читает</u></td></tr>
    <tr><td>составное глагольное</td><td>Он <u>начал читать</u></td></tr>
    <tr><td>составное именное</td><td>Он <u>был учителем</u></td></tr>
</table><br><b>Односоставные предложения</b><br>• определённо-личные: <i>Люблю грозу</i><br>• неопределённо-личные: <i>В дверь стучат</i><br>• безличные: <i>Мне грустно. Светает</i><br>• назывные: <i>Зима. Мороз</i>`},
    {id: "B11", title: "В11. Односоставные и двусоставные предложения", rule: `<b>🔹 Двусоставные</b> – есть и подлежащее, и сказуемое: <i>Солнце светит</i><br><br><b>🔹 Односоставные</b> – один главный член:<br><table><tr><th>Тип</th><th>Пример</th></tr>
    <tr><td>определённо-личные</td><td>Люблю грозу в начале мая</td></tr>
    <tr><td>неопределённо-личные</td><td>В дверь стучат</td></tr>
    <tr><td>безличные</td><td>Мне холодно. Вечереет</td></tr>
    <tr><td>назывные</td><td>Зима. Мороз и солнце</td></tr>
</table>`},
    {id: "B12", title: "В12. Однородные члены предложения", rule: `<b>🔹 Однородные члены</b> отвечают на один вопрос, относятся к одному слову.<br><br><b>Запятая ставится:</b><br>• между однородными членами без союзов: <i>Яблоки, груши, сливы</i><br>• перед противительными союзами: <i>Не красивый, а умный</i><br>• перед повторяющимися союзами: <i>И снег, и ветер, и мороз</i><br><br><b>Запятая не ставится:</b><br>• между однородными членами с одиночным союзом <b>и</b><br>• в фразеологизмах: <i>ни свет ни заря</i>`},
    {id: "B13", title: "В13. Обособленные члены предложения", rule: `<b>🔹 Обособляются</b><br>• причастный оборот после определяемого слова: <i>Лес, <u>покрытый инеем</u>, стоял</i><br>• деепричастный оборот: <i><u>Спустившись к реке</u>, мы увидели лодку</i><br>• приложение: <i>Сосед, <u>мужчина лет пятидесяти</u>, вышел</i><br>• уточняющие члены: <i>Там, <u>на горе</u>, стоял дом</i><br><br><b>🔹 Не обособляются</b><br>• определение перед определяемым словом<br>• фразеологизмы: <i>работал спустя рукава</i><br>• деепричастия, перешедшие в наречия: <i>сидел молча</i>`},
    {id: "B14", title: "В14. Уточняющие члены предложения", rule: `<b>🔹 Уточняющие члены</b> сужают понятие, выделяются запятыми.<br><br><b>Примеры:</b><br>• места: <i>Там, <u>внизу</u>, шумела река</i><br>• времени: <i>Вечером, <u>после заката</u>, стало прохладно</i><br>• образа действия: <i>Он говорил тихо, <u>почти шёпотом</u></i>`},
    {id: "B15", title: "В15. Знаки препинания в предложениях со сравнительными оборотами", rule: `<b>🔹 Сравнительный оборот выделяется запятыми</b><br>• <i>Она пела, <u>как соловей</u></i><br>• <i>Глаза её сияли, <u>словно звёзды</u></i><br><br><b>🔹 Запятая не ставится</b><br>• если оборот входит в состав сказуемого: <i>Глаза <u>как звёзды</u></i><br>• если оборот – фразеологизм: <i>Он работает <u>как вол</u></i><br>• перед <b>как</b> есть отрицание: <i>Он говорил не <u>как учитель</u></i><br><br><b>Запомнить:</b> <i>как правило, как всегда, как сейчас</i> – вводные сочетания, выделяются запятыми.`},
    {id: "B16", title: "В16. Знаки препинания в предложениях с вводными словами и обращениями", rule: `<b>🔹 Вводные слова</b> выделяются запятыми<br>• уверенность: <i>конечно, безусловно</i><br>• неуверенность: <i>кажется, возможно</i><br>• чувства: <i>к счастью, к сожалению</i><br>• источник: <i>по-моему, говорят</i><br>• порядок: <i>во-первых, итак</i><br><br><b>Не являются вводными</b>: <i>авось, будто, вдруг, ведь, даже, как будто, словно, якобы</i><br><br><b>🔹 Обращения</b> выделяются запятыми: <i>Иван, принеси книгу</i>`},
    {id: "B17", title: "В17. Морфологические нормы (образование форм слова)", rule: `<b>🔹 Имена существительные</b><br>• директор<u>а</u>, профессор<u>а</u>, но договор<u>ы</u>, инженер<u>ы</u><br>• Родительный падеж мн.ч.: нет чулок, носков, апельсинов, помидоров, но яблок<br><br><b>🔹 Образование степеней сравнения</b><br>• красивый – красивее – самый красивый<br><br><b>🔹 Числительные</b><br>• оба (м.р.) – обе (ж.р.)<br>• склонение: пятидесяти, пятьюдесятью, двухсот, двумстам`},
    {id: "B18", title: "В18. Синтаксические нормы (управление, согласование)", rule: `<b>🔹 Согласование</b><br>• сказуемое с подлежащим в роде и числе: <i>Большинство согласил<u>ось</u></i><br><br><b>🔹 Управление</b><br>• заведующий чем (не чего)<br>• оплатить что (не за что)<br>• согласно чему, благодаря чему (Д.п.)<br>• вопреки чему (Д.п.)`},
    {id: "B19", title: "В19. Речевые нормы (плеоназм, тавтология)", rule: `<b>🔹 Плеоназм</b> – употребление лишних слов: <i>свободная вакансия, хронометраж времени</i><br><br><b>🔹 Тавтология</b> – повтор однокоренных слов: <i>рассказывать рассказ, спросить вопрос</i><br><br><b>🔹 Лексическая несочетаемость</b><br><i>играть значение (играть роль / иметь значение)</i><br><i>одержать поражение (одержать победу / потерпеть поражение)</i>`},
    {id: "B20", title: "В20. Словообразовательный разбор", rule: `<b>🔹 Способы образования:</b><br>• приставочный<br>• суффиксальный<br>• приставочно-суффиксальный<br>• сложение<br>• переход из одной части речи в другую<br><br><b>🔹 Слова женского рода образованы от мужского:</b> <i>покупательница → покупатель</i><br><br><b>🔹 Слова на -ние образованы от глаголов:</b> <i>страдание → страдать</i><br><br><b>🔹 Слова на -тель образованы от глаголов:</b> <i>исследователь → исследовать</i><br><br><b>🔹 Наречия образованы от прилагательных:</b> <i>живой → вживую, частый → зачастую</i>`},
    {id: "B21", title: "В21. Текст. Типы связи предложений", rule: `<b>🔹 Цепная связь</b> – повтор ключевого слова, местоимение: <i>В лесу рос дуб. <u>Он</u> был могучим.</i><br><br><b>🔹 Параллельная связь</b> – одинаковый порядок слов, однотипные конструкции: <i>Солнце светит ярко. Птицы поют громко.</i><br><br><b>🔹 Средства связи:</b> местоимения, лексический повтор, синонимы, союзы, наречия, синтаксический параллелизм.`},
    {id: "B22", title: "В22. Анализ текста (проблема, идея, средства выразительности)", rule: `<b>🔹 Средства выразительности</b><br>• эпитеты: <i>золотая осень</i><br>• метафоры: <i>костёр рябины красной</i><br>• сравнения: <i>лёд как сахар</i><br>• олицетворения: <i>ветер воет</i><br>• гиперболы: <i>не видел тебя сто лет</i><br><br><b>🔹 Проблема</b> – вопрос, который поднимает автор.<br><br><b>🔹 Идея</b> – главная мысль текста.`}
];

let historyFacts = ["📚 Учи правила — сдавай экзамены", "🎯 Готовься к ЦЭ/ЦТ с нами", "📖 Повторение — мать учения", "✍️ Пиши грамотно, говори правильно"];

function renderTasks() {
    const now = new Date(); document.getElementById('currentDate').innerText = `${now.getDate()} ${now.toLocaleString('ru', { month: 'long' })} ${now.getFullYear()}`;
    const container = document.getElementById('tasksList'); container.innerHTML = '';
    const card = document.createElement('div'); card.className = 'subject-card';
    card.innerHTML = `<div class="subject-title">📋 Задания ЦЭ/ЦТ</div><div class="task-grid" id="taskGrid"></div>`;
    container.appendChild(card);
    const grid = document.getElementById('taskGrid');
    sections.forEach(section => {
        const btn = document.createElement('div');
        btn.className = 'task-btn';
        btn.innerText = section.id;
        btn.onclick = () => showRule(section);
        grid.appendChild(btn);
    });
}

function showRule(section) {
    document.getElementById('ruleHeader').innerText = section.title;
    document.getElementById('ruleText').innerHTML = section.rule;
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('ruleScreen').style.display = 'block';
}

function backToTasks() {
    document.getElementById('mainScreen').style.display = 'block';
    document.getElementById('ruleScreen').style.display = 'none';
    renderTasks();
}

function renderStats() {
    let totalLearned = 0;
    const saved = localStorage.getItem("russian_rules_viewed");
    const viewed = saved ? JSON.parse(saved) : [];
    sections.forEach(s => { if(viewed.includes(s.id)) totalLearned++; });
    const percent = sections.length ? Math.round((totalLearned / sections.length) * 100) : 0;
    document.getElementById('statsContent').innerHTML = `<div class="stat-card"><div style="font-size:48px;">📊</div><div style="font-size:48px;font-weight:800;color:#9bbf7a;">${percent}%</div><div>правил изучено</div><div class="stat-card" style="margin-top:16px;"><div>📚 Просмотрено: ${totalLearned} / ${sections.length}</div></div></div>`;
}

function renderProfile() {
    const user = tg?.initDataUnsafe?.user;
    const randomFact = historyFacts[Math.floor(Math.random() * historyFacts.length)];
    const avatarHtml = user?.photo_url ? `<img src="${user.photo_url}" style="width:80px;height:80px;border-radius:80px;margin:0 auto 16px;display:block;object-fit:cover;">` : `<div style="width:80px;height:80px;border-radius:80px;background:linear-gradient(135deg,#9bbf7a,#7dab5a);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:40px;">📖</div>`;
    document.getElementById('profileContent').innerHTML = `<div class="stat-card">${avatarHtml}<div style="font-size:24px;font-weight:bold;">${user?.first_name || "Гость"}</div><div style="color:#9bbf7a;">🎓 Готовься к ЦЭ/ЦТ</div></div><div class="stat-card"><div style="font-size:18px;margin-bottom:12px;">📖 Совет дня</div><div style="font-size:14px;">${randomFact}</div></div>`;
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
    document.getElementById('tasksList').style.display = 'none'; document.getElementById('statsContent').style.display = 'none'; document.getElementById('profileContent').style.display = 'none';
    if (tab === 'tasks') { document.getElementById('tasksList').style.display = 'block'; renderTasks(); }
    if (tab === 'stats') { document.getElementById('statsContent').style.display = 'block'; renderStats(); }
    if (tab === 'profile') { document.getElementById('profileContent').style.display = 'block'; renderProfile(); }
}

document.querySelectorAll('.tab').forEach(tab => { tab.addEventListener('click', () => switchTab(tab.dataset.tab)); });

renderTasks();
renderStats();
renderProfile();
switchTab('tasks');
</script>
</body>
</html>
