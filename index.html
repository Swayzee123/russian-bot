<script>
const sections = [
{"id":"А1","title":"А1. Гласная в корне","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Алгоритм:</b><br>1️⃣ Корни с чередующимися гласными<br>2️⃣ Подбери проверочное слово<br>3️⃣ Не получается → словарное</div><div class="info-block green"><i class="fas fa-exchange-alt"></i> <b>Гар/гор, клан/клон, твар/твор</b> (без уд.→О); <b>зар/зор</b> (без уд.→А); <b>плав/плов</b> (А, кроме пловец/пловчиха); <b>кас/кос</b> (суфф.А→А); <b>лаг/лож</b> (Г→А, Ж→О); <b>раст/ращ/рос</b> (СТ,Щ→А); <b>скак/скоч</b> (К→А, Ч→О); <b>мак/мок</b> (мак=погруж., мок=мокр.); <b>равн/ровн</b> (равн=одинак., ровн=гладк.).</div><div class="info-block pink"><i class="fas fa-star"></i> <b>Искл.:</b> <span class="ex-word">пригарь, выгарки, утварь; скачу, скачок; росток, Ростов, Ростислав, ростовщик, отрасль; поровну, уровень, ровесник, равнина</span></div><div class="info-block yellow"><i class="fas fa-exclamation-triangle"></i> <b>НЕЛЬЗЯ с -ыва-, -ива-:</b> <span class="ex-word">опоздать</span> (поздний) ✅, <span class="ex-word">опаздывать</span> ❌</div>`},
{"id":"А2","title":"А2. Гласная в корне","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Алгоритм:</b> 1️⃣ Корни е/и? 2️⃣ Проверочное? 3️⃣ Словарное? 4️⃣ пре-/при-?</div><div class="info-block green"><i class="fas fa-exchange-alt"></i> <b>Е/И:</b> бер/бир, дер/дир, мер/мир, пер/пир, тер/тир, блест/блист, жег/жиг, стел/стил, чет/чит. Суфф.А → И. Искл.: сочетать, сочетание, чета.</div><div class="info-block blue"><i class="fas fa-code-branch"></i> <b>ПРЕ-:</b> =очень (премилый), =пере (преградить). <b>ПРИ-:</b> приближение, присоединение, близость, неполнота.</div><div class="info-block purple"><i class="fas fa-star"></i> <b>ПРИ-:</b> <span class="ex-word">привередливый, примитивный, привлекательный, прилежный, привилегия, приоритет, примадонна, приватный, присутствие, прибор</span>. <b>ПРЕ-:</b> <span class="ex-word">беспрекословный, знаки препинания, камень преткновения, непреклонный, преамбула, президент, преимущество, препятствие, престиж, преследовать, прецедент</span></div>`},
{"id":"А3","title":"А3. Согласные в корне","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Алгоритм:</b> 1️⃣ Озвонч./оглуш.? 2️⃣ Проверь однокоренным. 3️⃣ Словарное?</div><div class="info-block green"><i class="fas fa-volume-up"></i> <b>Проверяемые:</b> <span class="ex-word">просьба—просить, резьба—резать</span>. Искл.: <span class="ex-word">свадьба</span></div><div class="info-block blue"><i class="fas fa-book"></i> <b>Непроверяемые:</b> <span class="ex-word">космонавт, вокзал, бутсы, анекдот, здесь, здоровье, здание, футбол</span></div><div class="info-block green"><i class="fas fa-volume-up"></i> <b>Непроизносимые:</b> <span class="ex-word">солнце—солнышко</span>. Непровер.: <span class="ex-word">лестница, чувство, сверстник, праздник, ландшафт, ветчина</span>. Без: <span class="ex-word">грейпфрут, блеснуть, шествовать</span></div><div class="info-block orange"><i class="fas fa-exchange-alt"></i> <b>З-/С-:</b> З- перед гласн. и звонк., С- перед глух. диз-/дис-: дис- перед согл., диз- перед гласн.</div>`},
{"id":"А4","title":"А4. Суффиксы и окончания","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>1️⃣ Перед ВШ,В,ВШИ,НН,Л → как в инф. (искл.: -ИТЬ→перед НН пишем Е). 2️⃣ Перед М,Щ → причастия. 3️⃣ Окончания → спряжение.</b></div><div class="info-block green"><i class="fas fa-crown"></i> <b>Причастия наст. вр.:</b> Действ.: 1 спр. -ущ/-ющ (читающий), 2 спр. -ащ/-ящ (клеящий). Страдат.: 1 спр. -ем/-ом (читаемый), 2 спр. -им (видимый).</div><div class="info-block blue"><i class="fas fa-running"></i> <b>Спряжение:</b> 1 спр: -ать, -еть, -ять, -оть, -уть, -ти, -чь (+брить, стелить). 2 спр: -ить (+гнать, дышать, держать, слышать, смотреть, видеть, ненавидеть, терпеть, зависеть, вертеть, обидеть).</div>`},
{"id":"А5","title":"А5. НЕ и НИ","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>НЕ:</b> отрицание; двойное НЕ=утверждение (<span class="ex-word">нельзя не уважать</span>); не раз/не один=много; <span class="ex-word">свет не мил</span>; вовсе/далеко/отнюдь не.</div><div class="info-block blue"><i class="fas fa-ban"></i> <b>НИ:</b> усиление (<span class="ex-word">ни гроша</span>); ни...ни; ни разу=никогда; <span class="ex-word">ни свет ни заря, ни жив ни мёртв, ни пуха ни пера, ни слуху ни духу</span></div><div class="info-block orange"><i class="fas fa-exchange-alt"></i> НЕ под уд.=Е (<span class="ex-word">негде</span>), НИ без уд.=И (<span class="ex-word">никогда</span>)</div>`},
{"id":"А6","title":"А6. Слитное/раздельное НЕ","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>Слитно:</b> синоним без НЕ, без НЕ не употр., есть «НО».</div><div class="info-block blue"><i class="fas fa-times-circle"></i> <b>Раздельно:</b> есть «А»; вовсе/далеко/отнюдь не; никто не.</div><div class="info-block purple"><i class="fas fa-pen-fancy"></i> <b>НЕ с причастиями:</b> Слитно — нет зависимого. Раздельно — есть зависимое.</div><div class="info-block yellow"><i class="fas fa-exclamation-triangle"></i> Краткие причастия ВСЕГДА раздельно! Глаголы/деепричастия ВСЕГДА раздельно.</div>`},
{"id":"А7","title":"А7. Сложные слова","rule":`<div class="info-block green"><i class="fas fa-link"></i> <b>Слитно:</b> <span class="ex-word">авиа-, авто-, био-, гео-, кино-, метео-, радио-, теле-, фото-, электро-, анти-, архи-, контр-, супер-, ультра-, экстра-</span></div><div class="info-block blue"><i class="fas fa-hyphen"></i> <b>Дефис:</b> <span class="ex-word">альфа-, блок-, веб-, вице-, лейб-, макси-, мини-, онлайн-, обер-, поп-, пресс-, рок-, штаб-, экс-</span></div><div class="info-block green"><i class="fas fa-star"></i> <b>Сущ. СЛИТНО:</b> -метр; сложносокр.; полу-; числительное. <b>ДЕФИС:</b> стороны света; оценка; научные; географические.</div><div class="info-block yellow"><i class="fas fa-star"></i> <b>ПОЛ-:</b> Слитно. Дефис — перед Л, гласн., прописн. Раздельно — есть слово между.</div>`},
{"id":"А8","title":"А8. Союзы, предлоги, наречия","rule":`<div class="info-block green"><i class="fas fa-link"></i> <b>Союзы СЛИТНО:</b> зато=но, тоже/также=и, чтобы=каб, итак=следовательно, оттого=потому что. <b>РАЗДЕЛЬНО:</b> за то, то же, что бы, и так, при том, от того.</div><div class="info-block purple"><i class="fas fa-map-marker-alt"></i> <b>Предлоги СЛИТНО:</b> <span class="ex-word">благодаря, ввиду, вопреки, несмотря на, вследствие, наподобие, навстречу</span>. <b>РАЗДЕЛЬНО:</b> <span class="ex-word">в течение, в продолжение, в заключение, в связи с, в отличие от, по мере, по поводу</span></div><div class="info-block yellow"><i class="fas fa-star"></i> <b>в заключение</b> вечера vs <b>в заключении</b> (находится). <b>в течение</b> года vs <b>в течении</b> реки.</div>`},
{"id":"А9","title":"А9. Тире","rule":`<div class="info-block green"><i class="fas fa-minus"></i> <b>Ставится:</b> сущ.—сущ., инф.—инф., числ.—числ., это/вот/значит.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>НЕ ставится:</b> перед как/словно/будто; перед есть; подлежащее — личное мест.; сказуемое — прилагательное; перед НЕ (кроме инф.); фразеологизм; перед также/тоже.</div>`},
{"id":"А10","title":"А10. Обособленные","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>Дееприч. оборот</b> — ВСЕГДА обособл., кроме: фразеологизм, одиночное сразу за сказуемым.</div><div class="info-block blue"><i class="fas fa-check-circle"></i> <b>«Несмотря на»</b> — всегда обособляется!</div><div class="info-block green"><i class="fas fa-check-circle"></i> <b>Причастный оборот:</b> ПОСЛЕ опр. — обособл. ПЕРЕД опр. — НЕ обособл.</div>`},
{"id":"А11","title":"А11. Вводные слова","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Вводные ВСЕГДА обособляются!</b></div><div class="info-block green"><i class="fas fa-comment-dots"></i> <b>Обозначают:</b> уверенность, чувства, источник, порядок мыслей.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>НЕ вводные:</b> <span class="ex-word">авось, вот, едва ли, лишь, притом, будто, именно, между тем, причём, действительно, буквально, вряд ли, к тому же, просто, вдруг, словно, примерно, ведь, даже, как раз, якобы</span></div>`},
{"id":"А12","title":"А12. Однородные члены","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>Ставится:</b> Перечисление. Противительные (а, но, да=но, однако, зато, же). Повторяющиеся (и...и, ни...ни). Двойные (не только...но и, как...так и).</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>НЕ ставится:</b> Одиночные и/да=и/или/либо. Фразеологизмы: <span class="ex-word">ни свет ни заря, и так и этак, за все про все</span>.</div>`},
{"id":"А13","title":"А13. ССП и СПП","rule":`<div class="info-block green"><i class="fas fa-code-branch"></i> <b>ССП</b> — запятая между частями. <b>НЕ ставится:</b> Общий второст. член; общее вводное; оба вопросит./восклицат.; оба безличные; оба назывные.</div><div class="info-block blue"><i class="fas fa-sitemap"></i> <b>СПП — НЕ ставится:</b> Есть НЕ/повторяющийся союз/ни...ни; придаточная из одного слова; фразеологизм; однородные придаточные с И.</div><div class="info-block yellow"><i class="fas fa-exclamation-triangle"></i> <b>Стык союзов:</b> Ставится — если НЕТ (то, но). НЕ ставится — если ЕСТЬ (то, но).</div>`},
{"id":"А14","title":"А14. БСП","rule":`<div class="info-block green"><i class="fas fa-comma"></i> <b>Запятая</b> — перечисление.</div><div class="info-block blue"><i class="fas fa-colon"></i> <b>Двоеточие:</b> пояснение (а именно), изъяснение (что), причина (потому что), прямой вопрос.</div><div class="info-block pink"><i class="fas fa-minus"></i> <b>Тире:</b> противопоставление, условие (если), время (когда), следствие, быстрая смена.</div>`},
{"id":"А15","title":"А15. Прямая речь","rule":`<div class="info-block green"><i class="fas fa-quote-left"></i> <b>Схемы:</b> «П», — а. | «П, — а. — П». | «П, — а: — П» (2 сказуемых).</div><div class="info-block blue"><i class="fas fa-quote-right"></i> <b>Цитаты:</b> 1) Как прямая речь. 2) [ ], что «цитата». 3) Вводное, «цитата».</div><div class="info-block purple"><i class="fas fa-comments"></i> <b>Диалог:</b> Каждая реплика с абзаца, перед каждой — тире.</div>`},
{"id":"А16","title":"А16. Запятая перед КАК","rule":`<div class="info-block green"><i class="fas fa-check-circle"></i> <b>Ставится:</b> Причина (=будучи); сравнение (=будто); указат. слова; СПП; вводные (как правило); не кто иной, как; как и.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>НЕ ставится:</b> Составное сказуемое (<span class="ex-word">Город как сад</span>); = «в качестве»; как...так и; в начале предложения; фразеологизм.</div>`},
{"id":"А17","title":"А17. Разные виды связи","rule":`<div class="info-block green"><i class="fas fa-code-branch"></i> <b>Стык союзов:</b> Ставится — если НЕТ (то, но). НЕ ставится — если ЕСТЬ (то, но).</div><div class="info-block blue"><i class="fas fa-table"></i> <b>Типы:</b> сочинение+подчинение, подчинение+бессоюзие, сочинение+бессоюзие, все три вида.</div>`},
{"id":"А18","title":"А18. Текст","rule":`<div class="info-block green"><i class="fas fa-palette"></i> <b>Типы:</b> Описание. Повествование. Рассуждение.</div><div class="info-block blue"><i class="fas fa-book"></i> <b>Стили:</b> Научный, публицистический, художественный.</div>`},
{"id":"В1","title":"В1. Связь предложений","rule":`<div class="info-block green"><i class="fas fa-link"></i> 1️⃣ <b>Союз</b> (в начале 2-го): И, А, НО, ОДНАКО, ТОЖЕ, ТАКЖЕ. 2️⃣ <b>Лексический повтор</b>. 3️⃣ <b>Синонимическая замена</b>. 4️⃣ <b>Местоимение</b>.</div>`},
{"id":"В2","title":"В2. Лексика","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> <b>Синонимы</b> — близкие. <b>Антонимы</b> — противоположные. <b>Однозначные</b>: жёлтый, сорока, мечтать. <b>Многозначные</b>: ножка, шляпка, идти.</div>`},
{"id":"В3","title":"В3. Орфоэпия","rule":`<div class="info-block green"><i class="fas fa-volume-up"></i> <b>Ударение:</b> катал<b>о</b>г, кварт<b>а</b>л, догов<b>о</b>р, дос<b>у</b>г, звон<b>и</b>т, т<b>о</b>рты, б<b>а</b>нты, крас<b>и</b>вее, бал<b>о</b>ванный, кровоточ<b>и</b>ть, облегч<b>и</b>ть, щав<b>е</b>ль.</div>`},
{"id":"В4","title":"В4. Фразеология","rule":`<div class="info-block green"><i class="fas fa-book-open"></i> <b>Фразеологизмы:</b> бить баклуши (бездельничать), спустя рукава (небрежно), сломя голову (быстро), кот наплакал (мало), водить за нос (обманывать), как снег на голову (внезапно), ахиллесова пята (слабое место).</div>`},
{"id":"В5","title":"В5. Фонетика","rule":`<div class="info-block green"><i class="fas fa-volume-up"></i> <b>Звонкие:</b> б, в, г, д, ж, з, л, м, н, р, й. <b>Всегда мягкие:</b> щ, ч, й. <b>Всегда твёрдые:</b> ж, ш, ц.</div><div class="info-block blue"><i class="fas fa-exchange-alt"></i> <b>Оглушение:</b> в конце слова и перед глухим. <b>Озвончение:</b> перед звонким. <b>Смягчение:</b> мягкий смягчает предыдущий.</div>`},
{"id":"В6","title":"В6. Местоимение","rule":`<div class="info-block green"><i class="fas fa-users"></i> <b>Разряды:</b> Личные (я, ты, он), возвратное (себя), притяжательные (мой, твой), указательные (этот, тот), определительные (весь, каждый), вопросительные (кто, что, какой), относительные, неопределённые, отрицательные (никто, ничто).</div>`},
{"id":"В7","title":"В7. Существительное","rule":`<div class="info-block green"><i class="fas fa-venus-mars"></i> <b>Род:</b> мужской, женский, средний, общий.</div><div class="info-block blue"><i class="fas fa-list-ol"></i> <b>Склонение:</b> 1 скл. (заря: а/я, е, е), 2 скл. (стол: □/о/е, у/ю, е), 3 скл. (ночь: □, и, и). Разносклоняемые: 10 на -мя + путь, дитя.</div><div class="info-block yellow"><i class="fas fa-star"></i> Слова на -ия, -ие, -ий: в Д.п. и П.п. с <b>И</b>. Искл.: на острие, в забытьи.</div>`},
{"id":"В8","title":"В8. Глагол","rule":`<div class="info-block green"><i class="fas fa-clock"></i> <b>Вид:</b> Совершенный (что сделать?), Несовершенный (что делать?).</div><div class="info-block blue"><i class="fas fa-arrows-alt-h"></i> <b>Переходность:</b> Переходный (В.п. без предлога). Непереходный.</div><div class="info-block purple"><i class="fas fa-sync-alt"></i> <b>Возвратность:</b> Возвратный (-ся, -сь). Невозвратный.</div><div class="info-block pink"><i class="fas fa-running"></i> <b>Спряжение:</b> 1 спр: -ать, -еть, -ять, -оть, -уть, -ти, -чь (+брить, стелить). 2 спр: -ить (+гнать, дышать, держать, слышать, смотреть, видеть, ненавидеть, терпеть, зависеть, вертеть, обидеть). Разноспрягаемые: хотеть, бежать.</div>`},
{"id":"В9","title":"В9. Словосочетание","rule":`<div class="info-block green"><i class="fas fa-link"></i> <b>Согласование:</b> завис. — прилагательное (какой?): <span class="ex-word">красивый дом</span>.</div><div class="info-block blue"><i class="fas fa-link"></i> <b>Управление:</b> завис. — предмет (падежные вопросы): <span class="ex-word">читать книгу</span>.</div><div class="info-block purple"><i class="fas fa-link"></i> <b>Примыкание:</b> завис. — неизменяемая (наречие, дееприч., инфинитив): <span class="ex-word">бежать быстро</span>.</div>`},
{"id":"В10","title":"В10. Ы/И, Ъ/Ь, О/Ё","rule":`<div class="info-block green"><i class="fas fa-pen-fancy"></i> <b>О/Ё после шипящих:</b> Есть Е → Е. Нет Е → О. Глагол/отглагольное → Ё. -ёр- → Ё (стажёр, искл.: мажор).</div><div class="info-block orange"><i class="fas fa-exchange-alt"></i> <b>Ы/И после приставки:</b> И после: меж, интер, пост, сверх, контр, суб, дез, транс, супер, гипер, пан, двух/трёх/четырёх. Ы — после других. Искл.: взимать.</div><div class="info-block purple"><i class="fas fa-exchange-alt"></i> <b>Ы/И после Ц:</b> В корне → И. Искл.: <span class="ex-word">цыган, цыпочки, цыкать, цыплёнок, цыц</span>. Не в корне → Ы.</div><div class="info-block pink"><i class="fas fa-pen-fancy"></i> <b>Ь после шипящей:</b> Сущ. ж.р. ед.ч. (дочь), глагол (сечь), наречия (наотмашь), лишь/бишь/вишь/ишь. <b>Ъ:</b> перед Е, Ё, Ю, Я после приставки.</div>`},
{"id":"В11","title":"В11. Н и НН","rule":`<div class="info-block green"><i class="fas fa-paint-brush"></i> <b>От сущ.:</b> -ан-, -ян-, -ин-: <span class="ex-word">кожаный, волосяной</span>. Искл.: <span class="ex-word">стеклянный, оловянный, деревянный</span>. -онн-, -енн-: <span class="ex-word">художественный</span>. Искл.: <span class="ex-word">ветреный</span> (но: безветренный).</div><div class="info-block blue"><i class="fas fa-paint-brush"></i> <b>От глагола:</b> -ованный, -еванный → НН. Искл.: <span class="ex-word">клёваный, жёваный, кованый</span>.</div><div class="info-block pink"><i class="fas fa-star"></i> <b>НН:</b> <span class="ex-word">данный, деревянный, желанный, медленный, невиданный, нежданный, неожиданный, священный, стеклянный</span>. <b>Н:</b> <span class="ex-word">ветряной, зелёный, масленый, румяный, смышлёный, юный</span>.</div>`},
{"id":"В12","title":"В12. Алгоритм орфографии","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> Читать по буквам, проверять всю орфографию!</div>`},
{"id":"В13","title":"В13. Алгоритм пунктуации","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> 1️⃣ Стык союзов. 2️⃣ Двоеточие. 3️⃣ Однородные. 4️⃣ Причастный оборот.</div>`},
{"id":"В14","title":"В14. Лексика","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> <b>Синонимы</b> (близкие), <b>Антонимы</b> (противоположные), <b>Многозначные</b> (несколько значений), <b>Омонимы</b> (одинаково пишутся, разное значение).</div>`},
{"id":"В15","title":"В15. Простое предложение","rule":`<div class="info-block green"><i class="fas fa-lightbulb"></i> Нераспространённое (только главные), распространённое (главные + второстепенные).</div>`},
{"id":"В16","title":"В16. Вводные слова","rule":`<div class="info-block green"><i class="fas fa-comment-dots"></i> <b>Вводные:</b> уверенность, чувства, источник, порядок мыслей.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>НЕ вводные:</b> <span class="ex-word">авось, вот, едва ли, лишь, будто, именно, между тем, действительно, буквально, вряд ли, к тому же, просто, вдруг, словно, примерно, ведь, даже, как раз, якобы</span></div>`},
{"id":"В17","title":"В17. Морфологические нормы","rule":`<div class="info-block green"><i class="fas fa-pen-fancy"></i> <b>Краткие прилагательные:</b> каков? какова? каково? каковы?</div>`},
{"id":"В18","title":"В18. Синтаксические нормы","rule":`<div class="info-block green"><i class="fas fa-exclamation-triangle"></i> <b>Ошибки:</b> управление, однородные, деепричастный оборот, причастный оборот, смешение прямой и косвенной речи.</div>`},
{"id":"В19","title":"В19. Состав слова","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Алгоритм:</b> 1️⃣ Часть речи (по вопросу!!!). 2️⃣ СМС. 3️⃣ Изменяем слово.</div><div class="info-block pink"><i class="fas fa-ban"></i> <b>Нет окончания:</b> наречие (<span class="ex-word">легко</span>), деепричастие (<span class="ex-word">читая</span>), инфинитив (<span class="ex-word">писать</span>), сравн. степень (<span class="ex-word">красивее</span>).</div>`},
{"id":"В20","title":"В20. Словообразование","rule":`<div class="info-block green"><i class="fas fa-code-branch"></i> <b>Способы:</b> Суффиксальный (убрать суффикс: водопроводчик→водопровод). Сложение (2 слова: водоснабжение). Сложение+суффиксация (нельзя убрать: сорокалетний).</div>`},
{"id":"В21","title":"В21. Служебные части речи","rule":`<div class="info-block green"><i class="fas fa-link"></i> <b>Союз</b> — связывает однородные, части СП. <b>Предлог</b> — связывает слова. <b>Частица</b> — оттенки значения: <span class="ex-word">хоть бы, ведь, даже, же</span>.</div><div class="info-block blue"><i class="fas fa-star"></i> <b>Подчинительные союзы:</b> благодаря тому что, будто, чтобы, если, как, когда, поскольку, так как, хотя, что. <b>Союзные слова:</b> чей, какой, который, что, кто, где, куда, когда, откуда, почему, зачем.</div>`},
{"id":"В22","title":"В22. Пунктуация","rule":`<div class="info-block orange"><i class="fas fa-lightbulb"></i> <b>Алгоритм:</b> 1️⃣ Посчитать части. 2️⃣ Найти союзы. 3️⃣ Схема: квадратные=главная, круглые=придаточная. 4️⃣ Обороты, обращения, вводные — «выкидываем».</div><div class="info-block pink"><i class="fas fa-exclamation-triangle"></i> <b>Ловушки:</b> <span class="ex-word">Несмотря на…</span> — обособленное. <span class="ex-word">Несмотря на то что</span> — подчинительный союз.</div>`}

function plainOptions(options){return options.map(function(o){return o.replace(/^\d\)\s*/,'')})}

function applyPattern(options,pattern){
return pattern.map(function(index){return options[index]})}

function remapAnswer(answer,pattern){
const original=answer.split('').map(function(v){return parseInt(v,10)-1});
const mapped=original.map(function(idx){return pattern.indexOf(idx)+1}).sort(function(a,b){return a-b});
return mapped.join('')}

function expandQuestionPool(seed,total){
const patterns=[
[0,1,2,3,4],
[1,2,3,4,0],
[2,3,4,0,1],
[4,0,2,1,3],
[3,1,4,0,2],
[2,4,1,3,0],
[1,3,0,4,2]
];
const out=[];
for(let i=0;i<total;i++){
const src=seed[i%seed.length];
const pattern=patterns[Math.floor(i/seed.length)%patterns.length];
const baseOptions=plainOptions(src.options);
const rotated=applyPattern(baseOptions,pattern);
out.push({
num:i+1,
text:src.text,
options:rotated.map(function(opt,idx){return(idx+1)+') '+opt}),
answer:remapAnswer(src.answer,pattern)
})}
return out}

'А1':`<div class="info-block blue"><i class="fas fa-seedling"></i><b>Из конспектов:</b> корни <b>гар/гор, клан/клон, твар/твор</b> без ударения пишутся с <b>О</b>; <b>зар/зор</b> без ударения с <b>А</b>; <b>плав/плов</b> почти всегда с <b>А</b>, кроме <span class="ew">пловец, пловчиха, плывун</span>.</div><div class="info-block purple"><i class="fas fa-book"></i><b>Ловушка проверки:</b> нельзя проверять безударную гласную формами на <span class="ew">-ыва-/-ива-</span>. Правильно: <span class="ew">опоздать → поздний</span>, а не <span class="ew">опаздывать</span>.</div>`,
'А2':`<div class="info-block yellow"><i class="fas fa-highlighter"></i><b>Чередование Е/И:</b> <span class="ew">бир/бер, мир/мер, тир/тер, дир/дер, чит/чет, пир/пер, жиг/жег, стил/стел, блист/блест</span>. Если после корня идёт <b>А</b>, обычно пишем <b>И</b>.</div><div class="info-block pink"><i class="fas fa-list"></i><b>Слова, которые часто просят выучить:</b> <span class="ew">привередливый, примитивный, приоритет, присутствовать, прибор, президент, препятствие, престиж, претензия, претендент, презентация, пренебрегать</span>.</div>`,
'А3':`<div class="info-block blue"><i class="fas fa-tools"></i><b>Ещё по теме:</b> суффикс <span class="ew">-чик-</span> пишется после <b>д, т, з, с, ж</b>, в остальных случаях чаще <span class="ew">-щик-</span>: <span class="ew">разведчик, барабанщик</span>.</div><div class="info-block yellow"><i class="fas fa-volume-up"></i><b>Подсказка:</b> все глухие удобно помнить по фразе <span class="ew">«Стёпка, хочешь щец? Фи!»</span>. Перед ними в приставках пишем <b>С</b>.</div><div class="info-block green"><i class="fas fa-check"></i><b>Непроизносимые согласные:</b> проверяем словом, где после сомнительной согласной слышится гласная: <span class="ew">местный → место, прекрасный → прекрасен</span>. Частые исключения: <span class="ew">лестница</span>, а также словарные формы вроде <span class="ew">чувство, сверстник, праздник</span>.</div>`,
'А4':`<div class="info-block purple"><i class="fas fa-feather"></i><b>Суффикс Л:</b> перед <span class="ew">-л-</span> пишем ту же гласную, что и в инфинитиве: <span class="ew">читать → читал, увидеть → увидел</span>.</div><div class="info-block green"><i class="fas fa-sitemap"></i><b>Не определяем спряжение</b> для форм на <span class="ew">-л, -вш/-ш, -нн</span>: там работает не окончание, а правило инфинитива.</div>`,
'А5':`<div class="info-block purple"><i class="fas fa-bolt"></i><b>Когда пишем НИ:</b> для усиления отрицания, в сочетании <span class="ew">ни...ни</span>, во многих устойчивых выражениях и в придаточных уступки: <span class="ew">сколько ни старался</span>.</div><div class="info-block orange"><i class="fas fa-map-pin"></i><b>В местоимениях и наречиях:</b> под ударением обычно <b>НЕ</b> — <span class="ew">негде</span>, без ударения — <b>НИ</b> — <span class="ew">никогда, нигде</span>.</div>`,
'А6':`<div class="info-block blue"><i class="fas fa-layer-group"></i><b>По частям речи:</b> с существительными, прилагательными и наречиями на <b>-о/-е</b> смотрим на синоним, союз <b>А</b> и слова <span class="ew">вовсе, далеко, отнюдь</span>. С глаголами и деепричастиями обычно раздельно.</div><div class="info-block pink"><i class="fas fa-thumbtack"></i><b>Раздельно всегда:</b> краткие причастия, большинство числительных, формы через дефис и случаи с зависимыми словами у причастий.</div>`,
'А7':`<div class="info-block green"><i class="fas fa-link"></i><b>Слитно пишутся</b> сложные слова с иноязычными основами: <span class="ew">авто-, авиа-, агро-, аэро-, био-, вело-, видео-, гидро-, микро-, макро-, супер-, ультра-</span>.</div><div class="info-block yellow"><i class="fas fa-minus"></i><b>Пол-:</b> через дефис перед <span class="ew">л, гласной и прописной</span>: <span class="ew">пол-лимона, пол-яблока, пол-Минска</span>; раздельно, если между частями есть слово.</div>`,
'А8':`<div class="info-block orange"><i class="fas fa-directions"></i><b>Наречия:</b> слитно часто пишутся формы <span class="ew">вверх, вниз, сначала, издалека, навстречу, наизусть</span>; через дефис — <span class="ew">по-русски, во-первых, чуть-чуть, давным-давно</span>; раздельно — сочетания с предлогами <span class="ew">без оглядки, в упор, на лету</span>.</div><div class="info-block blue"><i class="fas fa-bookmark"></i><b>Предлоги-ловушки:</b> <span class="ew">ввиду, вроде, насчёт, навстречу</span> пишутся слитно, а <span class="ew">иметь в виду, в виде, в связи с, в отличие от</span> — раздельно.</div>`,
'А9':`<div class="info-block yellow"><i class="fas fa-ruler-horizontal"></i><b>Тире не ставим:</b> если есть сравнение <span class="ew">как, словно, будто</span>, отрицание <span class="ew">не</span>, глагол-связка <span class="ew">есть</span>, личное местоимение или сказуемое выражено прилагательным без особого акцента.</div>`,
'А10':`<div class="info-block purple"><i class="fas fa-wind"></i><b>Деепричастный оборот:</b> обычно обособляется, но в конспектах отдельно выделены частые исключения: <span class="ew">шёл не торопясь</span>, фразеологизмы типа <span class="ew">бежал сломя голову</span>, а также конструкции с наречием рядом.</div>`,
'А11':`<div class="info-block green"><i class="fas fa-circle-question"></i><b>Как проверить вводное:</b> его можно убрать без разрушения грамматики, к нему нельзя задать вопрос как к члену предложения, и оно часто выражает отношение говорящего.</div>`,
'А12':`<div class="info-block blue"><i class="fas fa-arrows-left-right"></i><b>Комма при однородных:</b> ставим при повторяющихся союзах, двойных союзах и противопоставлении; не ставим при одиночных <span class="ew">и/или/либо</span> и внутри устойчивых сочетаний.</div>`,
'А13':`<div class="info-block yellow"><i class="fas fa-code-branch"></i><b>СПП-матрёшка:</b> сначала ищем границы придаточных, потом смотрим на стык союзов и наличие слов <span class="ew">то, но</span>. В ССП сначала проверяем, нет ли общего элемента для двух частей.</div>`,
'А14':`<div class="info-block pink"><i class="fas fa-quote-right"></i><b>БСП по смыслу:</b> запятая = события рядом; двоеточие = пояснение, причина, раскрытие; тире = вывод, противопоставление, резкая смена событий, условие или время.</div>`,
'А15':`<div class="info-block blue"><i class="fas fa-comments"></i><b>Диалог и цитаты:</b> в диалоге каждая реплика с новой строки и с тире; цитата может оформляться как прямая речь, как часть СПП или после вводной конструкции.</div>`,
'А16':`<div class="info-block orange"><i class="fas fa-circle-nodes"></i><b>Без запятой перед КАК:</b> в значении <span class="ew">«в качестве»</span>, в составе сказуемого, во фразеологизмах и в двойном союзе <span class="ew">как..., так и...</span>.</div>`,
'А17':`<div class="info-block green"><i class="fas fa-diagram-project"></i><b>Разные виды связи:</b> сначала посчитай грамматические основы, затем определи, что связывает союз: однородные члены, части ССП или придаточную часть. После этого уже рисуй схему.</div>`,
'А18':`<div class="info-block purple"><i class="fas fa-pen"></i><b>Композиция текста:</b> описание создаёт образ предмета, повествование идёт через развитие событий, рассуждение строится как <span class="ew">мысль → аргументы → вывод</span>.</div><div class="info-block blue"><i class="fas fa-feather-pointed"></i><b>Стили речи:</b> <span class="ew">научный, публицистический, художественный, разговорный, официально-деловой</span>. Для заданий важно помнить, что разговорный связан с живым неофициальным общением, а официально-деловой — с документами, заявлениями и точными формулировками.</div>`,
'В1':`<div class="info-block yellow"><i class="fas fa-link"></i><b>Из книги:</b> к средствам связи предложений ещё относятся <span class="ew">наречия</span> и <span class="ew">одинаковый порядок слов</span>. Это особенно важно в заданиях на связность текста.</div>`,
'В2':`<div class="info-block blue"><i class="fas fa-book"></i><b>Лексикология:</b> различай <b>лексическое</b> значение слова и <b>грамматическое</b>. Однозначные слова имеют одно значение, многозначные — несколько, а контекст помогает понять нужное.</div>`,
'В5':`<div class="info-block purple"><i class="fas fa-microphone-lines"></i><b>Фонетика из учебника:</b> непарные глухие — <span class="ew">х, ц, ч</span>, непарные звонкие — <span class="ew">л, м, н, р, й</span>. Основные законы: оглушение в конце слова и перед глухим, озвончение перед звонким.</div>`,
'В6':`<div class="info-block green"><i class="fas fa-user-tag"></i><b>Местоимения:</b> в заданиях часто ловят на различии <span class="ew">вопросительных/относительных</span>, <span class="ew">неопределённых</span> и <span class="ew">отрицательных</span> разрядов, поэтому всегда смотри не только на слово, но и на его роль в предложении.</div>`,
'В7':`<div class="info-block yellow"><i class="fas fa-list-ul"></i><b>Склонение:</b> чтобы определить его правильно, ставим существительное в <span class="ew">И.п., ед.ч.</span>. Отдельно запоминаем разносклоняемые на <span class="ew">-мя</span>, а также <span class="ew">путь</span> и <span class="ew">дитя</span>.</div><div class="info-block blue"><i class="fas fa-genderless"></i><b>Несклоняемые слова</b> тоже часто попадаются в тестах: <span class="ew">шоссе, авеню, радио</span> и подобные формы не изменяются по падежам.</div>`,
'В8':`<div class="info-block pink"><i class="fas fa-repeat"></i><b>Постоянные признаки глагола:</b> вид, переходность, возвратность, спряжение. Переходность проверяем по возможности поставить зависимое слово в <span class="ew">В.п. без предлога</span>.</div>`,
'В9':`<div class="info-block orange"><i class="fas fa-paperclip"></i><b>Примыкание:</b> зависимое слово здесь неизменяемо. Чаще всего это <span class="ew">наречие, деепричастие, инфинитив</span>, а иногда и неизменяемая форма прилагательного.</div>`,
'В10':`<div class="info-block green"><i class="fas fa-pen-nib"></i><b>После шипящих:</b> в суффиксах пишутся <span class="ew">-онок-, -онк-, -ов-</span>, но <span class="ew">-ённ-, -ён, -ёр-</span> тоже нужно помнить как отдельную группу. После русских приставок на согласную <span class="ew">И → Ы</span>, но не после <span class="ew">меж-, сверх-, контр-, пост-, суб-, супер-, транс-</span>.</div>`,
'В11':`<div class="info-block purple"><i class="fas fa-spell-check"></i><b>Н/НН:</b> сначала решаем, что перед нами — прилагательное, причастие, существительное или наречие. Потом уже смотрим на суффикс, зависимые слова и вид исходного глагола.</div><div class="info-block yellow"><i class="fas fa-star"></i><b>Слова-исключения из конспекта:</b> <span class="ew">смышлёный, юный, пряный, румяный, названый брат, посажёный отец</span>.</div>`,
'В12':`<div class="info-block blue"><i class="fas fa-magnifying-glass"></i><b>Алгоритм полезнее всего работает так:</b> читаешь слово по буквам, проверяешь приставку, корень, суффикс, окончание и только потом выбираешь ответ. Не угадывай по «общему виду» слова.</div>`,
'В13':`<div class="info-block green"><i class="fas fa-diagram-successor"></i><b>Алгоритм пунктуации:</b> сначала ищем основы и союзы, потом проверяем стык союзов, однородные члены, обособленные обороты и только после этого ставим знаки.</div>`,
'В15':`<div class="info-block orange"><i class="fas fa-table-cells"></i><b>Ещё важно:</b> подлежащее может быть выражено не только существительным, но и числительным, местоимением, цельным словосочетанием: <span class="ew">четверо, большинство из нас, мало времени</span>.</div>`,
'В16':`<div class="info-block blue"><i class="fas fa-bullseye"></i><b>Речевые нормы:</b> здесь особенно важно отличать разговорную, нейтральную и книжную форму, а также следить за лексической сочетаемостью слов в контексте.</div>`,
'В17':`<div class="info-block green"><i class="fas fa-scale-balanced"></i><b>Морфологические нормы:</b> в кратких формах прилагательных, степенях сравнения и формах числительных чаще всего и прячутся ошибки. Всегда проговаривай нормативную форму целиком.</div>`,
'В18':`<div class="info-block pink"><i class="fas fa-triangle-exclamation"></i><b>Синтаксические нормы:</b> частые ошибки — неправильное управление, смешение конструкций при однородных членах, сбой в деепричастном обороте и ошибки при косвенной речи.</div>`,
'В19':`<div class="info-block yellow"><i class="fas fa-puzzle-piece"></i><b>Состав слова:</b> сначала определи часть речи, потом найди окончание изменением формы, после этого выделяй основу, корень, суффиксы и приставки. У наречий, деепричастий и инфинитива окончания нет.</div><div class="info-block blue"><i class="fas fa-list-ol"></i><b>Алгоритм:</b> 1) определить часть речи по вопросу; 2) найти самое маленькое однокоренное слово; 3) изменить форму, чтобы увидеть окончание; 4) выделить основу и только потом разбирать приставку, корень и суффиксы.</div><div class="info-block green"><i class="fas fa-thumbtack"></i><b>Нет окончания:</b> <span class="ew">легко</span> — наречие, <span class="ew">читая</span> — деепричастие, <span class="ew">писать</span> — инфинитив, <span class="ew">красивее</span> — форма сравнительной степени.</div>`,
'В20':`<div class="info-block purple"><i class="fas fa-brackets-curly"></i><b>Если в твоей версии этот раздел про члены предложения,</b> начинай с вопроса к слову и от грамматической основы двигайся к второстепенным: определение, дополнение, обстоятельство.</div>`,
'В21':`<div class="info-block green"><i class="fas fa-layer-group"></i><b>Части речи:</b> определяем только по вопросу и значению в конкретном предложении. Одно и то же слово в разных контекстах может играть разную роль.</div>`,
'В22':`<div class="info-block orange"><i class="fas fa-route"></i><b>Финальный алгоритм:</b> посчитать части предложения, найти союзы, понять, что они связывают, и только потом рисовать схему. Это самый надёжный способ не потерять запятые в сложной конструкции.</div><div class="info-block purple"><i class="fas fa-diagram-project"></i><b>Порядок работы:</b> 1) посчитать грамматические основы; 2) найти союзы и союзные слова; 3) нарисовать схему: квадратные скобки для главной части, круглые — для придаточной; 4) потом проверить обороты, обращения, вводные слова и однородные члены.</div>`

function sn(id){
const m=id.match(/\d+/);
return m?parseInt(m[0],10):0}

function sgp(id){return id.charAt(0)}

function sth(id){return sectionThemes[(sn(id)-1)%sectionThemes.length]}

function svars(id){
const t=sth(id);
return'--accent:'+t.accent+';--accent2:'+t.accent2+';--soft:'+t.soft+';'}

function fullRule(s){return s.rule+(extraTheory[s.id]||'')}

function stripRule(rule){
return rule.replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}

function previewRule(rule){
const text=stripRule(rule);
return text.length>126?text.slice(0,123)+'…':text}

function blockCount(rule){return(rule.match(/class="info-block/g)||[]).length}

function splitSections(list,group){
if(group==='А'){
return[
{title:'Орфография',items:list.filter(function(s){return sn(s.id)<=8})},
{title:'Пунктуация и текст',items:list.filter(function(s){return sn(s.id)>8})}
]}
return[
{title:'Нормы языка',items:list.filter(function(s){return sn(s.id)<=10})},
{title:'Подсказки к разбору',items:list.filter(function(s){return sn(s.id)>10})}
]}

function na(s){return s.replace(/[^0-9]/g,'').split('').sort().join('')}

function examLabelsFromAnswers(answers){
return Object.keys(answers).sort(function(a,b){
const am=a.match(/^([A-ZА-Я]+)(\d+)$/i);
const bm=b.match(/^([A-ZА-Я]+)(\d+)$/i);
if(!am||!bm)return a.localeCompare(b,'ru');
if(am[1]!==bm[1])return am[1].localeCompare(bm[1],'ru');
return Number(am[2])-Number(bm[2])})}

function nea(v){
return String(v||'').toUpperCase().replace(/Ё/g,'Е').replace(/[ABC]/g,function(ch){
return({A:'А',B:'Б',C:'С'})[ch]||ch}).replace(/[^0-9A-ZА-Я]/g,'')}

function renderExamText(text,prefix,labels){
return text.split('\n').map(function(line){
const safe=eh(line);
if(!line.trim())return'<div class="exam-line empty"></div>';
if(/^Часть\s+[АВAB]/i.test(line))return'<div class="exam-line heading">'+safe+'</div>';
if(/^Текст к заданиям/i.test(line))return'<div class="exam-line subheading">'+safe+'</div>';
const m=line.match(/^([ABАВ]\d+)\./i);
if(m){
const label=m[1].replace(/^А/,'A').replace(/^В/,'B');
let html='<div class="exam-line question">'+safe+'</div>';
if(labels.includes(label)){
html+='<div class="exam-inline-answer"><label for="'+prefix+'-'+label+'">Ответ</label><input id="'+prefix+'-'+label+'" autocomplete="off" placeholder="Введи ответ"></div>'}
return html}
return'<div class="exam-line">'+safe+'</div>'}).join('')}

function renderExamCheckButton(prefix){
return '<div class="exam-card"><button class="sb" onclick="checkOldExam(\''+prefix+'\')">✅ Проверить</button><div id="'+prefix+'-result"></div></div>'}

function checkOldExam(id){
const exam=oldExamData[id];
if(!exam)return;
const labels=examLabelsFromAnswers(exam.answers);
let correct=0;
labels.forEach(function(label){
const input=document.getElementById(id+'-'+label);
if(!input)return;
const expected=exam.answers[label];
const variants=Array.isArray(expected)?expected:[expected];
const user=nea(input.value);
const ok=variants.some(function(v){return nea(v)===user});
input.classList.remove('good','bad');
input.classList.add(ok?'good':'bad');
if(ok)correct++});
const total=labels.length;
const pct=Math.round((correct/total)*100);
document.getElementById(id+'-result').innerHTML='<div class="rs"><div class="rsc">'+correct+'/'+total+'</div><div style="font-size:18px;font-weight:700;color:var(--p)">'+pct+'%</div></div>'}

function ca(){
let c=0;let qs=window._cq||a1_questions;let t=qs.length;let tk=window._tk||'a1';
qs.forEach(function(q,i){
let inp=document.getElementById('a'+i);let lbl=document.getElementById('l'+i);
if(!inp||!lbl)return;
let ua=na(inp.value);let ca=q.answer;
if(ua===ca){c++;inp.className='ai c';lbl.className='al c';lbl.textContent='✅ Верно!'}
else{inp.className='ai w';lbl.className='al w';lbl.textContent='❌ Правильный: '+ca}});
let pct=Math.round((c/t)*100);
let ap=sg("ps",{});ap[tk]={correct:c,total:t,percent:pct,date:new Date().toISOString()};ss("ps",ap);
document.getElementById('ra').innerHTML='<div class="rs"><div class="rsc">'+c+'/'+t+'</div><div style="font-size:18px;font-weight:700;color:var(--p)">'+pct+'%</div></div>'}
