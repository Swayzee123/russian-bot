{num:28,text:`Папоротники — это древнейшие растения, появившиеся около 400 миллионов лет назад. Гигантские папоротниковые растения во многом определяли облик планеты в конце палеозойской — начале мезозойской эры.

Современные папоротники сильно различаются по размерам, жизненным циклам, особенностям строения. Широкое распространение папоротников по земному шару обусловлено устойчивостью к переувлажнению, громадным количеством производимых спор. Папоротники встречаются в лесах, в расселинах скал, на болотах, в реках и озёрах, на стенах городских домов. Но самое их большое разнообразие — в местах, где тепло и сыро: в тропиках и субтропиках.

У папоротников ещё нет настоящих листьев. То, что у папоротника напоминает лист, — это не лист, а целая система ветвей, расположенных в одной плоскости.

Значение папоротников в жизни человека не так велико по сравнению с семенными растениями.

Некоторые папоротники употребляются в пищу. Однако многие их виды ядовиты. Наиболее токсичными являются представители рода щитовников. Экстракты из щитовника используются в медицине.

С девятнадцатого века папоротники используют как комнатные растения. Орхидеи часто выращивают в почве, содержащей густо переплетённые тонкие корни папоротника.

Стволы древовидных папоротников служат в тропиках строительным материалом, а на Гавайях их крахмалистую сердцевину используют в пищу.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) научный стиль речи`,`2) художественный стиль речи`,`3) тип речи — повествование`,`4) тип речи — описание`,`5) задача речи — сообщить читателю объективную информацию о папоротниках как виде растений`],answer:`145`},
{num:29,text:`Сегодня мы поговорим с тобою о русском народном искусстве, точнее, только об одном его художественном явлении — искусстве «золотой Хохломы».

Хохлома — это удивительная яркость цвета и праздничность. Огненно-красный цвет хохломских изделий, золотое сияние затейливых узоров вызывает ощущение жаркого пламени, огня. И недаром! Созидательный огонь превратил деревянные поверхности посуды в золотые. Они блестят золотистым металлическим блеском. Всем сердцем любя родную сторону и любуясь ею, русские люди не только воспевали в песнях и сказках её неповторимую красоту, но и создавали простые предметы обихода. Мастера этого народного промысла украшали их яркой нарядной росписью, в которой ожили любимые природные мотивы.

Хохломские художники любят рисовать на поверхности своих изделий «ягодки»: земляничку, черничку, малинку, ежевичку, рябинку и чёрную и красную смородинку.

Самый любимый орнамент художников — «травка». Как правило, это удлинённые, слегка изогнутые тонкие былинки. А если «травки» превратились в крупные кудри-завитки, то тогда эти узоры называют «кудремами».

Пожеланием добра, благополучия и счастья с давних пор на Руси считались изображения цветущих кустов и плодов. Прекрасную традицию хохломские художники сохраняют и сегодня, украшая обычные предметы нарядной росписью. И с этими вещами в наш дом приходят красота и радость.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — описание`,`4) тип речи — рассуждение`,`5) задача речи — показать своеобразие искусства «золотой Хохломы»`],answer:`135`},
{num:30,text:`Я считаю, что каждый человек обязан заботиться о своём интеллектуальном развитии. Это его обязанность перед обществом, в котором он живёт, и перед самим собой.

Существуют различные способы интеллектуального развития. Основной, но не единственный, на мой взгляд, — это чтение.

Я точно знаю, каким не должно быть чтение. Чтение не должно быть случайным. Почему? Потому что это огромный расход времени, а время между тем величайшая ценность, которую нельзя тратить на пустяки. Чтение, безусловно, должно быть избирательным, продуманным, глубоким. В чём должен проявляться его избирательный характер? По моему мнению, в целенаправленном отборе книг.

В идеале хорошо было бы составить своеобразную программу чтения. Разумеется, не обязательно следовать ей жёстко. Да, отступления от неё возможны там, где появляются дополнительные для читающего интересы. Отклонились от первоначального плана — составьте для себя новую программу.

Чтение не должно быть простой самоцелью. Для того чтобы быть эффективным, оно должно в первую очередь интересовать читающего. Так что развивайте в себе интерес к чтению вообще или по определённым отраслям культуры. Такой интерес может быть в значительной мере результатом самовоспитания.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) стиль речи публицистический`,`2) стиль речи художественный`,`3) тип речи — рассуждение`,`4) тип речи — описание`,`5) задача речи — дать рекомендации, какую литературу следует читать дома`],answer:`13`}
,{num:31,text:`Есть на карте России, недалеко от Нижнего Новгорода, село Хохлома, известное теперь всему миру своими неповторимыми изделиями.

Хохломской промысел насчитывает более трёх столетий. По одной из легенд, принёс на Нижегородскую землю искусство золотой росписи старообрядец-иконописец. Селились вокруг избы мастера люди, перенимали его искусство. Быстро разлетелась слава об умельце, дошла и до царского дворца. Послал царь стрельцов за мастером, да воля тому была дороже жизни. Передал он свои секреты людям, поджёг избу и исчез. Сгорел ли иконописец вместе с домом или ушёл дальше за волей, неизвестно. Но остались его краски — цвет жаркого костра и чернь пепелища, осталось мастерство горячего сердца, золотых рук да свободной души. А огненная жар-птица стала символом хохломской росписи.

Конечно, это легенда, но действительно уходили в леса старообрядцы, знавшие секреты золочения икон без золота. Деревянные иконы покрывали тонким слоем растёртого в порошок серебра, пропитывали олифой и ставили в русскую печь. После закалки огнём икона обретала новый золотистый цвет. А позже эти приёмы стали использовать для изготовления расписной деревянной посуды.

Сегодня для народного хохломского промысла нет границ! Хохломская роспись вышла из традиционных рамок — трёхцветные узоры можно увидеть на бусах, серёжках, ёлочных игрушках, рисовальных наборах, даже на валенках и варежках.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) научный стиль речи`,`3) тип речи — повествование с элементами описания`,`4) тип речи — рассуждение`,`5) задача речи — описать излюбленные сюжеты современной хохломской росписи`],answer:`13`},
{num:32,text:`Был хороший майский день. Своё свободное время я проводил, бродя по булыжным мостовым, по которым так редко проезжали автомобили, что между камней росла неприхотливая, выносливая травка.

Старый русский городок, кирпично-бурый, малоэтажный, с горбатыми улочками, смотрел на меня гераниевыми своими окошками. За крашеными-перекрашеными заборами ютились тесные дворики, заросшие травой с ярко-жёлтыми одуванчиками и кустами цветущей сирени. Кирпичные рельефчики на фасадах обречённых на снос дряхлых домов резко контрастировали с белёными фасадами новых домов.

Старики сидели на скамеечках перед этими домами, под цветущими на подоконниках розовыми и алыми бальзаминами. Мне, столичному жителю, попавшему в этот тихий уголок исконно русской жизни, было очень хорошо. Слыша в ответ удивлённое и тихое «здрасте», я смущался.

Бродя по улочкам, которые вели то вверх, то вниз, я вышел к краеведческому музею. Площадка перед этим музеем была похожа на старый церковный дворик.

Укажите, какие из приведённых ниже характеристик соответствуют данному тексту:`,options:[`1) научный стиль речи`,`2) художественный стиль речи`,`3) тип речи — описание с элементами повествования`,`4) задача речи — убедить читателя в необходимости развития экологического туризма`,`5) задача речи — создать художественных образ старого русского городка`],answer:`235`},
{num:33,text:`Нравственный климат в государстве определяется степенью культуры общества. А культура — это прежде всего результат знаний, упорядоченных и сочетающихся с осознанием их недостаточности.

В самом деле, чем больше человек знает, тем яснее он понимает недостаток своих знаний. Отсюда особая осторожность и тактичность подлинно знающих людей и — рядом с ними — чрезвычайная самоуверенность полузнаек.

Полузнайка думает, что знает всё, и прежде всего рецепты благополучия человечества. И он всегда находит быстрый выход из временных затруднений. Полузнайке кажется, что учёный или просто культурный человек — плохой проводник его самоуверенных идей и, более того, ещё и живой укор его невежеству. Некультурность видна во всём облике полузнайки, в его поведении. Он агрессивен в своём мировоззрении, в отношении к природе, к истории, к классическим и недавно появившимся течениям в искусстве. Одним словом, полузнайка ведёт себя так, как будто бы он находится в полузнакомом ему лесу в сумерках.

Таким образом, полузнайство воспитывает очень опасные черты характера, поведения, отношения к окружающему миру. Полузнайство — это опаснейшая социальная болезнь.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) научный стиль речи`,`3) тип речи — рассуждение с элементами описания`,`4) тип речи — повествование`,`5) задача речи — показать путь достижения всеобщего благополучия`],answer:`13`},
{num:34,text:`Зима вошла в степи. К этому времени волчата у Акбары заметно подросли и превратились в угловатых переростков — каждый со своим норовом. Понятно, волчица не могла дать им имена, зато по запаху и по другим приметам она легко могла различать своих детёнышей.

Первый снег, выпавший незаметно за ночь, ранним утром был праздником для всех. Вначале волчата-переростки оробели от вида и запаха незнакомого вещества, а потом стали барахтаться в снегу и фыркать от удовольствия.

В степи было уже светло и прозрачно, как днём. Покой и тишина разлились всюду, и острый голод по-зимнему дал о себе знать. Наступила пора добывать прокорм. Волчата сидели в нетерпеливом напряжении, ещё не ведая, какие тяготы несёт охота, и преданно смотрели в синие глаза волчицы. Акбара встала с места и двинулась трусцой. И все последовали за ней.

Всё складывалось так, как грезилось волчице, когда волчата были ещё малы. Акбара и Ташчайнар, отец семейства, вели своих перворождённых на испытание, на первую для них великую охоту на сайгаков. Волки шли то шагом, то трусцой, печатая на нетронутом снегу цветы звериных следов. И смогут ли они выжить в этом мире, теперь зависело от них самих и от удачи.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) художественный стиль речи`,`2) публицистический стиль речи`,`3) тип речи — рассуждение`,`4) тип речи — повествование с элементами описания`,`5) задача речи — рассказать о том, как волчата готовились к первой в своей жизни охоте`],answer:`14`},
{num:35,text:`В годы Великой Отечественной войны наравне с людьми сражались и животные. Верблюдов стали брать в армию не от хорошей жизни. Когда в Астраханской области перебили всех лошадей, некому стало тащить артиллерийские снаряды и полевую кухню. Многие двугорбые, высокие и слишком медлительные, погибли в первые же дни службы, став лёгкой мишенью. Однако были такие, кто мужественно вытерпел все тяготы солдатской службы, уцелел и дожил до победы.

Верблюды Маша и Миша прошагали со своим артиллерийским расчётом 902-го стрелкового полка до Берлина. А когда гвардейский корпус одним из первых оказался у рейхсканцелярии, верблюды невозмутимо подвозили оружие. Машу и Мишу не пугали ни разрывы снарядов, ни свист пуль, ни тяжёлый гул орудий.

После окончания Великой Отечественной войны штабное начальство велело отправить животных на бойню, но армейцы потребовали найти другое решение. И героических животных оставили в Берлинском зоопарке.

А в 2008 году скромным труженикам Маше и Мише в городе Ахтубинске установили бронзовый памятник. Так увековечили мужество, героизм и трогательную дружбу человека и животного.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) художественный стиль речи`,`2) публицистический стиль речи`,`3) тип речи — описание`,`4) тип речи — повествование`,`5) задача речи — дать информацию об условиях жизни среднеазиатских верблюдов в Берлинском зоопарке`],answer:`24`},
{num:36,text:`Это лето было на редкость знойным. Вечера стояли душные, тихие, даже ночь не приносила облегчения. Вот и сегодня казалось, что в густом, тягучем воздухе буквально застыли и город, и река и ничто не сможет оживить их. И вдруг зажглась первая звезда, за ней другая, и вскоре всё небо покрылось звёздным узором, россыпью огоньков отразившимся в реке.

В доме на берегу не спал маленький мальчик. Он смотрел на звёзды и видел неведомый, фантастический мир, в котором живут необыкновенные существа и добрые, щедрые и могущественные люди. Вот Козерог, а вот созвездие Водолея. Водолей — это сказочный король, который вытянул руку, чтобы с его ладони падала вниз, на Землю, серебряная струя. А вон Скорпион, Телец, Дева, Рыбы... Огромный небесный мир, полный жизни!

Мальчику вдруг вспомнился бабушкин рассказ о далёких временах, когда люди верили, что звёзды — это серебряная накидка, украшающая голову неба, и что по ним можно определить, сколько живых душ обитает на земле. Родился человек — зажглась звезда, отдал Богу душу — и звезда закатилась, погасла. Большие и яркие звёзды принадлежат князьям, царям, а маленькие и тусклые — неудачникам и беднякам, самые же крошечные — всем остальным существам.

Маленький художник не спал до рассвета, мысленно рисуя одну картину за другой в ожидании завтрашнего дня.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) научный стиль речи`,`2) художественный стиль речи`,`3) тип речи — рассуждение`,`4) задача речи — рассказать о семье маленького художника`,`5) задача речи — передать восхищение мальчика красотой звёздного неба`],answer:`25`},
{num:37,text:`Я просыпаюсь от холода. Вылезаю из-под одеяла, иду во двор за поленьями. С десяток поленьев несу в дом. Нащипал лучины и затопил печь. Запах огня был чист и резок. Дым, белый как снег, пошёл в трубу, и я долго смотрел на него.

Через несколько часов на небе показалось яркое солнышко.

Его лучи стали проникать через неплотно притворённые ставни, золотили изразцовую печь и стены. Какие только переливающиеся на солнце краски здесь не играли!

Печь уже трещала. Я взял две бадьи и пошёл за водой. Высоко натоптанная тропинка звенела под валенками фарфоровым звоном. Снег на солнце был до того ярок и светел, что глаза непроизвольно щурились, а в тени от домов чётко ощущалась глубинная снежная синева.

Набрав воды, я пошёл домой. Дышалось легко, глубоко. Я не слышал своего сердца. Дома налил воды в самовар, набрал в железный совок румяных, уже успевших нагореть углей и опустил их в нутро самовара. Самовар зашумел почти тотчас же.

Я раскрыл банку сгущёнки, заварил чай и нарезал хлеб. Хорошо-то как!

Определите стиль и тип речи текста из задания В1:`,options:[`1) стиль публицистический, тип речи — повествование с элементами рассуждения`,`2) стиль разговорный, тип речи — описание с элементами повествования`,`3) стиль художественный, тип речи — повествование с элементами описания`,`4) стиль научный, тип речи — описание`,`5) стиль официально-деловой, тип речи — описание`],answer:`3`},
{num:38,text:`«Это подлинник», — с уважением говорят про картину или скульптуру. Казалось бы, можно, легко листая журнал или книгу, где помещены разнообразные репродукции работ художников и скульпторов, познакомиться с их многогранным творчеством. Но почему люди всё-таки стремятся в музеи и картинные галереи? Почему, для того чтобы посмотреть подлинник, они едут в другой город или даже страну?

Эти вопросы очень важны для формирования правильного отношения к искусству. Художник не просто положил краски на холст, стараясь сделать это как можно красивее. Нет, в картину он всегда вкладывает своё отношение к тому, что изображает, свои переживания и мысли — словом, своё неповторимое, потому что каждый видит мир по-своему. Встреча с произведением искусства — это также встреча с его создателем.

Стоя перед картиной или скульптурой, мы стараемся понять её творца, разгадать то, что он хотел нам сказать. И чем больше мы смотрим на картину-подлинник, тем больше она говорит нам, тем больше раскрывается перед нами её красота и своеобразие. Рассказать обо всём этом, передать очарование подлинника не в силах даже самая совершенная копия.

Определите стиль и тип речи текста из задания В1:`,options:[`1) стиль публицистический, тип речи — рассуждение`,`2) стиль разговорный, тип речи — рассуждение`,`3) стиль художественный, тип речи — описание`,`4) стиль научный, тип речи — повествование`,`5) стиль официально-деловой, тип речи — описание`],answer:`1`},
{num:39,text:`Лексика — это словарный запас языка. Центральную, ядерную, часть лексики составляют слова, актуальные для современных носителей русского языка, и прежде всего общеупотребительные слова.

Это слова, понятные всем говорящим на русском языке и необходимые для их повседневного общения, независимо от их занятий, профессии, места жительства, социальной принадлежности, возраста и т. д.

Они образуют активную лексику. Это, например: человек, голова, учить, есть, светлый, умный.

На фоне активной лексики выделяется пассивная лексика.

В неё входят слова, редко употребляющиеся в повседневном общении и не всегда понятные самим носителям языка. Это слова, уже неактуальные в процессе общения, или, наоборот, новые слова, недавно появившиеся и ещё не ставшие привычными.

Границы между активной и пассивной лексикой характеризуются подвижностью, изменчивостью. Это значит, что возможен переход из одной группы в другую. К пассивной лексике в настоящее время относят слова «гусар», «городовой», «денщик», которые ранее принадлежали к активной лексике; в активную же лексику сейчас входят слова «гимназия», «гимназист».

Определите стиль и тип речи текста из задания В1:`,options:[`1) стиль официально-деловой, тип речи — описание`,`2) стиль научный, тип речи — описание`,`3) стиль разговорный, тип речи — рассуждение`,`4) стиль художественный, тип речи — повествование`,`5) стиль публицистический, тип речи — рассуждение`],answer:`2`},
{num:40,text:`Барбос был невелик ростом, но приземист и широкогруд. Благодаря длинной, чуть-чуть вьющейся шерсти в нём замечалось отдалённое сходство с белым пуделем, но только с пуделем, к которому никогда не прикасались ни мыло, ни гребень, ни ножницы. Летом он постоянно с головы до конца хвоста бывал унизан колючками, а осенью клоки шерсти на его ногах, животе, извалявшись в грязи, превращались в сотни коричневых болтающихся сталактитов. Уши Барбоса вечно носили следы «боевых схваток».

Пёс имел весьма смутные понятия о праве собственности и не отличался аккуратностью. Этому разбойнику ничего не стоило стрескать в один присест половину жареного пасхального индюка или улечься, только что выскочив из грязной лужи, на белое покрывало.

Барбос обыкновенно лежал на подоконнике раскрытого окна в позе спящего льва. Едва на улице показывалась собачья фигура, он стремительно скатывался с окошка и, как молния, настигал соперника. В течение нескольких минут среди густого столба коричневой пыли барахтались два собачьих тела. Наконец Барбос одерживал победу. В то время когда враг обращался в бегство, Барбос с гордым видом возвращался на свой пост на подоконник. Правда, иногда при этом триумфальном шествии он сильно прихрамывал.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) публицистический стиль речи`,`2) художественный стиль речи`,`3) тип речи — рассуждение`,`4) тип речи — описание с элементами повествования`,`5) задача речи — рассказать о дружбе Барбоса с соседскими собаками`],answer:`24`}
,{num:41,text:`Чартков сделался модным живописцем во всех отношениях. Чаще стал бывать на обедах, сопровождать дам в галереи и на гулянья, щегольски одеваться. Дома у себя он завёл опрятность и чистоту в высшей степени, определил двух великолепных лакеев, завёл щегольских учеников, занялся улучшением разных манер. Скоро в нём нельзя было узнать того скромного и талантливого художника, который работал когда-то незаметно в своей лачужке на Васильевском острове.

Когда в журналах появлялась печатная хвала ему, он радовался, как ребёнок, хотя эта хвала была куплена им за свои же деньги. Слава его росла, работы и заказы увеличивались. Но уже стали ему надоедать одни и те же портреты и лица. Уже без большой охоты он писал. Ум уставал придумывать и обдумывать. Кисть его хладела и тупела. Он видел только мундир да фрак, перед которыми чувствует холод художник и падает всякое воображение.

Прикосновение прекрасного уже не превращало девственных сил в огонь и пламя. Но все отгоревшие чувства становились доступнее к звуку золота, вслушивались внимательнее в его заманчивую музыку и мало-помалу позволяли ей совершенно усыпить себя. Золото сделалось его страстью, идеалом, страхом, наслаждением, целью.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) художественный стиль речи`,`2) публицистический стиль речи`,`3) тип речи — рассуждение`,`4) задача речи — рассказать читателю, какие работы были написаны художником в маленькой квартирке на Васильевском острове`,`5) задача речи — создать художественный образ модного живописца, показать, как слава и богатство постепенно становятся смыслом жизни некогда скромного и талантливого художника`],answer:`15`},
{num:42,text:`В ожидании концерта мы расположились в камышовых зарослях на берегу небольшой, но быстрой речонки. Воздух был чист, прозрачен, душист...

Вечер начался пением кукушки. Она лениво закуковала где-то в дальней роще и скоро замолкла. Затем запела иволга. Мы прослушали бы её с невыразимым удовольствием, если бы не грачи, летевшие на ночёвку и с карканьем опустившиеся на рощу.

Когда закричали грачи, загалдели и лягушки, где-то запел дрозд. Ему аккомпанировали речная курочка и камышовка.

Затем последовал антракт, наступила тишина, изредка нарушаемая пением сверчка. Когда на землю опустилась ночь и луна остановилась среди неба над самой рощей, наступила и очередь соловья. Он показался в молодом ольшанике, порхнул в терновник, повертел хвостом и стал неподвижен. Минуты три сидел он молча, не двигаясь. Но вот зашумели верхушки деревьев, задул ветерок, затрещал громче сверчок и под аккомпанемент этого оркестра соловей исполнил свою первую трель.

Он запел, засвистал, осыпая рощу щёлканьем и дробью. И властная сила, и томительная нега, и искренняя страсть слышались в его чудесном голосе. Он пел, а кругом царила внимающая тишина.

Когда засерело небо и потухли миниатюрные фонарики звёзд, голос соловья стал слабее и нежнее и мало-помалу умолк.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) художественный стиль речи`,`2) научный стиль речи`,`3) тип речи — повествование с элементами описания`,`4) задача речи — рассуждение`,`5) задача речи — рассказать о видах птиц, обитающих в роще`],answer:`13`},
{num:43,text:`Передо мной были молчаливые горы и тихие леса в осенней задумчивости. Горечь надвигающегося увядания угадывалась во всём. Речки кружились, затягивая в жёлтые петли горы с дремучими лесами, и казалось, что в расщелинах, оврагах и долинах обнажились нервы земли. Всё вокруг было величаво и спокойно.

Предчувствие долгого сна таилось в лесах, и шорох облетающих листьев уже начинал усыплять их, нашёптывая об осенних дождях, о глубоких снегах и о весне, которую надо долго и терпеливо ждать. Очарованные печальной музыкой осени, обнажились леса, роняя листья в светлые ручьи.

Земля надевала шубу из листьев, готовилась к зиме, утихали звуки на ней, и только шорох был всюду от листа и шум от речек, наполненных водой.

Но гора, на которой мы стояли, жила вроде бы отдельно от всего леса. Она была обрублена лет десять назад. Вокруг пней рос рябинник, берёзки. Они занимали полянки покосов и без грусти сорили вокруг листьями.

Укажите, какие из приведённых характеристик соответствуют данному тексту:`,options:[`1) художественный стиль речи`,`2) научный стиль речи`,`3) тип речи — описание`,`4) задача речи — рассуждение`,`5) задача речи — дать конкретную информацию о сезонных изменениях в природе`],answer:`13`},
{num:44,text:`Дом у Песоцкого был громадный, с колоннами, со львами, на которых облупилась штукатурка, и с лакеем у подъезда.

Старинный парк, угрюмый и строгий, разбитый на английский манер, тянулся чуть ли не целую версту от дома до реки и здесь оканчивался обрывистым, крутым глинистым берегом, на котором росли сосны с обнажившимися корнями, похожими на мохнатые лапы. Внизу нелюдимо блестела вода, носились с жалобным, еле слышным писком кулики. И всегда тут менялось настроение. Зато около самого дома, во дворе и фруктовом саду всегда было весело и жизнерадостно.

Таких удивительных роз, лилий, камелий, таких тюльпанов всевозможных цветов, как в усадьбе Песоцкого, не случалось видеть в другом месте. Весна была ещё только в начале, и самая настоящая роскошь цветников пряталась ещё в теплицах. Но уж и того, что цвело вдоль аллей и там и сям на клумбах, было достаточно, чтобы почувствовать себя в царстве нежных красок. Особенно в ранние часы, когда на каждом лепестке сверкала вода.

{num:45,text:`За скрипучим столом в кабинете, низко нагнувшись над книгой или препаратом, сидит мой ассистент Пётр Игнатьевич, трудолюбивый, скромный, но бесталанный человек, лет тридцати пяти, уже плешивый и с большим животом. Работает он с утра до ночи, читает много, отлично помнит всё прочитанное — и в этом отношении он не человек, а золото. В остальном же прочем — это ломовой конь, или, как иначе говорят, учёный-тупица. Характерные черты ломового коня, отличающие его от таланта, таковы: кругозор его тесен и ограничен специальностью; вне своей специальности он наивен, как ребёнок.

Другая черта — фантастическая вера в непогрешимость науки и всего того, что пишут немцы. Он уверен в самом себе, в своих препаратах, знает цель жизни и совершенно незнаком с сомнениями и разочарованиями. Рабское поклонение авторитетам и отсутствие потребности самостоятельно мыслить. Разубедить его в чём-то трудно, спорить с ним невозможно.

Будущность его представляется мне ясно. Возможно, за всю свою жизнь Пётр Игнатьевич приготовит несколько сотен препаратов необыкновенной чистоты, напишет много сухих, очень приличных рефератов, сделает около десяти добросовестных переводов. Но пороха он не выдумает. Для пороха нужны фантазия, изобретательность, умение угадывать, а у Петра Игнатьевича нет ничего подобного. Короче говоря, это не хозяин в науке, а работник.

{num:46,text:`Карликовая игрунка относится к семейству игрунковых и является наименьшим представителем отряда приматов на Земле.

Длина тела достигает 15 сантиметров, хвоста — 20 сантиметров. Максимальная масса тела — 150 граммов. Шерсть густая и длинная и окрашена на верхней стороне в золотисто-бурый цвет. Длинные пучки волос на голове и груди напоминают гриву. Глаза маленькие, миндалевидные, янтарно-медового цвета.

Карликовые игрунки активны в утреннее и полуденное время. Они передвигаются на четырёх лапах, в том числе по вертикальным ветвям деревьев, и умеют прыгать на расстояние до одного метра. Карликовые игрунки живут в родовых группах, состоящих из нескольких поколений. Взаимный уход за шерстью играет важную роль в их социальных отношениях.

Карликовые игрунки живут в бассейне реки Амазонки, в южной Колумбии, Эквадоре, северных регионах Перу и Боливии, а также на западе Бразилии. Часто селятся на опушках лесов, по берегам рек и в заливаемых сезонными паводками джунглях. На деревьях эти животные проводят большую часть жизни. Но иногда они спускаются на землю.

Пища карликовых игрунок в основном состоит из древесных соков. Учёные отмечают, что самая большая продолжительность жизни у этих зверей составляет одиннадцать лет.

{num:47,text:`Краски и свет в природе надо не столько наблюдать, сколько ими попросту жить. Для искусства годится только тот материал, который завоевал место в сердце. Живопись важна для прозаика не только тем, что помогает увидеть и полюбить краски и свет. Живопись важна ещё и тем, что художник часто замечает то, чего мы совсем не видим. Только после его картин мы тоже начинаем видеть это и удивляться, что не замечали этого раньше.

Французский художник Моне приехал в Лондон и написал Вестминстерское аббатство. Работал Моне в обыкновенный лондонский туманный день. На картине художника готические очертания аббатства едва выступают из тумана.

Когда картина была выставлена, она произвела смятение среди лондонцев. Они были поражены, что туман у Моне был окрашен в багровый цвет, тогда как всем известно, что цвет тумана серый.

Дерзость Моне вызвала сначала возмущение. Но возмущение прошло, когда лондонцы вышли на улицы, вгляделись в туман и впервые заметили, что он действительно багровый.

Тотчас начали искать этому объяснение. Согласились, что красный оттенок тумана зависит от обилия дыма. Кроме того, этот цвет туману придают красные кирпичные лондонские дома. Но как бы там ни было, Моне победил. После его картины все начали видеть лондонский туман таким, каким его увидел художник. Моне даже прозвали «создателем лондонского тумана».

{num:48,text:`Любовь японцев к прекрасному коренится в их любви к природе. Нужно хотя бы раз увидеть острова Японии, чтобы понять, почему населяющий их народ обожествляет родную природу.

Предметом восхищения может быть всё, что служит окном в бесконечное разнообразие мира: травинка, на которой обосновался кузнечик, или причудливо изогнутый корень. Издавна для японцев характерно стремление жить в согласии с природой.

{num:109,text:`С конца сентября наши сады пустели, погода, по обыкновению, круто менялась. Ветер по целым дням рвал и трепал деревья, дожди поливали их с утра до ночи. Иногда к вечеру между хмурыми низкими тучами пробивался на западе трепещущий золотистый свет низкого солнца. Воздух делался чист и ясен, солнечный свет ослепительно сверкал между листвою, между ветвями, которые живою сеткою двигались и волновались от ветра. Холодно и ярко сияло на севере над тяжёлыми свинцовыми тучами голубое небо, а из-за этих туч медленно выплывали хребты снеговых гор-облаков. Стоишь у окна и думаешь: «Авось, бог даст, распогодится».

{num:1280,text:`Зима вошла в степи. К этому времени волчата у Акбары заметно подросли и превратились в угловатых переростков — каждый со своим норовом. Понятно, волчица не могла дать им имена, зато по запаху и по другим приметам она легко могла различать своих детёнышей.

Первый снег, выпавший незаметно за ночь, ранним утром был праздником для всех. Вначале волчата-переростки оробели от вида и запаха незнакомого вещества, а потом стали барахтаться в снегу и фыркать от удовольствия.

В степи было уже светло и прозрачно, как днём. Покой и тишина разлились всюду, и острый голод по-зимнему дал о себе знать. Наступила пора добывать прокорм. Волчата сидели в нетерпеливом напряжении, ещё не ведая, какие тяготы несёт охота, и преданно смотрели в синие глаза волчицы. Акбара встала с места и двинулась трусцой. И все последовали за ней.

Всё складывалось так, как грезилось волчице, когда волчата были ещё малы. Акбара и Ташчайнар, отец семейства, вели своих перворождённых на испытание, на первую для них великую охоту на сайгаков. Волки шли то шагом, то трусцой, печатая на нетронутом снегу цветы звериных следов. И смогут ли они выжить в этом мире, теперь зависело от них самих и от удачи.

{num:1310,text:`В годы Великой Отечественной войны наравне с людьми сражались и животные. Верблюдов стали брать в армию не от хорошей жизни. Когда в Астраханской области перебили всех лошадей, некому стало тащить артиллерийские снаряды и полевую кухню. Многие двугорбые, высокие и слишком медлительные, погибли в первые же дни службы, став лёгкой мишенью. Однако были такие, кто мужественно вытерпел все тяготы солдатской службы, уцелел и дожил до победы.

Верблюды Маша и Миша прошагали со своим артиллерийским расчётом 902-го стрелкового полка до Берлина. А когда гвардейский корпус одним из первых оказался у рейхсканцелярии, верблюды невозмутимо подвозили оружие, тем самым защищая воинов, водружавших Знамя Победы над Рейхстагом. Машу и Мишу не пугали ни разрывы снарядов, ни свист пуль, ни тяжёлый гул орудий.

После окончания Великой Отечественной войны, во время передислокации советских войск, штабное начальство велело отправить животных на бойню, но армейцы потребовали найти другое решение. И героических животных, с которыми бойцы делили скудный паёк и тяготы войны, оставили в Берлинском зоопарке.

А в 2008 году скромным труженикам Маше и Мише, приближавшим День Победы в меру своих сил, в городе Ахтубинске установили бронзовый памятник. Так увековечили мужество, героизм и трогательную дружбу человека и животного.

{num:1347,text:`Это лето было на редкость знойным. Вечера стояли душные, тихие, даже ночь не приносила облегчения. Вот и сегодня казалось, что в густом, тягучем воздухе буквально застыли и город, и река и ничто не сможет оживить их. И вдруг зажглась первая звезда, за ней другая, и вскоре всё небо покрылось звёздным узором, россыпью огоньков отразившимся в реке.

В доме на берегу не спал маленький мальчик. Он смотрел на звёзды и видел неведомый, фантастический мир, в котором живут необыкновенные существа и добрые, щедрые и могущественные люди. Вот Козерог, а вот созвездие Водолея. Водолей — это сказочный король, который вытянул руку, чтобы с его ладони падала вниз, на Землю, серебряная струя. А вон Скорпион, Телец, Дева, Рыбы... Огромный небесный мир, полный жизни!

Мальчику вдруг вспомнился бабушкин рассказ о далёких временах, когда люди верили, что звёзды — это серебряная накидка, украшающая голову неба, и что по ним можно определить, сколько живых душ обитает на земле. Родился человек — зажглась звезда, отдал Богу душу — и звезда закатилась, погасла. Большие и яркие звёзды принадлежат князьям, царям, а маленькие и тусклые — неудачникам и беднякам, самые же крошечные, еле различимые глазом — всем остальным существам: птицам, рыбам, животным.

Маленький художник не спал до рассвета, мысленно рисуя одну картину за другой в ожидании завтрашнего дня, когда он сможет взять в руки кисть.

{num:1461,text:`Лексика — это словарный запас языка. Центральную, ядерную, часть лексики составляют слова, актуальные для современных носителей русского языка, и прежде всего общеупотребительные слова.

Это слова, понятные всем говорящим на русском языке и необходимые для их повседневного общения, независимо от их занятий, профессии, места жительства, социальной принадлежности, возраста и т. д.

Они образуют активную лексику. Это, например: человек, голова, учить, есть, светлый, умный.

На фоне активной лексики выделяется пассивная лексика.

В неё входят слова, редко употребляющиеся в повседневном общении и не всегда понятные самим носителям языка. Это слова, уже неактуальные в процессе общения, или, наоборот, новые слова, недавно появившиеся и ещё не ставшие привычными, актуальными, окончательно не вошедшие в общее употребление.

Границы между активной и пассивной лексикой характеризуются подвижностью, изменчивостью. Это значит, что возможен переход из одной группы в другую. К пассивной лексике в настоящее время относят слова «гусар», «городовой», «денщик», которые ранее принадлежали к активной лексике; в активную же лексику сейчас входят слова «гимназия», «гимназист», ранее принадлежавшие к пассивной лексике.

{num:1497,text:`Барбос был невелик ростом, но приземист и широкогруд. Благодаря длинной, чуть-чуть вьющейся шерсти в нём замечалось отдалённое сходство с белым пуделем, но только с пуделем, к которому никогда не прикасались ни мыло, ни гребень, ни ножницы. Летом он постоянно с головы до конца хвоста бывал унизан колючками, а осенью клоки шерсти на его ногах, животе, извалявшись в грязи, превращались в сотни коричневых болтающихся сталактитов. Уши Барбоса вечно носили следы «боевых схваток».

Пёс имел весьма смутные понятия о праве собственности и не отличался аккуратностью. Этому разбойнику ничего не стоило стрескать в один присест половину жареного пасхального индюка или улечься, только что выскочив из грязной лужи, на белое покрывало.

Барбос обыкновенно лежал на подоконнике раскрытого окна в позе спящего льва, уткнув морду между вытянутыми передними лапами. Едва на улице показывалась собачья фигура, он стремительно скатывался с окошка и, как молния, настигал соперника. В течение нескольких минут среди густого столба коричневой пыли барахтались, сплетаясь клубком, два собачьих тела. Наконец Барбос одерживал победу. В то время когда враг обращался в бегство, визжа и трусливо оглядываясь назад, Барбос с гордым видом возвращался на свой пост на подоконник. Правда, иногда при этом триумфальном шествии он сильно прихрамывал, но, вероятно, тем слаще казались ему победные лавры.

{num:1537,text:`Чартков сделался модным живописцем во всех отношениях. Чаще стал бывать на обедах, сопровождать дам в галереи и на гулянья, щегольски одеваться. Дома у себя он завёл опрятность и чистоту в высшей степени, определил двух великолепных лакеев, завёл щегольских учеников, занялся улучшением разных манер. Скоро в нём нельзя было узнать того скромного и талантливого художника, который работал когда-то незаметно в своей лачужке на Васильевском острове.

Когда в журналах появлялась печатная хвала ему, он радовался, как ребёнок, хотя эта хвала была куплена им за свои же деньги. Слава его росла, работы и заказы увеличивались. Но уже стали ему надоедать одни и те же портреты и лица. Уже без большой охоты он писал. Ум уставал придумывать и обдумывать. Кисть его хладела и тупела. Он видел только мундир да фрак, перед которыми чувствует холод художник и падает всякое воображение.

Прикосновение прекрасного уже не превращало девственных сил в огонь и пламя. Но все отгоревшие чувства становились доступнее к звуку золота, вслушивались внимательнее в его заманчивую музыку и мало-помалу позволяли ей совершенно усыпить себя. Золото сделалось его страстью, идеалом, страхом, наслаждением, целью.

{num:1654,text:`Дом у Песоцкого был громадный, с колоннами, со львами, на которых облупилась штукатурка, и с лакеем у подъезда.

Старинный парк, угрюмый и строгий, разбитый на английский манер, тянулся чуть ли не целую версту от дома до реки и здесь оканчивался обрывистым, крутым глинистым берегом, на котором росли сосны с обнажившимися корнями, похожими на мохнатые лапы. Внизу нелюдимо блестела вода, носились с жалобным, еле слышным писком кулики. И всегда тут менялось настроение, что хоть садись и балладу пиши. Зато около самого дома, во дворе и фруктовом саду, который вместе с питомником занимал десятин тридцать, всегда было весело и жизнерадостно, даже в плохую погоду.

Таких удивительных роз, лилий, камелий, таких тюльпанов всевозможных цветов, начиная с ярко-белого и кончая чёрным, как сажа, вообще такого богатства цветов, как в усадьбе Песоцкого, не случалось видеть в другом месте. Весна была ещё только в начале, и самая настоящая роскошь цветников пряталась ещё в теплицах. Но уж и того, что цвело вдоль аллей и там и сям на клумбах, было достаточно, чтобы, гуляя по саду, почувствовать себя в царстве нежных красок. Особенно в ранние часы, когда на каждом лепестке сверкала вода.

{num:1692,text:`За скрипучим столом в кабинете, низко нагнувшись над книгой или препаратом, сидит мой ассистент Пётр Игнатьевич, трудолюбивый, скромный, но бесталанный человек, лет тридцати пяти, уже плешивый и с большим животом. Работает он с утра до ночи, читает много, отлично помнит всё прочитанное — и в этом отношении он не человек, а золото. В остальном же прочем — это ломовой конь, или, как иначе говорят, учёный-тупица. Характерные черты ломового коня, отличающие его от таланта, таковы: кругозор его тесен и ограничен специальностью; вне своей специальности он наивен, как ребёнок.

Другая черта — фантастическая вера в непогрешимость науки и всего того, что пишут немцы. Он уверен в самом себе, в своих препаратах, знает цель жизни и совершенно незнаком с сомнениями и разочарованиями, от которых седеют таланты. Рабское поклонение авторитетам и отсутствие потребности самостоятельно мыслить. Разубедить его в чём-то трудно, спорить с ним невозможно.

Будущность его представляется мне ясно. Возможно, за всю свою жизнь Пётр Игнатьевич приготовит несколько сотен препаратов необыкновенной чистоты, напишет много сухих, очень приличных рефератов, сделает около десяти добросовестных переводов. Но пороха он не выдумает. Для пороха нужны фантазия, изобретательность, умение угадывать, а у Петра Игнатьевича нет ничего подобного. Короче говоря, это не хозяин в науке, а работник.

{num:1729,text:`Карликовая игрунка относится к семейству игрунковых и является наименьшим представителем отряда приматов на Земле.

Длина тела достигает 15 сантиметров, хвоста — 20 сантиметров. Максимальная масса тела — 150 граммов. Шерсть густая и длинная и окрашена на верхней стороне в золотисто-бурый цвет. Длинные пучки волос на голове и груди напоминают гриву. Глаза маленькие, миндалевидные, янтарно-медового цвета.

Карликовые игрунки активны в утреннее и полуденное время. Они передвигаются на четырёх лапах, в том числе по вертикальным ветвям деревьев, и умеют прыгать на расстояние до одного метра. Карликовые игрунки живут в родовых группах, состоящих из нескольких поколений. Взаимный уход за шерстью играет важную роль в их социальных отношениях.

Карликовые игрунки живут в бассейне реки Амазонки, в южной Колумбии, Эквадоре, северных регионах Перу и Боливии, а также на западе Бразилии. Часто селятся на опушках лесов, по берегам рек и в заливаемых сезонными паводками джунглях. На деревьях эти животные проводят большую часть жизни. Но иногда они спускаются на землю.

Пища карликовых игрунок в основном состоит из древесных соков, ради которых они подгрызают кору своими острыми резцами. Учёные отмечают, что самая большая продолжительность жизни у этих зверей составляет одиннадцать лет.

{num:1767,text:`Краски и свет в природе надо не столько наблюдать, сколько ими попросту жить. Для искусства годится только тот материал, который завоевал место в сердце. Живопись важна для прозаика не только тем, что помогает увидеть и полюбить краски и свет. Живопись важна ещё и тем, что художник часто замечает то, чего мы совсем не видим. Только после его картин мы тоже начинаем видеть это и удивляться, что не замечали этого раньше.

Французский художник Моне приехал в Лондон и написал Вестминстерское аббатство. Работал Моне в обыкновенный лондонский туманный день. На картине художника готические очертания аббатства едва выступают из тумана.

Когда картина была выставлена, она произвела смятение среди лондонцев. Они были поражены, что туман у Моне был окрашен в багровый цвет, тогда как всем известно, что цвет тумана серый.

Дерзость Моне вызвала сначала возмущение. Но возмущение прошло, когда лондонцы вышли на улицы, вгляделись в туман и впервые заметили, что он действительно багровый.

Тотчас начали искать этому объяснение. Согласились, что красный оттенок тумана зависит от обилия дыма. Кроме того, этот цвет туману придают красные кирпичные лондонские дома. Но как бы там ни было, Моне победил. После его картины все начали видеть лондонский туман таким, каким его увидел художник. Моне даже прозвали «создателем лондонского тумана».

{num:1795,text:`Любовь японцев к прекрасному коренится в их любви к природе. Нужно хотя бы раз увидеть острова Японии, чтобы понять, почему населяющий их народ обожествляет родную природу.

Япония — это страна зелёных гор и морских заливов, сумрачных вулканических озёр и зеркальных мозаик рисовых полей. Ландшафты Японии составлены из мягких тонов, приглушённых влажностью воздуха. Эту сдержанную гамму временно нарушают лишь какие-нибудь сезонные краски. Например, весеннее цветение азалий или пламенеющие к осени листья клёнов.

Муссонные ветры и тёплое морское течение сделали Японию страной удивительного климата, где весна, лето, осень и зима сменяют друг друга на редкость пунктуально. Японцы находят радость в том, чтобы подчинять природному календарю ритм своей жизни. Они стараются есть определённую пищу, носить определённую одежду, придавать должный облик своему жилищу. Они любят приурочивать семейные торжества к важным природным явлениям: цветению сакуры или осеннему полнолунию.

Предметом восхищения может быть всё, что служит окном в бесконечное разнообразие мира: травинка, на которой обосновался кузнечик, или причудливо изогнутый корень. Издавна для японцев характерно стремление жить в согласии с природой.

{num:1833,text:`Зинаида Павловна была мечтательницей по призванию. Она пристрастилась к чтению ещё в начальных классах гимназии.

По вечерам, когда классная дама скучно объясняла ученицам заданный к завтрашнему дню урок математики, Зинаида Павловна тихонько вынимала из стола описание какого-нибудь фантастического путешествия по девственным лесам Америки или пустыням Африки и жадно погружалась в чтение. Всё, что хоть немного напоминало действительность, переставало существовать для неё в эти блаженные минуты.

С годами грёзы Зинаиды Павловны приняли более жгучий характер. Очень сильно повлияли на неё в этом отношении лекции по истории, которые увлекательно читал симпатичный и знающий учитель. Она внимательно слушала его на уроке. Описание блеска и роскоши средневековой жизни, победы и завоевания римских цезарей гораздо меньше шевелили её воображение, чем героизм отважных мучеников идеи. Она обожала Жанну д'Арк и находила в её образе и поступках много общего с собой. Зинаиде Павловне начинало казаться, что и в её груди таятся и зреют до нужной минуты могущественные силы. И эти силы назначены судьбой для каких-то великих целей. Ею часто овладевало желание радостно отдать свою молодую жизнь во имя чего-то далёкого и прекрасного.

{num:1312,mode:'text',text:`Текст к заданиям А28—А30 и В1—В5
(1) В годы Великой Отечественной войны наравне с людьми сражались и животные. (2) Верблюдов стали брать в армию не от хорошей жизни. (3) Когда в Астраханской области перебили всех лошадей, некому стало тащить артиллерийские снаряды и полевую кухню. (4) Многие двугорбые, высокие и слишком медлительные, погибли в первые же дни службы, став лёгкой мишенью. (5) Однако были такие, кто мужественно вытерпел все тяготы солдатской службы, уцелел и дожил до победы.

(6) Верблюды Маша и Миша прошагали со своим артиллерийским расчётом 902-го стрелкового полка до Берлина. (7) А когда гвардейский корпус одним из первых оказался у рейхсканцелярии, верблюды невозмутимо подвозили оружие, тем самым защищая воинов, водружавших Знамя Победы над Рейхстагом. (8) Машу и Мишу не пугали ни разрывы снарядов, ни свист пуль, ни тяжёлый гул орудий, который даже люди переносили с трудом.

(9) После окончания Великой Отечественной войны, во время передислокации советских войск, штабное начальство велело отправить животных на бойню, но армейцы потребовали найти другое решение. (10) И героических животных, с которыми бойцы делили скудный паёк и тяготы войны, оставили в Берлинском зоопарке.

(11) А в 2008 году скромным труженикам Маше и Мише, приближавшим День Победы в меру своих сил, в городе Ахтубинске установили бронзовый памятник. (12) Так увековечили мужество, героизм и трогательную дружбу человека и животного.

Найдите в предложениях 4—6 глагол совершенного вида, переходный, 2-го спряжения.`,answer:`вытерпел`},
{num:1348,mode:'text',text:`Текст к заданиям А28—А30 и В1—В5
(1) Это лето было на редкость знойным. (2) Вечера стояли душные, тихие, даже ночь не приносила облегчения. (3) Вот и сегодня казалось, что в густом, тягучем воздухе буквально застыли и город, и река, и ничто не сможет оживить их. (4) И вдруг зажглась первая звезда, за ней другая, и вскоре всё небо покрылось звёздным узором, россыпью огоньков отразившимся в реке.

(5) В доме на берегу не спал маленький мальчик. (6) Он смотрел на звёзды и видел неведомый, фантастический мир, в котором живут необыкновенные существа и добрые, щедрые и могущественные люди. (7) Вот Козерог, а вот созвездие Водолея. (8) Водолей — это сказочный король, который вытянул руку, чтобы с его ладони падала вниз, на Землю, серебряная струя. (9) А вон Скорпион, Телец, Дева, Рыбы… (10) Огромный небесный мир, полный жизни!

(11) Мальчику вдруг вспомнился бабушкин рассказ о далёких временах, когда люди верили, что звёзды — это серебряная накидка, украшающая голову неба, и что по ним можно определить, сколько живых душ обитает на земле. (12) Родился человек — зажглась звезда, отдал Богу душу — и звезда закатилась, погасла. (13) Большие и яркие звёзды принадлежат князьям, царям, а маленькие и тусклые — неудачникам и беднякам.

(14) Маленький художник не спал до рассвета, мысленно рисуя одну картину за другой в ожидании завтрашнего дня, когда он сможет взять в руки кисть.

{num:1424,mode:'text',text:`(1) «Это подлинник», — с уважением говорят про картину или скульптуру. (2) Казалось бы, можно, легко листая журнал или книгу, где помещены разнообразные репродукции работ художников и скульпторов, познакомиться с их многогранным творчеством. (3) Но почему люди всё-таки стремятся в музеи и картинные галереи? (4) Почему, для того чтобы посмотреть подлинник, они едут в другой город или даже страну?

(5) Эти вопросы очень важны для формирования правильного отношения к искусству. (6) Художник не просто положил краски на холст, стараясь сделать это как можно красивее. (7) Нет, в картину он всегда вкладывает своё отношение к тому, что изображает, свои переживания и мысли — словом, своё неповторимое, потому что каждый видит мир по-своему. (8) Встреча с произведением искусства — это также встреча с его создателем.

(9) Стоя перед картиной или скульптурой, мы стараемся понять её творца, разгадать то, что он хотел нам сказать. (10) И чем больше мы смотрим на картину-подлинник, тем больше она говорит нам, тем больше раскрывается перед нами её красота и своеобразие. (11) Рассказать обо всём этом, передать очарование подлинника не в силах даже самая совершенная копия.

(1) Папоротники — это древнейшие растения, появившиеся около 400 миллионов лет назад. (2) Гигантские папоротниковые растения во многом определяли облик планеты в конце палеозойской — начале мезозойской эры.

(3) Современные папоротники сильно различаются по размерам, жизненным циклам, особенностям строения. (4) Широкое распространение папоротников по земному шару обусловлено устойчивостью к переувлажнению, громадным количеством производимых спор. (5) Папоротники встречаются в лесах, в расселинах скал, на болотах, в реках и озёрах, на стенах городских домов. (6) Но самое их большое разнообразие — в местах, где тепло и сыро: в тропиках и субтропиках.

(7) У папоротников ещё нет настоящих листьев. (8) То, что у папоротника напоминает лист, — это не лист, а целая система ветвей, расположенных в одной плоскости.

(9) Значение папоротников в жизни человека не так велико по сравнению с семенными растениями.

(10) Некоторые папоротники употребляются в пищу, например страусник обыкновенный. (11) Однако многие их виды ядовиты. (12) Наиболее токсичными из произрастающих в средней полосе папоротников являются представители рода щитовников. (13) Экстракты из щитовника используются в медицине.

(14) С девятнадцатого века папоротники используют как комнатные растения. (15) Орхидеи часто выращивают в почве, содержащей густо переплетённые тонкие корни папоротника.

(16) Стволы древовидных папоротников служат в тропиках строительным материалом, а на Гавайях их крахмалистую сердцевину используют в пищу.

{num:1087,mode:'text',text:`Текст к заданиям А29—А32 и В1—В3
(1) Сегодня мы поговорим с тобою о русском народном искусстве, точнее, только об одном его художественном явлении — искусстве «золотой Хохломы».

(2) Хохлома — это удивительная яркость цвета и праздничность. (3) Огненно-красный цвет хохломских изделий, золотое сияние затейливых узоров вызывает ощущение жаркого пламени, огня. (4) И недаром! (5) Созидательный огонь превратил деревянные поверхности посуды в золотые. (6) Они блестят золотистым металлическим блеском. (7) Всем сердцем любя родную сторону и любуясь ею, русские люди не только воспевали в песнях и сказках её неповторимую красоту, но и создавали простые предметы обихода. (8) Мастера этого народного промысла украшали их яркой нарядной росписью, в которой ожили любимые природные мотивы.

(9) Хохломские художники любят рисовать на поверхности своих изделий «ягодки»: земляничку, черничку, малинку, ежевичку, рябинку и чёрную и красную смородинку.

(10) Самый любимый орнамент художников — «травка». (11) Как правило, это удлинённые, слегка изогнутые тонкие былинки. (12) А если «травки» превратились в крупные кудри-завитки, то тогда эти узоры называют «кудрями».

(13) Пожеланием добра, благополучия и счастья с давних пор на Руси считались изображения цветущих кустов и плодов. (14) Прекрасную традицию хохломские художники сохраняют и сегодня, украшая обычные предметы нарядной росписью. (15) И с этими вещами в наш дом приходят красота и радость, которые щедро дарят нам мастера промысла.

{num:1125,mode:'text',text:`Текст к заданиям А29—А32 и В1—В3
(1) Я считаю, что каждый человек обязан заботиться о своём интеллектуальном развитии. (2) Это его обязанность перед обществом, в котором он живёт, и перед самим собой.

(3) Существуют различные способы интеллектуального развития. (4) Основной (но, разумеется, не единственный), на мой взгляд, — это чтение.

(5) Я точно знаю, каким не должно быть чтение. (6) Чтение не должно быть случайным. (7) Почему? (8) Потому что это огромный расход времени, а время между тем величайшая ценность, которую нельзя тратить на пустяки. (9) Чтение, безусловно, должно быть избирательным, продуманным, глубоким. (10) В чём должен проявляться его избирательный характер? (11) По моему мнению, в целенаправленном отборе книг.

(12) В идеале хорошо было бы составить своеобразную программу чтения. (13) Разумеется, не обязательно следовать ей жёстко. (14) Да, отступления от неё возможны там, где появляются дополнительные для читающего интересы. (15) Отклонились от первоначального плана — составьте для себя новую программу, учитывающую появившиеся иные интересы.

(16) Чтение не должно быть простой самоцелью. (17) Для того чтобы быть эффективным, оно должно в первую очередь интересовать читающего. (18) Так что развивайте в себе интерес к чтению вообще или по определённым отраслям культуры. (19) Такой интерес может быть в значительной мере результатом самовоспитания.

{num:1163,mode:'text',text:`Текст к заданиям А29—А32 и В1—В3
(1) Есть на карте России, недалеко от Нижнего Новгорода, село Хохлома, известное теперь всему миру своими неповторимыми изделиями.

(2) Хохломской промысел насчитывает более трёх столетий. (3) По одной из легенд, принёс на Нижегородскую землю искусство золотой росписи старообрядец-иконописец. (4) Селились вокруг избы мастера, люди перенимали его искусство. (5) Быстро разлетелась слава об умельце, дошла и до царского дворца. (6) Послал царь стрельцов за мастером, да воля тому была дороже жизни. (7) Передал он свои секреты людям, поджёг избу и исчез. (8) Сгорел ли иконописец вместе с домом или ушёл дальше за волей, неизвестно. (9) Но остались его краски — цвет жаркого костра и чернь пепелища, осталось мастерство горячего сердца, золотых рук да свободной души. (10) А огненная жар-птица стала символом хохломской росписи.

(11) Конечно, это легенда, но действительно уходили в леса старообрядцы, знавшие секреты золочения икон без золота. (12) Деревянные иконы покрывали тонким слоем растёртого в порошок серебра, пропитывали олифой и ставили в русскую печь. (13) После закалки огнём икона обретала новый золотистый цвет. (14) А позже эти приёмы стали использовать для изготовления расписной деревянной посуды.

(15) Сегодня для народного хохломского промысла нет границ! (16) Хохломская роспись вышла из традиционных рамок — трёхцветные узоры можно увидеть на бусах, серёжках, ёлочных игрушках, рисовальных наборах, даже на валенках и варежках.

{num:1201,mode:'text',text:`Текст к заданиям А29—А32 и В1—В4
(1) Был хороший майский день. (2) Своё свободное время я проводил, бродя по булыжным мостовым, по которым так редко проезжали автомобили, что между камней росла неприхотливая, выносливая травка.

(3) Старый русский городок, кирпично-бурый, малоэтажный, с горбатыми улочками, смотрел на меня гераниевыми своими окошками. (4) За крашеными-перекрашеными заборами ютились тесные дворики, заросшие травой с ярко-жёлтыми одуванчиками и кустами цветущей сирени. (5) Кирпичные рельефчики на фасадах обречённых на снос дряхлых домов, кирпичные украшения над окнами, похожие на удивлённо поднятые брови, — всё это резко контрастировало с белёными фасадами новых домов, поднявшихся на окраинах города.

(6) Старики сидели на скамеечках перед этими домами, под цветущими на подоконниках розовыми и алыми бальзаминами. (7) Мне, столичному жителю, волею случая попавшему в этот тихий уголок исконно русской жизни, было очень хорошо, душу мою переполняли такие добрые чувства к старым людям, которые внимательно смотрели на меня, когда я проходил мимо, что я, как со старыми знакомыми, как с родными, здоровался с ними. (8) Слыша в ответ удивлённое и тихое «здрасте», я смущался, будто люди одаривали меня, случайного прохожего, незаслуженным благословением.

(9) Бродя по улочкам, которые вели то вверх, то вниз, я вышел к краеведческому музею. (10) Площадка перед этим музеем, затянутая сочной травой, в которой ярко светились пушистые цветы одуванчиков, была похожа на старый церковный дворик с протоптанными тропами, с покосившейся чугунной решёткой на серых столбах из песчаника.

{num:1239,mode:'text',text:`Текст к заданиям А29—А32 и В1—В3
(1) Нравственный климат в государстве определяется степенью культуры общества. (2) А культура — это прежде всего результат знаний, упорядоченных и сочетающихся с осознанием их недостаточности.

(3) В самом деле, чем больше человек знает, тем яснее он понимает недостаток своих знаний. (4) Отсюда особая осторожность и тактичность подлинно знающих людей и — рядом с ними — чрезвычайная самоуверенность полузнаек.

(5) Полузнайка думает, что знает всё, и прежде всего рецепты благополучия человечества. (6) И он всегда находит быстрый выход из временных затруднений. (7) Полузнайке кажется, что учёный или просто культурный человек — плохой проводник его самоуверенных идей и, более того, ещё и живой укор его невежеству. (8) Некультурность видна во всём облике полузнайки, в его поведении. (9) Он агрессивен в своём мировоззрении, в отношении к природе, к истории, к классическим и недавно появившимся течениям в искусстве. (10) Одним словом, полузнайка ведёт себя так, как будто бы он находится в полузнакомом ему лесу в сумерках: стволы деревьев он принимает за разбойников, стремящихся на него напасть, он не видит дороги и с радостью бросается на всё, что покажется ему дорогой или тропинкой.

(11) Таким образом, полузнайство воспитывает очень опасные черты характера, поведения, отношения к окружающему миру. (12) Полузнайство — это опаснейшая социальная болезнь.

function chunkVocabWords(words,minSize,maxSize){
const groups=[];let i=0;
while(i<words.length){
let rem=words.length-i;
if(rem<=maxSize){groups.push(words.slice(i));break}
let size=40;
if(rem-size<minSize)size=rem-minSize;
size=Math.max(minSize,Math.min(maxSize,size));
groups.push(words.slice(i,i+size));
i+=size}
return groups}
function pickMaskIndex(word){
const vowels='аеёиоуыэюя';
for(let i=1;i<word.length-1;i++){if(vowels.includes(word[i].toLowerCase()))return i}
return Math.min(1,Math.max(0,word.length-2))}
function maskVocabWord(word){
if(!word||word.length<3)return word;
const idx=pickMaskIndex(word);
return word.slice(0,idx)+'_'+word.slice(idx+1)}

function plainOptions(options){return options.map(function(o){return o.replace(/^\d\)\s*/,'')})}

function parseUserFromInitData(raw){
if(!raw||typeof raw!=='string')return null;
try{
const params=new URLSearchParams(raw);
const userRaw=params.get('user');
if(!userRaw)return null;
const parsed=JSON.parse(userRaw);
return parsed&&typeof parsed==='object'?parsed:null;
}catch(e){return null}}

function resolveTelegramUser(){
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(!tg)return null;
const direct=tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user:null;
if(direct&&direct.id)return direct;
const receiver=tg.initDataUnsafe&&tg.initDataUnsafe.receiver?tg.initDataUnsafe.receiver:null;
if(receiver&&receiver.id)return receiver;
const parsed=parseUserFromInitData(tg.initData||'');
if(parsed&&parsed.id)return parsed;
return null}

function safeHttpUrl(raw){
try{
const u=new URL(String(raw||''));
if(u.protocol==='https:'||u.protocol==='http:')return u.toString();
}catch(e){}
return''}

function fmtSeconds(total){
const sec=Math.max(0,Number(total)||0);
const m=Math.floor(sec/60);
const s=sec%60;
return m+':'+String(s).padStart(2,'0')}

function profileSongTitle(audio){
if(!audio||typeof audio!=='object')return'';
const title=String(audio.title||'').trim();
const performer=String(audio.performer||'').trim();
if(performer&&title)return performer+' — '+title;
return title||performer||'Без названия'}

async function fetchTelegramProfileAudio(userId){
if(!telegramProfileAudioApi)return{ok:false,code:'NOT_CONFIGURED'};
try{
const base=new URL(telegramProfileAudioApi,window.location.href);
base.searchParams.set('user_id',String(userId));
const res=await fetch(base.toString(),{method:'GET'});
const data=await res.json().catch(function(){return{}});
if(!res.ok||data.ok===false){
return{ok:false,code:'API_ERROR',error:data.error||data.description||('HTTP '+res.status)}}
return{ok:true,audio:data.audio||null}
}catch(e){
return{ok:false,code:'NETWORK_ERROR',error:e&&e.message?e.message:'network error'}}}

async function loadTelegramProfileSong(user){
const userId=Number(user&&user.id)||0;
if(!userId){
profileAudioCache.userId=0;
profileAudioCache.status='no_user';
profileAudioCache.audio=null;
profileAudioCache.error='';
renderProfileSongCard('no_user');
return}
if(!telegramProfileAudioApi){
profileAudioCache.userId=userId;
profileAudioCache.status='not_configured';
profileAudioCache.audio=null;
profileAudioCache.error='';
renderProfileSongCard('not_configured');
return}
if(profileAudioCache.userId===userId&&profileAudioCache.status==='ready'&&profileAudioCache.audio){
renderProfileSongCard('ready');
return}
profileAudioCache.userId=userId;
profileAudioCache.status='loading';
profileAudioCache.audio=null;
profileAudioCache.error='';
renderProfileSongCard('loading');
const res=await fetchTelegramProfileAudio(userId);
if(res.ok){
profileAudioCache.status=res.audio?'ready':'empty';
profileAudioCache.audio=res.audio||null;
profileAudioCache.error='';
renderProfileSongCard(profileAudioCache.status);
return}
profileAudioCache.status='error';
profileAudioCache.audio=null;
profileAudioCache.error=res.error||'';
renderProfileSongCard('error')}

function applyPattern(options,pattern){
return pattern.map(function(index){return options[index]})}

function remapAnswer(answer,pattern){
const original=answer.split('').map(function(v){return parseInt(v,10)-1});
const mapped=original.map(function(idx){return pattern.indexOf(idx)+1}).sort(function(a,b){return a-b});
return mapped.join('')}

function expandQuestionPool(seed,total){
const patterns=[
[0,1,2,3,4],
[1,2,3,4,0],
[2,3,4,0,1],
[4,0,2,1,3],
[3,1,4,0,2],
[2,4,1,3,0],
[1,3,0,4,2]
];
const out=[];
for(let i=0;i<total;i++){
const src=seed[i%seed.length];
const pattern=patterns[Math.floor(i/seed.length)%patterns.length];
const baseOptions=plainOptions(src.options);
const rotated=applyPattern(baseOptions,pattern);
out.push({
num:i+1,
text:src.text,
options:rotated.map(function(opt,idx){return(idx+1)+') '+opt}),
answer:remapAnswer(src.answer,pattern)
})}
return out}

{num:13,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) — Левое плечо вперёд! Шагом марш! — скомандовал капитан.`,`2) «Надеюсь увидеть вас завтра, — произнёс он и уже мягче добавил: — Передайте привет брату».`,`3) «То сердце не научится любить, — писал Некрасов: которое устало ненавидеть».`,`4) Как сказал-поэт: «если жизнь тебя обманет, не печалься, не сердись».`,`5) — Отчего вы бледны? — поинтересовалась Нечаева.`],answer:`125`},
{num:14,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) Девушка смущённо пояснила: «Это, наверное, пришла моя сестра».`,`2) — Тебе ведь известно, в чём дело, да? — спросила Наташа.`,`3) «Молодёжь интересуется устройством и историей наших машин, — сказал Василий и с гордостью добавил: — Значит, не зря эти старые автомобили возвращали к жизни».`,`4) Аристотель утверждал, что: «Гнев врачуется временем, ненависть же неизлечима».`,`5) «У кого веснушки», — утешала мать Катю, — «того солнце любит».`],answer:`123`},
{num:15,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) Девочка всплеснула руками: «Он заболел!»`,`2) В Евангелии говорится, что: «В начале всего было слово».`,`3) «Мир полон возможностей, — произнёс профессор и, немного помолчав, добавил: — Нужно только уметь их видеть».`,`4) — Это платье тебе очень идёт, — заметила Ольга.`,`5) «Мы можем встретиться завтра вечером» — сказал Сергей, — «или в любой день на этой неделе. У меня все дни свободны».`],answer:`134`},
{num:16,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) Библиотекарь предупредила строго: — Не уносите книгу из зала! — Хорошо, я только посмотрю оглавление, — заверил Валентин.`,`2) «Мне к работе не привыкать», — храбро сказал парнишка.`,`3) — Он на три года моложе тебя, — возмутилась она и холодно прибавила: — И у него нет постоянного места работы.`,`4) «Ты, милок, — хитро прищурившись, произнёс старик: — Поживи с моё, тогда и спорь».`,`5) Шарль де Костер считал, что: «счастлив тот, кто и в чёрные дни сохраняет чистоту сердца».`],answer:`123`},
{num:17,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) — У меня так дело поставлено, что комар носу не подточит, — заявил мастер.`,`2) Л. Кассиль говорил, что: «Человек всегда является добытчиком».`,`3) «Вы где работаете?» — спросил старик у меня. — «А когда уезжаете?»`,`4) «Великие русские писатели и поэты-классики писали на подлинно народном русском языке, — считал Л. Успенский и подчёркивал: — В богатом их словаре заимствованные слова всегда занимали второстепенное место».`,`5) Калиновский сообщил: «Сейчас в городе работает более трёх тысяч малых предприятий-производителей».`],answer:`145`},
{num:18,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) Древнегреческий философ Плутарх считал, что: «Сила речи состоит в умении выразить многое в немногих словах».`,`2) «Хорошая книга», — писал Л. Толстой, — «точно беседа с умным человеком».`,`3) Ф. Шиллер утверждал: «Тот, кто ничего не боится, не менее могуществен, чем тот, кого все боятся».`,`4) «Да, я иногда просматриваю эту газету, — сказал Чванов и добавил: — Там интересные объявления печатаются».`,`5) — Я буду бороться, чтобы отстоять свою точку зрения, — твёрдо произнёс Пётр.`],answer:`345`},
{num:19,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) Владик громко, как его учили в детском саду, продекламировал: «Отчего у мамочки на щеках две ямочки?»`,`2) «Друг у меня один,— возразил Павел и пояснил:— Друзей не может быть много».`,`3) — Здравствуйте! — сказала она, протягивая руку для приветствия: — Очень рада вас видеть!`,`4) Генрих Манн верно подметил, что: «мы рождены искать истину, а не обладать ею».`,`5) — До свидания, приезжайте к нам ещё! — хором закричали дети. — Непременно приедем!`],answer:`125`},
{num:20,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) — Ну что за лицо! Курносый нос, веснушки! — бормотал про себя Коля и отходил от зеркала с негодованием.`,`2) «В знак мира и согласия я принесу вам букет роз, — говорит Войницкий и, уходя, добавляет: — Прелестные розы».`,`3) «Спасибо за поздравление — смущённо сказала она. — И что не забыли, спасибо».`,`4) Пословица гласит, что: «тише едешь — дальше будешь».`,`5) — И где вы ходите ? Спектакль давно уже начался! — закричала на девочек Рита. — Ты не поверишь: мы участвовали в поимке бандита! — соврала Женька.`],answer:`125`},
{num:21,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) — Вы, конечно, изволите шутить? — холодно спросил граф.`,`2) — Всё так ужасно? — испуганно спросила Лена. — Наоборот, изумительно! — воскликнула Оля. — Мы приняты!`,`3) «Не бойся, — сказала санитарка и добавила : — Твоя операция будет описана во всех медицинских журналах».`,`4) «Наше племя не затевает раздоров — произнёс вождь. — Уходите с миром».`,`5) Нельзя не согласиться с Вольтером, который писал, что: «о великом человеке судят только по его главным деяниям, а не по его ошибкам».`],answer:`123`},
{num:22,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Люблю, когда лес шумит, — сказал Михаил Петрович и, обернувшись ко мне, добавил: — Особенно летом».`,`2) «Я сяду заниматься, чтобы не терять времени» — заявил весело Тема.`,`3) Народная мудрость гласит, что : «свобода — это чистая совесть».`,`4) - Ни на что не годится тот, — утверждал Вольтер, — кто годится только для себя.`,`5) Подняв глаза на Крячко, она холодно спросила: «Вас, молодой человек, никогда не учили стучаться?»`],answer:`145`},
{num:23,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Лучше смотреть в будущее, чем мечтать о прошлом», — прочитал я недавно в умной книжке.`,`2) «Умный знает, как выпутаться из трудного положения, — говорила Раневская и шутливо добавляла: — А мудрый никогда в него не попадает».`,`3) Сенека говорил, что: «язык правды прост».`,`4) — Я не должна слушать вас, Рахметов, — сказала она тоном резкого неудовольствия: — вы осыпаете упрёками человека, которому я бесконечно обязана.`,`5) Коля, услышав, как воет буран, вдруг подумал: «А если мамка заблудится?»`],answer:`125`},
{num:24,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Да, это тот самый дуб», — подумал князь Андрей.`,`2) «Вы здесь? — спросила она — а мы вас ищем».`,`3) Не забывайте слова Державина о том, что: «Чрезмерная похвала — насмешка».`,`4) — Пожалуйста, не плачьте, — попросила девушка. — Сейчас дам вам адрес.`,`5) «Откуда ты? Где был? — засыпал я Дерсу своими вопросами и попросил: — Рассказывай обо всём подробно».`],answer:`145`},
{num:25,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Вот здесь можно перевести дух! — воскликнул мой спутник — Наконец-то мы дошли до поляны, а там и до озера недалеко».`,`2) «Как будто и боя никакого не было!» — изумлённо думал Звягинцев.`,`3) Сократ считал, что: «нельзя лечить тело, не излечив душу».`,`4) — Стиль каменного века, — заметил Остап с одобрением и спросил: — А доисторические животные в матрацах не водятся?`,`5) Фаина Раневская иронизировала: «Оптимизм — это недостаток информации».`],answer:`245`},
{num:26,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Я не могу смотреть весело на того», — подумал Володя, — «кого я так огорчил».`,`2) Древние мудрецы утверждали, что: «нельзя дважды войти в одну и ту же реку».`,`3) Никита предложил: «Хочешь, мама, я тебе свой стих прочту?»`,`4) «Доверяй делам людей, но не верь их речам», — советовал греческий оратор Демосфен.`,`5) «Зачем так рано пришёл? — спросил сторож и добавил: — Уроки начинаются в восемь часов».`],answer:`345`},
{num:27,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Как это тебе пришло в голову следить за нами?» — возмутился старик.`,`2) С. Я. Маршак говорил, что: «писатель должен чувствовать возраст каждого слова».`,`3) «Мама, ты здесь?» — тихо спросил малыш. — «Подойди ко мне».`,`4) «Не приду я сегодня, — слабым голосом произнесла Тамара и, громко чихнув, добавила: — Заболела я».`,`5) Зина посмотрела на меня и огорчённо вздохнула: «Стыдно с такими способностями так лениться».`],answer:`145`},
{num:28,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Степан же ветеринар», — спокойно пояснила Галя. — «Причём один из лучших».`,`2) «Столько вопросов сразу, — усмехнулся Чванов и, достав небольшую, красиво изогнутую трубку, поинтересовался: — Не возражаете?»`,`3) Л. Толстой утверждал: «Сущность всякой веры состоит в том, что она придаёт жизни такой смысл, который не уничтожается смертью».`,`4) «Пусть к прокурору сходит», — посоветовал один из присутствующих.`,`5) Драматург Мольер как-то сказал, что: «в обещаниях все люди сходны».`],answer:`234`},
{num:29,text:`Укажите примеры с правильным пунктуационным оформлением чужой речи:`,options:[`1) — До чего же я невезучий человек, — вздохнул Коля и пояснил: — Я надеялся, что вы прочтёте мою повесть.`,`2) Анатолий Алексин утверждал, что: «Человек в гневе выражает не столько свои убеждения, сколько ощущения».`,`3) — Вот видите, — развёл руками Василий: — у меня этой записки нет.`,`4) «Только твоих истерик тут не хватало!» — поморщилась Рита.`,`5) Димка заглянул мне в глаза и спросил : « Ты довольна, что мы здесь?»`],answer:`145`},
{num:30,text:`Укажите примеры с правильным пунктуационным оформлением чужой речи:`,options:[`1) — Когда я вам понадоблюсь, позовёте, — шепнула домработница.`,`2) Древнегреческий историк Плутарх заявлял, что: «Бог — это надежда для храброго, а не оправдание для трусливого».`,`3) Малышев растерянно спросил: «Папа, как дела?»`,`4) «Ура!» — закричала Алёнка. — «Мы пойдём в зоопарк!»`,`5) «Плыви, кораблик, к синему морю, — прошептал Ваня и, опустив кораблик на воду, продолжил: — Быть может, ты принесёшь мне привет от доброго друга?»`],answer:`135`},
{num:31,text:`Укажите примеры с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Можешь ли ты, старик», — спросил он, — «Достать мне лошадей до Жадрина?»`,`2) — Кто дежурный? — неожиданно поинтересовался учитель математики.`,`3) И. Репин утверждал, что: «Все недостатки, всё можно простить художнику, если его творение очаровывает».`,`4) Английский романист Г. Уэллс говорил: «Именно русскому языку суждено в будущем лечь в основу языка человеческого».`,`5) «Учить он умеет, любит учительствовать, — убеждала директора Марья Ивановна и потом добавила: — У него столько благодарных учеников!»`],answer:`245`},
{num:32,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) Мудрый Овидий советовал: «Верь опытному».`,`2) Она любила повторять слова Цицерона из книги «Античные афоризмы», что: «без занятий жизнь пуста».`,`3) «Я, когда в Москву приехал, прямо потрясён был, — рассказывал В. Суриков и пояснял: — Я на памятники с восторгом смотрел».`,`4) «Нет, мне слишком весело, чтобы портить своё веселье сочувствием чужому горю», — думала Маша, вспоминая вчерашний разговор.`,`5) «Вот», — сказала Лиза. — «Господа в ссоре, а слуги друг друга угощают».`],answer:`134`},
{num:33,text:`Укажите примеры с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Говорит Москва», — раздался из репродуктора женский голос.`,`2) «Ты промахнулся», — сказал егерь. — «Олень убежал».`,`3) Светлана попросила: «Надя, отойди от меня, пожалуйста».`,`4) А. П. Чехов утверждал, что: «Праздная жизнь не может быть честной».`,`5) — Хватит реветь, — прикрикнула на подругу Ира и уже спокойнее продолжила: — Слезами горю не поможешь.`],answer:`135`},
{num:34,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) Твардовский, прослушав одну из знаменитых песен Михаила Исаковского, удивлённо и почтительно сказал, что: «ты в двадцать строк вкладываешь столько, что мне в поэму не вложить!»`,`2) «Я не люблю, когда на меня долго смотрят, — сказала Нина и добавила: — Такое впечатление, будто разглядывают географическую карту».`,`3) — Снова на улицу? — проворчала мать: — Ты бы лишний раз в учебник заглянул.`,`4) Лисица слушает рассказ Волка и приговаривает про себя: «Ох, глуповат ты, братец».`,`5) «Будет буря, так что нам лучше бы остаться дома», — сказал, посмотрев на небо, проводник. «Нет, мы должны спешить», — ответил сердито Алексей.`],answer:`245`},
{num:35,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) — Наши предки научили нас строить жилища, — сказал юноша: — И мы жили в них целыми поколениями.`,`2) «Вот он! — воскликнул рыбак, довольно потирая руки, и добавил с усмешкой: — А теперь ступай-ка, сударь ёрш, в корзину!»`,`3) «Боже мой, когда же наконец будет солнце?» — простонал Рябовский.`,`4) Философ Артур Шопенгауэр заметил, что: «каждый ребёнок отчасти гений, а каждый гений отчасти ребёнок».`,`5) «А где живёт твоя бабушка?» — спросил Алёша. «В пятидесяти километрах от города», — ответил Максим.`],answer:`235`},
{num:36,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Какую книгу, — поинтересовалась учительница: — вы взяли бы с собой на необитаемый остров?»`,`2) — Зачёт в три часа, — сказал староста и строго добавил: — Не опаздывайте!`,`3) Она произнесла голосом, похожим на кошачье мяуканье: «Пожалейте бедняжку».`,`4) Л. Н. Толстой утверждал, что: «главное средство во всяком искусстве — чувство меры».`,`5) «Хорошо, что догадался подать мне руку», — заметила Таня. «Я догадливый!» — отшутился Иван.`],answer:`235`},
{num:37,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Кирилл, — сказала она робко: — Почему же ты ничего не ешь?»`,`2) Недаром Л. Н. Толстой говорил: «Чехов — это Пушкин в прозе».`,`3) «И тебе совсем нескучно было без нас?» — спросила Александра. «А вам без меня было скучно?» — задал вопрос я. «Да», — отвечала она.`,`4) «Дедушка, ты куда?» — спросил Гарик. — «А меня возьмёшь с собой?»`,`5) Я тотчас же объяснил им, что я гвардейский офицер в отставке.`],answer:`235`},
{num:38,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) «Да это уже и не так важно, — сказала Варя и, подумав, добавила. — Ничего уже, к сожалению, не исправишь».`,`2) По словам критика В. Г. Белинского: «Татьяна — редкий, прекрасный цветок, случайно выросший в расселине дикой скалы».`,`3) «Пора смотреть правде в глаза», — подумал Алексей Шурмилёв.`,`4) «Ты плохой стратег!» — почти крикнула она на Фёдора. — «Кто плохой стратег? Я?»`,`5) — Вот видите, — сказал многозначительно Эрнст, — создавать счастье — это высокий труд.`],answer:`35`},
{num:39,text:`Укажите предложения с правильным пунктуационным оформлением чужой речи:`,options:[`1) — Все идите за мной! — Крикнула она, спускаясь к быстрой реке.`,`2) Владимир Одоевский утверждал, что: «поэзия есть предвестник того состояния человечества, когда оно перестанет достигать и начнёт пользоваться достигнутым».`,`3) — У тебя когда каникулы-то? — спросила бабка Шурку строго. — Какие? Зимние? — ответил вопросом на вопрос Шурка.`,`4) В одном из стихотворений, адресованных А. Ахматовой, Марина Цветаева так разграничила сферы поэтического влияния между двумя поэтами:
И поделили мы так просто:
Твой — Петербург, моя — Москва.`,`5) Увидел меня генерал и говорит: «Погоди-ка, санитар, не уходи».`],answer:`345`},
