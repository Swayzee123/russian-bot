r-collapse:collapse;margin:12px 0}.rule-text th,.rule-text td{border:1px solid #c8e6c9;padding:8px;text-align:left;vertical-align:top}.rule-text th{background:#e8f5e9;color:#5d8c3a}.rule-text .diagram{background:#f5f9f0;padding:12px;border-radius:16px;margin:12px 0;font-family:monospace;white-space:pre}.btn-main{width:100%;background:linear-gradient(135deg,#9bbf7a,#7dab5a);color:white;border:none;padding:14px;border-radius:24px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:20px}.footer{position:fixed;bottom:0;left:0;width:100%;padding:12px 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(155,191,122,0.3);display:flex;justify-content:center;gap:40px;z-index:10}.social-item{text-align:center;text-decoration:none;color:#9bbf7a;transition:transform 0.2s}.social-item:hover{transform:translateY(-3px)}.social-icon{font-size:28px;margin-bottom:4px;display:block}.social-label{font-size:10px;font-weight:500;letter-spacing:0.5px}.stat-card{background:rgba(255,255,255,0.9);border-radius:28px;padding:20px;margin-bottom:16px;text-align:center}

const sections = [

let historyFacts = ["📚 Правила будут добавляться постепенно", "🎯 Готовься к ЦЭ/ЦТ с нами", "📖 Учи правила — сдавай экзамены"];

function renderTasks() {
    const now = new Date(); document.getElementById('currentDate').innerText = `${now.getDate()} ${now.toLocaleString('ru', { month: 'long' })} ${now.getFullYear()}`;
    const container = document.getElementById('tasksList'); container.innerHTML = '';
    const card = document.createElement('div'); card.className = 'subject-card';
    card.innerHTML = `<div class="subject-title">📋 Задания ЦЭ/ЦТ</div><div class="task-grid" id="taskGrid"></div>`;
    container.appendChild(card);
    const grid = document.getElementById('taskGrid');
    sections.forEach(section => {
        const btn = document.createElement('div');
        btn.className = 'task-btn';
        btn.innerText = section.id;
        btn.onclick = () => showRule(section);
        grid.appendChild(btn);
    });
}

function showRule(section) {
    document.getElementById('ruleHeader').innerText = section.title;
    document.getElementById('ruleText').innerHTML = section.rule;
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('ruleScreen').style.display = 'block';
}

function backToTasks() {
    document.getElementById('mainScreen').style.display = 'block';
    document.getElementById('ruleScreen').style.display = 'none';
    renderTasks();
}

function renderStats() {
    let totalLearned = 0;
    const saved = localStorage.getItem("russian_rules_viewed");
    const viewed = saved ? JSON.parse(saved) : [];
    sections.forEach(s => { if(viewed.includes(s.id)) totalLearned++; });
    const percent = sections.length ? Math.round((totalLearned / sections.length) * 100) : 0;
    document.getElementById('statsContent').innerHTML = `<div class="stat-card"><div style="font-size:48px;">📊</div><div style="font-size:48px;font-weight:800;color:#9bbf7a;">${percent}%</div><div>правил изучено</div><div class="stat-card" style="margin-top:16px;"><div>📚 Просмотрено: ${totalLearned} / ${sections.length}</div></div></div>`;
}

function renderProfile() {
    const user = tg?.initDataUnsafe?.user;
    const randomFact = historyFacts[Math.floor(Math.random() * historyFacts.length)];
    const avatarHtml = user?.photo_url ? `<img src="${user.photo_url}" style="width:80px;height:80px;border-radius:80px;margin:0 auto 16px;display:block;object-fit:cover;">` : `<div style="width:80px;height:80px;border-radius:80px;background:linear-gradient(135deg,#9bbf7a,#7dab5a);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:40px;">📖</div>`;
    document.getElementById('profileContent').innerHTML = `<div class="stat-card">${avatarHtml}<div style="font-size:24px;font-weight:bold;">${user?.first_name || "Гость"}</div><div style="color:#9bbf7a;">🎓 Готовься к ЦЭ/ЦТ</div></div><div class="stat-card"><div style="font-size:18px;margin-bottom:12px;">📖 Совет дня</div><div style="font-size:14px;">${randomFact}</div></div>`;
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
    document.getElementById('tasksList').style.display = 'none'; document.getElementById('statsContent').style.display = 'none'; document.getElementById('profileContent').style.display = 'none';
    if (tab === 'tasks') { document.getElementById('tasksList').style.display = 'block'; renderTasks(); }
    if (tab === 'stats') { document.getElementById('statsContent').style.display = 'block'; renderStats(); }
    if (tab === 'profile') { document.getElementById('profileContent').style.display = 'block'; renderProfile(); }
}

document.querySelectorAll('.tab').forEach(tab => { tab.addEventListener('click', () => switchTab(tab.dataset.tab)); });

renderTasks();
renderStats();
renderProfile();
switchTab('tasks');
</script>
</body>
</html>
